<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>曲線の双子を探す · primitive-lean</title>
<style>
* {box-sizing:border-box}
body {margin:0;background:#f6f5ee;color:#172f32;font:16px/1.55 "DM Sans",system-ui,sans-serif}
main {max-width:1010px;margin:auto;padding:clamp(18px,4vw,52px)}
h1 {margin:0;font-size:clamp(27px,5vw,48px);letter-spacing:-.05em}
.intro {max-width:52em;margin:.5em 0 1.4em}
label {display:grid;gap:5px;font-weight:650}
select,button {font:inherit;color:inherit;border:1px solid #9cafa9;background:white;border-radius:5px;padding:.4em .65em;max-width:100%}
.controls {display:flex;gap:1em;flex-wrap:wrap;align-items:end}
#summary {margin:1em 0;font-weight:600}
.plots {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
article {padding:clamp(10px,2vw,22px);border:1px solid #c9d1c7;background:#fffef9;border-radius:10px}
article select {font:600 clamp(13px,2vw,20px) monospace;width:100%}
svg {width:100%;height:auto;display:block}
.readout {font-size:14px;font-variant-numeric:tabular-nums}
.timeline {display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 10px}
.timeline label {display:flex;align-items:center;gap:10px;flex:1}
input {accent-color:#146c70;min-width:50px;flex:1}
#loopSwap {margin-top:1em;cursor:pointer}
.key {font-weight:700}
.a {color:#146c70} .b {color:#a44420}
.note {font-size:14px;color:#42595a}
@media(max-width:540px){.plots{gap:5px}article{padding:6px}.timeline label{flex-basis:100%}}
</style>
<main>
<h1>曲線の双子を探す</h1>
<p class="intro">同じ長さの円弧 <span class="key a">A（90°）</span> と <span class="key b">B（270°）</span> を、左に曲がりながらつなぎます。終点と符号付き面積が同じになる並べ方を選んで、途中の形を比べてみてください。</p>
<div class="controls">
<label>A と B の個数<select id="count"><option value="4">各 4 個</option><option value="5" selected>各 5 個</option><option value="6">各 6 個</option></select></label>
<label>終点と面積が一致する組<select id="group"></select></label>
</div>
<button type="button" id="loopSwap">完成図が重なる二本を、4文字目で比べる</button>
<p id="summary"></p>
<div class="plots">
<article><label>左の並べ方<select id="left"></select></label><svg id="plotL" role="img" aria-label="左の並べ方で描いた曲線"></svg><div id="statsL" class="readout"></div></article>
<article><label>右の並べ方<select id="right"></select></label><svg id="plotR" role="img" aria-label="右の並べ方で描いた曲線"></svg><div id="statsR" class="readout"></div></article>
</div>
<div class="timeline"><label>描く文字数 <input id="step" type="range" min="0" value="10" max="10"><output id="progress" for="step"></output></label></div>
<p class="note">白丸が始点、黒丸が現在の終点です。座標の単位は ξ = 2h/(3π)（h は一文字の弧長）。D は各円弧の始点と終点を結ぶ折れ線を閉じた符号付き面積の 2 倍です。円弧を含む曲線の面積には各弧と弦の間の面積も加わり、A・B の個数が同じなら D の一致で判定できます。</p>
</main>
<script>
"use strict";
const el = id => document.getElementById(id);
const directions = [[1,0],[0,1],[-1,0],[0,-1]];

// In units of ξ, the left-turning arcs have radii 3 and 1.
function trace(word) {
  let x = 0, y = 0, turn = 0, cross = 0;
  const points = [{x, y, cross}];
  for (const letter of word) {
    const a = letter === 'A';
    const radius = a ? 3 : 1;
    const [c,s] = directions[turn % 4];
    const forward = a ? 3 : -1;
    const dx = c * forward - s * radius;
    const dy = s * forward + c * radius;
    cross += x * dy - y * dx;
    const cx = x - s * radius, cy = y + c * radius;
    x += dx;
    y += dy;
    points.push({x, y, cross, cx, cy, radius, letter});
    turn += a ? 1 : 3;
  }
  return points;
}

function classify(k) {
  const classes = new Map();
  function visit(word, a, b) {
    if (a || b) {
      if (a) visit(word + 'A', a - 1, b);
      if (b) visit(word + 'B', a, b - 1);
      return;
    }
    const {x,y,cross} = trace(word).at(-1);
    const key = [x,y,cross].join(',');
    if (!classes.has(key)) classes.set(key, []);
    classes.get(key).push(word);
  }
  visit('', k, k);
  return [...classes.values()].sort((a,b) => b.length - a.length);
}

let groups;
function selectOptions(select, entries) {
  select.replaceChildren(...entries.map(([value,label]) => new Option(label, value)));
}

function changeCount() {
  const k = Number(el('count').value);
  const classes = classify(k);
  groups = classes.filter(words => words.length > 1);
  el('summary').textContent = '全 ' + classes.reduce((n,g) => n + g.length, 0)
    + ' 通りを終点と面積で分けると ' + classes.length + ' 組。そのうち ' + groups.length + ' 組に複数の並べ方があります。';
  selectOptions(el('group'), groups.map((words,i) => {
    const {x,y,cross} = trace(words[0]).at(-1);
    return [i, '(' + x + ', ' + y + ')　D = ' + cross + '　·　' + words.length + ' 通り'];
  }));
  el('step').max = 2*k;
  el('step').value = 2*k;
  changeGroup();
}

function changeGroup() {
  const words = groups[Number(el('group').value)];
  const entries = words.map(w => [w,w]);
  for (const id of ['left','right']) selectOptions(el(id), entries);
  el('right').selectedIndex = words.length - 1;
  if (words.includes('ABBAAAABBB') && words.includes('BBBAAAABAB')) {
    el('left').value = 'ABBAAAABBB';
    el('right').value = 'BBBAAAABAB';
  }
  draw();
}

function draw() {
  const curves = [trace(el('left').value),trace(el('right').value)];
  const step = Number(el('step').value);
  el('progress').value = step + ' / ' + el('step').max;
  // Full-circle bounds keep both plots at one fixed scale while scrubbing.
  const arcs = curves.flatMap(points => points.slice(1));
  const xmin = Math.min(...arcs.map(p => p.cx-p.radius));
  const xmax = Math.max(...arcs.map(p => p.cx+p.radius));
  const ymin = Math.min(...arcs.map(p => p.cy-p.radius));
  const ymax = Math.max(...arcs.map(p => p.cy+p.radius));
  const size = Math.max(xmax-xmin, ymax-ymin) + 2;
  const left = (xmax+xmin-size)/2, top = (-ymax-ymin-size)/2;
  curves.forEach((points,i) => {
    const suffix = i === 0 ? 'L' : 'R';
    const svg = el('plot'+suffix);
    svg.setAttribute('viewBox', [left,top,size,size].join(' '));
    svg.replaceChildren();
    function shape(tag, attrs) {
      const node = document.createElementNS('http://www.w3.org/2000/svg',tag);
      for (const [k,v] of Object.entries(attrs)) node.setAttribute(k,v);
      svg.append(node);
    }
    shape('path',{d:'M '+left+' 0 h '+size+' M 0 '+top+' v '+size,stroke:'#c9d1c7','stroke-width':size*.003});
    for (let j=1; j<=step; j++) {
      const p = points[j], prev = points[j-1], a = p.letter === 'A';
      const d = ['M',prev.x,-prev.y,'A',p.radius,p.radius,0,a?0:1,0,p.x,-p.y].join(' ');
      shape('path',{d, fill:'none', stroke:a?'#146c70':'#ae502c','stroke-width':size*.012});
    }
    const p = points[step];
    shape('circle',{cx:0,cy:0,r:size*.024,fill:'#fffef9',stroke:'#172f32','stroke-width':size*.005});
    shape('circle',{cx:p.x,cy:-p.y,r:size*.013,fill:'#172f32'});
    el('stats'+suffix).textContent = '終点 ('+p.x+', '+p.y+')　D = '+p.cross;
  });
}

el('loopSwap').onclick = () => {
  el('count').value = '4';
  changeCount();
  el('group').value = groups.findIndex(words => words.includes('AAAABBBB'));
  changeGroup();
  el('left').value = 'AAAABBBB';
  el('right').value = 'BBBBAAAA';
  el('step').value = 4;
  draw();
};
el('count').onchange = changeCount;
el('group').onchange = changeGroup;
for (const id of ['left','right']) el(id).onchange = draw;
el('step').oninput = draw;
changeCount();
</script>
</html>
