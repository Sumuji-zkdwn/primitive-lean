"proof":"by\n  apply radius_pos\n  by_contra hz\n  push Not at hz\n  have hB : 0 ≤ (max (-r) 0) ^ 2 / (12 * lam) := by positivity\n  simp [hz.1, hz.2, E, f] at he\n  linarith","truncated":false,"comment":""},{"id":433,"line":139,"statement":"theorem direction_mem_circle {z : ℝ × ℝ} (hz : 0 < radius z) :\n    (direction z).1 ^ 2 + (direction z).2 ^ 2 = 1","proof":"by\n  have hs : radius z ^ 2 = z.1 ^ 2 + z.2 ^ 2 := Real.sq_sqrt (by positivity)\n  dsimp [direction]\n  field_simp [ne_of_gt hz]\n  exact hs.symm","truncated":false,"comment":""},{"id":434,"line":146,"statement":"theorem radius_mul_direction {z : ℝ × ℝ} (hz : 0 < radius z) :\n    (radius z * (direction z).1, radius z * (direction z).2) = z","proof":"by\n  apply Prod.ext <;> dsimp [direction] <;> field_simp [ne_of_gt hz]","truncated":false,"comment":""},{"id":435,"line":150,"statement":"theorem direction_positive_scale (z : ℝ × ℝ) {t : ℝ} (ht : 0 < t) :\n    direction (t*z.1, t*z.2) = direction z","proof":"by\n  have hr : radius (t*z.1, t*z.2) = t * radius z := by\n    dsimp [radius]\n    rw [show (t*z.1)^2+(t*z.2)^2 = t^2*(z.1^2+z.2^2) by ring,\n      Real.sqrt_mul (sq_nonneg t), Real.sqrt_sq (le_of_lt ht)]\n  apply Prod.ext <;> dsimp only [direction, Prod.fst, Prod.snd] <;>\n    rw [hr] <;> exact mul_div_mul_left _ _ (ne_of_gt ht)","truncated":false,"comment":""},{"id":436,"line":159,"statement":"theorem direction_of_circle {v : ℝ × ℝ} (hv : v.1 ^ 2 + v.2 ^ 2 = 1) :\n    direction v = v","proof":"by\n  simp [direction, radius, hv]","truncated":false,"comment":""},{"id":437,"line":163,"statement":"theorem continuous_radius : Continuous radius","proof":"by unfold radius; fun_prop","truncated":false,"comment":""},{"id":438,"line":165,"statement":"theorem continuous_direction_subtype {S : Set (ℝ × ℝ)}\n    (hS : ∀ z : S, 0 < radius z.val) : Continuous (fun z : S => direction z.val)","proof":"by\n  apply Continuous.prodMk\n  · exact (continuous_fst.comp continuous_subtype_val).div\n      (continuous_radius.comp continuous_subtype_val) (fun z => ne_of_gt (hS z))\n  · exact (continuous_snd.comp continuous_subtype_val).div\n      (continuous_radius.comp continuous_subtype_val) (fun z => ne_of_gt (hS z))","truncated":false,"comment":""},{"id":439,"line":174,"statement":"theorem eq_of_direction_energy_eq {lam r u : ℝ} (hlam : 0 < lam) {z w : ℝ × ℝ}\n    (he : (max (-r) 0) ^ 2 / (12 * lam) < E lam r u z.1 z.2)\n    (hd : direction z = direction w) (hE : E lam r u z.1 z.2 = E lam r u w.1 w.2) :\n    z = w","proof":"by\n  have hz := radius_pos_of_energy hlam he\n  have hw := radius_pos_of_energy hlam (he.trans_eq hE)\n  have hx : z.1 * radius w = w.1 * radius z :=\n    (div_eq_div_iff (ne_of_gt hz) (ne_of_gt hw)).1 (congrArg Prod.fst hd)\n  have hy : z.2 * radius w = w.2 * radius z :=\n    (div_eq_div_iff (ne_of_gt hz) (ne_of_gt hw)).1 (congrArg Prod.snd hd)\n  have hscaleW : (radius w / radius z * z.1, radius w / radius z * z.2) = w := by\n    apply Prod.ext\n    · dsimp only\n      rw [div_mul_eq_mul_div]\n      apply (div_eq_iff (ne_of_gt hz)).2\n      nlinarith\n    · dsimp only\n      rw [div_mul_eq_mul_div]\n      apply (div_eq_iff (ne_of_gt hz)).2\n      nlinarith\n  have hscaleZ : (radius z / radius w * w.1, radius z / radius w * w.2) = z := by\n    apply Prod.ext\n    · dsimp only\n      rw [div_mul_eq_mul_div]\n      apply (div_eq_iff (ne_of_gt hw)).2\n      nlinarith\n    · dsimp only\n      rw [div_mul_eq_mul_div]\n      apply (div_eq_iff (ne_of_gt hw)).2\n      nlinarith\n  rcases lt_trichotomy (radius z) (radius w) with hlt | heq | hlt\n  · have hs := energy_outward_strict hlam he\n      ((lt_div_iff₀ hz).2 (by simpa using hlt))\n    have hws := congrArg (fun q : ℝ × ℝ => E lam r u q.1 q.2) hscaleW\n    change E lam r u (radius w / radius z * z.1) (radius w / radius z * z.2) =\n      E lam r u w.1 w.2 at hws\n    linarith\n  · apply Prod.ext\n    · exact (mul_right_cancel₀ (ne_of_gt hw)) (by simpa only [heq] using hx)\n    · exact (mul_right_cancel₀ (ne_of_gt hw)) (by simpa only [heq] using hy)\n  · have hs := energy_outward_strict hlam (he.trans_eq hE)\n      ((lt_div_iff₀ hw).2 (by simpa using hlt))\n    have hzs := congrArg (fun q : ℝ × ℝ => E lam r u q.1 q.2) hscaleZ\n    change E lam r u (radius z / radius w * w.1) (radius z / radius w * w.2) =\n      E lam r u z.1 z.2 at hzs\n    linarith","truncated":false,"comment":"Direction and energy determine a point uniquely above the threshold."},{"id":440,"line":7,"statement":"theorem exponential_bound_on_Icc {v q : ℝ → ℝ} {k T : ℝ} (hT : 0 ≤ T)\n    (hd : ∀ t ∈ Icc (0 : ℝ) T, HasDerivAt v (q t) t)\n    (hi : ∀ t ∈ Icc (0 : ℝ) T, q t ≤ -k * v t)\n    {t : ℝ} (ht : t ∈ Icc (0 : ℝ) T) :\n    v t ≤ v 0 * Real.exp (-k * t)","proof":"by\n  let w : ℝ → ℝ := fun s => Real.exp (k * s) * v s\n  let dw : ℝ → ℝ := fun s => Real.exp (k * s) * (k * v s + q s)\n  have hw : ∀ s ∈ Icc (0 : ℝ) T, HasDerivAt w (dw s) s := by\n    intro s hs\n    convert (((hasDerivAt_id s).const_mul k).exp.mul (hd s hs)) using 1\n    · rfl\n    · dsimp [dw]\n      ring\n  have hc : ContinuousOn w (Icc (0 : ℝ) T) :=\n    fun s hs => (hw s hs).continuousAt.continuousWithinAt\n  have ha : AntitoneOn w (Icc (0 : ℝ) T) :=\n    antitoneOn_of_hasDerivWithinAt_nonpos (convex_Icc (0 : ℝ) T) hc\n      (fun s hs => (hw s (interior_subset hs)).hasDerivWithinAt)\n      (fun s hs => by\n        dsimp [dw]\n        apply mul_nonpos_of_nonneg_of_nonpos (Real.exp_pos _).le\n        have h := hi s (interior_subset hs)\n        linarith)\n  have hvalue : Real.exp (k * t) * v t ≤ v 0 := by\n    simpa [w] using ha ⟨le_rfl, hT⟩ ht ht.1\n  have hdiv : v t ≤ v 0 / Real.exp (k * t) := by\n    apply (le_div_iff₀ (Real.exp_pos _)).2\n    simpa only [mul_comm] using hvalue\n  simpa only [div_eq_mul_inv, ← Real.exp_neg, neg_mul] using hdiv","truncated":false,"comment":"Integrating-factor estimate requiring the differential inequality only on [0,T]."},{"id":441,"line":38,"statement":"theorem square_bound_on_Icc {θ f : ℝ → ℝ} {κ ρ M T : ℝ}\n    (hκ : 0 < κ) (hM : 0 ≤ M) (hT : 0 ≤ T)\n    (hd : ∀ t ∈ Icc (0 : ℝ) T, HasDerivAt θ (-κ * θ t + ρ * f t) t)\n    (hf : ∀ t ∈ Icc (0 : ℝ) T, |f t| ≤ M)\n    {t : ℝ} (ht : t ∈ Icc (0 : ℝ) T) :\n    (θ t)^2 ≤ (θ 0)^2 * exp (-κ*t) + (ρ*M/κ)^2 * (1-exp (-κ*t))","proof":"by\n  let C : ℝ := (ρ*M/κ)^2\n  have hC : κ^2 * C = ρ^2 * M^2 := by\n    dsimp [C]\n    field_simp\n  have hv : ∀ s ∈ Icc (0 : ℝ) T,\n      HasDerivAt (fun s => (θ s)^2-C) (2*θ s*(-κ*θ s+ρ*f s)) s := by\n    intro s hs\n    convert ((hd s hs).pow 2).sub_const C using 1; ring\n  have hi : ∀ s ∈ Icc (0 : ℝ) T,\n      2*θ s*(-κ*θ s+ρ*f s) ≤ -κ*((θ s)^2-C) := by\n    intro s hs\n    have hf2 : (f s)^2 ≤ M^2 := by\n      nlinarith [sq_abs (f s), hf s hs, abs_nonneg (f s)]\n    have hforce : ρ^2*(f s)^2 ≤ ρ^2*M^2 :=\n      mul_le_mul_of_nonneg_left hf2 (sq_nonneg ρ)\n    have hscaled : κ*(2*θ s*(-κ*θ s+ρ*f s)+κ*((θ s)^2-C)) ≤ 0 := by\n      nlinarith [sq_nonneg (κ*θ s-ρ*f s)]\n    have hsum : 2*θ s*(-κ*θ s+ρ*f s)+κ*((θ s)^2-C) ≤ 0 := by\n      nlinarith\n    linarith\n  have hb := exponential_bound_on_Icc hT hv hi ht\n  dsimp [C] at *\n  nlinarith","truncated":false,"comment":"The explicit square bound is valid on every finite interval of existence."},{"id":442,"line":69,"statement":"theorem abs_le_on_Icc {θ f : ℝ → ℝ} {κ M T : ℝ}\n    (hκ : 0 < κ) (hM : 0 ≤ M) (hT : 0 ≤ T)\n    (hd : ∀ t ∈ Icc (0 : ℝ) T, HasDerivAt θ (-κ * θ t + f t) t)\n    (hf : ∀ t ∈ Icc (0 : ℝ) T, |f t| ≤ κ * M)\n    (hinit : |θ 0| ≤ M) {t : ℝ} (ht : t ∈ Icc (0 : ℝ) T) : |θ t| ≤ M","proof":"by\n  have hb := square_bound_on_Icc (ρ := 1) hκ (mul_nonneg hκ.le hM) hT\n    (fun s hs => by simpa only [one_mul] using hd s hs) hf ht\n  have hc : (1 * (κ*M) / κ)^2 = M^2 := by field_simp\n  rw [hc] at hb\n  have hstart : (θ 0)^2 ≤ M^2 := by\n    nlinarith [sq_abs (θ 0), abs_nonneg (θ 0)]\n  have hprod := mul_nonpos_of_nonpos_of_nonneg (sub_nonpos.mpr hstart)\n    (exp_pos (-κ*t)).le\n  have ht2 : (θ t)^2 ≤ M^2 := by nlinarith\n  nlinarith [sq_abs (θ t), abs_nonneg (θ t)]","truncated":false,"comment":"A forcing below κM preserves the interval [-M,M] for the damped coordinate."},{"id":443,"line":25,"statement":"theorem contDiff_vectorField {n : ℕ} {m : WithTop ℕ∞} {b : State n → ℝ}\n    {Phi : ℝ × ℝ → (Fin n → ℝ)} (hb : ContDiff ℝ m b) (hPhi : ContDiff ℝ m Phi)\n    (lam r u gamma target : ℝ) (kappa rho : Fin n → ℝ) :\n    ContDiff ℝ m (vectorField lam r u gamma target b kappa rho Phi)","proof":"by\n  unfold vectorField LinearInputTrajectoryExistence.vectorField E f gx gy\n  fun_prop","truncated":false,"comment":""},{"id":444,"line":33,"statement":"theorem hasDerivAt_internal {n : ℕ} {lam r u gamma target t : ℝ}\n    {b : State n → ℝ} {kappa rho : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    {q : ℝ → State n}\n    (hq : HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q t)) t)\n    (i : Fin n) :\n    HasDerivAt (fun s => (q s).2 i)\n      (-kappa i * (q t).2 i + rho i * Phi (q t).1 i) t","proof":"(hasDerivAt_pi.mp hq.snd) i","truncated":false,"comment":"The actual internal coordinate derivative is obtained by projection."},{"id":445,"line":43,"statement":"theorem hasDerivAt_energy {n : ℕ} {lam r u gamma target t : ℝ}\n    {b : State n → ℝ} {kappa rho : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    {q : ℝ → State n}\n    (hq : HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q t)) t) :\n    HasDerivAt (fun s => E lam r u (q s).1.1 (q s).1.2)\n      (-gamma * (E lam r u (q t).1.1 (q t).1.2 - target) *\n        gSq lam r u (q t).1.1 (q t).1.2) t","proof":"hasDerivAt_energy_fixed_input lam r u gamma target (b (q t)) hq.fst.fst hq.fst.snd","truncated":false,"comment":"Internal updates do not change the exact spatial energy derivative."},{"id":446,"line":54,"statement":"theorem energy_band_on_Icc {n : ℕ} {lam r u gamma target T : ℝ}\n    {b : State n → ℝ} {kappa rho : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    {q : ℝ → State n} (hgamma : 0 ≤ gamma) (hT : 0 ≤ T)\n    (hq : ∀ s ∈ Icc (0 : ℝ) T,\n      HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q s)) s)\n    (hinit : target ≤ E lam r u (q 0).1.1 (q 0).1.2)\n    {t : ℝ} (ht : t ∈ Icc (0 : ℝ) T) :\n    target ≤ E lam r u (q t).1.1 (q t).1.2 ∧\n      E lam r u (q t).1.1 (q t).1.2 ≤ E lam r u (q 0).1.1 (q 0).1.2","proof":"by\n  have hg : ContinuousOn (fun s => gSq lam r u (q s).1.1 (q s).1.2)\n      (Icc (0 : ℝ) T) := by\n    intro s hs\n    exact ((continuous_gSq lam r u).continuousAt.comp\n      (hq s hs).continuousAt.fst).continuousWithinAt\n  have he := LinearInputFiniteBand.error_band_on_Icc hgamma hT hg\n    (fun s hs => (hasDerivAt_energy (hq s hs)).sub_const target)\n    (fun s _ => gSq_nonneg lam r u (q s).1.1 (q s).1.2) (sub_nonneg.mpr hinit) ht\n  constructor <;> linarith [he.1, he.2]","truncated":false,"comment":"Spatial energy confinement holds on every actual finite solution interval,\neven though the tangential coefficient changes with the internal state."},{"id":447,"line":75,"statement":"theorem isTrajectory_of_global_solution {n : ℕ} {lam r u gamma target : ℝ}\n    {b : State n → ℝ} {kappa rho : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    {q : ℝ → State n}\n    (hq : ∀ t ∈ Ici (0 : ℝ),\n      HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q t)) t) :\n    IsTrajectory lam r u gamma target (fun t => (q t).1.1) (fun t => (q t).1.2)\n      (fun t => b (q t))","proof":"fun t ht => ⟨(hq t ht).fst.fst, (hq t ht).fst.snd⟩","truncated":false,"comment":"A supplied global coupled solution projects to the original spatial\ntrajectory predicate with the actual time-dependent coefficient."},{"id":448,"line":86,"statement":"theorem exists_internal_bounds {n : ℕ} {K : Set (ℝ × ℝ)} (hK : IsCompact K)\n    {Phi : ℝ × ℝ → (Fin n → ℝ)} (hPhi : Continuous Phi)\n    (kappa rho theta₀ : Fin n → ℝ) (hkappa : ∀ i, 0 < kappa i) :\n    ∃ M : Fin n → ℝ, (∀ i, 0 ≤ M i) ∧ (∀ i, |theta₀ i| ≤ M i) ∧\n      ∀ z ∈ K, ∀ i, |rho i * Phi z i| ≤ kappa i * M i","proof":"by\n  have hbounded (i : Fin n) : ∃ B : ℝ, ∀ z ∈ K, |rho i * Phi z i| ≤ B := by\n    simpa only [Real.norm_eq_abs, Pi.mul_apply, Function.comp_def] using hK.exists_bound_of_continuousOn\n      ((continuous_const.mul ((continuous_apply i).comp hPhi)).continuousOn)\n  choose B hB using hbounded\n  let M : Fin n → ℝ := fun i => max |theta₀ i| (max (B i) 0 / kappa i)\n  refine ⟨M, fun i => (abs_nonneg _).trans (le_max_left _ _),\n    fun i => le_max_left _ _, ?_⟩\n  intro z hz i\n  have hM : max (B i) 0 ≤ kappa i * M i := by\n    have hm : max (B i) 0 / kappa i ≤ M i := le_max_right _ _\n    have hh := (div_le_iff₀ (hkappa i)).mp hm\n    simpa only [mul_comm] using hh\n  exact (hB i z hz).trans ((le_max_left _ _).trans hM)","truncated":false,"comment":"A compact spatial set supplies finite coordinate bounds compatible with\nstrictly positive damping and every initial internal state."},{"id":449,"line":107,"statement":"theorem band_box_on_Icc {n : ℕ} {lam r u gamma target T : ℝ}\n    {b : State n → ℝ} {kappa rho M : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    {q : ℝ → State n} (hgamma : 0 ≤ gamma) (hT : 0 ≤ T)\n    (hkappa : ∀ i, 0 < kappa i) (hM : ∀ i, 0 ≤ M i)\n    (hforce : ∀ z : ℝ × ℝ,\n      target ≤ E lam r u z.1 z.2 ∧ E lam r u z.1 z.2 ≤ E lam r u (q 0).1.1 (q 0).1.2 →\n      ∀ i, |rho i * Phi z i| ≤ kappa i * M i)\n    (hinit : target ≤ E lam r u (q 0).1.1 (q 0).1.2)\n    (htheta : ∀ i, |(q 0).2 i| ≤ M i)\n    (hq : ∀ s ∈ Icc (0 : ℝ) T,\n      HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q s)) s)\n    {t : ℝ} (ht : t ∈ Icc (0 : ℝ) T) :\n    (target ≤ E lam r u (q t).1.1 (q t).1.2 ∧\n      E lam r u (q t).1.1 (q t).1.2 ≤ E lam r u (q 0).1.1 (q 0).1.2) ∧\n      ∀ i, |(q t).2 i| ≤ M i","proof":"by\n  refine ⟨energy_band_on_Icc hgamma hT hq hinit ht, fun i => ?_⟩\n  exact LinearInputFiniteInternalUpdate.abs_le_on_Icc (hkappa i) (hM i) hT\n    (fun s hs => hasDerivAt_internal (hq s hs) i)\n    (fun s hs => hforce (q s).1 (energy_band_on_Icc hgamma hT hq hinit hs) i)\n    (htheta i) ht","truncated":false,"comment":"Every finite solution segment stays in its spatial energy band and its\ninternal coordinate box. Both conclusions follow from the actual ODE."},{"id":450,"line":130,"statement":"theorem exists_global_solution {n : ℕ} {lam r u gamma target : ℝ}\n    {b : State n → ℝ} {kappa rho : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    (hb : ContDiff ℝ 1 b) (hPhi : ContDiff ℝ 1 Phi)\n    (hlam : 0 < lam) (hgamma : 0 ≤ gamma) (hkappa : ∀ i, 0 < kappa i)\n    (q₀ : State n) (hinit : target ≤ E lam r u q₀.1.1 q₀.1.2) :\n    ∃ M : Fin n → ℝ, (∀ i, 0 ≤ M i) ∧ ∃ q : ℝ → State n, q 0 = q₀ ∧\n      (∀ t : ℝ, 0 ≤ t →\n        HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q t)) t) ∧\n      ∀ t : ℝ, 0 ≤ t →\n        (target ≤ E lam r u (q t).1.1 (q t).1.2 ∧\n          E lam r u (q t).1.1 (q t).1.2 ≤ E lam r u q₀.1.1 q₀.1.2) ∧\n        ∀ i, |(q t).2 i| ≤ M i","proof":"by\n  let K : Set (ℝ × ℝ) := {z | target ≤ E lam r u z.1 z.2 ∧\n    E lam r u z.1 z.2 ≤ E lam r u q₀.1.1 q₀.1.2}\n  have hK : IsCompact K :=\n    LinearInputCoercivity.isCompact_band hlam r u target (E lam r u q₀.1.1 q₀.1.2)\n  obtain ⟨M, hM, htheta, hforce⟩ :=\n    exists_internal_bounds hK hPhi.continuous kappa rho q₀.2 hkappa\n  let S : Set (State n) := K ×ˢ Icc (-M) M\n  have hS : IsCompact S := hK.prod isCompact_Icc\n  have hstart : q₀ ∈ S := by\n    exact ⟨⟨hinit, le_rfl⟩, (fun i => (abs_le.mp (htheta i)).1),\n      fun i => (abs_le.mp (htheta i)).2⟩\n  have hF : ContDiff ℝ 1 (vectorField lam r u gamma target b kappa rho Phi) :=\n    contDiff_vectorField hb hPhi lam r u gamma target kappa rho\n  obtain ⟨eps, heps, hlocal⟩ := LinearInputCompactLocalExistence.exists_uniform_local_time hF hS\n  have hstay : ∀ (a : ℝ) (q : ℝ → State n), q 0 = q₀ →\n      (∀ t ∈ Ioo (-eps) a,\n        HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q t)) t) →\n      ∀ t : ℝ, 0 ≤ t → t < a → q t ∈ S := by\n    intro a q hq₀ hq t ht hta\n    have hi : target ≤ E lam r u (q 0).1.1 (q 0).1.2 := by simpa only [hq₀] using hinit\n    have hitheta : ∀ i, |(q 0).2 i| ≤ M i := by simpa only [hq₀] using htheta\n    have hiforce : ∀ z : ℝ × ℝ,\n        target ≤ E lam r u z.1 z.2 ∧\n          E lam r u z.1 z.2 ≤ E lam r u (q 0).1.1 (q 0).1.2 →\n        ∀ i, |rho i * Phi z i| ≤ kappa i * M i := by\n      simpa only [K, mem_ofPred_eq, hq₀] using hforce\n    have hbound := band_box_on_Icc hgamma ht hkappa hM hiforce hi hitheta\n      (fun s hs => hq s ⟨by linarith [hs.1], hs.2.trans_lt hta⟩)\n      (show t ∈ Icc (0 : ℝ) t from ⟨ht, le_rfl⟩)\n    refine ⟨?_, (fun i => (abs_le.mp (hbound.2 i)).1),\n      fun i => (abs_le.mp (hbound.2 i)).2⟩\n    simpa only [K, mem_ofPred_eq, hq₀] using hbound.1\n  obtain ⟨q, hq₀, hq⟩ :=\n    LinearInputGlobalContinuation.exists_forward_solution hF hstart heps hlocal hstay\n  refine ⟨M, hM, q, hq₀, hq, fun t ht => ?_⟩\n  have hi : target ≤ E lam r u (q 0).1.1 (q 0).1.2 := by simpa only [hq₀] using hinit\n  have hitheta : ∀ i, |(q 0).2 i| ≤ M i := by simpa only [hq₀] using htheta\n  have hiforce : ∀ z : ℝ × ℝ,\n      target ≤ E lam r u z.1 z.2 ∧\n        E lam r u z.1 z.2 ≤ E lam r u (q 0).1.1 (q 0).1.2 →\n      ∀ i, |rho i * Phi z i| ≤ kappa i * M i := by\n    simpa only [K, mem_ofPred_eq, hq₀] using hforce\n  have hbound := band_box_on_Icc hgamma ht hkappa hM hiforce hi hitheta\n    (fun s hs => hq s hs.1) (show t ∈ Icc (0 : ℝ) t from ⟨ht, le_rfl⟩)\n  simpa only [hq₀] using hbound","truncated":false,"comment":"Damped internal updates and spatial confinement yield an actual\nforward-global coupled solution, with a fixed compact coordinate box."},{"id":451,"line":190,"statement":"theorem solution_unique_on_Ici {n : ℕ} {lam r u gamma target : ℝ}\n    {b : State n → ℝ} {kappa rho : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    (hb : ContDiff ℝ 1 b) (hPhi : ContDiff ℝ 1 Phi) {q v : ℝ → State n}\n    (hq : ∀ t ∈ Ici (0 : ℝ),\n      HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q t)) t)\n    (hv : ∀ t ∈ Ici (0 : ℝ),\n      HasDerivAt v (vectorField lam r u gamma target b kappa rho Phi (v t)) t)\n    (heq : q 0 = v 0) : EqOn q v (Ici (0 : ℝ))","proof":"LinearInputForwardUniqueness.solution_unique_on_Ici\n    (contDiff_vectorField hb hPhi lam r u gamma target kappa rho) hq hv heq","truncated":false,"comment":"The actual coupled solution is unique on the nonnegative time domain.\nUniqueness itself needs no damping, energy or coefficient sign assumptions."},{"id":452,"line":203,"statement":"theorem contDiff_finite_expansion {n : ℕ} {m : WithTop ℕ∞}\n    {psi : Fin n → (ℝ × ℝ) → ℝ} (hpsi : ∀ i, ContDiff ℝ m (psi i)) :\n    ContDiff ℝ m (fun q : State n => ∑ i, q.2 i * psi i q.1)","proof":"by\n  apply ContDiff.sum\n  intro i _\n  have hi : ContDiff ℝ m (fun q : State n => q.2 i) := by\n    simpa only [Function.comp_def] using\n      (contDiff_apply ℝ (fun _ : Fin n => ℝ) i).comp (contDiff_snd (E := ℝ × ℝ))\n  have hp : ContDiff ℝ m (fun q : State n => psi i q.1) := by\n    simpa only [Function.comp_def] using (hpsi i).comp (contDiff_fst (F := Fin n → ℝ))\n  exact hi.mul hp","truncated":false,"comment":"Every finite coefficient expansion has the smoothness required by the\ncoupled theorem; polynomial spatial basis functions are included."},{"id":453,"line":217,"statement":"theorem exists_global_solution_one_add_sq {n : ℕ} {lam r u gamma target : ℝ}\n    {Q : State n → ℝ} {kappa rho : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    (hQ : ContDiff ℝ 1 Q) (hPhi : ContDiff ℝ 1 Phi)\n    (hlam : 0 < lam) (hgamma : 0 ≤ gamma) (hkappa : ∀ i, 0 < kappa i)\n    (q₀ : State n) (hinit : target ≤ E lam r u q₀.1.1 q₀.1.2) :\n    ∃ M : Fin n → ℝ, (∀ i, 0 ≤ M i) ∧ ∃ q : ℝ → State n, q 0 = q₀ ∧\n      (∀ t : ℝ, 0 ≤ t → HasDerivAt q\n        (vectorField lam r u gamma target (fun v => 1 + Q v ^ 2) kappa rho Phi (q t)) t) ∧\n      ∀ t : ℝ, 0 ≤ t →\n        (target ≤ E lam r u (q t).1.1 (q t).1.2 ∧\n          E lam r u (q t).1.1 (q t).1.2 ≤ E lam r u q₀.1.1 q₀.1.2) ∧\n        ∀ i, |(q t).2 i| ≤ M i","proof":"exists_global_solution (contDiff_const.add (hQ.pow 2)) hPhi hlam hgamma hkappa q₀ hinit","truncated":false,"comment":"The original coefficient 1 + Qθ², now with genuinely evolving finite\ninternal coefficients, has an actual forward-global coupled solution."},{"id":454,"line":20,"statement":"theorem bandRadius_nonneg (lam r u upper : ℝ) : 0 ≤ bandRadius lam r u upper","proof":"by\n  unfold bandRadius\n  positivity","truncated":false,"comment":""},{"id":455,"line":24,"statement":"theorem norm_le_bandRadius {lam r u upper : ℝ} (hlam : 0 < lam) {z : ℝ × ℝ}\n    (he : E lam r u z.1 z.2 ≤ upper) : ‖z‖ ≤ bandRadius lam r u upper","proof":"by\n  let S := max (upper + lowerBoundConstant lam r u) 0\n  have hS : 0 ≤ S := le_max_right _ _\n  have hmax : upper + lowerBoundConstant lam r u ≤ S := le_max_left _ _\n  have hc := coercive_lower_bound hlam r u z.1 z.2\n  have hx : z.1 ^ 2 ≤ S := by\n    nlinarith [sq_nonneg (z.2 - Real.sqrt 2 * z.1)]\n  have hi : 4 * (z.1 ^ 2 + (z.2 - Real.sqrt 2 * z.1) ^ 2 / 2) - z.2 ^ 2 =\n      (z.2 - 2 * Real.sqrt 2 * z.1) ^ 2 := by\n    ring_nf\n    rw [Real.sq_sqrt (by norm_num : (0 : ℝ) ≤ 2)]\n    ring\n  have hy : z.2 ^ 2 ≤ 4 * S := by\n    nlinarith [sq_nonneg (z.2 - 2 * Real.sqrt 2 * z.1)]\n  have hR : 0 ≤ 2 * Real.sqrt S := by positivity\n  have hRsq : (2 * Real.sqrt S) ^ 2 = 4 * S := by\n    rw [mul_pow, Real.sq_sqrt hS]\n    ring\n  change max |z.1| |z.2| ≤ 2 * Real.sqrt S\n  apply max_le\n  · apply abs_le_of_sq_le_sq _ hR\n    rw [hRsq]\n    linarith\n  · apply abs_le_of_sq_le_sq _ hR\n    rwa [hRsq]","truncated":false,"comment":""},{"id":456,"line":51,"statement":"theorem target_level_nonempty {lam r u target : ℝ} (hlam : 0 < lam)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target) :\n    {p : ℝ × ℝ | E lam r u p.1 p.2 = target}.Nonempty","proof":"by\n  obtain ⟨a, ha, _⟩ := existsUnique_positive_radius (r := r) (u := u) (x := 1) (y := 0)\n    hlam htarget (Or.inl one_ne_zero)\n  exact ⟨(a*1, a*0), ha.2⟩","truncated":false,"comment":""},{"id":457,"line":60,"statement":"theorem exists_radial_target_point {lam r u target : ℝ} (hlam : 0 < lam)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    {z : ℝ × ℝ} (he : target ≤ E lam r u z.1 z.2) :\n    ∃ a : ℝ, 0 < a ∧ a ≤ 1 ∧ E lam r u (a*z.1) (a*z.2) = target ∧\n      (1-a) * (target - (max (-r) 0) ^ 2 / (12 * lam)) ≤\n        E lam r u z.1 z.2 - target","proof":"by\n  have hz : z.1 ≠ 0 ∨ z.2 ≠ 0 := by\n    by_contra h\n    push Not at h\n    have hB : 0 ≤ (max (-r) 0) ^ 2 / (12 * lam) := by positivity\n    simp [h.1, h.2, E, f] at he\n    linarith\n  obtain ⟨a, ha, _⟩ := existsUnique_positive_radius hlam htarget hz\n  have ha1 : a ≤ 1 := by\n    by_contra h\n    have hs := energy_outward_strict hlam (lt_of_lt_of_le htarget he) (lt_of_not_ge h)\n    rw [ha.2] at hs\n    linarith\n  have hscale := energy_outward_scaling hlam r u (a*z.1) (a*z.2)\n    ((le_div_iff₀ ha.1).2 (by simpa using ha1))\n  have hx : (1/a)*(a*z.1) = z.1 := by field_simp [ne_of_gt ha.1]\n  have hy : (1/a)*(a*z.2) = z.2 := by field_simp [ne_of_gt ha.1]\n  rw [hx, hy, ha.2] at hscale\n  have hm := mul_le_mul_of_nonneg_left hscale ha.1.le\n  have hi : a * (1/a * (target - (max (-r) 0) ^ 2 / (12 * lam))) =\n      target - (max (-r) 0) ^ 2 / (12 * lam) := by field_simp [ne_of_gt ha.1]\n  rw [hi] at hm\n  refine ⟨a, ha.1, ha1, ha.2, ?_⟩\n  have hgap := mul_nonneg (sub_nonneg.mpr ha1) (sub_nonneg.mpr he)\n  nlinarith","truncated":false,"comment":"Move inward along the same positive ray to the target level. The displacement\nfraction is controlled by the actual energy error, without a root formula."},{"id":458,"line":91,"statement":"theorem dist_radial_multiple (z : ℝ × ℝ) (a : ℝ) :\n    dist z (a*z.1, a*z.2) = |1-a| * ‖z‖","proof":"by\n  change dist z (a • z) = _\n  have hi : z - a • z = (1-a) • z := by rw [sub_smul, one_smul]\n  rw [dist_eq_norm, hi, norm_smul, Real.norm_eq_abs]","truncated":false,"comment":""},{"id":459,"line":98,"statement":"theorem exists_level_point_distance_bound {lam r u target upper : ℝ} (hlam : 0 < lam)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    {z : ℝ × ℝ} (hlo : target ≤ E lam r u z.1 z.2)\n    (hhi : E lam r u z.1 z.2 ≤ upper) :\n    ∃ p : ℝ × ℝ, E lam r u p.1 p.2 = target ∧\n      dist z p ≤ bandRadius lam r u upper /\n        (target - (max (-r) 0) ^ 2 / (12 * lam)) * (E lam r u z.1 z.2 - target)","proof":"by\n  obtain ⟨a, ha, ha1, hp, hgap⟩ := exists_radial_target_point hlam htarget hlo\n  have hnorm := norm_le_bandRadius hlam hhi\n  have hR := bandRadius_nonneg lam r u upper\n  have hd : 0 < target - (max (-r) 0) ^ 2 / (12 * lam) := sub_pos.mpr htarget\n  refine ⟨(a*z.1, a*z.2), hp, ?_⟩\n  calc\n    dist z (a*z.1, a*z.2) = (1-a) * ‖z‖ := by\n      rw [dist_radial_multiple, abs_of_nonneg (sub_nonneg.mpr ha1)]\n    _ ≤ (1-a) * bandRadius lam r u upper :=\n      mul_le_mul_of_nonneg_left hnorm (sub_nonneg.mpr ha1)\n    _ ≤ bandRadius lam r u upper * (E lam r u z.1 z.2 - target) /\n        (target - (max (-r) 0) ^ 2 / (12 * lam)) := by\n      apply (le_div_iff₀ hd).2\n      have hm := mul_le_mul_of_nonneg_left hgap hR\n      nlinarith\n    _ = _ := by ring","truncated":false,"comment":"An actual point on the target level obeys a computed spatial error bound."},{"id":460,"line":122,"statement":"theorem infDist_level_bound {lam r u target upper : ℝ} (hlam : 0 < lam)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    {z : ℝ × ℝ} (hlo : target ≤ E lam r u z.1 z.2)\n    (hhi : E lam r u z.1 z.2 ≤ upper) :\n    Metric.infDist z {p : ℝ × ℝ | E lam r u p.1 p.2 = target} ≤\n      bandRadius lam r u upper / (target - (max (-r) 0) ^ 2 / (12 * lam)) *\n        (E lam r u z.1 z.2 - target)","proof":"by\n  obtain ⟨p, hp, hdist⟩ := exists_level_point_distance_bound hlam htarget hlo hhi\n  have hmem : p ∈ {q : ℝ × ℝ | E lam r u q.1 q.2 = target} := hp\n  exact (Metric.infDist_le_dist_of_mem (x := z) hmem).trans hdist","truncated":false,"comment":""},{"id":461,"line":134,"statement":"theorem spatial_error_exponential_of_initial {lam r u gamma target : ℝ}\n    (hlam : 0 < lam) (hgamma : 0 ≤ gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    {x y b : ℝ → ℝ} (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target ≤ E lam r u (x 0) (y 0)) {t : ℝ} (ht : 0 ≤ t) :\n    0 ≤ Metric.infDist (x t, y t) {p : ℝ × ℝ | E lam r u p.1 p.2 = target} ∧\n      Metric.infDist (x t, y t) {p : ℝ × ℝ | E lam r u p.1 p.2 = target} ≤\n        bandRadius lam r u (E lam r u (x 0) (y 0)) /\n          (target - (max (-r) 0) ^ 2 / (12 * lam)) *\n          (E lam r u (x 0) (y 0) - target) *\n          Real.exp (-(gamma * gradientLowerBound lam r u target (E lam r u (x 0) (y 0))) * t)","proof":"by\n  have hb := energy_band_of_trajectory hgamma htraj hinit t ht\n  have hd := infDist_level_bound (z := (x t, y t)) hlam htarget hb.1 hb.2\n  have he := energy_error_exponential_of_initial hlam hgamma htarget htraj hinit ht\n  have hC : 0 ≤ bandRadius lam r u (E lam r u (x 0) (y 0)) /\n      (target - (max (-r) 0) ^ 2 / (12 * lam)) :=\n    div_nonneg (bandRadius_nonneg _ _ _ _) (sub_nonneg.mpr htarget.le)\n  refine ⟨Metric.infDist_nonneg, ?_⟩\n  calc\n    _ ≤ _ := hd\n    _ ≤ _ := mul_le_mul_of_nonneg_left he.2 hC\n    _ = _ := by ring","truncated":false,"comment":"Exponential approach to the target level as a set in the product metric."},{"id":462,"line":159,"statement":"theorem spatial_convergence_of_initial {lam r u gamma target : ℝ}\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    {x y b : ℝ → ℝ} (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target ≤ E lam r u (x 0) (y 0)) :\n    Tendsto (fun t => Metric.infDist (x t, y t)\n      {p : ℝ × ℝ | E lam r u p.1 p.2 = target}) atTop (𝓝 0)","proof":"by\n  let C := bandRadius lam r u (E lam r u (x 0) (y 0)) /\n    (target - (max (-r) 0) ^ 2 / (12 * lam))\n  obtain ⟨_, _, _, hE⟩ := energy_convergence_of_initial hlam hgamma htarget htraj hinit\n  have hlim : Tendsto (fun t => C * (E lam r u (x t) (y t) - target)) atTop (𝓝 0) := by\n    simpa only [sub_self, mul_zero] using (hE.sub_const target).const_mul C\n  apply squeeze_zero' (Eventually.of_forall (fun _ => Metric.infDist_nonneg)) _ hlim\n  filter_upwards [eventually_ge_atTop (0 : ℝ)] with t ht\n  have hb := energy_band_of_trajectory hgamma.le htraj hinit t ht\n  exact infDist_level_bound (z := (x t, y t)) hlam htarget hb.1 hb.2","truncated":false,"comment":"The spatial distance to the actual nonempty target level tends to zero.\nNo point limit or periodic limiting trajectory is asserted."},{"id":463,"line":11,"statement":"theorem exists_global_convergent_solution {n : ℕ} {lam r u gamma target : ℝ}\n    {b : State n → ℝ} {kappa rho : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    (hb : ContDiff ℝ 1 b) (hPhi : ContDiff ℝ 1 Phi)\n    (hlam : 0 < lam) (hgamma : 0 < gamma) (hkappa : ∀ i, 0 < kappa i)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (q₀ : State n) (hinit : target ≤ E lam r u q₀.1.1 q₀.1.2) :\n    ∃ M : Fin n → ℝ, (∀ i, 0 ≤ M i) ∧ ∃ q : ℝ → State n, q 0 = q₀ ∧\n      (∀ t : ℝ, 0 ≤ t →\n        HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q t)) t) ∧\n      (∀ t : ℝ, 0 ≤ t → ∀ i, |(q t).2 i| ≤ M i) ∧\n      (∀ t : ℝ, 0 ≤ t →\n        0 ≤ E lam r u (q t).1.1 (q t).1.2 - target ∧\n        E lam r u (q t).1.1 (q t).1.2 - target ≤\n          (E lam r u q₀.1.1 q₀.1.2 - target) * Real.exp\n            (-(gamma * gradientLowerBound lam r u target (E lam r u q₀.1.1 q₀.1.2)) * t)) ∧\n      (∀ t : ℝ, 0 ≤ t →\n        Metric.infDist (q t).1 {p : ℝ × ℝ | E lam r u p.1 p.2 = target} ≤\n          bandRadius lam r u (E lam r u q₀.1.1 q₀.1.2) /\n            (target - (max (-r) 0) ^ 2 / (12 * lam)) *\n            (E lam r u q₀.1.1 q₀.1.2 - target) * Real.exp\n              (-(gamma * gradientLowerBound lam r u target (E lam r u q₀.1.1 q₀.1.2)) * t)) ∧\n      Tendsto (fun t => E lam r u (q t).1.1 (q t).1.2) atTop (𝓝 target) ∧\n      Tendsto (fun t => Metric.infDist (q t).1\n        {p : ℝ × ℝ | E lam r u p.1 p.2 = target}) atTop (𝓝 0)","proof":"by\n  obtain ⟨M, hM, q, hq₀, hq, hbound⟩ :=\n    LinearInputCoupledTrajectory.exists_global_solution hb hPhi hlam hgamma.le hkappa q₀ hinit\n  have htraj := isTrajectory_of_global_solution hq\n  have hi : target ≤ E lam r u (q 0).1.1 (q 0).1.2 := by simpa only [hq₀] using hinit\n  obtain ⟨_, _, _, hE⟩ := LinearInputInvariance.energy_convergence_of_initial\n    hlam hgamma htarget htraj hi\n  refine ⟨M, hM, q, hq₀, hq, fun t ht => (hbound t ht).2, ?_, ?_, hE, ?_⟩\n  · intro t ht\n    simpa only [hq₀] using energy_error_exponential_of_initial\n      hlam hgamma.le htarget htraj hi ht\n  · intro t ht\n    simpa only [hq₀, Prod.eta] using\n      (spatial_error_exponential_of_initial hlam hgamma.le htarget htraj hi ht).2\n  · simpa only [Prod.eta] using\n      spatial_convergence_of_initial hlam hgamma htarget htraj hi","truncated":false,"comment":"An actual coupled global solution, internal bounds, and quantitative\nenergy and spatial convergence, all obtained from the initial data."},{"id":464,"line":53,"statement":"theorem exists_global_injective_convergent_solution {n : ℕ} {lam r u gamma target : ℝ}\n    {b : State n → ℝ} {kappa rho : Fin n → ℝ} {Phi : ℝ × ℝ → (Fin n → ℝ)}\n    (hb : ContDiff ℝ 1 b) (hPhi : ContDiff ℝ 1 Phi)\n    (hlam : 0 < lam) (hgamma : 0 < gamma) (hkappa : ∀ i, 0 < kappa i)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (q₀ : State n) (hinit : target < E lam r u q₀.1.1 q₀.1.2) :\n    ∃ q : ℝ → State n, q 0 = q₀ ∧\n      (∀ t : ℝ, 0 ≤ t →\n        HasDerivAt q (vectorField lam r u gamma target b kappa rho Phi (q t)) t) ∧\n      (∀ t : ℝ, 0 ≤ t → target < E lam r u (q t).1.1 (q t).1.2) ∧\n      StrictAntiOn (fun t => E lam r u (q t).1.1 (q t).1.2) (Ici (0 : ℝ)) ∧\n      InjOn (fun t => (q t).1) (Ici (0 : ℝ)) ∧\n      Tendsto (fun t => E lam r u (q t).1.1 (q t).1.2) atTop (𝓝 target) ∧\n      Tendsto (fun t => Metric.infDist (q t).1\n        {p : ℝ × ℝ | E lam r u p.1 p.2 = target}) atTop (𝓝 0)","proof":"by\n  obtain ⟨_, _, q, hq₀, hq, _, _, _, hE, hdist⟩ := exists_global_convergent_solution\n    hb hPhi hlam hgamma hkappa htarget q₀ hinit.le\n  have htraj := isTrajectory_of_global_solution hq\n  have hi : target < E lam r u (q 0).1.1 (q 0).1.2 := by simpa only [hq₀] using hinit\n  refine ⟨q, hq₀, hq, ?_,\n    LinearInputStrictEnergy.energy_strictAntiOn hlam hgamma htarget htraj hi, ?_, hE, hdist⟩\n  · intro t ht\n    exact LinearInputStrictEnergy.energy_strictly_above_target htraj hi ht\n  · simpa only [Prod.eta] using\n      LinearInputStrictEnergy.trajectory_injOn hlam hgamma htarget htraj hi","truncated":false,"comment":"Strict initial energy excess also prevents any spatial return, even\nwhile the internal state evolves. No limit of a single spatial point is asserted."}]}</script>

   if(!area)return;
   try{
    if(!globalThis.navigator?.clipboard?.writeText)throw Error("Clipboard unavailable");
    await globalThis.navigator.clipboard.writeText(area.value);
    if(status)status.textContent="コピーしました。";
   }catch(_){
    area.focus();area.select?.();area.setSelectionRange?.(0,area.value.length);
    if(status)status.textContent="選択しました。端末のコピー操作を使ってください。";
   }
  });
  $("add-research")?.addEventListener("click",()=>{
   research=A.sanitizeResearch(model,{...research,ids:[...research.ids,selected]});
   tab="research";persist();renderReader();openReader();
  });
  content.querySelectorAll("[data-remove-research]").forEach(el=>el.addEventListener("click",()=>{
   research={...research,ids:research.ids.filter(id=>id!==Number(el.dataset.removeResearch))};
   persist();renderReader();
  }));
  $("research-claim")?.addEventListener("input",e=>{
   research=A.sanitizeResearch(model,{...research,claim:e.target.value});
   persist();
   const out=$("research-output");if(out)out.innerHTML="";
  });
  $("prepare-research")?.addEventListener("click",()=>{
   if(!research.ids.length)return;
   const out=$("research-output");if(!out)return;
   out.innerHTML='<textarea class="argument-packet" id="research-packet" readonly aria-label="Lean検証依頼資料">'+esc(A.researchPacket(model,research,links))+'</textarea><div class="row-actions"><button type="button" class="action" id="copy-research">資料をコピー／選択</button><span id="copy-research-status" class="slim" role="status"></span></div>';
   $("copy-research")?.addEventListener("click",async()=>{
    const area=$("research-packet"),status=$("copy-research-status");if(!area)return;
    try{
     if(!globalThis.navigator?.clipboard?.writeText)throw Error("Clipboard unavailable");
     await globalThis.navigator.clipboard.writeText(area.value);
     if(status)status.textContent="コピーしました。";
    }catch(_){
     area.focus();area.select?.();area.setSelectionRange?.(0,area.value.length);
     if(status)status.textContent="選択しました。端末のコピー操作を使ってください。";
    }
   });
  });
  $("go-deps")?.addEventListener("click",()=>{tab="deps";renderReader();});
  $("go-lean")?.addEventListener("click",()=>{tab="lean";renderReader();});
  $("begin-link")?.addEventListener("click",()=>{
   linkSource=selected;linkDraft=null;$("search").focus();renderReader();
  });
  $("cancel-link")?.addEventListener("click",()=>{
   linkSource=null;linkDraft=null;renderReader();
  });
  $("save-link")?.addEventListener("click",()=>{
   if(!linkDraft)return;
   linkDraft.note=$("link-note").value;
   links=A.addLink(model,links,linkDraft.from,linkDraft.to,linkDraft.note);
   linkDraft=null;linkSource=null;persist();renderReader();draw();
  });
 }
 function render(){
  $("graph-title").textContent=mode==="all"?"初期465定理の全体図":"前提から証明をたどる";
  $("graph-subtitle").textContent=mode==="all"?"629本の直接証明参照を表示":"選択中："+(model.argumentsById[selected]?.title||A.short(model.nodes[selected]));
  $("focus").setAttribute("aria-pressed",String(mode==="focus"));
  $("overview").setAttribute("aria-pressed",String(mode==="all"));
  $("open-reader").textContent="定理 #"+String(selected+1).padStart(3,"0")+" を読む ↑";
  renderReader();draw();
 }
 function resetView(next=mode){
  mode=next;zoom=1;panX=0;panY=0;render();
 }
 function bind(){
  $("focus").addEventListener("click",()=>resetView("focus"));
  $("overview").addEventListener("click",()=>resetView("all"));
  $("zoom-reset").addEventListener("click",()=>resetView());
  $("open-reader").addEventListener("click",openReader);
  $("close-reader").addEventListener("click",closeReader);
  document.querySelectorAll("[data-reader-tab]").forEach(el=>el.addEventListener("click",()=>{
   tab=el.dataset.readerTab;renderReader();
  }));
  $("search").addEventListener("input",e=>renderSearch(e.target.value));
  $("search").addEventListener("keydown",e=>{
   if(e.key==="Escape"){e.target.value="";renderSearch("");e.target.blur();}
   if(e.key==="Enter"){const first=$("hits").querySelector("[data-hit]");
    if(first){e.preventDefault();first.click();}
   }
  });
  document.addEventListener("keydown",e=>{
   if(e.key==="Escape"){closeReader();$("hits").hidden=true;linkSource=null;linkDraft=null;renderReader();}
   if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("search").focus();}
  });
  const distance=pts=>Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  canvas.addEventListener("pointerdown",e=>{
   if(e.button!==undefined&&e.button!==0)return;
   e.preventDefault();canvas.setPointerCapture?.(e.pointerId);
   const id=e.pointerId??"pointer";
   pointers.set(id,{x:e.clientX,y:e.clientY});
   if(pointers.size>=2){
    pinch={distance:Math.max(1,distance([...pointers.values()].slice(0,2))),zoom};
    gesture=null;suppressHit=true;return;
   }
   gesture={id,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};
  });
  canvas.addEventListener("pointermove",e=>{
   const id=e.pointerId??"pointer";
   if(pointers.has(id))pointers.set(id,{x:e.clientX,y:e.clientY});
   if(pinch&&pointers.size>=2){
    const dist=distance([...pointers.values()].slice(0,2));
    zoom=A.clamp(pinch.zoom*dist/pinch.distance,.45,16);draw();return;
   }
   if(!gesture||gesture.id!==id)return;
   const dx=e.clientX-gesture.lastX,dy=e.clientY-gesture.lastY;
   if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>7)gesture.moved=true;
   if(gesture.moved){panX+=dx;panY+=dy;draw();}
   gesture.lastX=e.clientX;gesture.lastY=e.clientY;
  });
  canvas.addEventListener("pointerup",e=>{
   const id=e.pointerId??"pointer",g=gesture;
   pointers.delete(id);
   if(pinch){if(pointers.size<2)pinch=null;gesture=null;return;}
   gesture=null;
   if(suppressHit){suppressHit=false;return;}
   if(!g||g.id!==id||g.moved)return;
   const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
   let best=null,dist=mode==="all"?16:26;
   for(const hit of graphHitboxes){
    const d=Math.hypot(x-hit.x,y-hit.y);
    if(d<dist){dist=d;best=hit.id;}
   }
   if(best!==null)moveSelection(best);
  });
  canvas.addEventListener("pointercancel",()=>{pointers.clear();pinch=null;gesture=null;suppressHit=false;});
  canvas.addEventListener("wheel",e=>{
   e.preventDefault();zoom=A.clamp(zoom*(e.deltaY<0?1.12:.89),.45,16);draw();
  },{passive:false});
  if(typeof ResizeObserver==="function")new ResizeObserver(draw).observe(stage);
  else globalThis.addEventListener?.("resize",draw);
 }
 bind();render();persist();
})().catch(error=>{
 const el=document.getElementById("reader-content");
 if(el)el.textContent="証明資料を読み込めませんでした: "+String(error?.message||error);
});
</script>
</body>
