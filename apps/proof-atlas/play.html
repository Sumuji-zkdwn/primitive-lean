<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#101b24">
<meta name="description" content="primitive-leanの初期465定理を、629本の証明参照から辿るインタラクティブな証明アトラス。">
<title>PRIMITIVE ATLAS — オフライン版</title>
<style>
:root{color-scheme:dark;--base:#101a23;--panel:#172530;--paper:#1b2b35;--line:#344a55;
 --ink:#e7ece6;--soft:#b8c5c4;--dim:#8098a3;--aqua:#85c9c6;--gold:#e0c28b;--rust:#e6a58a;
 font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--base);color:var(--ink);min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:#a3d9df}code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Noto Sans Mono CJK JP",monospace}
.app{min-height:100dvh;max-width:1800px;margin:auto;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line);background:#14232d}
.identity{display:flex;align-items:center;gap:10px;min-width:190px}
.symbol{width:36px;height:36px;border:1px solid #66858a;border-radius:5px;display:grid;place-items:center;color:var(--gold);font:24px Georgia,serif}
.identity h1{margin:0;font-size:18px;font-weight:740;letter-spacing:.105em}
.identity p{margin:1px 0 0;font-size:10px;color:var(--dim);letter-spacing:.06em}
.search{position:relative;flex:1;min-width:min(290px,100%)}
.search input{width:100%;height:44px;background:#0e1b25;border:1px solid #4c6670;border-radius:8px;padding:9px 46px 9px 14px;font-size:14px}
.search .search-mark{position:absolute;right:14px;top:10px;color:#8eabb2;font-size:21px;pointer-events:none}
.hitlist{position:absolute;left:0;right:0;top:48px;max-height:50dvh;overflow:auto;background:#1b2d39;border:1px solid #63828a;border-radius:10px;z-index:40;box-shadow:0 14px 40px #0009;padding:4px}
.hitlist[hidden]{display:none}
.hit{border:0;border-bottom:1px solid #38505b;background:transparent;width:100%;padding:12px;display:flex;justify-content:space-between;text-align:left;gap:12px;font-size:13px}
.hit:hover,.hit:focus-visible{background:#2a414b}
.hit small{display:block;color:var(--dim);margin-top:3px;font-size:11px}
.stats{color:var(--soft);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stats strong{font-size:16px;font-weight:750;color:var(--gold)}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(335px,.85fr)}
.graph-pane{display:flex;flex-direction:column;min-width:0;min-height:600px;background:#111e28;border-right:1px solid var(--line)}
.graphbar{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:9px;border-bottom:1px solid #30434f}
.graphbar h2{margin:0;font-size:14px;font-weight:720}
.graphbar small{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:3px}
.graph-actions{display:flex;gap:6px}
.action{background:#223642;border:1px solid #516b78;border-radius:8px;padding:10px 12px;min-height:43px;font-size:12px;font-weight:650;white-space:nowrap}
.action.primary{background:#335d59;border-color:#77aba5;color:#eaf6ef}
.action[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:#3b4541}
.graph-stage{position:relative;flex:1;min-height:350px}
#graph{display:block;width:100%;height:100%;touch-action:none}
.graphhint{position:absolute;left:13px;bottom:13px;border:1px solid #35515b;background:#101f29df;color:#b1c6c8;border-radius:7px;padding:9px 11px;font-size:11px;pointer-events:none;line-height:1.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:11px 15px;border-top:1px solid #2e4550;font-size:11px;color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.origin{background:#dfbb7f}.dot.dep{background:#8ebebd}.dot.user{background:#dc9f83}
.legend .line-solid{display:inline-block;width:23px;border-top:2px solid #89bdb5;vertical-align:middle;margin-right:6px}
.legend .line-dash{display:inline-block;width:23px;border-top:2px dashed var(--rust);vertical-align:middle;margin-right:6px}
.reader{min-width:0;overflow-y:auto;background:var(--panel);max-height:calc(100dvh - 70px);overscroll-behavior:contain}
.reader-header{padding:20px 22px 12px;border-bottom:1px solid #30434d}
.brow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:11px;letter-spacing:.03em}
.reader h2{font-size:clamp(19px,2.3vw,27px);margin:10px 0 8px;line-height:1.45;font-weight:780}
.reader .source{margin:0;font-size:11px;color:var(--soft);line-height:1.6;overflow-wrap:anywhere}
.reader-tabs{position:sticky;top:0;background:#1b2a35f7;z-index:3;display:flex;border-bottom:1px solid #3c5260}
.reader-tabs button{flex:1;border:0;border-bottom:2px solid transparent;padding:12px 5px;background:transparent;font-size:13px;color:var(--soft);min-height:46px}
.reader-tabs button[aria-selected=true]{border-color:var(--gold);color:#f1dfae;background:#273943}
.reader-content{padding:18px 22px 70px}
.section-label{font-size:11px;color:var(--gold);letter-spacing:.07em;font-weight:740;margin:16px 0 8px}
.reader-content p{font-size:14px;line-height:1.85;color:#d4e0dc;margin:7px 0 12px}
.claim{border-left:3px solid #79b9b7;padding:10px 14px;background:#20333c;border-radius:0 7px 7px 0;font-size:14px;line-height:1.75;overflow-wrap:anywhere;white-space:pre-wrap}
.proof-notes{padding:0 0 0 23px;color:#dfebe8}
.proof-notes li{font-size:14px;line-height:1.82;padding:6px 0 6px 2px}
.proof-notes li::marker{color:var(--gold)}
.proof-detail{border:1px solid #3b5864;border-radius:8px;margin:12px 0;background:#152631;overflow:hidden}
.proof-detail>summary{cursor:pointer;padding:13px 12px;min-height:46px;line-height:1.55;font-size:14px;color:#e6d5a6;font-weight:650;overflow-wrap:anywhere}
.proof-detail>summary small{display:block;margin:4px 0 0 16px;color:var(--soft);font-weight:400;font-size:11px}
.proof-detail[open]{padding:0 12px 10px}
.proof-detail[open]>summary{border-bottom:1px solid #3b5864;margin:0 -12px 8px}
.proof-ancestor{background:#111e28;margin:9px 0}
.argument-packet{display:block;width:100%;max-width:100%;min-height:120px;padding:10px;background:#0d1922;border:1px solid #3b5864;border-radius:8px;resize:vertical;font-size:12px;line-height:1.6}
.source-note{font-size:12px!important;color:#a8bbc1!important}
.boundary{padding:10px 12px;background:#243944;border-left:2px solid var(--gold);font-size:12px!important;color:#c6d1d1!important;line-height:1.7!important}
.pill{display:inline-block;border:1px solid #4b6772;border-radius:5px;background:#29424b;padding:4px 7px;font-size:10px;color:#cadee0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 10px;border:1px solid #56717c;border-radius:7px;background:#2a3d49;text-align:left;font-size:12px;min-height:40px}
.chip small{font-size:10px;color:#9eb6c0}
.source-block{overflow-x:auto;padding:15px;border:1px solid #3b5864;background:#0d1922;border-radius:8px;white-space:pre;line-height:1.65;font-size:12px;color:#dfeddd;tab-size:2}
.slim{font-size:11px!important;color:var(--dim)!important}
.row-actions{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:10px 0}
.link-draft{border:1px solid #865c57;border-radius:9px;background:#332b30;padding:12px;margin-top:10px}
.link-draft strong{font-size:13px;color:#f2ceb4}
.link-draft textarea{width:100%;min-height:64px;background:#111d25;border:1px solid #6b6869;border-radius:7px;padding:10px;font-size:13px;resize:vertical;margin-top:7px}
.connection{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #41525a;padding:8px 0;font-size:12px}
.connection button{border:1px solid #865f56;border-radius:5px;background:transparent;padding:6px 8px;font-size:11px}
.empty{color:var(--soft);font-size:13px;line-height:1.8}
.mobile-read{display:none}
footer{padding:9px 16px;border-top:1px solid #263943;font-size:10px;color:var(--dim)}
@media(max-width:900px){
 .topbar{padding:9px 10px;gap:8px}
 .identity{min-width:145px}
 .identity h1{font-size:15px}
 .symbol{width:29px;height:29px;font-size:20px}
 .stats{margin-left:auto;font-size:10px}
 .stats strong{font-size:13px}
 .search{order:3;flex-basis:100%;min-width:0}
 .search input{font-size:16px;height:46px}
 .workspace{display:block}
 .graph-pane{height:calc(100dvh - 186px - env(safe-area-inset-bottom));min-height:330px;border-right:0}
 .graphbar{padding:8px 9px}
 .graphbar h2{font-size:13px}
 .graphbar small{font-size:10px}
 .graph-actions .action{min-height:43px;padding:7px 10px}
 .graph-stage{min-height:200px}
 .graphhint{font-size:10px;padding:6px 8px;bottom:8px;left:8px}
 .legend{padding:7px 10px;gap:12px;font-size:10px}
 .reader{
  position:fixed;z-index:30;left:0;right:0;bottom:0;top:auto;
  max-height:none;height:min(85dvh,820px);transform:translateY(calc(100% + 5px));
  transition:transform .23s ease;background:#1a2a35;
  box-shadow:0 -18px 40px #000b;border-top:1px solid #6c838a;border-radius:15px 15px 0 0;
  padding-bottom:env(safe-area-inset-bottom)
 }
 body.reader-open .reader{transform:translateY(0)}
 .reader-header{padding:11px 15px}
 .reader h2{font-size:20px;margin:8px 0}
 .reader-content{padding:13px 16px 52px}
 .reader-content p,.proof-notes li{font-size:14px}
 .reader-tabs button{font-size:13px;min-height:48px}
 .mobile-read{
  position:fixed;z-index:20;display:flex;align-items:center;justify-content:center;
  right:max(12px,env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));
  min-height:52px;border-radius:26px;border:1px solid #dfc78e;background:#d1b67d;
  color:#17272f;padding:10px 20px;font-size:14px;font-weight:800;box-shadow:0 6px 22px #0009
 }
 #close-reader{display:inline-flex!important}
 footer{padding:7px 10px;font-size:9px}
}
@media(max-width:900px) and (orientation:landscape) and (max-height:550px){
 .topbar{padding:5px 10px}
 .identity p{display:none}
 .search{order:initial;flex:1}
 .search input{height:42px}
 .workspace .graph-pane{height:calc(100dvh - 115px);min-height:180px}
 .graph-actions .action{min-height:40px}
 .reader{height:100dvh;border-radius:0;max-width:550px;left:auto;width:min(95vw,550px);transform:translateX(101%);right:0;top:0}
 body.reader-open .reader{transform:translateX(0)}
 .mobile-read{bottom:calc(11px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){.reader{transition:none}}
</style>
</head>

fs":["LinearInputDesign.E"],"depth":7,"otherProjectRefs":["LinearInputDesign.E","LinearInputDesign.f"]},{"id":458,"name":"LinearInputLevelConvergence.dist_radial_multiple","label":"放射 · 459","chapter":"収束","school":"LinearInput","file":"linear_input/lean_check/LevelConvergence.inc","line":91,"parents":[],"statementRefs":[],"depth":0,"otherProjectRefs":[]},{"id":459,"name":"LinearInputLevelConvergence.exists_level_point_distance_bound","label":"存在・等位面・点 · 460","chapter":"収束","school":"LinearInput","file":"linear_input/lean_check/LevelConvergence.inc","line":98,"parents":[454,455,457,458],"statementRefs":["LinearInputDesign.E","LinearInputLevelConvergence.bandRadius"],"depth":8,"otherProjectRefs":["LinearInputDesign.E","LinearInputLevelConvergence.bandRadius"]},{"id":460,"name":"LinearInputLevelConvergence.infDist_level_bound","label":"等位面・評価 · 461","chapter":"収束","school":"LinearInput","file":"linear_input/lean_check/LevelConvergence.inc","line":122,"parents":[459],"statementRefs":["LinearInputDesign.E","LinearInputLevelConvergence.bandRadius"],"depth":9,"otherProjectRefs":["LinearInputDesign.E","LinearInputLevelConvergence.bandRadius"]},{"id":461,"name":"LinearInputLevelConvergence.spatial_error_exponential_of_initial","label":"誤差・指数・初期 · 462","chapter":"収束","school":"LinearInput","file":"linear_input/lean_check/LevelConvergence.inc","line":134,"parents":[284,388,454,460],"statementRefs":["LinearInputDesign.E","LinearInputGradientBound.gradientLowerBound","LinearInputLevelConvergence.bandRadius","LinearInputRegularBand.IsTrajectory"],"depth":10,"otherProjectRefs":["LinearInputDesign.E","LinearInputGradientBound.gradientLowerBound","LinearInputLevelConvergence.bandRadius","LinearInputRegularBand.IsTrajectory"]},{"id":462,"name":"LinearInputLevelConvergence.spatial_convergence_of_initial","label":"収束・初期 · 463","chapter":"収束","school":"LinearInput","file":"linear_input/lean_check/LevelConvergence.inc","line":159,"parents":[284,285,460],"statementRefs":["LinearInputDesign.E","LinearInputRegularBand.IsTrajectory"],"depth":10,"otherProjectRefs":["LinearInputDesign.E","LinearInputLevelConvergence.bandRadius","LinearInputRegularBand.IsTrajectory"]},{"id":463,"name":"LinearInputCoupledConsequences.exists_global_convergent_solution","label":"存在・大域・収束 · 464","chapter":"結合系の帰結","school":"LinearInput","file":"linear_input/lean_check/CoupledConsequences.inc","line":11,"parents":[285,388,447,450,461,462],"statementRefs":["LinearInputCoupledTrajectory.State","LinearInputCoupledTrajectory.vectorField","LinearInputDesign.E","LinearInputGradientBound.gradientLowerBound","LinearInputLevelConvergence.bandRadius"],"depth":11,"otherProjectRefs":["LinearInputCoupledTrajectory.State","LinearInputCoupledTrajectory.vectorField","LinearInputDesign.E","LinearInputGradientBound.gradientLowerBound","LinearInputLevelConvergence.bandRadius","LinearInputRegularBand.IsTrajectory"]},{"id":464,"name":"LinearInputCoupledConsequences.exists_global_injective_convergent_solution","label":"存在・大域・収束 · 465","chapter":"結合系の帰結","school":"LinearInput","file":"linear_input/lean_check/CoupledConsequences.inc","line":53,"parents":[374,376,377,447,463],"statementRefs":["LinearInputCoupledTrajectory.State","LinearInputCoupledTrajectory.vectorField","LinearInputDesign.E"],"depth":12,"otherProjectRefs":["LinearInputCoupledTrajectory.State","LinearInputCoupledTrajectory.vectorField","LinearInputDesign.E","LinearInputGradientBound.gradientLowerBound","LinearInputLevelConvergence.bandRadius","LinearInputRegularBand.IsTrajectory"]}]}</script>
<script id="atlas-proofs" type="application/json">{"schema":1,"origin":"original primitive-lean theorem sources, pinned in DAG","boundary":"source statements and Lean proof excerpts, not automatically converted into complete Japanese human proofs","records":[{"id":0,"line":21,"statement":"theorem locallyMinimizing_affine_density_iff {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (a b : ℝ) :\n    LocallyMinimizing (fun q => ε q + a * q + b) θ ℓ ↔\n      LocallyMinimizing ε θ ℓ","proof":"by\n  have he (ψ : ℝ → ℝ) (hψ : ContDiff ℝ 1 ψ)\n      (h0 : ψ 0 = θ 0) (hend : ψ ℓ = θ ℓ) :\n      energy (fun q => ε q + a * q + b) θ ℓ ≤\n          energy (fun q => ε q + a * q + b) ψ ℓ ↔\n        energy ε θ ℓ ≤ energy ε ψ ℓ := by\n    rw [energy_affine_density hε hθ, energy_affine_density hε hψ, h0, hend]\n    exact (add_le_add_iff_right _).trans (add_le_add_iff_right _)\n  constructor <;> rintro ⟨r, hr, hm⟩ <;> refine ⟨r, hr, ?_⟩ <;>\n    intro ψ hψ h0 hend hx hy hclose\n  · exact (he ψ hψ h0 hend).mp (hm ψ hψ h0 hend hx hy hclose)\n  · exact (he ψ hψ h0 hend).mpr (hm ψ hψ h0 hend hx hy hclose)","truncated":false,"comment":"Adding an affine function of signed curvature preserves the same C¹\nconstrained local minima, including the same neighborhood radius."},{"id":1,"line":40,"statement":"theorem stationary_affine_density_iff {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (a b : ℝ) :\n    Stationary (fun q => ε q + a * q + b) θ ℓ ↔ Stationary ε θ ℓ","proof":"by\n  have he (η : variationSpace ℓ) :\n      (fun t => energy (fun q => ε q + a * q + b) (angleVariation θ η.val t) ℓ) =\n        (fun t => energy ε (angleVariation θ η.val t) ℓ +\n          (a * (θ ℓ - θ 0) + b * ℓ)) := by\n    funext t\n    have hvar : ContDiff ℝ 1 (angleVariation θ η.val t) :=\n      hθ.add (contDiff_const.mul η.property.1)\n    rw [energy_affine_density hε hvar]\n    simp only [angleVariation, η.property.2.1, η.property.2.2, mul_zero, add_zero]\n    ring\n  unfold Stationary\n  simp_rw [he, deriv_add_const]","truncated":false,"comment":"Along every fixed-angle variation the actual energy functions differ by a\nconstant.  Thus affine density changes preserve actual derivative stationarity;\nno first-variation formula is introduced as a hypothesis."},{"id":2,"line":58,"statement":"theorem locallyMinimizing_powerLogDensity_one_iff {θ : ℝ → ℝ} {ℓ κ₀ : ℝ}\n    (hθ : ContDiff ℝ 1 θ) (K : ℝ) (hκ₀ : 0 < κ₀) :\n    LocallyMinimizing (powerLogDensity 1 K κ₀) θ ℓ ↔\n      LocallyMinimizing (fun q => (K / κ₀) * q ^ 2 / 2) θ ℓ","proof":"by\n  have he : powerLogDensity 1 K κ₀ =\n      fun q => (K / κ₀) * q ^ 2 / 2 + (-K) * q + K * κ₀ / 2 := by\n    funext q\n    rw [powerLogDensity_one K hκ₀]\n    ring\n  rw [he]\n  exact locallyMinimizing_affine_density_iff (by fun_prop) hθ (-K) (K * κ₀ / 2)","truncated":false,"comment":"Exponent one gives exactly the classical quadratic C¹ local-minimum\nproblem, on all signed curvatures and with the original endpoint constraints."},{"id":3,"line":72,"statement":"theorem stationary_powerLogDensity_one_iff {θ : ℝ → ℝ} {ℓ κ₀ : ℝ}\n    (hθ : ContDiff ℝ 1 θ) (K : ℝ) (hκ₀ : 0 < κ₀) :\n    Stationary (powerLogDensity 1 K κ₀) θ ℓ ↔\n      Stationary (fun q => (K / κ₀) * q ^ 2 / 2) θ ℓ","proof":"by\n  have he : powerLogDensity 1 K κ₀ =\n      fun q => (K / κ₀) * q ^ 2 / 2 + (-K) * q + K * κ₀ / 2 := by\n    funext q\n    rw [powerLogDensity_one K hκ₀]\n    ring\n  rw [he]\n  exact stationary_affine_density_iff (by fun_prop) hθ (-K) (K * κ₀ / 2)","truncated":false,"comment":"The exponent-one response and the corresponding quadratic density have\nthe same stationary angles under the original linearized endpoint constraints."},{"id":4,"line":88,"statement":"theorem locallyMinimizing_powerLogDensity_one_classical_equations\n    {θ : ℝ → ℝ} {ℓ κ₀ : ℝ} (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hne : ¬ ∀ s ∈ Icc 0 ℓ, θ s = θ 0) (K : ℝ) (hκ₀ : 0 < κ₀)\n    (hmin : LocallyMinimizing (powerLogDensity 1 K κ₀) θ ℓ) :\n    ∃ lam μ σ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      ((K / κ₀) * deriv (deriv θ) s = -lam * sin (θ s) + μ * cos (θ s)) ∧\n      ((K / κ₀) * (deriv θ s) ^ 2 / 2 -\n        lam * cos (θ s) - μ * sin (θ s) = σ) ∧\n      ((K / κ₀) * deriv (deriv (deriv θ)) s +\n        (K / κ₀) * (deriv θ s) ^ 3 / 2 - σ * deriv θ s = 0)","proof":"by\n  have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n  have hκ : ContDiff ℝ 2 (deriv θ) := hθ.deriv' (n := 2)\n  have hmin' := (locallyMinimizing_powerLogDensity_one_iff hθ1 K hκ₀).mp hmin\n  obtain ⟨lam, μ, σ, heq⟩ :=\n    locallyMinimizing_angle_firstIntegral_curvature hℓ (by fun_prop) hθ hne hmin'\n  have hmoment : (fun t => deriv (fun q : ℝ => (K / κ₀) * q ^ 2 / 2) (deriv θ t)) =\n      (fun t => (K / κ₀) * deriv θ t) := by\n    funext t\n    exact (quadratic_density_hasDerivAt (K / κ₀) (deriv θ t)).deriv\n  refine ⟨lam, μ, σ, ?_⟩\n  intro s hs\n  obtain ⟨hangle, hfirst, hcurve⟩ := heq s hs\n  refine ⟨?_, ?_, quadratic_curvature_equation hκ hcurve⟩\n  · rw [hmoment] at hangle\n    rw [((hκ.differentiable (by norm_num) s).hasDerivAt.const_mul (K / κ₀)).deriv]\n      at hangle\n    exact hangle\n  · rw [(quadratic_density_hasDerivAt (K / κ₀) (deriv θ s)).deriv] at hfirst\n    nlinarith [hfirst]","truncated":false,"comment":"A nonstraight C³ local minimum for the exponent-one response satisfies the\nclassical angle, first-integral, and curvature equations with stiffness `K / κ₀`.\nThe hypotheses are on the actual constrained energy; no stationarity or equation\nis supplied.  The first-integral constant is that of the quadratic representative."},{"id":5,"line":14,"statement":"theorem locallyMinimizing_powerLogDensity_one_scaling_iff {θ : ℝ → ℝ}\n    {a ℓ κ₀ : ℝ} (ha : 0 < a) (hθ : ContDiff ℝ 1 θ)\n    (K : ℝ) (hκ₀ : 0 < κ₀) :\n    LocallyMinimizing (powerLogDensity 1 K κ₀) (fun s => θ (s / a)) (a * ℓ) ↔\n      LocallyMinimizing (powerLogDensity 1 K κ₀) θ ℓ","proof":"by\n  exact (locallyMinimizing_powerLogDensity_one_iff (contDiff_angle_scaling hθ a) K hκ₀).trans\n    ((locallyMinimizing_scaling_iff_quadratic ha hθ (K / κ₀)).trans\n      (locallyMinimizing_powerLogDensity_one_iff hθ K hκ₀).symm)","truncated":false,"comment":"Fixed K and reference curvature still give equivalent C¹ local-minimum\nproblems under similarity, even though this density itself is not homogeneous."},{"id":6,"line":25,"statement":"theorem energy_powerLogDensity_one_scaling {θ : ℝ → ℝ} {a κ₀ : ℝ}\n    (ha : 0 < a) (hθ : ContDiff ℝ 1 θ) (K : ℝ) (hκ₀ : 0 < κ₀) (ℓ : ℝ) :\n    energy (powerLogDensity 1 K κ₀) (fun s => θ (s / a)) (a * ℓ) =\n      energy (powerLogDensity 1 K κ₀) θ ℓ / a +\n      K * (1 / a - 1) * (θ ℓ - θ 0) + K * κ₀ / 2 * (a - 1 / a) * ℓ","proof":"by\n  rw [energy_powerLogDensity_one (contDiff_angle_scaling hθ a) K hκ₀,\n    energy_scaling_quadratic (hθ.differentiable one_ne_zero) ha,\n    energy_powerLogDensity_one hθ K hκ₀]\n  simp only [zero_div, mul_div_cancel_left₀ ℓ ha.ne']\n  ring","truncated":false,"comment":"The exact scaling law includes boundary constants. It is not the\nhomogeneous scaling law of the quadratic representative alone."},{"id":7,"line":24,"statement":"theorem integral_split_three {f : ℝ → ℝ} (hf : Continuous f) (a b ℓ : ℝ) :\n    (∫ s in 0..ℓ, f s) =\n      (∫ s in 0..a, f s) + (∫ s in a..b, f s) + (∫ s in b..ℓ, f s)","proof":"by\n  rw [intervalIntegral.integral_add_adjacent_intervals\n    (hf.intervalIntegrable 0 a) (hf.intervalIntegrable a b),\n    intervalIntegral.integral_add_adjacent_intervals\n      (hf.intervalIntegrable 0 b) (hf.intervalIntegrable b ℓ)]","truncated":false,"comment":"Three consecutive oriented interval integrals give the original integral.\nIn applications the cuts satisfy `0 ≤ a ≤ b ≤ ℓ`; the identity itself needs no\nordering assumption."},{"id":8,"line":33,"statement":"theorem energy_split_three {ε θ : ℝ → ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (a b ℓ : ℝ) :\n    energy ε θ ℓ =\n      (∫ s in 0..a, ε (deriv θ s)) +\n      (∫ s in a..b, ε (deriv θ s)) +\n      (∫ s in b..ℓ, ε (deriv θ s))","proof":"integral_split_three (hε.comp hθ.continuous_deriv_one) a b ℓ","truncated":false,"comment":"The actual curvature energy splits into the three pieces."},{"id":9,"line":42,"statement":"theorem xCoord_sub_eq_integral {θ : ℝ → ℝ} (hθ : Continuous θ)\n    (x₀ a b : ℝ) :\n    xCoord θ x₀ b - xCoord θ x₀ a = ∫ s in a..b, cos (θ s)","proof":"by\n  have h := intervalIntegral.integral_add_adjacent_intervals\n    (μ := volume) (f := fun s => cos (θ s))\n    ((continuous_cos.comp hθ).intervalIntegrable 0 a)\n    ((continuous_cos.comp hθ).intervalIntegrable a b)\n  unfold xCoord\n  linarith","truncated":false,"comment":"The horizontal displacement of any subarc is its tangent integral."},{"id":10,"line":53,"statement":"theorem yCoord_sub_eq_integral {θ : ℝ → ℝ} (hθ : Continuous θ)\n    (y₀ a b : ℝ) :\n    yCoord θ y₀ b - yCoord θ y₀ a = ∫ s in a..b, sin (θ s)","proof":"by\n  have h := intervalIntegral.integral_add_adjacent_intervals\n    (μ := volume) (f := fun s => sin (θ s))\n    ((continuous_sin.comp hθ).intervalIntegrable 0 a)\n    ((continuous_sin.comp hθ).intervalIntegrable a b)\n  unfold yCoord\n  linarith","truncated":false,"comment":"The vertical displacement of any subarc is its tangent integral."},{"id":11,"line":64,"statement":"theorem xCoord_split_three {θ : ℝ → ℝ} (hθ : Continuous θ) (x₀ a b ℓ : ℝ) :\n    xCoord θ x₀ ℓ = x₀ +\n      ((∫ s in 0..a, cos (θ s)) + (∫ s in a..b, cos (θ s)) +\n        (∫ s in b..ℓ, cos (θ s)))","proof":"by\n  unfold xCoord\n  exact congrArg (fun z : ℝ => x₀ + z)\n    (integral_split_three (f := fun s => cos (θ s)) (continuous_cos.comp hθ) a b ℓ)","truncated":false,"comment":"Position reconstruction splits at exactly the same cut locations as energy."},{"id":12,"line":72,"statement":"theorem yCoord_split_three {θ : ℝ → ℝ} (hθ : Continuous θ) (y₀ a b ℓ : ℝ) :\n    yCoord θ y₀ ℓ = y₀ +\n      ((∫ s in 0..a, sin (θ s)) + (∫ s in a..b, sin (θ s)) +\n        (∫ s in b..ℓ, sin (θ s)))","proof":"by\n  unfold yCoord\n  exact congrArg (fun z : ℝ => y₀ + z)\n    (integral_split_three (f := fun s => sin (θ s)) (continuous_sin.comp hθ) a b ℓ)","truncated":false,"comment":""},{"id":13,"line":83,"statement":"theorem density_integral_eq_of_angle_eqOn {ε θ φ : ℝ → ℝ} {a b : ℝ}\n    (hθ : ContDiff ℝ 1 θ) (hφ : ContDiff ℝ 1 φ) (hab : a ≤ b)\n    (hEq : EqOn θ φ (Icc a b)) :\n    (∫ s in a..b, ε (deriv θ s)) = ∫ s in a..b, ε (deriv φ s)","proof":"by\n  rcases hab.eq_or_lt with hab | hab\n  · subst b\n    simp\n  have hd : EqOn (deriv θ) (deriv φ) (Ioo a b) := by\n    intro s hs\n    have he : θ =ᶠ[𝓝 s] φ := by\n      filter_upwards [isOpen_Ioo.mem_nhds hs] with t ht\n      exact hEq ⟨ht.1.le, ht.2.le⟩\n    exact he.deriv_eq\n  have hdc : EqOn (deriv θ) (deriv φ) (Icc a b) := by\n    have hc := hd.closure hθ.continuous_deriv_one hφ.continuous_deriv_one\n    simpa only [closure_Ioo hab.ne] using hc\n  apply intervalIntegral.integral_congr\n  intro s hs\n  rw [uIcc_of_le hab.le] at hs\n  exact congrArg ε (hdc hs)","truncated":false,"comment":"Agreement of two C¹ angles on a closed interval implies agreement of\ntheir density integrals. Derivative agreement is derived, not assumed.\nDegenerate intervals are included."},{"id":14,"line":107,"statement":"theorem boundary_eq_of_middle_integrals {θ φ : ℝ → ℝ} {a b ℓ : ℝ}\n    (hθ : Continuous θ) (hφ : Continuous φ)\n    (ha : 0 ≤ a) (_hab : a ≤ b) (hb : b ≤ ℓ)\n    (hleft : EqOn θ φ (Icc 0 a)) (hright : EqOn θ φ (Icc b ℓ))\n    (hx : (∫ s in a..b, cos (θ s)) = ∫ s in a..b, cos (φ s))\n    (hy : (∫ s in a..b, sin (θ s)) = ∫ s in a..b, sin (φ s))\n    (x₀ y₀ : ℝ) :\n    θ 0 = φ 0 ∧ θ ℓ = φ ℓ ∧\n      xCoord θ x₀ ℓ = xCoord φ x₀ ℓ ∧ yCoord θ y₀ ℓ = yCoord φ y₀ ℓ","proof":"by\n  have hcos_left : (∫ s in 0..a, cos (θ s)) = ∫ s in 0..a, cos (φ s) := by\n    apply intervalIntegral.integral_congr\n    intro s hs\n    rw [uIcc_of_le ha] at hs\n    exact congrArg cos (hleft hs)\n  have hsin_left : (∫ s in 0..a, sin (θ s)) = ∫ s in 0..a, sin (φ s) := by\n    apply intervalIntegral.integral_congr\n    intro s hs\n    rw [uIcc_of_le ha] at hs\n    exact congrArg sin (hleft hs)\n  have hcos_right : (∫ s in b..ℓ, cos (θ s)) = ∫ s in b..ℓ, cos (φ s) := by\n    apply intervalIntegral.integral_congr\n    intro s hs\n    rw [uIcc_of_le hb] at hs\n    exact congrArg cos (hright hs)\n  have hsin_right : (∫ s in b..ℓ, sin (θ s)) = ∫ s in b..ℓ, sin (φ s) := by\n    apply intervalIntegral.integral_congr\n    intro s hs\n    rw [uIcc_of_le hb] at hs\n    exact congrArg sin (hright hs)\n  refine ⟨hleft ⟨le_rfl, ha⟩, hright ⟨hb, le_rfl⟩, ?_, ?_⟩\n  · rw [xCoord_split_three hθ x₀ a b ℓ, xCoord_split_three hφ x₀ a b ℓ,\n      hcos_left, hx, hcos_right]\n  · rw [yCoord_split_three hθ y₀ a b ℓ, yCoord_split_three hφ y₀ a b ℓ,\n      hsin_left, hy, hsin_right]","truncated":false,"comment":"Two already smooth curves with the same exterior angles have the same\nboundary angles and positions when both middle displacement integrals match.\nThe theorem does not construct a gluing from arbitrary angle pieces."},{"id":15,"line":144,"statement":"theorem energy_sub_eq_middle_of_outer_angle_eq {ε θ φ : ℝ → ℝ} {a b ℓ : ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (hφ : ContDiff ℝ 1 φ)\n    (ha : 0 ≤ a) (_hab : a ≤ b) (hb : b ≤ ℓ)\n    (hleft : EqOn θ φ (Icc 0 a)) (hright : EqOn θ φ (Icc b ℓ)) :\n    energy ε φ ℓ - energy ε θ ℓ =\n      (∫ s in a..b, ε (deriv φ s)) - (∫ s in a..b, ε (deriv θ s))","proof":"by\n  have hl := density_integral_eq_of_angle_eqOn (ε := ε) hθ hφ ha hleft\n  have hr := density_integral_eq_of_angle_eqOn (ε := ε) hθ hφ hb hright\n  rw [energy_split_three hε hθ a b ℓ, energy_split_three hε hφ a b ℓ, hl, hr]\n  ring","truncated":false,"comment":"A smooth middle replacement changes the total energy by exactly the middle\nintegral difference. The angle agreement outside implies derivative agreement."},{"id":16,"line":157,"statement":"theorem energy_le_iff_middle_integral_le {ε θ φ : ℝ → ℝ} {a b ℓ : ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (hφ : ContDiff ℝ 1 φ)\n    (ha : 0 ≤ a) (hab : a ≤ b) (hb : b ≤ ℓ)\n    (hleft : EqOn θ φ (Icc 0 a)) (hright : EqOn θ φ (Icc b ℓ)) :\n    energy ε φ ℓ ≤ energy ε θ ℓ ↔\n      (∫ s in a..b, ε (deriv φ s)) ≤ ∫ s in a..b, ε (deriv θ s)","proof":"by\n  have h := energy_sub_eq_middle_of_outer_angle_eq hε hθ hφ ha hab hb hleft hright\n  constructor <;> intro hh <;> linarith","truncated":false,"comment":"Under the same smooth exterior data, energy comparison is exactly comparison\nof the middle integrals. No minimizer existence is asserted."},{"id":17,"line":23,"statement":"theorem hasDerivAt_deriv_integral_variation {ε κ v : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε) (hκ : Continuous κ) (hv : Continuous v) :\n    HasDerivAt (deriv (fun t => ∫ s in 0..ℓ, ε (κ s + t * v s)))\n      (∫ s in 0..ℓ, deriv (deriv ε) (κ s) * (v s) ^ 2) 0","proof":"by\n  have hd : deriv (fun t => ∫ s in 0..ℓ, ε (κ s + t * v s)) =\n      fun t => ∫ s in 0..ℓ, deriv ε (κ s + t * v s) * v s := by\n    funext t\n    simpa only [mul_one] using\n      (hasDerivAt_weighted_integral_variation (w := fun _ => 1) hℓ\n        (hε.of_le (by norm_num)) hκ hv continuous_const t).deriv\n  rw [hd]\n  simpa only [zero_mul, add_zero, mul_assoc, ← pow_two] using\n    (hasDerivAt_weighted_integral_variation (ε := deriv ε) (w := v)\n      hℓ hε.deriv' hκ hv hv 0)","truncated":false,"comment":"Second parameter derivative for the actual integral, without imposing that\nthe argument of the density is a spatial derivative."},{"id":18,"line":39,"statement":"theorem hasDerivAt_deriv_add {f g : ℝ → ℝ} {f₂ g₂ x : ℝ}\n    (hf : ∀ᶠ t in 𝓝 x, DifferentiableAt ℝ f t)\n    (hg : ∀ᶠ t in 𝓝 x, DifferentiableAt ℝ g t)\n    (hf₂ : HasDerivAt (deriv f) f₂ x) (hg₂ : HasDerivAt (deriv g) g₂ x) :\n    HasDerivAt (deriv (fun t => f t + g t)) (f₂ + g₂) x","proof":"by\n  apply (hf₂.add hg₂).congr_of_eventuallyEq\n  filter_upwards [hf, hg] with t hft hgt\n  exact deriv_add hft hgt","truncated":false,"comment":"Differentiating a sum twice when the first derivatives exist in a neighborhood."},{"id":19,"line":49,"statement":"theorem hasDerivAt_deriv_const_mul {f : ℝ → ℝ} {f₂ x : ℝ}\n    (hf : ∀ᶠ t in 𝓝 x, DifferentiableAt ℝ f t)\n    (hf₂ : HasDerivAt (deriv f) f₂ x) (a : ℝ) :\n    HasDerivAt (deriv (fun t => a * f t)) (a * f₂) x","proof":"by\n  apply (hf₂.const_mul a).congr_of_eventuallyEq\n  filter_upwards [hf] with t hft\n  exact deriv_const_mul a hft","truncated":false,"comment":"Constant multiplication commutes with the second derivative."},{"id":20,"line":58,"statement":"theorem hasDerivAt_deriv_augmentedEnergy_variation {ε θ η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) (lam μ : ℝ) :\n    HasDerivAt (deriv (fun t => augmentedEnergy ε (angleVariation θ η t) ℓ lam μ))\n      (∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s) ^ 2 -\n        (lam * cos (θ s) + μ * sin (θ s)) * (η s) ^ 2) 0","proof":"by\n  let f := fun t => energy ε (angleVariation θ η t) ℓ\n  let g := fun t => ∫ s in 0..ℓ, cos (θ s + t * η s)\n  let h := fun t => ∫ s in 0..ℓ, sin (θ s + t * η s)\n  have hf (t : ℝ) : DifferentiableAt ℝ f t :=\n    (hasDerivAt_energy_variation_at hℓ (hε.of_le (by norm_num)) hθ hη t).differentiableAt\n  have hg (t : ℝ) : DifferentiableAt ℝ g t := by\n    have hg' := hasDerivAt_weighted_integral_variation (ε := cos) (w := fun _ => 1)\n      hℓ contDiff_cos hθ.continuous hη.continuous continuous_const t\n    simpa only [mul_one] using hg'.differentiableAt\n  have hh (t : ℝ) : DifferentiableAt ℝ h t := by\n    have hh' := hasDerivAt_weighted_integral_variation (ε := sin) (w := fun _ => 1)\n      hℓ contDiff_sin hθ.continuous hη.continuous continuous_const t\n    simpa only [mul_one] using hh'.differentiableAt\n  have hf₂ := hasDerivAt_deriv_energy_variation hℓ hε hθ hη\n  have hg₂ : HasDerivAt (deriv g) (∫ s in 0..ℓ, -cos (θ s) * (η s)^2) 0 := by\n    simpa only [Real.deriv_cos', deriv.fun_neg, Real.deriv_sin] using\n      (hasDerivAt_deriv_integral_variation hℓ (ε := cos) contDiff_cos hθ.continuous hη.continuous)\n  have hh₂ : HasDerivAt (deriv h) (∫ s in 0..ℓ, -sin (θ s) * (η s)^2) 0 := by\n    simpa only [Real.deriv_sin, Real.deriv_cos] using\n      (hasDerivAt_deriv_integral_variation hℓ (ε := sin) contDiff_sin hθ.continuous hη.continuous)\n  have hsum := hasDerivAt_deriv_add\n    (Filter.Eventually.of_forall (fun t => (hf t).add ((hg t).const_mul lam)))\n    (Filter.Eventually.of_forall (fun t => (hh t).const_mul μ))\n    (hasDerivAt_deriv_add (Filter.Eventually.of_forall hf)\n      (Filter.Eventually.of_forall (fun t => (hg t).const_mul lam)) hf₂\n      (hasDerivAt_deriv_const_mul (Filter.Eventually.of_forall hg) hg₂ lam))\n    (hasDerivAt_deriv_const_mul (Filter.Eventually.of_forall hh) hh₂ μ)\n  have hε₂ : Continuous (deriv (deriv ε)) := hε.deriv'.continuous_deriv_one\n  have hi₁ : IntervalIntegrable\n      (fun s => deriv (deriv ε) (deriv θ s) * (deriv η s)^2) volume 0 ℓ :=\n    ((hε₂.comp hθ.continuous_deriv_one).mul (hη.continuous_deriv_one.pow 2)).intervalIntegrable 0 ℓ\n  have hi₂ : IntervalIntegrable (fun s => lam * (-cos (θ s) * (η s)^2)) volume 0 ℓ :=\n    (continuous_const.mul ((Real.continuous_cos.comp hθ.continuous).neg.mul\n      (hη.continuous.pow 2))).intervalIntegrable 0 ℓ\n  have hi₃ : IntervalIntegrable (fun s => μ * (-sin (θ s) * (η s)^2)) volume 0 ℓ :=\n    (continuous_const.mul ((Real.continuous_sin.comp hθ.continuous).neg.mul\n      (hη.continuous.pow 2))).intervalIntegrable 0 ℓ\n  have heq : (∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s)^2) +\n      lam * (∫ s in 0..ℓ, -cos (θ s) * (η s)^2) +\n      μ * (∫ s in 0..ℓ, -sin (θ s) * (η s)^2) =\n      ∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s)^2 -\n        (lam * cos (θ s) + μ * sin (θ s)) * (η s)^2 := by\n    rw [← intervalIntegral.integral_const_mul, ← intervalIntegral.integral_const_mul,\n      ← intervalIntegral.integral_add hi₁ hi₂,\n      ← intervalIntegral.integral_add (hi₁.add hi₂) hi₃]\n    apply intervalIntegral.integral_congr\n    intro s _\n    dsimp\n    ring\n  rw [heq] at hsum\n  exact hsum","truncated":false,"comment":"The actual additive second variation of the Lagrange augmented energy."},{"id":21,"line":117,"statement":"theorem secondVariation_augmentedEnergy {ε θ η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) (lam μ : ℝ) :\n    deriv (deriv (fun t => augmentedEnergy ε (angleVariation θ η t) ℓ lam μ)) 0 =\n      ∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s)^2 -\n        (lam * cos (θ s) + μ * sin (θ s)) * (η s)^2","proof":"(hasDerivAt_deriv_augmentedEnergy_variation hℓ hε hθ hη lam μ).deriv","truncated":false,"comment":"Scalar second derivative form of the augmented variation theorem."},{"id":22,"line":127,"statement":"theorem hasDerivAt_integral_of_continuousOn_rectangle\n    {F D : ℝ → ℝ → ℝ} {ℓ r t₀ : ℝ} (hℓ : 0 ≤ ℓ)\n    (ht₀ : t₀ ∈ Ioo (-r) r)\n    (hF : ContinuousOn (fun p : ℝ × ℝ => F p.1 p.2) (Icc (-r) r ×ˢ Icc 0 ℓ))\n    (hD : ContinuousOn (fun p : ℝ × ℝ => D p.1 p.2) (Icc (-r) r ×ˢ Icc 0 ℓ))\n    (hd : ∀ t ∈ Ioo (-r) r, ∀ s ∈ Icc 0 ℓ, HasDerivAt (fun u => F u s) (D t s) t) :\n    HasDerivAt (fun t => ∫ s in 0..ℓ, F t s) (∫ s in 0..ℓ, D t₀ s) t₀","proof":"by\n  have hint (t : ℝ) (ht : t ∈ Icc (-r) r) : IntervalIntegrable (F t) volume 0 ℓ := by\n    apply ContinuousOn.intervalIntegrable_of_Icc hℓ\n    exact hF.comp (continuous_const.prodMk continuous_id).continuousOn (fun s hs => ⟨ht, hs⟩)\n  have hdint (t : ℝ) (ht : t ∈ Icc (-r) r) : IntervalIntegrable (D t) volume 0 ℓ := by\n    apply ContinuousOn.intervalIntegrable_of_Icc hℓ\n    exact hD.comp (continuous_const.prodMk continuous_id).continuousOn (fun s hs => ⟨ht, hs⟩)\n  obtain ⟨C, hC⟩ :=\n    ((isCompact_Icc : IsCompact (Icc (-r) r)).prod\n      (isCompact_Icc : IsCompact (Icc (0 : ℝ) ℓ))).exists_bound_of_continuousOn hD\n  have hmeas : ∀ᶠ t in 𝓝 t₀, AEStronglyMeasurable (F t) (volume.restrict (Ioc 0 ℓ)) := by\n    filter_upwards [Ioo_mem_nhds ht₀.1 ht₀.2] with t ht\n    exact (hint t ⟨ht.1.le, ht.2.le⟩).1.aestronglyMeasurable\n  have hbound : ∀ᵐ s ∂volume.restrict (Ioc 0 ℓ),\n      ∀ t ∈ Ioo (-r) r, ‖D t s‖ ≤ C := by\n    filter_upwards [ae_restrict_mem measurableSet_Ioc] with s hs\n    intro t ht\n    exact hC (t, s) ⟨⟨ht.1.le, ht.2.le⟩, ⟨hs.1.le, hs.2⟩⟩\n  have hdiff : ∀ᵐ s ∂volume.restrict (Ioc 0 ℓ), ∀ t ∈ Ioo (-r) r,\n      HasDerivAt (fun u => F u s) (D t s) t := by\n    filter_upwards [ae_restrict_mem measurableSet_Ioc] with s hs\n    exact fun t ht => hd t ht s ⟨hs.1.le, hs.2⟩\n  have h := hasDerivAt_integral_of_dominated_loc_of_deriv_le\n    (Ioo_mem_nhds ht₀.1 ht₀.2) hmeas (hint t₀ ⟨ht₀.1.le, ht₀.2.le⟩).1\n    (hdint t₀ ⟨ht₀.1.le, ht₀.2.le⟩).1.aestronglyMeasurable hbound (integrable_const C) hdiff\n  simpa only [intervalIntegral.integral_of_le hℓ] using h.2","truncated":false,"comment":"Local differentiation under a finite integral. The hypotheses concern the\nintegrand and its actual pointwise derivative, not the integral derivative."},{"id":23,"line":161,"statement":"theorem hasDerivAt_deriv_integral_of_continuousOn_rectangle\n    {F D D₂ : ℝ → ℝ → ℝ} {ℓ r : ℝ} (hℓ : 0 ≤ ℓ) (hr : 0 < r)\n    (hF : ContinuousOn (fun p : ℝ × ℝ => F p.1 p.2) (Icc (-r) r ×ˢ Icc 0 ℓ))\n    (hD : ContinuousOn (fun p : ℝ × ℝ => D p.1 p.2) (Icc (-r) r ×ˢ Icc 0 ℓ))\n    (hD₂ : ContinuousOn (fun p : ℝ × ℝ => D₂ p.1 p.2) (Icc (-r) r ×ˢ Icc 0 ℓ))\n    (hd : ∀ t ∈ Ioo (-r) r, ∀ s ∈ Icc 0 ℓ, HasDerivAt (fun u => F u s) (D t s) t)\n    (hd₂ : ∀ t ∈ Ioo (-r) r, ∀ s ∈ Icc 0 ℓ, HasDerivAt (fun u => D u s) (D₂ t s) t) :\n    HasDerivAt (deriv (fun t => ∫ s in 0..ℓ, F t s)) (∫ s in 0..ℓ, D₂ 0 s) 0","proof":"by\n  have ht : (0 : ℝ) ∈ Ioo (-r) r := ⟨by linarith, hr⟩\n  apply (hasDerivAt_integral_of_continuousOn_rectangle hℓ ht hD hD₂ hd₂).congr_of_eventuallyEq\n  filter_upwards [Ioo_mem_nhds ht.1 ht.2] with t ht'\n  exact (hasDerivAt_integral_of_continuousOn_rectangle hℓ ht' hF hD hd).deriv","truncated":false,"comment":"Local second differentiation under the actual integral."},{"id":24,"line":175,"statement":"theorem hasDerivAt_deriv_density_integral\n    {ε : ℝ → ℝ} {K V A : ℝ → ℝ → ℝ} {ℓ r : ℝ}\n    (hℓ : 0 ≤ ℓ) (hr : 0 < r) (hε : ContDiff ℝ 2 ε)\n    (hK : ContinuousOn (fun p : ℝ × ℝ => K p.1 p.2) (Icc (-r) r ×ˢ Icc 0 ℓ))\n    (hV : ContinuousOn (fun p : ℝ × ℝ => V p.1 p.2) (Icc (-r) r ×ˢ Icc 0 ℓ))\n    (hA : ContinuousOn (fun p : ℝ × ℝ => A p.1 p.2) (Icc (-r) r ×ˢ Icc 0 ℓ))\n    (hKV : ∀ t ∈ Ioo (-r) r, ∀ s ∈ Icc 0 ℓ, HasDerivAt (fun u => K u s) (V t s) t)\n    (hVA : ∀ t ∈ Ioo (-r) r, ∀ s ∈ Icc 0 ℓ, HasDerivAt (fun u => V u s) (A t s) t) :\n    HasDerivAt (deriv (fun t => ∫ s in 0..ℓ, ε (K t s)))\n      (∫ s in 0..ℓ, deriv (deriv ε) (K 0 s) * (V 0 s)^2 + deriv ε (K 0 s) * A 0 s) 0","proof":"by\n  have hε₁ : Continuous (deriv ε) := hε.continuous_deriv (by norm_num)\n  have hε₂ : Continuous (deriv (deriv ε)) := hε.deriv'.continuous_deriv_one\n  refine hasDerivAt_deriv_integral_of_continuousOn_rectangle\n    (F := fun t s => ε (K t s)) (D := fun t s => deriv ε (K t s) * V t s)\n    (D₂ := fun t s => deriv (deriv ε) (K t s) * (V t s)^2 + deriv ε (K t s) * A t s) hℓ hr\n    (hε.continuous.comp_continuousOn hK)\n    ((hε₁.comp_continuousOn hK).mul hV)\n    (((hε₂.comp_continuousOn hK).mul (hV.pow 2)).add\n      ((hε₁.comp_continuousOn hK).mul hA)) ?_ ?_\n  · intro t ht s hs\n    exact ((hε.differentiable (by norm_num)) (K t s)).hasDerivAt.comp t (hKV t ht s hs)\n  · intro t ht s hs\n    convert (((hε.deriv'.differentiable one_ne_zero) (K t s)).hasDerivAt.comp t\n      (hKV t ht s hs)).mul (hVA t ht s hs) using 1\n    all_goals first | rfl | (simp only [Function.comp_apply]; ring)","truncated":false,"comment":"Chain and product rules under the integral, with actual pointwise time jets."},{"id":25,"line":203,"statement":"theorem exists_correction_radius {a b : ℝ → ℝ}\n    (ha : ContDiffAt ℝ 2 a 0) (hb : ContDiffAt ℝ 2 b 0) :\n    ∃ r > 0, ∀ t ∈ Icc (-r) r, ContDiffAt ℝ 2 a t ∧ ContDiffAt ℝ 2 b t","proof":"by\n  have he := (ha.eventually (by norm_num)).and (hb.eventually (by norm_num))\n  obtain ⟨δ, hδ, hsub⟩ := Metric.mem_nhds_iff.mp he\n  refine ⟨δ / 2, by linarith, ?_⟩\n  intro t ht\n  apply hsub\n  rw [Metric.mem_ball, Real.dist_eq, sub_zero, abs_lt]\n  constructor <;> linarith [ht.1, ht.2]","truncated":false,"comment":"Local C² correction coefficients have a common compact time neighborhood\non which their first two derivatives are continuous and their jets exist."},{"id":26,"line":216,"statement":"theorem hasDerivAt_corrected_integral_and_deriv\n    {ε κ v u w a b : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hκ : Continuous κ) (hv : Continuous v) (hu : Continuous u) (hw : Continuous w)\n    (ha : ContDiffAt ℝ 2 a 0) (hb : ContDiffAt ℝ 2 b 0)\n    (ha0 : a 0 = 0) (hb0 : b 0 = 0) (ha1 : deriv a 0 = 0) (hb1 : deriv b 0 = 0) :\n    HasDerivAt (fun t => ∫ s in 0..ℓ, ε (κ s + t * v s + a t * u s + b t * w s))\n      (∫ s in 0..ℓ, deriv ε (κ s) * v s) 0 ∧\n    HasDerivAt (deriv (fun t => ∫ s in 0..ℓ,\n      ε (κ s + t * v s + a t * u s + b t * w s)))\n      (∫ s in 0..ℓ, deriv (deriv ε) (κ s) * (v s)^2 +\n        deriv ε (κ s) * (deriv (deriv a) 0 * u s + deriv (deriv b) 0 * w s)) 0","proof":"by\n  obtain ⟨r, hr, hab⟩ := exists_correction_radius ha hb\n  have ca : ContinuousOn a (Icc (-r) r) := fun t ht => (hab t ht).1.continuousAt.continuousWithinAt\n  have cb : ContinuousOn b (Icc (-r) r) := fun t ht => (hab t ht).2.continuousAt.continuousWithinAt\n  have ca1 : ContinuousOn (deriv a) (Icc (-r) r) := fun t ht =>\n    ((hab t ht).1.derivWithin (m := 1) (by norm_num)).continuousAt.continuousWithinAt\n  have cb1 : ContinuousOn (deriv b) (Icc (-r) r) := fun t ht =>\n    ((hab t ht).2.derivWithin (m := 1) (by norm_num)).continuousAt.continuousWithinAt\n  have ca2 : ContinuousOn (deriv (deriv a)) (Icc (-r) r) := fun t ht =>\n    (((hab t ht).1.derivWithin (m := 1) (by norm_num)).derivWithin\n      (m := 0) (by norm_num)).continuousAt.continuousWithinAt\n  have cb2 : ContinuousOn (deriv (deriv b)) (Icc (-r) r) := fun t ht =>\n    (((hab t ht).2.derivWithin (m := 1) (by norm_num)).derivWithin\n      (m := 0) (by norm_num)).continuousAt.continuousWithinAt\n  let S := Icc (-r) r ×ˢ Icc (0 : ℝ) ℓ\n  have cp {f : ℝ → ℝ} (hf : ContinuousOn f (Icc (-r) r)) :\n      ContinuousOn (fun p : ℝ × ℝ => f p.1) S :=\n    hf.comp continuous_fst.continuousOn (fun _ hp => hp.1)\n  have cs {f : ℝ → ℝ} (hf : Continuous f) :\n      ContinuousOn (fun p : ℝ × ℝ => f p.2) S := (hf.comp continuous_snd).continuousOn\n  let K : ℝ → ℝ → ℝ := fun t s => κ s + t * v s + a t * u s + b t * w s\n  let V : ℝ → ℝ → ℝ := fun t s => v s + deriv a t * u s + deriv b t * w s\n  let A : ℝ → ℝ → ℝ := fun t s => deriv (deriv a) t * u s + deriv (deriv b) t * w s\n  have hK : ContinuousOn (fun p : ℝ × ℝ => K p.1 p.2) S :=\n    (((cs hκ).add (continuous_fst.continuousOn.mul (cs hv))).add\n      ((cp ca).mul (cs hu))).add ((cp cb).mul (cs hw))\n  have hV : ContinuousOn (fun p : ℝ × ℝ => V p.1 p.2) S :=\n    ((cs hv).add ((cp ca1).mul (cs hu))).add ((cp cb1).mul (cs hw))\n  have hA : ContinuousOn (fun p : ℝ × ℝ => A p.1 p.2) S :=\n    ((cp ca2).mul (cs hu)).add ((cp cb2).mul (cs hw))\n  have hdK : ∀ t ∈ Ioo (-r) r, ∀ s ∈ Icc 0 ℓ, HasDerivAt (fun t => K t s) (V t s) t := by\n    intro t ht s _\n    have ha' := ((hab t ⟨ht.1.le, ht.2.le⟩).1.differentiableAt (by norm_num)).hasDerivAt\n    have hb' := ((hab t ⟨ht.1.le, ht.2.le⟩).2.differentiableAt (by norm_num)).hasDerivAt\n    convert ((((hasDerivAt_id t).mul_const (v s)).const_add (κ s)).add\n      (ha'.mul_const (u s))).add (hb'.mul_const (w s)) using 1\n    all_goals first | rfl | simp [V]\n  have hdV : ∀ t ∈ Ioo (-r) r, ∀ s ∈ Icc 0 ℓ, HasDerivAt (fun t => V t s) (A t s) t := by\n    intro t ht s _\n    have ha' := (((hab t ⟨ht.1.le, ht.2.le⟩).1.derivWithin\n      (m := 1) (by norm_num)).differentiableAt one_ne_zero).hasDerivAt\n    have hb' := (((hab t ⟨ht.1.le, ht.2.le⟩).2.derivWithin\n      (m := 1) (by norm_num)).differentiableAt one_ne_zero).hasDerivAt\n    convert ((ha'.mul_const (u s)).const_add (v s)).add (hb'.mul_const (w s)) using 1\n  constructor\n  · have hf := hasDerivAt_integral_of_continuousOn_rectangle\n      (F := fun t s => ε (K t s)) (D := fun t s => deriv ε (K t s) * V t s)\n      hℓ (show (0 : ℝ) ∈ Ioo (-r) r from ⟨by linarith, hr⟩)\n      (hε.continuous.comp_continuousOn hK)\n      (((hε.continuous_deriv (by norm_num)).comp_continuousOn hK).mul hV)\n      (fun t ht s hs => ((hε.differentiable (by norm_num)) (K t s)).hasDerivAt.comp t\n        (hdK t ht s hs))\n    simpa [K, V, ha0, hb0, ha1, hb1] using hf\n  · simpa [K, V, A, ha0, hb0, ha1, hb1] using\n      (hasDerivAt_deriv_density_integral hℓ hr hε hK hV hA hdK hdV)","truncated":false,"comment":"Exact second derivative of a locally C² corrected integral family. The\nacceleration terms are derived, not discarded or assumed to vanish."},{"id":27,"line":284,"statement":"theorem hasDerivAt_deriv_corrected_integral\n    {ε κ v u w a b : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hκ : Continuous κ) (hv : Continuous v) (hu : Continuous u) (hw : Continuous w)\n    (ha : ContDiffAt ℝ 2 a 0) (hb : ContDiffAt ℝ 2 b 0)\n    (ha0 : a 0 = 0) (hb0 : b 0 = 0) (ha1 : deriv a 0 = 0) (hb1 : deriv b 0 = 0) :\n    HasDerivAt (deriv (fun t => ∫ s in 0..ℓ,\n      ε (κ s + t * v s + a t * u s + b t * w s)))\n      (∫ s in 0..ℓ, deriv (deriv ε) (κ s) * (v s)^2 +\n        deriv ε (κ s) * (deriv (deriv a) 0 * u s + deriv (deriv b) 0 * w s)) 0","proof":"(hasDerivAt_corrected_integral_and_deriv hℓ hε hκ hv hu hw ha hb ha0 hb0 ha1 hb1).2","truncated":false,"comment":"Second derivative projection of the full corrected integral calculation."},{"id":28,"line":297,"statement":"theorem deriv_corrected_angle {θ η ξ₁ ξ₂ : ℝ → ℝ}\n    (hθ : Differentiable ℝ θ) (hη : Differentiable ℝ η)\n    (hξ₁ : Differentiable ℝ ξ₁) (hξ₂ : Differentiable ℝ ξ₂)\n    (a b : ℝ → ℝ) (t s : ℝ) :\n    deriv (fun x => θ x + t * η x + a t * ξ₁ x + b t * ξ₂ x) s =\n      deriv θ s + t * deriv η s + a t * deriv ξ₁ s + b t * deriv ξ₂ s","proof":"by\n  exact ((((hθ s).hasDerivAt.add ((hη s).hasDerivAt.const_mul t)).add\n    ((hξ₁ s).hasDerivAt.const_mul (a t))).add ((hξ₂ s).hasDerivAt.const_mul (b t))).deriv","truncated":false,"comment":"Spatial differentiation of the actual corrected angle family."},{"id":29,"line":308,"statement":"theorem hasDerivAt_corrected_energy_and_deriv\n    {ε θ η ξ₁ ξ₂ a b : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η)\n    (hξ₁ : ContDiff ℝ 1 ξ₁) (hξ₂ : ContDiff ℝ 1 ξ₂)\n    (ha : ContDiffAt ℝ 2 a 0) (hb : ContDiffAt ℝ 2 b 0)\n    (ha0 : a 0 = 0) (hb0 : b 0 = 0) (ha1 : deriv a 0 = 0) (hb1 : deriv b 0 = 0) :\n    HasDerivAt (fun t => energy ε\n      (fun s => θ s + t * η s + a t * ξ₁ s + b t * ξ₂ s) ℓ)\n      (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv η s) 0 ∧\n    HasDerivAt (deriv (fun t => energy ε\n      (fun s => θ s + t * η s + a t * ξ₁ s + b t * ξ₂ s) ℓ))\n      (∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s)^2 +\n        deriv ε (deriv θ s) *\n          (deriv (deriv a) 0 * deriv ξ₁ s + deriv (deriv b) 0 * deriv ξ₂ s)) 0","proof":"by\n  simpa only [energy, deriv_corrected_angle (hθ.differentiable one_ne_zero)\n    (hη.differentiable one_ne_zero) (hξ₁.differentiable one_ne_zero) (hξ₂.differentiable one_ne_zero)]\n    using hasDerivAt_corrected_integral_and_deriv hℓ hε hθ.continuous_deriv_one\n      hη.continuous_deriv_one hξ₁.continuous_deriv_one hξ₂.continuous_deriv_one\n      ha hb ha0 hb0 ha1 hb1","truncated":false,"comment":"First and second derivatives of the actual energy along a locally C²\ncorrected angle family. The second derivative retains its acceleration term."},{"id":30,"line":330,"statement":"theorem second_deriv_zero_of_eventually_const {f : ℝ → ℝ} {c x : ℝ}\n    (h : f =ᶠ[𝓝 x] fun _ => c) : deriv (deriv f) x = 0","proof":"by\n  rw [h.deriv.deriv_eq]\n  simp","truncated":false,"comment":"A function that is locally constant has zero actual second derivative."},{"id":31,"line":337,"statement":"theorem constrained_secondVariation_corrected\n    {ε θ η a b : ℝ → ℝ} {ℓ lam μ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η)\n    (ξ₁ ξ₂ : variationSpace ℓ)\n    (ha : ContDiffAt ℝ 2 a 0) (hb : ContDiffAt ℝ 2 b 0)\n    (ha0 : a 0 = 0) (hb0 : b 0 = 0) (ha1 : deriv a 0 = 0) (hb1 : deriv b 0 = 0)\n    (hx : (fun t => ∫ s in 0..ℓ,\n      cos (θ s + t * η s + a t * ξ₁.val s + b t * ξ₂.val s)) =ᶠ[𝓝 0]\n        fun _ => ∫ s in 0..ℓ, cos (θ s))\n    (hy : (fun t => ∫ s in 0..ℓ,\n      sin (θ s + t * η s + a t * ξ₁.val s + b t * ξ₂.val s)) =ᶠ[𝓝 0]\n        fun _ => ∫ s in 0..ℓ, sin (θ s))\n    (hstat : ∀ ζ : variationSpace ℓ,\n      (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv ζ.val s) +\n        lam * (∫ s in 0..ℓ, -sin (θ s) * ζ.val s) +\n        μ * (∫ s in 0..ℓ, cos (θ s) * ζ.val s) = 0) :\n    HasDerivAt (deriv (fun t => energy ε\n      (fun s => θ s + t * η s + a t * ξ₁.val s + b t * ξ₂.val s) ℓ))\n      (∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s)^2 -\n        (lam * cos (θ s) + μ * sin (θ s)) * (η s)^2) 0","proof":"by\n  let ζ : variationSpace ℓ := ⟨fun s =>\n      deriv (deriv a) 0 * ξ₁.val s + deriv (deriv b) 0 * ξ₂.val s,\n    ⟨(contDiff_const.mul ξ₁.property.1).add (contDiff_const.mul ξ₂.property.1),\n      by simp [ξ₁.property.2.1, ξ₂.property.2.1],\n      by simp [ξ₁.property.2.2, ξ₂.property.2.2]⟩⟩\n  have hdζ (s : ℝ) : deriv ζ.val s =\n      deriv (deriv a) 0 * deriv ξ₁.val s + deriv (deriv b) 0 * deriv ξ₂.val s :=\n    (((ξ₁.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (deriv (deriv a) 0)).add\n      ((ξ₂.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (deriv (deriv b) 0))).deriv\n  have he := (hasDerivAt_corrected_energy_and_deriv hℓ hε hθ hη ξ₁.property.1 ξ₂.property.1\n    ha hb ha0 hb0 ha1 hb1).2\n  simp_rw [← hdζ] at he\n  have hx₂ := (hasDerivAt_deriv_corrected_integral (ε := cos) hℓ contDiff_cos\n    hθ.continuous hη.continuous ξ₁.property.1.continuous ξ₂.property.1.continuous\n    ha hb ha0 hb0 ha1 hb1).deriv\n  have hy₂ := (hasDerivAt_deriv_corrected_integral (ε := sin) hℓ contDiff_sin\n    hθ.continuous hη.continuous ξ₁.property.1.continuous ξ₂.property.1.continuous\n    ha hb ha0 hb0 ha1 hb1).deriv\n  simp only [Real.deriv_cos', deriv.fun_neg, Real.deriv_sin] at hx₂\n  simp only [Real.deriv_sin, Real.deriv_cos] at hy₂\n  have hxI := hx₂.symm.trans (second_deriv_zero_of_eventually_const hx)\n  have hyI := hy₂.symm.trans (second_deriv_zero_of_eventually_const hy)\n  change (∫ s in 0..ℓ, -cos (θ s) * (η s)^2 + -sin (θ s) * ζ.val s) = 0 at hxI\n  change (∫ s in 0..ℓ, -sin (θ s) * (η s)^2 + cos (θ s) * ζ.val s) = 0 at hyI\n  have hM : Continuous (fun s => deriv ε (deriv θ s)) :=\n    (hε.continuous_deriv (by norm_num)).comp hθ.continuous_deriv_one\n  have hE : Continuous (fun s => deriv (deriv ε) (deriv θ s) * (deriv η s)^2) :=\n    (hε.deriv'.continuous_deriv_one.comp hθ.continuous_deriv_one).mul\n      (hη.continuous_deriv_one.pow 2)\n  have hC : Continuous (fun s => -cos (θ s) * (η s)^2) :=\n    (Real.continuous_cos.comp hθ.continuous).neg.mul (hη.continuous.pow 2)\n  have hS : Continuous (fun s => -sin (θ s) * (η s)^2) :=\n    (Real.continuous_sin.comp hθ.continuous).neg.mul (hη.continuous.pow 2)\n  have hX : Continuous (fun s => -sin (θ s) * ζ.val s) :=\n    (Real.continuous_sin.comp hθ.continuous).neg.mul ζ.property.1.continuous\n  have hY : Continuous (fun s => cos (θ s) * ζ.val s) :=\n    (Real.continuous_cos.comp hθ.continuous).mul ζ.property.1.continuous\n  rw [intervalIntegral.integral_add (hC.intervalIntegrable 0 ℓ) (hX.intervalIntegrable 0 ℓ)] at hxI\n  rw [intervalIntegral.integral_add (hS.intervalIntegrable 0 ℓ) (hY.intervalIntegrable 0 ℓ)] at hyI\n  rw [intervalIntegral.integral_add\n    (f := fun s => deriv (deriv ε) (deriv θ s) * (deriv η s)^2)\n    (g := fun s => deriv ε (deriv θ s) * deriv ζ.val s)\n    (hE.intervalIntegrable 0 ℓ)\n    ((hM.mul ζ.property.1.continuous_deriv_one).intervalIntegrable 0 ℓ)] at he\n  have hs := hstat ζ\n  have heq : (∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s)^2) +\n      (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv ζ.val s) =\n      ∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s)^2 -\n        (lam * cos (θ s) + μ * sin (θ s)) * (η s)^2 := by\n    calc\n      _ = (∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s)^2) +\n          lam * (∫ s in 0..ℓ, -cos (θ s) * (η s)^2) +\n          μ * (∫ s in 0..ℓ, -sin (θ s) * (η s)^2) := by\n        nlinarith [congrArg (fun x : ℝ => lam * x) hxI, congrArg (fun x : ℝ => μ * x) hyI]\n      _ = _ := by\n        rw [← intervalIntegral.integral_const_mul, ← intervalIntegral.integral_const_mul,\n          ← intervalIntegral.integral_add\n            (f := fun s => deriv (deriv ε) (deriv θ s) * (deriv η s)^2)\n            (g := fun s => lam * (-cos (θ s) * (η s)^2)) (hE.intervalIntegrable 0 ℓ)\n            ((continuous_const.mul hC).intervalIntegrable 0 ℓ),\n          ← intervalIntegral.integral_add\n            (f := fun s => deriv (deriv ε) (deriv θ s) * (deriv η s)^2 +\n              lam * (-cos (θ s) * (η s)^2))\n            (g := fun s => μ * (-sin (θ s) * (η s)^2))\n            ((hE.add (continuous_const.mul hC)).intervalIntegrable 0 ℓ)\n            ((continuous_const.mul hS).intervalIntegrable 0 ℓ)]\n        apply intervalIntegral.integral_congr\n        intro s _\n        dsimp\n        ring\n  rw [heq] at he\n  exact he","truncated":false,"comment":"Exact endpoint constraints and augmented stationarity cancel the acceleration\nof a corrected family. The remaining value is the constrained second variation."},{"id":32,"line":16,"statement":"theorem exists_nonzero_curvature_of_nonconstant {θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ)\n    (hne : ¬ ∀ s ∈ Icc 0 ℓ, θ s = θ 0) :\n    ∃ s ∈ Ioo 0 ℓ, deriv θ s ≠ 0","proof":"by\n  by_contra h\n  push Not at h\n  apply hne\n  exact angle_eq_of_curvature_eq_initial (θ := fun _ => θ 0) (ψ := θ)\n    hℓ contDiff_const hθ (by simpa [curvature] using h) rfl","truncated":false,"comment":"A C¹ angle which is not constant on the curve has nonzero curvature somewhere\nin its interior."},{"id":33,"line":28,"statement":"theorem constraint_coefficients_zero {θ : ℝ → ℝ} {ℓ a b : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ)\n    (hne : ∃ s ∈ Ioo 0 ℓ, deriv θ s ≠ 0)\n    (h : ∀ η : variationSpace ℓ,\n      a * (∫ s in 0..ℓ, -sin (θ s) * η.val s) +\n      b * (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0) : a = 0 ∧ b = 0","proof":"by\n  let q : ℝ → ℝ := fun s => -a * sin (θ s) + b * cos (θ s)\n  have hq : ContDiff ℝ 1 q := (contDiff_const.mul hθ.sin).add\n    (contDiff_const.mul hθ.cos)\n  let η : variationSpace ℓ := ⟨fun s => s * (ℓ - s) * q s,\n    ⟨(contDiff_id.mul (contDiff_const.sub contDiff_id)).mul hq, by simp, by simp⟩⟩\n  have hz : (∫ s in 0..ℓ, s * (ℓ - s) * (q s) ^ 2) = 0 := by\n    have hh := h η\n    rw [← force_integral hθ.continuous η] at hh\n    convert hh using 1\n    apply intervalIntegral.integral_congr\n    intro s _\n    change s * (ℓ - s) * (q s) ^ 2 = q s * (s * (ℓ - s) * q s)\n    ring\n  have hzero := residual_zero_of_weighted_square_integral hℓ hq.continuous hz\n  obtain ⟨s, hs, hκ⟩ := hne\n  have heq : q =ᶠ[nhds s] fun _ => 0 := by\n    filter_upwards [isOpen_Ioo.mem_nhds hs] with t ht using hzero t ht\n  have hd0 : HasDerivAt q 0 s := (hasDerivAt_const s (0 : ℝ)).congr_of_eventuallyEq heq\n  have hd : HasDerivAt q\n      ((-a * cos (θ s) - b * sin (θ s)) * deriv θ s) s := by\n    convert (((hθ.differentiable one_ne_zero s).hasDerivAt.sin.const_mul (-a)).add\n      ((hθ.differentiable one_ne_zero s).hasDerivAt.cos.const_mul b)) using 1\n    ring\n  have hcoef : -a * cos (θ s) - b * sin (θ s) = 0 :=\n    (mul_eq_zero.mp (hd.unique hd0)).resolve_right hκ\n  have hv : -a * sin (θ s) + b * cos (θ s) = 0 := hzero s hs\n  have htrig := sin_sq_add_cos_sq (θ s)\n  constructor\n  · calc\n      a = a * ((sin (θ s)) ^ 2 + (cos (θ s)) ^ 2) := by rw [htrig, mul_one]\n      _ = -sin (θ s) * (-a * sin (θ s) + b * cos (θ s)) -\n          cos (θ s) * (-a * cos (θ s) - b * sin (θ s)) := by ring\n      _ = 0 := by rw [hv, hcoef]; ring\n  · calc\n      b = b * ((sin (θ s)) ^ 2 + (cos (θ s)) ^ 2) := by rw [htrig, mul_one]\n      _ = cos (θ s) * (-a * sin (θ s) + b * cos (θ s)) -\n          sin (θ s) * (-a * cos (θ s) - b * sin (θ s)) := by ring\n      _ = 0 := by rw [hv, hcoef]; ring","truncated":false,"comment":"The endpoint-displacement differentials are independent on fixed-end\nvariations whenever the curve is not straight."},{"id":34,"line":76,"statement":"theorem exists_normalized_constraint_directions {θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ)\n    (hne : ∃ s ∈ Ioo 0 ℓ, deriv θ s ≠ 0) :\n    ∃ ξ₁ ξ₂ : variationSpace ℓ,\n      (∫ s in 0..ℓ, -sin (θ s) * ξ₁.val s) = 1 ∧\n      (∫ s in 0..ℓ, cos (θ s) * ξ₁.val s) = 0 ∧\n      (∫ s in 0..ℓ, -sin (θ s) * ξ₂.val s) = 0 ∧\n      (∫ s in 0..ℓ, cos (θ s) * ξ₂.val s) = 1","proof":"by\n  let cx := constraintLinear ℓ (fun s => -sin (θ s))\n    (Real.continuous_sin.comp hθ.continuous).neg\n  let cy := constraintLinear ℓ (fun s => cos (θ s))\n    (Real.continuous_cos.comp hθ.continuous)\n  let c : variationSpace ℓ →ₗ[ℝ] ℝ × ℝ := cx.prod cy\n  have hev (f : (ℝ × ℝ) →ₗ[ℝ] ℝ) (x y : ℝ) :\n      f (x, y) = f (1, 0) * x + f (0, 1) * y := by\n    have hp : (x, y) = x • (1, 0) + y • (0, 1) := by ext <;> simp\n    rw [hp, map_add, map_smul, map_smul]\n    simp only [smul_eq_mul]\n    ring\n  have ha : (LinearMap.range c).dualAnnihilator = ⊥ := by\n    apply le_antisymm _ bot_le\n    intro f hf\n    rw [Submodule.mem_dualAnnihilator] at hf\n    have hab : f (1, 0) = 0 ∧ f (0, 1) = 0 := by\n      apply constraint_coefficients_zero hℓ hθ hne\n      intro η\n      have hfc : f (c η) = 0 := hf (c η) ⟨η, rfl⟩\n      change f (cx η, cy η) = 0 at hfc\n      rw [hev] at hfc\n      exact hfc\n    change f = 0\n    apply LinearMap.ext\n    intro p\n    change f (p.1, p.2) = 0\n    rw [hev, hab.1, hab.2]\n    ring\n  have hsurj : Function.Surjective c :=\n    LinearMap.range_eq_top.mp (Submodule.dualAnnihilator_eq_bot_iff.mp ha)\n  obtain ⟨ξ₁, h₁⟩ := hsurj (1, 0)\n  obtain ⟨ξ₂, h₂⟩ := hsurj (0, 1)\n  exact ⟨ξ₁, ξ₂, congrArg Prod.fst h₁, congrArg Prod.snd h₁,\n    congrArg Prod.fst h₂, congrArg Prod.snd h₂⟩","truncated":false,"comment":"Two fixed-end C¹ variations can independently correct the two endpoint\ncoordinates.  This is the concrete rank conclusion used by the implicit\nfunction construction."},{"id":35,"line":24,"statement":"theorem stationary_iff_firstVariation {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 1 ε) (hθ : ContDiff ℝ 1 θ) :\n    Stationary ε θ ℓ ↔\n      ∀ η : variationSpace ℓ,\n        (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0 →\n        (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 →\n        (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv η.val s) = 0","proof":"by\n  unfold Stationary\n  constructor <;> intro h η hx hy\n  · have hx' := (hasDerivAt_horizontal_variation hℓ hθ.continuous η.property.1.continuous).deriv\n    have hy' := (hasDerivAt_vertical_variation hℓ hθ.continuous η.property.1.continuous).deriv\n    have he := (hasDerivAt_energy_variation hℓ hε hθ η.property.1).deriv\n    rw [← he]\n    exact h η (hx'.trans hx) (hy'.trans hy)\n  · have hx' := (hasDerivAt_horizontal_variation hℓ hθ.continuous η.property.1.continuous).deriv\n    have hy' := (hasDerivAt_vertical_variation hℓ hθ.continuous η.property.1.continuous).deriv\n    have he := (hasDerivAt_energy_variation hℓ hε hθ η.property.1).deriv\n    rw [he]\n    exact h η (hx'.symm.trans hx) (hy'.symm.trans hy)","truncated":false,"comment":"The integral characterization follows from genuine parameter derivatives."},{"id":36,"line":47,"statement":"theorem stationary_angle_firstIntegral_curvature\n    {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hε : ContDiff ℝ 3 ε) (hθ : ContDiff ℝ 3 θ)\n    (hstat : Stationary ε θ ℓ) :\n    ∃ lam μ σ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      (deriv (fun t => deriv ε (deriv θ t)) s =\n        -lam * sin (θ s) + μ * cos (θ s)) ∧\n      (deriv θ s * deriv ε (deriv θ s) - ε (deriv θ s) -\n        lam * cos (θ s) - μ * sin (θ s) = σ) ∧\n      (deriv (deriv (fun t => deriv ε (deriv θ t))) s +\n        (deriv θ s) ^ 2 * deriv ε (deriv θ s) -\n        deriv θ s * ε (deriv θ s) - σ * deriv θ s = 0)","proof":"by\n  have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n  have hε1 : ContDiff ℝ 1 ε := hε.of_le (by norm_num)\n  have hκ : ContDiff ℝ 2 (deriv θ) := hθ.deriv' (n := 2)\n  have hε' : ContDiff ℝ 2 (deriv ε) := hε.deriv' (n := 2)\n  have hM : ContDiff ℝ 2 (fun t => deriv ε (deriv θ t)) := hε'.comp hκ\n  obtain ⟨lam, μ, hAngle⟩ := angleEquation_of_stationary hℓ hθ1 hM\n    ((stationary_iff_firstVariation hℓ.le hε1 hθ1).mp hstat)\n  obtain ⟨σ, hσ⟩ := smooth_angle_firstIntegral_and_curvature hθ hε hAngle\n  exact ⟨lam, μ, σ, fun s hs => ⟨hAngle s hs, hσ s hs⟩⟩","truncated":false,"comment":"Main theorem: genuine linearized constrained stationarity produces force\nmultipliers, the angle equation, one first-integral constant and the curvature\nequation. No rank, convexity, evenness or nonzero curvature is assumed."},{"id":37,"line":19,"statement":"theorem firstIntegral_hasDerivAt\n    {θ κ M ε : ℝ → ℝ} {lam μ s κ' : ℝ}\n    (hθ : HasDerivAt θ (κ s) s) (hκ : HasDerivAt κ κ' s)\n    (hε : HasDerivAt ε (M s) (κ s))\n    (hM : HasDerivAt M (-lam * sin (θ s) + μ * cos (θ s)) s) :\n    HasDerivAt\n      (fun t => κ t * M t - ε (κ t) - lam * cos (θ t) - μ * sin (θ t)) 0 s","proof":"by\n  convert (((hκ.mul hM).sub (hε.comp s hκ)).sub\n    (hθ.cos.const_mul lam)).sub (hθ.sin.const_mul μ) using 1\n  all_goals first | rfl | ring","truncated":false,"comment":"Differentiating the usual first integral using the angle equation."},{"id":38,"line":31,"statement":"theorem firstIntegral_constant\n    {θ κ M ε : ℝ → ℝ} {lam μ a b : ℝ}\n    (hθ : ∀ s ∈ Ioo a b, HasDerivAt θ (κ s) s)\n    (hκ : ∀ s ∈ Ioo a b, DifferentiableAt ℝ κ s)\n    (hε : ∀ s ∈ Ioo a b, HasDerivAt ε (M s) (κ s))\n    (hM : ∀ s ∈ Ioo a b, HasDerivAt M (-lam * sin (θ s) + μ * cos (θ s)) s) :\n    ∃ σ : ℝ, ∀ s ∈ Ioo a b,\n      κ s * M s - ε (κ s) - lam * cos (θ s) - μ * sin (θ s) = σ","proof":"by\n  apply isOpen_Ioo.exists_is_const_of_deriv_eq_zero (convex_Ioo a b).isPreconnected\n  · intro s hs\n    exact (firstIntegral_hasDerivAt (hθ s hs) (hκ s hs).hasDerivAt\n      (hε s hs) (hM s hs)).differentiableAt.differentiableWithinAt\n  · intro s hs\n    exact (firstIntegral_hasDerivAt (hθ s hs) (hκ s hs).hasDerivAt\n      (hε s hs) (hM s hs)).deriv","truncated":false,"comment":"On an open connected interval the first integral is constant."},{"id":39,"line":48,"statement":"theorem angleForce_hasDerivAt {θ κ : ℝ → ℝ} {lam μ s : ℝ}\n    (hθ : HasDerivAt θ (κ s) s) :\n    HasDerivAt (fun t => -lam * sin (θ t) + μ * cos (θ t))\n      (-(lam * cos (θ s) + μ * sin (θ s)) * κ s) s","proof":"by\n  convert (hθ.sin.const_mul (-lam)).add (hθ.cos.const_mul μ) using 1\n  ring","truncated":false,"comment":"Differentiating the right-hand side of the angle equation."},{"id":40,"line":56,"statement":"theorem curvature_equation_of_firstIntegral\n    {κ M E M'' lam μ θ σ : ℝ}\n    (hsecond : M'' = -(lam * cos θ + μ * sin θ) * κ)\n    (hfirst : κ * M - E - lam * cos θ - μ * sin θ = σ) :\n    M'' + κ ^ 2 * M - κ * E - σ * κ = 0","proof":"by\n  rw [hsecond]\n  nlinarith [congrArg (fun x : ℝ => x * κ) hfirst]","truncated":false,"comment":"Algebraic elimination of the two force components; no division by ε'' occurs."},{"id":41,"line":65,"statement":"theorem curvature_equation\n    {θ κ ε : ℝ → ℝ} {lam μ σ s : ℝ}\n    (hsecond : deriv (deriv (fun t => deriv ε (κ t))) s =\n      -(lam * cos (θ s) + μ * sin (θ s)) * κ s)\n    (hfirst : κ s * deriv ε (κ s) - ε (κ s) - lam * cos (θ s) -\n      μ * sin (θ s) = σ) :\n    deriv (deriv (fun t => deriv ε (κ t))) s +\n      κ s ^ 2 * deriv ε (κ s) - κ s * ε (κ s) - σ * κ s = 0","proof":"curvature_equation_of_firstIntegral hsecond hfirst","truncated":false,"comment":"The general curvature equation with the actual density derivative substituted."},{"id":42,"line":77,"statement":"theorem second_derivative_of_angle_equation\n    {θ κ M : ℝ → ℝ} {lam μ a b s : ℝ} (hs : s ∈ Ioo a b)\n    (hθ : HasDerivAt θ (κ s) s)\n    (hM : ∀ t ∈ Ioo a b, HasDerivAt M (-lam * sin (θ t) + μ * cos (θ t)) t) :\n    deriv (deriv M) s = -(lam * cos (θ s) + μ * sin (θ s)) * κ s","proof":"by\n  have heq : deriv M =ᶠ[𝓝 s] (fun t => -lam * sin (θ t) + μ * cos (θ t)) := by\n    filter_upwards [isOpen_Ioo.mem_nhds hs] with t ht\n    exact (hM t ht).deriv\n  exact ((angleForce_hasDerivAt hθ).congr_of_eventuallyEq heq).deriv","truncated":false,"comment":"The second derivative is derived from the angle equation on an open interval.\nIt is not an extra hypothesis about an independent second-order symbol."},{"id":43,"line":89,"statement":"theorem firstIntegral_and_curvature_of_angle\n    {θ κ ε : ℝ → ℝ} {lam μ a b : ℝ}\n    (hθ : ∀ s ∈ Ioo a b, HasDerivAt θ (κ s) s)\n    (hκ : ∀ s ∈ Ioo a b, DifferentiableAt ℝ κ s)\n    (hε : ∀ s ∈ Ioo a b, DifferentiableAt ℝ ε (κ s))\n    (hAngle : ∀ s ∈ Ioo a b,\n      HasDerivAt (fun t => deriv ε (κ t)) (-lam * sin (θ s) + μ * cos (θ s)) s) :\n    ∃ σ : ℝ, ∀ s ∈ Ioo a b,\n      (κ s * deriv ε (κ s) - ε (κ s) - lam * cos (θ s) - μ * sin (θ s) = σ) ∧\n      (deriv (deriv (fun t => deriv ε (κ t))) s +\n        κ s ^ 2 * deriv ε (κ s) - κ s * ε (κ s) - σ * κ s = 0)","proof":"by\n  obtain ⟨σ, hσ⟩ := firstIntegral_constant hθ hκ (fun s hs => (hε s hs).hasDerivAt) hAngle\n  refine ⟨σ, fun s hs => ⟨hσ s hs, ?_⟩⟩\n  exact curvature_equation (second_derivative_of_angle_equation hs (hθ s hs) hAngle) (hσ s hs)","truncated":false,"comment":"From the angle equation to both the first integral and the actual curvature\nequation, on the same connected interval. The density derivative is genuine."},{"id":44,"line":105,"statement":"theorem smooth_angle_firstIntegral_and_curvature\n    {θ ε : ℝ → ℝ} {lam μ a b : ℝ}\n    (hθ : ContDiff ℝ 3 θ) (hε : ContDiff ℝ 3 ε)\n    (hAngle : ∀ s ∈ Ioo a b,\n      deriv (fun t => deriv ε (deriv θ t)) s = -lam * sin (θ s) + μ * cos (θ s)) :\n    ∃ σ : ℝ, ∀ s ∈ Ioo a b,\n      (deriv θ s * deriv ε (deriv θ s) - ε (deriv θ s) -\n        lam * cos (θ s) - μ * sin (θ s) = σ) ∧\n      (deriv (deriv (fun t => deriv ε (deriv θ t))) s +\n        (deriv θ s) ^ 2 * deriv ε (deriv θ s) -\n        deriv θ s * ε (deriv θ s) - σ * deriv θ s = 0)","proof":"by\n  have hθd : Differentiable ℝ θ := hθ.differentiable (by norm_num)\n  have hκ : ContDiff ℝ 2 (deriv θ) := hθ.deriv' (n := 2)\n  have hε' : ContDiff ℝ 2 (deriv ε) := hε.deriv' (n := 2)\n  have hM : Differentiable ℝ (fun t => deriv ε (deriv θ t)) :=\n    (hε'.comp hκ).differentiable (by norm_num)\n  apply firstIntegral_and_curvature_of_angle (fun s _ => (hθd s).hasDerivAt)\n    (fun s _ => hκ.differentiable (by norm_num) s)\n    (fun s _ => hε.differentiable (by norm_num) (deriv θ s))\n  intro s hs\n  exact (hM s).hasDerivAt.congr_deriv (hAngle s hs)","truncated":false,"comment":"C³ angles and densities supply the differentiability hypotheses needed above."},{"id":45,"line":128,"statement":"theorem quadratic_density_hasDerivAt (k q : ℝ) :\n    HasDerivAt (fun x : ℝ => k * x ^ 2 / 2) (k * q) q","proof":"by\n  convert (((hasDerivAt_id q).pow 2).const_mul k).div_const 2 using 1\n  all_goals first | rfl | (simp only [id_eq]; ring)","truncated":false,"comment":"Derivative of the quadratic density, with stiffness k retained."},{"id":46,"line":134,"statement":"theorem quadratic_moment_second_derivative\n    {κ : ℝ → ℝ} (k : ℝ) (hκ : ContDiff ℝ 2 κ) (s : ℝ) :\n    deriv (deriv (fun t => deriv (fun q : ℝ => k * q ^ 2 / 2) (κ t))) s =\n      k * deriv (deriv κ) s","proof":"by\n  have hfun : (fun t => deriv (fun q : ℝ => k * q ^ 2 / 2) (κ t)) = (fun t => k * κ t) := by\n    funext t\n    exact (quadratic_density_hasDerivAt k (κ t)).deriv\n  rw [hfun]\n  have hd : deriv (fun t => k * κ t) = (fun t => k * deriv κ t) := by\n    funext t\n    exact ((hκ.differentiable (by norm_num) t).hasDerivAt.const_mul k).deriv\n  rw [hd]\n  exact ((hκ.differentiable_deriv_two s).hasDerivAt.const_mul k).deriv","truncated":false,"comment":"The actual second derivative of ε'(κ) for a quadratic density."},{"id":47,"line":150,"statement":"theorem quadratic_curvature_equation\n    {κ : ℝ → ℝ} {k σ s : ℝ} (hκ : ContDiff ℝ 2 κ)\n    (h : deriv (deriv (fun t => deriv (fun q : ℝ => k * q ^ 2 / 2) (κ t))) s +\n      κ s ^ 2 * deriv (fun q : ℝ => k * q ^ 2 / 2) (κ s) -\n      κ s * (k * (κ s) ^ 2 / 2) - σ * κ s = 0) :\n    k * deriv (deriv κ) s + k * (κ s) ^ 3 / 2 - σ * κ s = 0","proof":"by\n  rw [quadratic_moment_second_derivative k hκ s,\n    (quadratic_density_hasDerivAt k (κ s)).deriv] at h\n  nlinarith [h]","truncated":false,"comment":"A quadratic instance of the actual functional equation is the classical\nelastica equation, rather than only a polynomial substitution."},{"id":48,"line":161,"statement":"theorem quadratic_curvature_expression (k κ κ'' σ : ℝ) :\n    k * κ'' + κ ^ 2 * (k * κ) - κ * (k * κ ^ 2 / 2) - σ * κ =\n      k * κ'' + k * κ ^ 3 / 2 - σ * κ","proof":"by ring","truncated":false,"comment":"Substitution of ε(κ)=kκ²/2 recovers the classical polynomial expression."},{"id":49,"line":166,"statement":"theorem affine_density_curvature_expression (κ M E M'' σ a b : ℝ) :\n    M'' + κ ^ 2 * (M + a) - κ * (E + a * κ + b) - (σ - b) * κ =\n      M'' + κ ^ 2 * M - κ * E - σ * κ","proof":"by ring","truncated":false,"comment":"An affine change of density changes σ by -b and leaves the equation unchanged."},{"id":50,"line":17,"statement":"theorem continuous_parameter_intervalIntegral\n    {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]\n    {G : Parameters → ℝ → E} {ℓ : ℝ} (hℓ : 0 ≤ ℓ)\n    (hG : Continuous (Function.uncurry G)) :\n    Continuous (fun p => ∫ s in 0..ℓ, G p s)","proof":"by\n  have h := continuous_parametric_integral_of_continuous (μ := volume) hG\n    (isCompact_Icc : IsCompact (Icc (0 : ℝ) ℓ))\n  simpa only [integral_Icc_eq_integral_Ioc, intervalIntegral.integral_of_le hℓ] using h","truncated":false,"comment":"Continuity of a compact interval integral, for a continuous joint integrand."},{"id":51,"line":28,"statement":"theorem hasFDerivAt_parameter_intervalIntegral\n    {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E] [CompleteSpace E]\n    {G : Parameters → ℝ → E} {D : Parameters → ℝ → Parameters →L[ℝ] E}\n    {ℓ : ℝ} (hℓ : 0 ≤ ℓ)\n    (hG : Continuous (Function.uncurry G)) (hD : Continuous (Function.uncurry D))\n    (hd : ∀ p s, HasFDerivAt (fun q => G q s) (D p s) p) (p₀ : Parameters) :\n    HasFDerivAt (fun p => ∫ s in 0..ℓ, G p s) (∫ s in 0..ℓ, D p₀ s) p₀","proof":"by\n  obtain ⟨C, hC⟩ :=\n    ((isCompact_closedBall p₀ 1).prod (isCompact_Icc : IsCompact (Icc (0 : ℝ) ℓ))).exists_bound_of_continuousOn\n      hD.continuousOn\n  have hGs (p : Parameters) : Continuous (G p) := hG.comp (continuous_const.prodMk continuous_id)\n  have hDs (p : Parameters) : Continuous (D p) := hD.comp (continuous_const.prodMk continuous_id)\n  apply intervalIntegral.hasFDerivAt_integral_of_dominated_of_fderiv_le\n    (s := ball p₀ 1) (bound := fun _ => C) (ball_mem_nhds p₀ one_pos)\n    (Eventually.of_forall fun p => (hGs p).aestronglyMeasurable)\n    ((hGs p₀).intervalIntegrable 0 ℓ) (hDs p₀).aestronglyMeasurable\n  · filter_upwards [] with s hs\n    rw [uIoc_of_le hℓ] at hs\n    intro p hp\n    exact hC (p, s) ⟨ball_subset_closedBall hp, ⟨hs.1.le, hs.2⟩⟩\n  · exact continuous_const.intervalIntegrable 0 ℓ\n  · filter_upwards [] with s _ p _\n    exact hd p s","truncated":false,"comment":"A continuous parameter derivative on a compact rectangle supplies the bound\nneeded to differentiate the actual interval integral."},{"id":52,"line":53,"statement":"theorem contDiff_two_parameter_intervalIntegral\n    {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E] [CompleteSpace E]\n    {G : Parameters → ℝ → E} {D : Parameters → ℝ → Parameters →L[ℝ] E}\n    {D₂ : Parameters → ℝ → Parameters →L[ℝ] (Parameters →L[ℝ] E)}\n    {ℓ : ℝ} (hℓ : 0 ≤ ℓ)\n    (hG : Continuous (Function.uncurry G)) (hD : Continuous (Function.uncurry D))\n    (hD₂ : Continuous (Function.uncurry D₂))\n    (hd : ∀ p s, HasFDerivAt (fun q => G q s) (D p s) p)\n    (hd₂ : ∀ p s, HasFDerivAt (fun q => D q s) (D₂ p s) p) :\n    ContDiff ℝ 2 (fun p => ∫ s in 0..ℓ, G p s)","proof":"by\n  have h₁ := hasFDerivAt_parameter_intervalIntegral hℓ hG hD hd\n  have h₂ := hasFDerivAt_parameter_intervalIntegral hℓ hD hD₂ hd₂\n  have heq : fderiv ℝ (fun p => ∫ s in 0..ℓ, G p s) = fun p => ∫ s in 0..ℓ, D p s :=\n    funext fun p => (h₁ p).fderiv\n  rw [show (2 : WithTop ENat) = 1 + 1 from rfl, contDiff_succ_iff_fderiv]\n  refine ⟨fun p => (h₁ p).differentiableAt, by simp, ?_⟩\n  rw [heq, contDiff_one_iff_fderiv]\n  refine ⟨fun p => (h₂ p).differentiableAt, ?_⟩\n  have heq₂ : fderiv ℝ (fun p => ∫ s in 0..ℓ, D p s) = fun p => ∫ s in 0..ℓ, D₂ p s :=\n    funext fun p => (h₂ p).fderiv\n  rw [heq₂]\n  exact continuous_parameter_intervalIntegral hℓ hD₂","truncated":false,"comment":"Two continuous actual parameter derivatives yield C² of the actual integral."},{"id":53,"line":76,"statement":"theorem hasFDerivAt_integral_linear_parameters\n    {ρ κ : ℝ → ℝ} {B : ℝ → Parameters →L[ℝ] ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hρ : ContDiff ℝ 1 ρ) (hκ : Continuous κ) (hB : Continuous B)\n    (p : Parameters) :\n    HasFDerivAt (fun p => ∫ s in 0..ℓ, ρ (κ s + B s p))\n      (∫ s in 0..ℓ, deriv ρ (κ s + B s p) • B s) p","proof":"by\n  have hp : Continuous (fun q : Parameters × ℝ => κ q.2 + B q.2 q.1) :=\n    (hκ.comp continuous_snd).add ((hB.comp continuous_snd).clm_apply continuous_fst)\n  apply hasFDerivAt_parameter_intervalIntegral\n    (G := fun p s => ρ (κ s + B s p))\n    (D := fun p s => deriv ρ (κ s + B s p) • B s) hℓ (hρ.continuous.comp hp)\n    ((hρ.continuous_deriv_one.comp hp).smul (hB.comp continuous_snd))\n  intro p s\n  exact (hρ.differentiable one_ne_zero _).hasDerivAt.comp_hasFDerivAt p\n    ((B s).hasFDerivAt.const_add (κ s))","truncated":false,"comment":""},{"id":54,"line":92,"statement":"theorem contDiff_two_integral_linear_parameters\n    {ρ κ : ℝ → ℝ} {B : ℝ → Parameters →L[ℝ] ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hρ : ContDiff ℝ 2 ρ) (hκ : Continuous κ) (hB : Continuous B) :\n    ContDiff ℝ 2 (fun p => ∫ s in 0..ℓ, ρ (κ s + B s p))","proof":"by\n  let D := fun (p : Parameters) (s : ℝ) => deriv ρ (κ s + B s p) • B s\n  let D₂ := fun (p : Parameters) (s : ℝ) =>\n    (deriv (deriv ρ) (κ s + B s p) • B s).smulRight (B s)\n  have hp : Continuous (fun q : Parameters × ℝ => κ q.2 + B q.2 q.1) :=\n    (hκ.comp continuous_snd).add ((hB.comp continuous_snd).clm_apply continuous_fst)\n  have hρ₁ : ContDiff ℝ 1 (deriv ρ) := hρ.deriv'\n  have hD : Continuous (Function.uncurry D) :=\n    ((hρ₁.continuous.comp hp).smul (hB.comp continuous_snd))\n  have hD₂ : Continuous (Function.uncurry D₂) := by\n    dsimp [D₂, Function.uncurry]\n    exact (isBoundedBilinearMap_smulRight (𝕜 := ℝ) (E := Parameters)\n      (F := Parameters →L[ℝ] ℝ)).continuous.comp\n      (((hρ₁.continuous_deriv_one.comp hp).smul (hB.comp continuous_snd)).prodMk\n        (hB.comp continuous_snd))\n  apply contDiff_two_parameter_intervalIntegral\n    (G := fun p s => ρ (κ s + B s p)) (D := D) (D₂ := D₂)\n    hℓ (hρ.continuous.comp hp) hD hD₂\n  · intro p s\n    exact (hρ.differentiable (by norm_num) _).hasDerivAt.comp_hasFDerivAt p\n      ((B s).hasFDerivAt.const_add (κ s))\n  · intro p s\n    exact ((hρ₁.differentiable one_ne_zero _).hasDerivAt.comp_hasFDerivAt p\n      ((B s).hasFDerivAt.const_add (κ s))).smul_const (B s)","truncated":false,"comment":""},{"id":55,"line":141,"statement":"theorem contDiff_endpointParameters {θ η u v : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : Continuous θ) (hη : Continuous η)\n    (hu : Continuous u) (hv : Continuous v) :\n    ContDiff ℝ 2 (endpointParameters θ η u v ℓ)","proof":"by\n  exact (contDiff_two_integral_linear_parameters hℓ Real.contDiff_cos hθ\n    (continuous_parameterLinear hη hu hv)).prodMk\n    (contDiff_two_integral_linear_parameters hℓ Real.contDiff_sin hθ\n      (continuous_parameterLinear hη hu hv))","truncated":false,"comment":""},{"id":56,"line":176,"statement":"theorem fderiv_endpointParameters_zero {θ η u v : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : Continuous θ) (hη : Continuous η)\n    (hu : Continuous u) (hv : Continuous v) (p : ℝ × (ℝ × ℝ)) :\n    fderiv ℝ (endpointParameters θ η u v ℓ) 0 p =\n      (p.1 * (∫ s in 0..ℓ, -sin (θ s) * η s) +\n        p.2.1 * (∫ s in 0..ℓ, -sin (θ s) * u s) +\n        p.2.2 * (∫ s in 0..ℓ, -sin (θ s) * v s),\n       p.1 * (∫ s in 0..ℓ, cos (θ s) * η s) +\n        p.2.1 * (∫ s in 0..ℓ, cos (θ s) * u s) +\n        p.2.2 * (∫ s in 0..ℓ, cos (θ s) * v s))","proof":"by\n  have hB := continuous_parameterLinear hη hu hv\n  have hc := hasFDerivAt_integral_linear_parameters hℓ Real.contDiff_cos hθ hB (0 : Parameters)\n  have hs := hasFDerivAt_integral_linear_parameters hℓ Real.contDiff_sin hθ hB (0 : Parameters)\n  have hd : HasFDerivAt (endpointParameters θ η u v ℓ)\n      ((∫ s in 0..ℓ, -sin (θ s) • parameterLinear η u v s).prod\n       (∫ s in 0..ℓ, cos (θ s) • parameterLinear η u v s)) 0 := by\n    convert hc.prodMk hs using 1\n    all_goals first | rfl | simp only [map_zero, add_zero, Real.deriv_cos, Real.deriv_sin]\n  rw [hd.fderiv]\n  apply Prod.ext\n  · change (∫ s in 0..ℓ, -sin (θ s) • parameterLinear η u v s) p = _\n    rw [ContinuousLinearMap.intervalIntegral_apply\n      (φ := fun s => -sin (θ s) • parameterLinear η u v s) (μ := volume) (v := p)\n      (((Real.continuous_sin.comp hθ).neg.smul hB).intervalIntegrable 0 ℓ)]\n    simpa only [smul_apply, smul_eq_mul, Function.comp_apply, Pi.neg_apply] using\n      integral_parameterLinear hη hu hv (Real.continuous_sin.comp hθ).neg p\n  · change (∫ s in 0..ℓ, cos (θ s) • parameterLinear η u v
