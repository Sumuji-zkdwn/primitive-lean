 s) p = _\n    rw [ContinuousLinearMap.intervalIntegral_apply\n      (φ := fun s => cos (θ s) • parameterLinear η u v s) (μ := volume) (v := p)\n      (((Real.continuous_cos.comp hθ).smul hB).intervalIntegrable 0 ℓ)]\n    simpa only [smul_apply, smul_eq_mul, Function.comp_apply] using\n      integral_parameterLinear hη hu hv (Real.continuous_cos.comp hθ) p","truncated":false,"comment":""},{"id":57,"line":211,"statement":"theorem exists_implicit_correction {f : (ℝ × (ℝ × ℝ)) → ℝ × ℝ}\n    (hf : ContDiff ℝ 2 f)\n    (ht : (fderiv ℝ f 0).comp (ContinuousLinearMap.inl ℝ ℝ (ℝ × ℝ)) = 0)\n    (hc : (fderiv ℝ f 0).comp (ContinuousLinearMap.inr ℝ ℝ (ℝ × ℝ)) =\n      ContinuousLinearMap.id ℝ (ℝ × ℝ)) :\n    ∃ g : ℝ → ℝ × ℝ, ContDiffAt ℝ 2 g 0 ∧ g 0 = 0 ∧ HasDerivAt g 0 0 ∧\n      ∀ᶠ t in 𝓝 0, f (t, g t) = f 0","proof":"by\n  have hi : ((fderiv ℝ f 0).comp (ContinuousLinearMap.inr ℝ ℝ (ℝ × ℝ))).IsInvertible := by\n    rw [hc]\n    exact ⟨ContinuousLinearEquiv.refl ℝ (ℝ × ℝ), rfl⟩\n  let h := hf.contDiffAt (x := (0 : Parameters))\n  let g := h.implicitFunction (by norm_num) hi\n  refine ⟨g, h.contDiffAt_implicitFunction (by norm_num) hi,\n    h.implicitFunction_apply_self (by norm_num) hi, ?_,\n    h.eventually_apply_implicitFunction (by norm_num) hi⟩\n  have hd := h.hasStrictFDerivAt_implicitFunction (by norm_num) hi\n  rw [ht] at hd\n  simpa using hd.hasFDerivAt.hasDerivAt","truncated":false,"comment":"Genuine finite-dimensional IFT, specialized to an identity correction block\nand a zero tangent block. No solution function is assumed."},{"id":58,"line":233,"statement":"theorem exists_exact_endpoint_variation {θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ)\n    (hne : ∃ s ∈ Ioo 0 ℓ, deriv θ s ≠ 0)\n    (η : variationSpace ℓ)\n    (hηx : (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0)\n    (hηy : (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0) :\n    ∃ ξ₁ ξ₂ : variationSpace ℓ, ∃ a b : ℝ → ℝ,\n      ContDiffAt ℝ 2 a 0 ∧ ContDiffAt ℝ 2 b 0 ∧\n      a 0 = 0 ∧ b 0 = 0 ∧ HasDerivAt a 0 0 ∧ HasDerivAt b 0 0 ∧\n      ∀ᶠ t in 𝓝 0,\n        (∫ s in 0..ℓ, cos (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s)) =\n          (∫ s in 0..ℓ, cos (θ s)) ∧\n        (∫ s in 0..ℓ, sin (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s)) =\n          (∫ s in 0..ℓ, sin (θ s))","proof":"by\n  obtain ⟨ξ₁, ξ₂, hx₁, hy₁, hx₂, hy₂⟩ := exists_normalized_constraint_directions hℓ hθ hne\n  let f := endpointParameters θ η.val ξ₁.val ξ₂.val ℓ\n  have hf : ContDiff ℝ 2 f := contDiff_endpointParameters hℓ.le hθ.continuous\n    η.property.1.continuous ξ₁.property.1.continuous ξ₂.property.1.continuous\n  have ht : (fderiv ℝ f 0).comp (ContinuousLinearMap.inl ℝ ℝ (ℝ × ℝ)) = 0 := by\n    apply ContinuousLinearMap.ext\n    intro t\n    change fderiv ℝ f 0 (t, (0, 0)) = (0, 0)\n    rw [fderiv_endpointParameters_zero hℓ.le hθ.continuous\n      η.property.1.continuous ξ₁.property.1.continuous ξ₂.property.1.continuous]\n    rw [hηx, hηy]\n    simp\n  have hc : (fderiv ℝ f 0).comp (ContinuousLinearMap.inr ℝ ℝ (ℝ × ℝ)) =\n      ContinuousLinearMap.id ℝ (ℝ × ℝ) := by\n    apply ContinuousLinearMap.ext\n    intro p\n    change fderiv ℝ f 0 (0, p) = p\n    rw [fderiv_endpointParameters_zero hℓ.le hθ.continuous\n      η.property.1.continuous ξ₁.property.1.continuous ξ₂.property.1.continuous]\n    rw [hx₁, hy₁, hx₂, hy₂]\n    simp\n  obtain ⟨g, hg, hg₀, hgd, hge⟩ := exists_implicit_correction hf ht hc\n  refine ⟨ξ₁, ξ₂, (fun t => (g t).1), (fun t => (g t).2), hg.fst, hg.snd,\n    congrArg Prod.fst hg₀, congrArg Prod.snd hg₀, hgd.fst, hgd.snd, ?_⟩\n  filter_upwards [hge] with t ht\n  constructor\n  · have hx := congrArg Prod.fst ht\n    simpa [f, endpointParameters, parameterLinear_apply, add_assoc] using hx\n  · have hy := congrArg Prod.snd ht\n    simpa [f, endpointParameters, parameterLinear_apply, add_assoc] using hy","truncated":false,"comment":"Every linearized feasible C¹ direction at a nonstraight curve is tangent to\nan actual C²-parameter family preserving both endpoint positions exactly.\nThe two correction directions have zero endpoint values by their subtype."},{"id":59,"line":279,"statement":"theorem corrected_angle_hasDerivAt {θ η u v a b : ℝ → ℝ}\n    (ha : HasDerivAt a 0 0) (hb : HasDerivAt b 0 0) (s : ℝ) :\n    HasDerivAt (fun t => θ s + t * η s + a t * u s + b t * v s) (η s) 0","proof":"by\n  convert (((hasDerivAt_id (0 : ℝ)).mul_const (η s)).const_add (θ s) |>.add\n    (ha.mul_const (u s)) |>.add (hb.mul_const (v s))) using 1\n  all_goals first | rfl | simp only [one_mul, zero_mul, add_zero]","truncated":false,"comment":"The correction terms vanish to first order, so the realized tangent is η."},{"id":60,"line":287,"statement":"theorem corrected_angle_endpoints {θ a b : ℝ → ℝ} {ℓ : ℝ}\n    (η u v : variationSpace ℓ) (t : ℝ) :\n    (θ 0 + t * η.val 0 + a t * u.val 0 + b t * v.val 0 = θ 0) ∧\n    (θ ℓ + t * η.val ℓ + a t * u.val ℓ + b t * v.val ℓ = θ ℓ)","proof":"by\n  simp [η.property.2.1, η.property.2.2, u.property.2.1, u.property.2.2,\n    v.property.2.1, v.property.2.2]","truncated":false,"comment":"Correction by fixed-end angle variations preserves both prescribed angles."},{"id":61,"line":17,"statement":"theorem energy_const (ε : ℝ → ℝ) (α ℓ : ℝ) :\n    energy ε (fun _ => α) ℓ = ℓ * ε 0","proof":"by\n  simp [energy]","truncated":false,"comment":"A constant tangent angle has zero curvature and constant energy density."},{"id":62,"line":22,"statement":"theorem energy_affine (ε : ℝ → ℝ) (α c ℓ : ℝ) :\n    energy ε (fun s => α + c * s) ℓ = ℓ * ε c","proof":"by\n  unfold energy\n  simp_rw [show ∀ s : ℝ, deriv (fun u => α + c * u) s = c from\n    fun s => curvature_affine α c s]\n  simp","truncated":false,"comment":"An affine tangent angle has constant signed curvature, hence this exact energy."},{"id":63,"line":30,"statement":"theorem integral_curvature {θ : ℝ → ℝ} (hθ : ContDiff ℝ 1 θ) (ℓ : ℝ) :\n    (∫ s in 0..ℓ, deriv θ s) = θ ℓ - θ 0","proof":"by\n  exact intervalIntegral.integral_deriv_eq_sub\n    (fun s _ => hθ.differentiable one_ne_zero s)\n    (hθ.continuous_deriv_one.intervalIntegrable 0 ℓ)","truncated":false,"comment":"The linear curvature term integrates to the difference of the lifted end angles."},{"id":64,"line":38,"statement":"theorem hasDerivAt_energy_affine_fixed_end_variation {ε η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 1 ε) (hη : ContDiff ℝ 1 η)\n    (h0 : η 0 = 0) (hend : η ℓ = 0) (α c : ℝ) :\n    HasDerivAt\n      (fun t => energy ε (angleVariation (fun s => α + c * s) η t) ℓ) 0 0","proof":"by\n  have h := hasDerivAt_energy_variation (θ := fun s => α + c * s) hℓ hε\n    (contDiff_const.add (contDiff_const.mul contDiff_id)) hη\n  have hi : (∫ s in 0..ℓ, deriv ε (deriv (fun u => α + c * u) s) * deriv η s) = 0 := by\n    simp_rw [show ∀ s : ℝ, deriv (fun u => α + c * u) s = c from\n      fun s => curvature_affine α c s]\n    rw [intervalIntegral.integral_const_mul, integral_curvature hη]\n    simp [h0, hend]\n  simpa only [hi] using h","truncated":false,"comment":"Straight lines and circular arcs have zero actual first variation under\nfixed-end-angle variations. This proves stationarity, not minimum energy."},{"id":65,"line":53,"statement":"theorem energy_affine_density {ε θ : ℝ → ℝ} (hε : Continuous ε)\n    (hθ : ContDiff ℝ 1 θ) (a b ℓ : ℝ) :\n    energy (fun q => ε q + a * q + b) θ ℓ =\n      energy ε θ ℓ + a * (θ ℓ - θ 0) + b * ℓ","proof":"by\n  have he : IntervalIntegrable (fun s => ε (deriv θ s)) volume 0 ℓ :=\n    (hε.comp hθ.continuous_deriv_one).intervalIntegrable 0 ℓ\n  have ha : IntervalIntegrable (fun s => a * deriv θ s) volume 0 ℓ :=\n    (continuous_const.mul hθ.continuous_deriv_one).intervalIntegrable 0 ℓ\n  unfold energy\n  rw [intervalIntegral.integral_add (he.add ha) intervalIntegrable_const,\n    intervalIntegral.integral_add he ha, intervalIntegral.integral_const_mul,\n    integral_curvature hθ]\n  simp [mul_comm]","truncated":false,"comment":"Adding `a κ + b` to the density changes the actual energy only by boundary data."},{"id":66,"line":69,"statement":"theorem affine_density_shift_same_end_angles {ε θ ψ : ℝ → ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (hψ : ContDiff ℝ 1 ψ)\n    (a b ℓ : ℝ) (h0 : θ 0 = ψ 0) (hℓ : θ ℓ = ψ ℓ) :\n    energy (fun q => ε q + a * q + b) θ ℓ - energy ε θ ℓ =\n      energy (fun q => ε q + a * q + b) ψ ℓ - energy ε ψ ℓ","proof":"by\n  rw [energy_affine_density hε hθ, energy_affine_density hε hψ, h0, hℓ]\n  ring","truncated":false,"comment":"For a fixed angle branch and length, the affine-density correction is the\nsame for any two curves sharing both lifted endpoint angles."},{"id":67,"line":78,"statement":"theorem reflection_counterexample :\n    energy (fun q : ℝ => q) (fun s : ℝ => s) 1 = 1 ∧\n    energy (fun q : ℝ => q) (fun s : ℝ => -s) 1 = -1","proof":"by\n  simp [energy]","truncated":false,"comment":"An exact failure of reflection invariance for a density that is not even."},{"id":68,"line":84,"statement":"theorem energy_reflection_of_even {ε : ℝ → ℝ} (hε : ∀ q, ε (-q) = ε q)\n    (θ : ℝ → ℝ) (ℓ : ℝ) :\n    energy ε (fun s => -θ s) ℓ = energy ε θ ℓ","proof":"by\n  unfold energy\n  apply intervalIntegral.integral_congr\n  intro s _\n  change ε (deriv (fun u => -θ u) s) = ε (deriv θ s)\n  rw [show deriv (fun u => -θ u) s = -deriv θ s from deriv.neg]\n  exact hε _","truncated":false,"comment":"Evenness of the density is sufficient for reflection invariance of the energy."},{"id":69,"line":95,"statement":"theorem energy_rotation (ε θ : ℝ → ℝ) (α ℓ : ℝ) :\n    energy ε (fun s => θ s + α) ℓ = energy ε θ ℓ","proof":"by\n  simp only [energy, deriv_add_const]","truncated":false,"comment":"A rigid rotation adds a constant to the angle and preserves energy for any density."},{"id":70,"line":31,"statement":"theorem exponentialWeight_pos (β : ℝ) (ε θ : ℝ → ℝ) (ℓ : ℝ) :\n    0 < exponentialWeight β ε θ ℓ","proof":"exp_pos _","truncated":false,"comment":""},{"id":71,"line":34,"statement":"theorem log_exponentialWeight (β : ℝ) (ε θ : ℝ → ℝ) (ℓ : ℝ) :\n    log (exponentialWeight β ε θ ℓ) = -β * energy ε θ ℓ","proof":"log_exp _","truncated":false,"comment":""},{"id":72,"line":38,"statement":"theorem energy_eq_neg_log_exponentialWeight {β : ℝ} (hβ : β ≠ 0)\n    (ε θ : ℝ → ℝ) (ℓ : ℝ) :\n    energy ε θ ℓ = -log (exponentialWeight β ε θ ℓ) / β","proof":"by\n  rw [log_exponentialWeight]\n  field_simp","truncated":false,"comment":"No sign condition on the energy is needed to recover it by a logarithm."},{"id":73,"line":46,"statement":"theorem exponentialWeight_split {ε θ : ℝ → ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (β a ℓ : ℝ) :\n    exponentialWeight β ε θ ℓ =\n      exponentialWeight β ε θ a * exp (-β * (∫ s in a..ℓ, ε (deriv θ s)))","proof":"by\n  have hc := hε.comp hθ.continuous_deriv_one\n  have he := intervalIntegral.integral_add_adjacent_intervals (μ := volume)\n    (hc.intervalIntegrable 0 a) (hc.intervalIntegrable a ℓ)\n  simp only [Function.comp_apply] at he\n  unfold exponentialWeight energy\n  rw [← he, mul_add, exp_add]","truncated":false,"comment":"Adjacent intervals compose multiplicatively. Oriented integrals make the\nidentity valid without an ordering hypothesis on the cut."},{"id":74,"line":58,"statement":"theorem exponentialWeight_split_three {ε θ : ℝ → ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (β a b ℓ : ℝ) :\n    exponentialWeight β ε θ ℓ =\n      exp (-β * (∫ s in 0..a, ε (deriv θ s))) *\n      exp (-β * (∫ s in a..b, ε (deriv θ s))) *\n      exp (-β * (∫ s in b..ℓ, ε (deriv θ s)))","proof":"by\n  rw [exponentialWeight, energy_split_three hε hθ a b ℓ]\n  rw [mul_add, mul_add, exp_add, exp_add]","truncated":false,"comment":"The existing three-piece energy decomposition gives three multiplicative factors."},{"id":75,"line":67,"statement":"theorem exp_neg_mul_le_exp_neg_mul_iff {β x y : ℝ} (hβ : 0 < β) :\n    exp (-β * x) ≤ exp (-β * y) ↔ y ≤ x","proof":"by\n  rw [exp_le_exp]\n  constructor <;> intro h <;> nlinarith","truncated":false,"comment":""},{"id":76,"line":72,"statement":"theorem exp_neg_mul_lt_exp_neg_mul_iff {β x y : ℝ} (hβ : 0 < β) :\n    exp (-β * x) < exp (-β * y) ↔ y < x","proof":"by\n  rw [exp_lt_exp]\n  constructor <;> intro h <;> nlinarith","truncated":false,"comment":""},{"id":77,"line":78,"statement":"theorem energy_le_iff_exponentialWeight_le {β : ℝ} (hβ : 0 < β)\n    (ε θ ψ : ℝ → ℝ) (ℓ : ℝ) :\n    energy ε θ ℓ ≤ energy ε ψ ℓ ↔\n      exponentialWeight β ε ψ ℓ ≤ exponentialWeight β ε θ ℓ","proof":"(exp_neg_mul_le_exp_neg_mul_iff hβ).symm","truncated":false,"comment":"The same curves are compared, with the order reversed."},{"id":78,"line":84,"statement":"theorem energy_lt_iff_exponentialWeight_lt {β : ℝ} (hβ : 0 < β)\n    (ε θ ψ : ℝ → ℝ) (ℓ : ℝ) :\n    energy ε θ ℓ < energy ε ψ ℓ ↔\n      exponentialWeight β ε ψ ℓ < exponentialWeight β ε θ ℓ","proof":"(exp_neg_mul_lt_exp_neg_mul_iff hβ).symm","truncated":false,"comment":""},{"id":79,"line":91,"statement":"theorem energy_minimum_iff_exponentialWeight_maximum {β : ℝ} (hβ : 0 < β)\n    (ε θ : ℝ → ℝ) (ℓ : ℝ) (S : Set (ℝ → ℝ)) :\n    (∀ ψ ∈ S, energy ε θ ℓ ≤ energy ε ψ ℓ) ↔\n      (∀ ψ ∈ S, exponentialWeight β ε ψ ℓ ≤ exponentialWeight β ε θ ℓ)","proof":"by\n  simp only [energy_le_iff_exponentialWeight_le hβ]","truncated":false,"comment":"Global extrema correspond on any one fixed feasible set."},{"id":80,"line":98,"statement":"theorem isLocalMinOn_iff_isLocalMaxOn_exp_neg_mul\n    {α : Type*} [TopologicalSpace α] {β : ℝ} (hβ : 0 < β)\n    (f : α → ℝ) (S : Set α) (x : α) :\n    IsLocalMinOn f S x ↔ IsLocalMaxOn (fun y => exp (-β * f y)) S x","proof":"by\n  change (∀ᶠ y in 𝓝[S] x, f x ≤ f y) ↔\n    (∀ᶠ y in 𝓝[S] x, exp (-β * f y) ≤ exp (-β * f x))\n  simp only [exp_neg_mul_le_exp_neg_mul_iff hβ]","truncated":false,"comment":"Local extrema also correspond, including on a restricted feasible set."},{"id":81,"line":107,"statement":"theorem locallyMinimizing_iff_exponentialWeight_local_maximum\n    {β : ℝ} (hβ : 0 < β) (ε θ : ℝ → ℝ) (ℓ : ℝ) :\n    LocallyMinimizing ε θ ℓ ↔\n      ∃ r : ℝ, 0 < r ∧ ∀ ψ : ℝ → ℝ, ContDiff ℝ 1 ψ →\n        ψ 0 = θ 0 → ψ ℓ = θ ℓ →\n        (∫ s in 0..ℓ, cos (ψ s)) = (∫ s in 0..ℓ, cos (θ s)) →\n        (∫ s in 0..ℓ, sin (ψ s)) = (∫ s in 0..ℓ, sin (θ s)) →\n        (∀ s ∈ Icc 0 ℓ,\n          |ψ s - θ s| < r ∧ |deriv ψ s - deriv θ s| < r) →\n        exponentialWeight β ε ψ ℓ ≤ exponentialWeight β ε θ ℓ","proof":"by\n  simp only [LocallyMinimizing, energy_le_iff_exponentialWeight_le hβ]","truncated":false,"comment":"The original C¹ constrained neighborhood and boundary conditions are retained."},{"id":82,"line":120,"statement":"theorem hasDerivAt_exp_neg_mul {f : ℝ → ℝ} {x d : ℝ}\n    (β : ℝ) (hf : HasDerivAt f d x) :\n    HasDerivAt (fun t => exp (-β * f t)) (-β * exp (-β * f x) * d) x","proof":"by\n  convert (hf.const_mul (-β)).exp using 1\n  ring","truncated":false,"comment":"Chain rule for an actual scalar parameter derivative."},{"id":83,"line":127,"statement":"theorem differentiableAt_exp_neg_mul_iff {f : ℝ → ℝ} {x β : ℝ}\n    (hβ : β ≠ 0) :\n    DifferentiableAt ℝ (fun t => exp (-β * f t)) x ↔ DifferentiableAt ℝ f x","proof":"by\n  constructor\n  · intro hw\n    have h := (hw.log (exp_ne_zero _)).const_mul (-(β⁻¹))\n    simpa only [log_exp, neg_mul_neg, ← mul_assoc, inv_mul_cancel₀ hβ, one_mul] using h\n  · intro hf\n    exact (hasDerivAt_exp_neg_mul β hf.hasDerivAt).differentiableAt","truncated":false,"comment":"The logarithmic inverse transports actual differentiability back to the energy."},{"id":84,"line":138,"statement":"theorem hasDerivAt_exp_neg_mul_zero_iff {f : ℝ → ℝ} {x β : ℝ}\n    (hβ : β ≠ 0) :\n    HasDerivAt (fun t => exp (-β * f t)) 0 x ↔ HasDerivAt f 0 x","proof":"by\n  constructor\n  · intro hw\n    have hf := (differentiableAt_exp_neg_mul_iff hβ).mp hw.differentiableAt\n    have he := (hasDerivAt_exp_neg_mul β hf.hasDerivAt).unique hw\n    have hd : deriv f x = 0 := by\n      rcases mul_eq_zero.mp he with h | h\n      · exact False.elim ((mul_ne_zero (neg_ne_zero.mpr hβ) (exp_ne_zero _)) h)\n      · exact h\n    simpa only [hd] using hf.hasDerivAt\n  · intro hf\n    simpa only [mul_zero] using hasDerivAt_exp_neg_mul β hf","truncated":false,"comment":"Stationarity equivalence is about actual derivatives, not an assumed formula."},{"id":85,"line":155,"statement":"theorem deriv_exp_neg_mul {f : ℝ → ℝ} {β : ℝ} (hβ : β ≠ 0) (x : ℝ) :\n    deriv (fun t => exp (-β * f t)) x = -β * exp (-β * f x) * deriv f x","proof":"by\n  by_cases hf : DifferentiableAt ℝ f x\n  · exact (hasDerivAt_exp_neg_mul β hf.hasDerivAt).deriv\n  · have hw : ¬ DifferentiableAt ℝ (fun t => exp (-β * f t)) x :=\n      fun h => hf ((differentiableAt_exp_neg_mul_iff hβ).mp h)\n    simp only [deriv_zero_of_not_differentiableAt hf,\n      deriv_zero_of_not_differentiableAt hw, mul_zero]","truncated":false,"comment":"The total derivative formula also holds where the inner function is not\ndifferentiable: the logarithmic inverse forces both total derivatives to be zero."},{"id":86,"line":164,"statement":"theorem deriv_exp_neg_mul_eq_zero_iff {f : ℝ → ℝ} {β : ℝ}\n    (hβ : β ≠ 0) (x : ℝ) :\n    deriv (fun t => exp (-β * f t)) x = 0 ↔ deriv f x = 0","proof":"by\n  rw [deriv_exp_neg_mul hβ]\n  simp only [mul_eq_zero, neg_eq_zero, hβ, exp_ne_zero, false_or]","truncated":false,"comment":""},{"id":87,"line":172,"statement":"theorem hasDerivAt_deriv_exp_neg_mul {f : ℝ → ℝ} {x d q β : ℝ}\n    (hβ : β ≠ 0) (hf : HasDerivAt f d x) (hsecond : HasDerivAt (deriv f) q x) :\n    HasDerivAt (deriv (fun t => exp (-β * f t)))\n      (β ^ 2 * exp (-β * f x) * d ^ 2 - β * exp (-β * f x) * q) x","proof":"by\n  have he : deriv (fun t => exp (-β * f t)) =\n      fun t => -β * exp (-β * f t) * deriv f t :=\n    funext (deriv_exp_neg_mul hβ)\n  rw [he]\n  convert ((hasDerivAt_exp_neg_mul β hf).const_mul (-β)).mul hsecond using 1\n  rw [hf.deriv]\n  ring","truncated":false,"comment":"Actual scalar second derivative, requiring only the two stated derivative\nfacts at the point. The extra square term is retained away from stationarity."},{"id":88,"line":186,"statement":"theorem hasDerivAt_deriv_exp_neg_mul_of_stationary {f : ℝ → ℝ} {x q β : ℝ}\n    (hβ : β ≠ 0) (hf : HasDerivAt f 0 x) (hsecond : HasDerivAt (deriv f) q x) :\n    HasDerivAt (deriv (fun t => exp (-β * f t)))\n      (-β * exp (-β * f x) * q) x","proof":"by\n  simpa only [zero_pow (by decide : 2 ≠ 0), mul_zero, zero_sub, neg_mul] using\n    hasDerivAt_deriv_exp_neg_mul hβ hf hsecond","truncated":false,"comment":"At a stationary point the second derivative changes by the negative factor\n`-β * exp (-β * f x)` when `β > 0`. No minimality is assumed."},{"id":89,"line":194,"statement":"theorem hasDerivAt_exponentialWeight_variation {ε θ η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 1 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) (β : ℝ) :\n    HasDerivAt (fun t => exponentialWeight β ε (angleVariation θ η t) ℓ)\n      (-β * exponentialWeight β ε θ ℓ *\n        (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv η s)) 0","proof":"by\n  have hzero : angleVariation θ η 0 = θ := by\n    funext s\n    simp only [angleVariation, zero_mul, add_zero]\n  simpa only [exponentialWeight, hzero] using\n    hasDerivAt_exp_neg_mul β (hasDerivAt_energy_variation hℓ hε hθ hη)","truncated":false,"comment":"The first derivative uses the already proved differentiation of the actual energy."},{"id":90,"line":207,"statement":"theorem exponentialWeight_variation_stationary_iff {β : ℝ} (hβ : β ≠ 0)\n    (ε θ η : ℝ → ℝ) (ℓ : ℝ) :\n    HasDerivAt (fun t => exponentialWeight β ε (angleVariation θ η t) ℓ) 0 0 ↔\n      HasDerivAt (fun t => energy ε (angleVariation θ η t) ℓ) 0 0","proof":"hasDerivAt_exp_neg_mul_zero_iff hβ","truncated":false,"comment":"Stationarity along each actual energy variation is unchanged for nonzero `β`."},{"id":91,"line":215,"statement":"theorem stationary_iff_exponentialWeight_stationary {β : ℝ} (hβ : β ≠ 0)\n    (ε θ : ℝ → ℝ) (ℓ : ℝ) :\n    Stationary ε θ ℓ ↔\n      ∀ η : variationSpace ℓ,\n        deriv (fun t : ℝ => ∫ s in 0..ℓ, cos (θ s + t * η.val s)) 0 = 0 →\n        deriv (fun t : ℝ => ∫ s in 0..ℓ, sin (θ s + t * η.val s)) 0 = 0 →\n        deriv (fun t => exponentialWeight β ε (angleVariation θ η.val t) ℓ) 0 = 0","proof":"by\n  simp only [Stationary, exponentialWeight, deriv_exp_neg_mul_eq_zero_iff hβ]","truncated":false,"comment":"The existing stationarity predicate uses the same fixed-angle directions and\nthe same two linearized displacement constraints after the change of representation."},{"id":92,"line":226,"statement":"theorem hasDerivAt_deriv_exponentialWeight_variation\n    {ε θ η : ℝ → ℝ} {ℓ β : ℝ} (hβ : β ≠ 0)\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) :\n    HasDerivAt (deriv (fun t => exponentialWeight β ε (angleVariation θ η t) ℓ))\n      (β ^ 2 * exponentialWeight β ε θ ℓ *\n          (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv η s) ^ 2 -\n        β * exponentialWeight β ε θ ℓ *\n          (∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s) ^ 2)) 0","proof":"by\n  have hzero : angleVariation θ η 0 = θ := by\n    funext s\n    simp only [angleVariation, zero_mul, add_zero]\n  simpa only [exponentialWeight, hzero] using hasDerivAt_deriv_exp_neg_mul hβ\n    (hasDerivAt_energy_variation hℓ (hε.of_le (by norm_num)) hθ hη)\n    (hasDerivAt_deriv_energy_variation hℓ hε hθ hη)","truncated":false,"comment":"The full second derivative along the actual additive angle family. This\nfamily need not preserve endpoint positions; hence the square term is retained."},{"id":93,"line":245,"statement":"theorem hasDerivAt_deriv_exponentialWeight_family_of_stationary\n    {ε : ℝ → ℝ} {Θ : ℝ → ℝ → ℝ} {ℓ x q β : ℝ} (hβ : β ≠ 0)\n    (hfirst : HasDerivAt (fun t => energy ε (Θ t) ℓ) 0 x)\n    (hsecond : HasDerivAt (deriv (fun t => energy ε (Θ t) ℓ)) q x) :\n    HasDerivAt (deriv (fun t => exponentialWeight β ε (Θ t) ℓ))\n      (-β * exponentialWeight β ε (Θ x) ℓ * q) x","proof":"hasDerivAt_deriv_exp_neg_mul_of_stationary hβ hfirst hsecond","truncated":false,"comment":"Any actual stationary energy path, in particular an exact admissible family,\nhas the stated weighted second derivative. The input `hsecond` is a derivative\nof the actual energy path, not a separately defined quadratic expression."},{"id":94,"line":258,"statement":"theorem constrained_secondVariation_exponentialWeight_corrected\n    {ε θ a b : ℝ → ℝ} {ℓ lam μ β : ℝ} (hβ : β ≠ 0)\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε) (hθ : ContDiff ℝ 1 θ)\n    (η ξ₁ ξ₂ : variationSpace ℓ)\n    (ha : ContDiffAt ℝ 2 a 0) (hb : ContDiffAt ℝ 2 b 0)\n    (ha0 : a 0 = 0) (hb0 : b 0 = 0) (ha1 : deriv a 0 = 0) (hb1 : deriv b 0 = 0)\n    (hx : (fun t => ∫ s in 0..ℓ,\n      cos (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s)) =ᶠ[𝓝 0]\n        fun _ => ∫ s in 0..ℓ, cos (θ s))\n    (hy : (fun t => ∫ s in 0..ℓ,\n      sin (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s)) =ᶠ[𝓝 0]\n        fun _ => ∫ s in 0..ℓ, sin (θ s))\n    (hstat : ∀ ζ : variationSpace ℓ,\n      (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv ζ.val s) +\n        lam * (∫ s in 0..ℓ, -sin (θ s) * ζ.val s) +\n        μ * (∫ s in 0..ℓ, cos (θ s) * ζ.val s) = 0) :\n    HasDerivAt (deriv (fun t => exponentialWeight β ε\n      (fun s => θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s) ℓ))\n      (-β * exponentialWeight β ε θ ℓ *\n        (∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η.val s)^2 -\n          (lam * cos (θ s) + μ * sin (θ s)) * (η.val s)^2)) 0","proof":"by\n  have hdx := (hasDerivAt_corrected_integral_and_deriv (ε := cos) hℓ contDiff_cos\n    hθ.continuous η.property.1.continuous ξ₁.property.1.continuous ξ₂.property.1.continuous\n    ha hb ha0 hb0 ha1 hb1).1\n  have hdy := (hasDerivAt_corrected_integral_and_deriv (ε := sin) hℓ contDiff_sin\n    hθ.continuous η.property.1.continuous ξ₁.property.1.continuous ξ₂.property.1.continuous\n    ha hb ha0 hb0 ha1 hb1).1\n  have hxI : (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0 := by\n    have h := hdx.deriv\n    rw [hx.deriv_eq] at h\n    simpa only [Real.deriv_cos, deriv_const] using h.symm\n  have hyI : (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 := by\n    have h := hdy.deriv\n    rw [hy.deriv_eq] at h\n    simpa only [Real.deriv_sin, deriv_const] using h.symm\n  have hz : (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv η.val s) = 0 := by\n    simpa only [hxI, hyI, mul_zero, add_zero] using hstat η\n  have he := (hasDerivAt_corrected_energy_and_deriv hℓ hε hθ η.property.1\n    ξ₁.property.1 ξ₂.property.1 ha hb ha0 hb0 ha1 hb1).1\n  rw [hz] at he\n  have hsecond := constrained_secondVariation_corrected hℓ hε hθ η.property.1\n    ξ₁ ξ₂ ha hb ha0 hb0 ha1 hb1 hx hy hstat\n  have h := hasDerivAt_deriv_exponentialWeight_family_of_stationary hβ he hsecond\n  simpa only [ha0, hb0, zero_mul, add_zero] using h","truncated":false,"comment":"On the existing exact constrained corrected family, stationarity removes\nboth the first-derivative square and the acceleration terms. The constrained\nsecond variation is therefore multiplied by `-β * exponentialWeight β ε θ ℓ`.\nThe exact displacement hypotheses are used to derive first-order feasibility;\nthat feasibility is not separately assumed."},{"id":95,"line":34,"statement":"@[simp] theorem xCoord_zero (θ : ℝ → ℝ) (x₀ : ℝ) : xCoord θ x₀ 0 = x₀","proof":"by\n  simp [xCoord]","truncated":false,"comment":""},{"id":96,"line":37,"statement":"@[simp] theorem yCoord_zero (θ : ℝ → ℝ) (y₀ : ℝ) : yCoord θ y₀ 0 = y₀","proof":"by\n  simp [yCoord]","truncated":false,"comment":""},{"id":97,"line":40,"statement":"theorem hasDerivAt_xCoord {θ : ℝ → ℝ} (hθ : Continuous θ) (x₀ s : ℝ) :\n    HasDerivAt (xCoord θ x₀) (Real.cos (θ s)) s","proof":"by\n  exact (((Real.continuous_cos.comp hθ).integral_hasStrictDerivAt 0 s).hasDerivAt.const_add x₀)","truncated":false,"comment":""},{"id":98,"line":44,"statement":"theorem hasDerivAt_yCoord {θ : ℝ → ℝ} (hθ : Continuous θ) (y₀ s : ℝ) :\n    HasDerivAt (yCoord θ y₀) (Real.sin (θ s)) s","proof":"by\n  exact (((Real.continuous_sin.comp hθ).integral_hasStrictDerivAt 0 s).hasDerivAt.const_add y₀)","truncated":false,"comment":""},{"id":99,"line":48,"statement":"theorem deriv_xCoord {θ : ℝ → ℝ} (hθ : Continuous θ) (x₀ s : ℝ) :\n    deriv (xCoord θ x₀) s = Real.cos (θ s)","proof":"(hasDerivAt_xCoord hθ x₀ s).deriv","truncated":false,"comment":""},{"id":100,"line":52,"statement":"theorem deriv_yCoord {θ : ℝ → ℝ} (hθ : Continuous θ) (y₀ s : ℝ) :\n    deriv (yCoord θ y₀) s = Real.sin (θ s)","proof":"(hasDerivAt_yCoord hθ y₀ s).deriv","truncated":false,"comment":""},{"id":101,"line":57,"statement":"theorem unit_speed_squared {θ : ℝ → ℝ} (hθ : Continuous θ) (x₀ y₀ s : ℝ) :\n    (deriv (xCoord θ x₀) s)^2 + (deriv (yCoord θ y₀) s)^2 = 1","proof":"by\n  rw [deriv_xCoord hθ, deriv_yCoord hθ]\n  exact Real.cos_sq_add_sin_sq _","truncated":false,"comment":"The reconstructed curve has Euclidean speed one."},{"id":102,"line":62,"statement":"theorem hasDerivAt_deriv_xCoord {θ : ℝ → ℝ} (hθ : Continuous θ)\n    {κ s : ℝ} (hθ' : HasDerivAt θ κ s) (x₀ : ℝ) :\n    HasDerivAt (deriv (xCoord θ x₀)) (-Real.sin (θ s) * κ) s","proof":"by\n  have hx : deriv (xCoord θ x₀) = fun u => Real.cos (θ u) :=\n    funext (deriv_xCoord hθ x₀)\n  rw [hx]\n  exact hθ'.cos","truncated":false,"comment":""},{"id":103,"line":70,"statement":"theorem hasDerivAt_deriv_yCoord {θ : ℝ → ℝ} (hθ : Continuous θ)\n    {κ s : ℝ} (hθ' : HasDerivAt θ κ s) (y₀ : ℝ) :\n    HasDerivAt (deriv (yCoord θ y₀)) (Real.cos (θ s) * κ) s","proof":"by\n  have hy : deriv (yCoord θ y₀) = fun u => Real.sin (θ u) :=\n    funext (deriv_yCoord hθ y₀)\n  rw [hy]\n  exact hθ'.sin","truncated":false,"comment":""},{"id":104,"line":79,"statement":"theorem signed_curvature_determinant {θ : ℝ → ℝ} (hθ : Continuous θ)\n    {κ s : ℝ} (hθ' : HasDerivAt θ κ s) (x₀ y₀ : ℝ) :\n    deriv (xCoord θ x₀) s * deriv (deriv (yCoord θ y₀)) s -\n      deriv (yCoord θ y₀) s * deriv (deriv (xCoord θ x₀)) s = κ","proof":"by\n  rw [deriv_xCoord hθ, deriv_yCoord hθ,\n    (hasDerivAt_deriv_xCoord hθ hθ' x₀).deriv,\n    (hasDerivAt_deriv_yCoord hθ hθ' y₀).deriv]\n  calc\n    _ = (Real.cos (θ s)^2 + Real.sin (θ s)^2) * κ := by ring\n    _ = κ := by rw [Real.cos_sq_add_sin_sq]; simp","truncated":false,"comment":"For the unit-speed reconstruction, `x' y'' - y' x'' = θ'`."},{"id":105,"line":90,"statement":"theorem signed_curvature_eq_deriv {θ : ℝ → ℝ} (hθ : Differentiable ℝ θ)\n    (x₀ y₀ s : ℝ) :\n    deriv (xCoord θ x₀) s * deriv (deriv (yCoord θ y₀)) s -\n      deriv (yCoord θ y₀) s * deriv (deriv (xCoord θ x₀)) s = curvature θ s","proof":"signed_curvature_determinant hθ.continuous (hθ s).hasDerivAt x₀ y₀","truncated":false,"comment":""},{"id":106,"line":97,"statement":"theorem xCoord_const (α x₀ s : ℝ) :\n    xCoord (fun _ => α) x₀ s = x₀ + s * Real.cos α","proof":"by\n  simp [xCoord]","truncated":false,"comment":"A constant angle reconstructs a straight line."},{"id":107,"line":101,"statement":"theorem yCoord_const (α y₀ s : ℝ) :\n    yCoord (fun _ => α) y₀ s = y₀ + s * Real.sin α","proof":"by\n  simp [yCoord]","truncated":false,"comment":""},{"id":108,"line":105,"statement":"@[simp] theorem curvature_const (α s : ℝ) : curvature (fun _ => α) s = 0","proof":"by\n  simp [curvature]","truncated":false,"comment":""},{"id":109,"line":109,"statement":"theorem curvature_affine (α κ s : ℝ) :\n    curvature (fun u => α + κ * u) s = κ","proof":"by\n  simp [curvature]","truncated":false,"comment":"The linear angle of a circular arc has the specified constant signed curvature."},{"id":110,"line":114,"statement":"theorem xCoord_affine (α κ x₀ s : ℝ) (hκ : κ ≠ 0) :\n    xCoord (fun u => α + κ * u) x₀ s =\n      x₀ + (Real.sin (α + κ * s) - Real.sin α) / κ","proof":"by\n  have hd (u : ℝ) :\n      HasDerivAt (fun v => Real.sin (α + κ * v) / κ)\n        (Real.cos (α + κ * u)) u := by\n    simpa [hκ] using\n      (((hasDerivAt_id u).const_mul κ |>.const_add α).sin.div_const κ)\n  have hi := intervalIntegral.integral_eq_sub_of_hasDerivAt\n    (a := (0 : ℝ)) (b := s) (fun u _ => hd u)\n    ((Real.continuous_cos.comp\n      (continuous_const.add (continuous_const.mul continuous_id))).intervalIntegrable 0 s)\n  unfold xCoord\n  rw [hi]\n  simp only [mul_zero, add_zero]\n  ring","truncated":false,"comment":"A nonzero affine angle reconstructs the classical circular arc."},{"id":111,"line":131,"statement":"theorem yCoord_affine (α κ y₀ s : ℝ) (hκ : κ ≠ 0) :\n    yCoord (fun u => α + κ * u) y₀ s =\n      y₀ + (Real.cos α - Real.cos (α + κ * s)) / κ","proof":"by\n  have hd (u : ℝ) :\n      HasDerivAt (fun v => -Real.cos (α + κ * v) / κ)\n        (Real.sin (α + κ * u)) u := by\n    simpa [hκ] using\n      ((((hasDerivAt_id u).const_mul κ |>.const_add α).cos.neg).div_const κ)\n  have hi := intervalIntegral.integral_eq_sub_of_hasDerivAt\n    (a := (0 : ℝ)) (b := s) (fun u _ => hd u)\n    ((Real.continuous_sin.comp\n      (continuous_const.add (continuous_const.mul continuous_id))).intervalIntegrable 0 s)\n  unfold yCoord\n  rw [hi]\n  simp only [mul_zero, add_zero]\n  ring","truncated":false,"comment":""},{"id":112,"line":150,"statement":"theorem abs_x_displacement_le (θ : ℝ → ℝ) (x₀ ℓ : ℝ) (hℓ : 0 ≤ ℓ) :\n    |xCoord θ x₀ ℓ - x₀| ≤ ℓ","proof":"by\n  have h := intervalIntegral.norm_integral_le_of_norm_le_const\n    (a := (0 : ℝ)) (b := ℓ) (C := (1 : ℝ))\n    (f := fun u => Real.cos (θ u))\n    (fun u _ => by simpa [Real.norm_eq_abs] using Real.abs_cos_le_one (θ u))\n  simpa [xCoord, Real.norm_eq_abs, abs_of_nonneg hℓ] using h","truncated":false,"comment":"A necessary endpoint condition. In particular an x-displacement greater than\nthe length cannot be attained, irrespective of tangent boundary conditions."},{"id":113,"line":158,"statement":"theorem abs_y_displacement_le (θ : ℝ → ℝ) (y₀ ℓ : ℝ) (hℓ : 0 ≤ ℓ) :\n    |yCoord θ y₀ ℓ - y₀| ≤ ℓ","proof":"by\n  have h := intervalIntegral.norm_integral_le_of_norm_le_const\n    (a := (0 : ℝ)) (b := ℓ) (C := (1 : ℝ))\n    (f := fun u => Real.sin (θ u))\n    (fun u _ => by simpa [Real.norm_eq_abs] using Real.abs_sin_le_one (θ u))\n  simpa [yCoord, Real.norm_eq_abs, abs_of_nonneg hℓ] using h","truncated":false,"comment":""},{"id":114,"line":166,"statement":"theorem impossible_x_endpoint {x₀ x₁ ℓ : ℝ} (hℓ : 0 ≤ ℓ)\n    (hfar : ℓ < |x₁ - x₀|) : ¬ ∃ θ : ℝ → ℝ, xCoord θ x₀ ℓ = x₁","proof":"by\n  rintro ⟨θ, hθ⟩\n  have h := abs_x_displacement_le θ x₀ ℓ hℓ\n  rw [hθ] at h\n  exact (not_lt_of_ge h) hfar","truncated":false,"comment":""},{"id":115,"line":48,"statement":"theorem corrected_family_C1_close {θ : ℝ → ℝ} {ℓ : ℝ}\n    (hθ : ContDiff ℝ 1 θ) (η ξ₁ ξ₂ : variationSpace ℓ)\n    {a b : ℝ → ℝ} (ha : ContinuousAt a 0) (hb : ContinuousAt b 0)\n    (ha0 : a 0 = 0) (hb0 : b 0 = 0) {r : ℝ} (hr : 0 < r) :\n    ∀ᶠ t in 𝓝 (0 : ℝ), ∀ s ∈ Icc 0 ℓ,\n      |(θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s) - θ s| < r ∧\n      |deriv (fun u => θ u + t * η.val u + a t * ξ₁.val u + b t * ξ₂.val u) s -\n        deriv θ s| < r","proof":"by\n  let G : ℝ → ℝ := fun s =>\n    |η.val s| + |deriv η.val s| + |ξ₁.val s| + |deriv ξ₁.val s| +\n      |ξ₂.val s| + |deriv ξ₂.val s|\n  have hG : Continuous G :=\n    ((((η.property.1.continuous.abs.add η.property.1.continuous_deriv_one.abs).add\n      ξ₁.property.1.continuous.abs).add ξ₁.property.1.continuous_deriv_one.abs).add\n        ξ₂.property.1.continuous.abs).add ξ₂.property.1.continuous_deriv_one.abs\n  obtain ⟨C, hC⟩ := (isCompact_Icc : IsCompact (Icc (0 : ℝ) ℓ)).exists_bound_of_continuousOn\n    hG.continuousOn\n  have hbounds (s : ℝ) (hs : s ∈ Icc 0 ℓ) :\n      |η.val s| ≤ C ∧ |deriv η.val s| ≤ C ∧\n      |ξ₁.val s| ≤ C ∧ |deriv ξ₁.val s| ≤ C ∧\n      |ξ₂.val s| ≤ C ∧ |deriv ξ₂.val s| ≤ C := by\n    have hg : G s ≤ C := (le_abs_self (G s)).trans (by\n      simpa only [Real.norm_eq_abs] using hC s hs)\n    dsimp [G] at hg\n    have h₁ := abs_nonneg (η.val s)\n    have h₂ := abs_nonneg (deriv η.val s)\n    have h₃ := abs_nonneg (ξ₁.val s)\n    have h₄ := abs_nonneg (deriv ξ₁.val s)\n    have h₅ := abs_nonneg (ξ₂.val s)\n    have h₆ := abs_nonneg (deriv ξ₂.val s)\n    refine ⟨?_, ?_, ?_, ?_, ?_, ?_⟩ <;> linarith\n  have hcont : ContinuousAt (fun t : ℝ => (|t| + |a t| + |b t|) * C) 0 :=\n    ((continuousAt_id.abs.add ha.abs).add hb.abs).mul continuousAt_const\n  have hsmall : ∀ᶠ t in 𝓝 (0 : ℝ), (|t| + |a t| + |b t|) * C < r :=\n    hcont.eventually (Iio_mem_nhds (by simpa [ha0, hb0] using hr))\n  filter_upwards [hsmall] with t ht\n  intro s hs\n  obtain ⟨h₁, h₂, h₃, h₄, h₅, h₆⟩ := hbounds s hs\n  have hd : deriv (fun u => θ u + t * η.val u + a t * ξ₁.val u + b t * ξ₂.val u) s =\n      deriv θ s + t * deriv η.val s + a t * deriv ξ₁.val s + b t * deriv ξ₂.val s :=\n    ((((hθ.differentiable one_ne_zero s).hasDerivAt.add\n      ((η.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul t)).add\n        ((ξ₁.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (a t))).add\n          ((ξ₂.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (b t))).deriv\n  constructor\n  · have he : θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s - θ s =\n        t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s := by ring\n    rw [he]\n    exact (abs_three_term_bound h₁ h₃ h₅).trans_lt ht\n  · rw [hd]\n    have he : deriv θ s + t * deriv η.val s + a t * deriv ξ₁.val s +\n        b t * deriv ξ₂.val s - deriv θ s =\n        t * deriv η.val s + a t * deriv ξ₁.val s + b t * deriv ξ₂.val s := by ring\n    rw [he]\n    exact (abs_three_term_bound h₂ h₄ h₆).trans_lt ht","truncated":false,"comment":"A continuous finite-parameter correction tending to zero tends to the base\nangle in the C¹ neighborhood on the fixed compact interval."},{"id":116,"line":107,"statement":"theorem locallyMinimizing_isLocalMin_corrected_family {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hθ : ContDiff ℝ 1 θ) (hmin : LocallyMinimizing ε θ ℓ)\n    (η ξ₁ ξ₂ : variationSpace ℓ) {a b : ℝ → ℝ}\n    (ha : ContinuousAt a 0) (hb : ContinuousAt b 0)\n    (ha0 : a 0 = 0) (hb0 : b 0 = 0)\n    (hexact : ∀ᶠ t in 𝓝 (0 : ℝ),\n      (∫ s in 0..ℓ, cos (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s)) =\n        (∫ s in 0..ℓ, cos (θ s)) ∧\n      (∫ s in 0..ℓ, sin (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s)) =\n        (∫ s in 0..ℓ, sin (θ s))) :\n    IsLocalMin (fun t => energy ε\n      (fun s => θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s) ℓ) 0","proof":"by\n  obtain ⟨r, hr, hminimal⟩ := hmin\n  have hclose := corrected_family_C1_close hθ η ξ₁ ξ₂ ha hb ha0 hb0 hr\n  change ∀ᶠ t in 𝓝 (0 : ℝ),\n    energy ε (fun s => θ s + 0 * η.val s + a 0 * ξ₁.val s + b 0 * ξ₂.val s) ℓ ≤ _\n  simp only [ha0, hb0, zero_mul, add_zero]\n  filter_upwards [hclose, hexact] with t ht hx\n  apply hminimal (fun s => θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s)\n  · exact ((hθ.add (contDiff_const.mul η.property.1)).add\n      (contDiff_const.mul ξ₁.property.1)).add (contDiff_const.mul ξ₂.property.1)\n  · simp only [η.property.2.1, ξ₁.property.2.1, ξ₂.property.2.1, mul_zero, add_zero]\n  · simp only [η.property.2.2, ξ₁.property.2.2, ξ₂.property.2.2, mul_zero, add_zero]\n  · exact hx.1\n  · exact hx.2\n  · exact ht","truncated":false,"comment":"A C¹ local minimum of the constrained energy induces a scalar local minimum\non every exact corrected family with continuous coefficients vanishing at zero.\nThe hypotheses from a C² implicit-function correction are therefore sufficient."},{"id":117,"line":18,"statement":"theorem locallyMinimizing_stationary_of_nonstraight {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hε : ContDiff ℝ 2 ε) (hθ : ContDiff ℝ 1 θ)\n    (hne : ∃ s ∈ Ioo 0 ℓ, deriv θ s ≠ 0)\n    (hmin : LocallyMinimizing ε θ ℓ) : Stationary ε θ ℓ","proof":"by\n  apply (stationary_iff_firstVariation hℓ.le (hε.of_le (by norm_num)) hθ).mpr\n  intro η hx hy\n  obtain ⟨ξ₁, ξ₂, a, b, ha, hb, ha0, hb0, ha1, hb1, hexact⟩ :=\n    exists_exact_endpoint_variation hℓ hθ hne η hx hy\n  have hm := locallyMinimizing_isLocalMin_corrected_family hθ hmin η ξ₁ ξ₂\n    ha.continuousAt hb.continuousAt ha0 hb0 hexact\n  have hd := (hasDerivAt_corrected_energy_and_deriv hℓ.le hε hθ η.property.1\n    ξ₁.property.1 ξ₂.property.1 ha hb ha0 hb0 ha1.deriv hb1.deriv).1\n  exact hd.deriv.symm.trans hm.deriv_eq_zero","truncated":false,"comment":"A genuine C¹ local minimum at a nonstraight curve satisfies the original\nstationarity predicate, which is stated using actual parameter derivatives."},{"id":118,"line":34,"statement":"theorem locallyMinimizing_angle_firstIntegral_curvature\n    {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hε : ContDiff ℝ 3 ε) (hθ : ContDiff ℝ 3 θ)\n    (hne : ¬ ∀ s ∈ Icc 0 ℓ, θ s = θ 0)\n    (hmin : LocallyMinimizing ε θ ℓ) :\n    ∃ lam μ σ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      (deriv (fun t => deriv ε (deriv θ t)) s =\n        -lam * sin (θ s) + μ * cos (θ s)) ∧\n      (deriv θ s * deriv ε (deriv θ s) - ε (deriv θ s) -\n        lam * cos (θ s) - μ * sin (θ s) = σ) ∧\n      (deriv (deriv (fun t => deriv ε (deriv θ t))) s +\n        (deriv θ s) ^ 2 * deriv ε (deriv θ s) -\n        deriv θ s * ε (deriv θ s) - σ * deriv θ s = 0)","proof":"by\n  have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n  exact stationary_angle_firstIntegral_curvature hℓ hε hθ\n    (locallyMinimizing_stationary_of_nonstraight hℓ (hε.of_le (by norm_num)) hθ1\n      (exists_nonzero_curvature_of_nonconstant hℓ hθ1 hne) hmin)","truncated":false,"comment":"The existing angle, first-integral and curvature equations now follow\nfrom a true constrained local minimum; no stationarity hypothesis is supplied."},{"id":119,"line":54,"statement":"theorem locallyMinimizing_secondVariation_nonneg\n    {ε θ : ℝ → ℝ} {ℓ lam μ : ℝ}\n    (hℓ : 0 < ℓ) (hε : ContDiff ℝ 2 ε) (hθ : ContDiff ℝ 1 θ)\n    (hne : ∃ s ∈ Ioo 0 ℓ, deriv θ s ≠ 0)\n    (hmin : LocallyMinimizing ε θ ℓ)\n    (hm : ∀ ζ : variationSpace ℓ,\n      (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv ζ.val s) +\n        lam * (∫ s in 0..ℓ, -sin (θ s) * ζ.val s) +\n        μ * (∫ s in 0..ℓ, cos (θ s) * ζ.val s) = 0)\n    (η : variationSpace ℓ)\n    (hx : (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0)\n    (hy : (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0) :\n    0 ≤ ∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η.val s)^2 -\n      (lam * cos (θ s) + μ * sin (θ s)) * (η.val s)^2","proof":"by\n  obtain ⟨ξ₁, ξ₂, a, b, ha, hb, ha0, hb0, ha1, hb1, hexact⟩ :=\n    exists_exact_endpoint_variation hℓ hθ hne η hx hy\n  have hpath := locallyMinimizing_isLocalMin_corrected_family hθ hmin η ξ₁ ξ₂\n    ha.continuousAt hb.continuousAt ha0 hb0 hexact\n  have hd := (hasDerivAt_corrected_energy_and_deriv hℓ.le hε hθ η.property.1\n    ξ₁.property.1 ξ₂.property.1 ha hb ha0 hb0 ha1.deriv hb1.deriv).1\n  have hsecond := constrained_secondVariation_corrected hℓ.le hε hθ η.property.1\n    ξ₁ ξ₂ ha hb ha0 hb0 ha1.deriv hb1.deriv\n    (hexact.mono fun _ h => h.1) (hexact.mono fun _ h => h.2) hm\n  exact second_derivative_nonneg_of_local_min hpath hd.continuousAt hsecond","truncated":false,"comment":"Every linearized feasible direction at a nonstraight local minimum has\nnonnegative constrained second variation, for any stationary multipliers."},{"id":120,"line":83,"statement":"theorem locallyMinimizing_necessary_conditions\n    {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hε : ContDiff ℝ 3 ε) (hθ : ContDiff ℝ 3 θ)\n    (hne : ¬ ∀ s ∈ Icc 0 ℓ, θ s = θ 0)\n    (hmin : LocallyMinimizing ε θ ℓ) :\n    ∃ lam μ σ : ℝ,\n      (∀ s ∈ Ioo 0 ℓ,\n        (deriv (fun t => deriv ε (deriv θ t)) s =\n          -lam * sin (θ s) + μ * cos (θ s)) ∧\n        (deriv θ s * deriv ε (deriv θ s) - ε (deriv θ s) -\n          lam * cos (θ s) - μ * sin (θ s) = σ) ∧\n        (deriv (deriv (fun t => deriv ε (deriv θ t))) s +\n          (deriv θ s) ^ 2 * deriv ε (deriv θ s) -\n          deriv θ s * ε (deriv θ s) - σ * deriv θ s = 0)) ∧\n      (∀ η : variationSpace ℓ,\n        (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0 →\n        (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 →\n        0 ≤ ∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η.val s)^2 -\n          (lam * cos (θ s) + μ * sin (θ s)) * (η.val s)^2)","proof":"by\n  have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n  have hε1 : ContDiff ℝ 1 ε := hε.of_le (by norm_num)\n  have hε2 : ContDiff ℝ 2 ε := hε.of_le (by norm_num)\n  have hn := exists_nonzero_curvature_of_nonconstant hℓ hθ1 hne\n  have hstat := locallyMinimizing_stationary_of_nonstraight hℓ hε2 hθ1 hn hmin\n  have hM : ContDiff ℝ 2 (fun t => deriv ε (deriv θ t)) :=\n    (hε.deriv' (n := 2)).comp (hθ.deriv' (n := 2))\n  obtain ⟨lam, μ, hm⟩ := stationary_multipliers hθ.continuous hM.continuous\n    ((stationary_iff_firstVariation hℓ.le hε1 hθ1).mp hstat)\n  have hAngle : ∀ s ∈ Ioo 0 ℓ,\n      deriv (fun t => deriv ε (deriv θ t)) s = -lam * sin (θ s) + μ * cos (θ s) := by\n    apply residual_zero_of_augmented_stationary hℓ hM\n      ((contDiff_const.mul hθ1.sin).add (contDiff_const.mul hθ1.cos))\n    intro η\n    rw [force_integral hθ.continuous η]\n    linarith [hm η]\n  obtain ⟨σ, hσ⟩ := smooth_angle_firstIntegral_and_curvature hθ hε hAngle\n  refine ⟨lam, μ, σ, (fun s hs => ⟨hAngle s hs, hσ s hs⟩), ?_⟩\n  exact locallyMinimizing_secondVariation_nonneg hℓ hε2 hθ1 hn hmin hm","truncated":false,"comment":"Complete necessary-condition theorem. A nonstraight C¹ constrained local\nminimum with the original C³ data has one choice of multipliers that satisfies\nall three classical equations and the constrained second-variation inequality.\nNeither stationarity, exact variation realization, nor rank is assumed."},{"id":121,"line":27,"statement":"@[simp] theorem powerLog_zero (z : ℝ) : powerLog 0 z = log z","proof":"by\n  simp [powerLog]","truncated":false,"comment":""},{"id":122,"line":30,"statement":"@[simp] theorem powerLog_one (p : ℝ) : powerLog p 1 = 0","proof":"by\n  by_cases hp : p = 0 <;> simp [powerLog, hp]","truncated":false,"comment":""},{"id":123,"line":34,"statement":"theorem hasDerivAt_powerLog {p z : ℝ} (hz : 0 < z) :\n    HasDerivAt (powerLog p) (z ^ (p - 1)) z","proof":"by\n  by_cases hp : p = 0\n  · subst p\n    unfold powerLog\n    simpa [Real.rpow_neg_one] using Real.hasDerivAt_log hz.ne'\n  · unfold powerLog\n    simp only [hp, ite_false]\n    convert ((Real.hasDerivAt_rpow_const (p := p) (Or.inl hz.ne')).sub_const 1).div_const p using 1\n    field_simp","truncated":false,"comment":"Every exponent gives the same first-order normalization at `z = 1`."},{"id":124,"line":45,"statement":"theorem deriv_powerLog {p z : ℝ} (hz : 0 < z) :\n    deriv (powerLog p) z = z ^ (p - 1)","proof":"(hasDerivAt_powerLog hz).deriv","truncated":false,"comment":""},{"id":125,"line":49,"statement":"theorem deriv_powerLog_pos {p z : ℝ} (hz : 0 < z) :\n    0 < deriv (powerLog p) z","proof":"by\n  rw [deriv_powerLog hz]\n  exact Real.rpow_pos_of_pos hz _","truncated":false,"comment":""},{"id":126,"line":56,"statement":"theorem powerLog_mul (p : ℝ) {z w : ℝ} (hz : 0 < z) (hw : 0 < w) :\n    powerLog p (z * w) = powerLog p z + powerLog p w + p * powerLog p z * powerLog p w","proof":"by\n  by_cases hp : p = 0\n  · subst p\n    simp [powerLog, Real.log_mul hz.ne' hw.ne']\n  · simp only [powerLog, hp, ite_false]\n    rw [Real.mul_rpow hz.le hw.le]\n    field_simp\n    ring","truncated":false,"comment":"The exact transported multiplication law; at exponent zero it is logarithmic\nadditivity. This identity is not an identification of two empirical response laws."},{"id":127,"line":68,"statement":"theorem continuousAt_powerLog_exponent_zero {z : ℝ} (hz : 0 < z) :\n    ContinuousAt (fun p => powerLog p z) 0","proof":"by\n  have hd : HasDerivAt (fun p : ℝ => z ^ p) (log z) 0 := by\n    simpa using (hasDerivAt_const (0 : ℝ) z).rpow (hasDerivAt_id 0) hz\n  convert hd.continuousAt_div using 1\n  funext p\n  by_cases hp : p = 0\n  · subst p\n    simp [powerLog]\n  · simp [powerLog, hp]","truncated":false,"comment":"The normalized power response really tends to the logarithm as its exponent\ntends to zero, including the explicitly defined value at zero."},{"id":128,"line":79,"statement":"theorem tendsto_powerLog_exponent_zero {z : ℝ} (hz : 0 < z) :\n    Tendsto (fun p => powerLog p z) (𝓝 0) (𝓝 (log z))","proof":"by\n  simpa using (continuousAt_powerLog_exponent_zero hz).tendsto","truncated":false,"comment":""},{"id":129,"line":91,"statement":"@[simp] theorem powerLogDensity_zero (K κ₀ κ : ℝ) :\n    powerLogDensity 0 K κ₀ κ = K * (κ * log (κ / κ₀) - κ + κ₀)","proof":"by\n  simp [powerLogDensity]","truncated":false,"comment":""},{"id":130,"line":95,"statement":"@[simp] theorem powerLogDensity_neg_one (K κ₀ κ : ℝ) :\n    powerLogDensity (-1) K κ₀ κ = K * (κ - κ₀ - κ₀ * log (κ / κ₀))","proof":"by\n  norm_num [powerLogDensity]","truncated":false,"comment":""},{"id":131,"line":99,"statement":"theorem powerLogDensity_reference (p K : ℝ) {κ₀ : ℝ} (hκ₀ : 0 < κ₀) :\n    powerLogDensity p K κ₀ κ₀ = 0","proof":"by\n  by_cases hp : p = 0\n  · simp [powerLogDensity, hp, hκ₀.ne']\n  · by_cases hp' : p = -1 <;> simp [powerLogDensity, hp, hp', hκ₀.ne']","truncated":false,"comment":""},{"id":132,"line":113,"statement":"theorem hasDerivAt_powerLogDensity (p K : ℝ) {κ₀ κ : ℝ}\n    (hκ₀ : 0 < κ₀) (hκ : 0 < κ) :\n    HasDerivAt (powerLogDensity p K κ₀) (K * powerLog p (κ / κ₀)) κ","proof":"by\n  unfold powerLogDensity\n  have hz : 0 < κ / κ₀ := div_pos hκ hκ₀\n  by_cases hp : p = 0\n  · subst p\n    simp only [powerLog_zero]\n    convert ((((hasDerivAt_id κ).mul (hasDerivAt_log_ratio hκ₀ hκ)).sub\n      (hasDerivAt_id κ)).add_const κ₀).const_mul K using 1\n    all_goals dsimp\n    field_simp; ring\n  · by_cases hp' : p = -1\n    · subst p\n      simp only [show (-1 : ℝ) ≠ 0 by norm_num, ite_false]\n      convert (((hasDerivAt_id κ).sub_const κ₀).sub\n        ((hasDerivAt_log_ratio hκ₀ hκ).const_mul κ₀)).const_mul K using 1\n      all_goals first | rfl | (simp only [powerLog, ite_eq_right hp, Real.rpow_neg_one, inv_div]; ring)\n    · have hp1 : p + 1 ≠ 0 := by intro h; apply hp'; linarith\n      simp only [hp, hp', ite_false, powerLog]\n      have hd := ((((hasDerivAt_id κ).div_const κ₀).rpow_const\n        (p := p + 1) (Or.inl hz.ne')).sub_const 1).div_const (p + 1)\n      convert (hd.sub (((hasDerivAt_id κ).div_const κ₀).sub_const 1)).const_mul\n        (K * κ₀ / p) using 1\n      all_goals dsimp\n      rw [show p + 1 - 1 = p by ring]\n      field_simp","truncated":false,"comment":"Actual differentiation of the displayed potential, including both exceptional\nexponents.  The response formula is proved, not supplied as a hypothesis."},{"id":133,"line":143,"statement":"theorem hasDerivAt_deriv_powerLogDensity (p K : ℝ) {κ₀ κ : ℝ}\n    (hκ₀ : 0 < κ₀) (hκ : 0 < κ) :\n    HasDerivAt (deriv (powerLogDensity p K κ₀))\n      (K / κ₀ * (κ / κ₀) ^ (p - 1)) κ","proof":"by\n  have he : deriv (powerLogDensity p K κ₀) =ᶠ[𝓝 κ]\n      fun q => K * powerLog p (q / κ₀) := by\n    filter_upwards [eventually_gt_nhds hκ] with q hq\n    exact (hasDerivAt_powerLogDensity p K hκ₀ hq).deriv\n  have hd := ((hasDerivAt_powerLog (p := p) (div_pos hκ hκ₀)).comp κ\n    ((hasDerivAt_id κ).div_const κ₀)).const_mul K\n  have hd' : HasDerivAt (fun q => K * powerLog p (q / κ₀))\n      (K / κ₀ * (κ / κ₀) ^ (p - 1)) κ := by\n    convert hd using 1\n    all_goals first | rfl | ring\n  exact hd'.congr_of_eventuallyEq he","truncated":false,"comment":"The actual second derivative of the potential remains positive for every\nreal response exponent when the reference curvature and scale are positive."},{"id":134,"line":159,"statement":"theorem second_deriv_powerLogDensity_pos (p : ℝ) {K κ₀ κ : ℝ}\n    (hK : 0 < K) (hκ₀ : 0 < κ₀) (hκ : 0 < κ) :\n    0 < deriv (deriv (powerLogDensity p K κ₀)) κ","proof":"by\n  rw [(hasDerivAt_deriv_powerLogDensity p K hκ₀ hκ).deriv]\n  exact mul_pos (div_pos hK hκ₀) (Real.rpow_pos_of_pos (div_pos hκ hκ₀) _)","truncated":false,"comment":""},{"id":135,"line":167,"statement":"theorem powerLogDensity_one (K : ℝ) {κ₀ : ℝ} (hκ₀ : 0 < κ₀) (κ : ℝ) :\n    powerLogDensity 1 K κ₀ κ = (K / κ₀) * κ ^ 2 / 2 - K * κ + K * κ₀ / 2","proof":"by\n  norm_num [powerLogDensity, Real.rpow_two]\n  field_simp; ring","truncated":false,"comment":"Exponent one recovers a classical quadratic density plus an affine term.\nThis polynomial identity extends to all signed curvatures."},{"id":136,"line":174,"statement":"theorem energy_powerLogDensity_one {θ : ℝ → ℝ} (hθ : ContDiff ℝ 1 θ)\n    (K : ℝ) {κ₀ : ℝ} (hκ₀ : 0 < κ₀) (ℓ : ℝ) :\n    energy (powerLogDensity 1 K κ₀) θ ℓ =\n      energy (fun q => (K / κ₀) * q ^ 2 / 2) θ ℓ -\n        K * (θ ℓ - θ 0) + K * κ₀ / 2 * ℓ","proof":"by\n  have he : powerLogDensity 1 K κ₀ =\n      fun q => (K / κ₀) * q ^ 2 / 2 + (-K) * q + K * κ₀ / 2 := by\n    funext q\n    rw [powerLogDensity_one K hκ₀]\n    ring\n  rw [he, energy_affine_density (by fun_prop) hθ]\n  ring","truncated":false,"comment":"The affine part changes the actual curve energy only by the fixed lifted\nendpoint angles and length, using the existing affine-density integral theorem."},{"id":137,"line":189,"statement":"theorem energy_powerLogDensity_one_le_iff {θ ψ : ℝ → ℝ}\n    (hθ : ContDiff ℝ 1 θ) (hψ : ContDiff ℝ 1 ψ)\n    (K : ℝ) {κ₀ : ℝ} (hκ₀ : 0 < κ₀) (ℓ : ℝ)\n    (h0 : θ 0 = ψ 0) (hend : θ ℓ = ψ ℓ) :\n    energy (powerLogDensity 1 K κ₀) θ ℓ ≤ energy (powerLogDensity 1 K κ₀) ψ ℓ ↔\n      energy (fun q => (K / κ₀) * q ^ 2 / 2) θ ℓ ≤\n        energy (fun q => (K / κ₀) * q ^ 2 / 2) ψ ℓ","proof":"by\n  rw [energy_powerLogDensity_one hθ K hκ₀,\n    energy_powerLogDensity_one hψ K hκ₀, h0, hend]\n  exact add_le_add_iff_right _ |>.trans (sub_le_sub_iff_right _)","truncated":false,"comment":"On fixed endpoint-angle data, exponent one compares curves in exactly the\nsame order as the classical quadratic bending energy."},{"id":138,"line":23,"statement":"theorem angle_sub_eq_initial_of_curvature_eq {θ ψ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ) (hψ : ContDiff ℝ 1 ψ)\n    (hκ : ∀ s ∈ Ioo 0 ℓ, curvature ψ s = curvature θ s) :\n    ∀ s ∈ Icc 0 ℓ, ψ s - θ s = ψ 0 - θ 0","proof":"by\n  have hd : ∀ s ∈ Ioo 0 ℓ, HasDerivAt (fun t => ψ t - θ t) 0 s := by\n    intro s hs\n    have hk : deriv ψ s = deriv θ s := hκ s hs\n    convert ((hψ.differentiable one_ne_zero s).hasDerivAt.sub\n      (hθ.differentiable one_ne_zero s).hasDerivAt) using 1\n    simp only [hk, sub_self]\n  obtain ⟨c, hc⟩ := isOpen_Ioo.exists_is_const_of_deriv_eq_zero\n    (convex_Ioo (0 : ℝ) ℓ).isPreconnected\n    (fun s hs => (hd s hs).differentiableAt.differentiableWithinAt)\n    (fun s hs => (hd s hs).deriv)\n  have hcc : EqOn (fun s => ψ s - θ s) (fun _ => c) (Icc 0 ℓ) := by\n    have heq : EqOn (fun s => ψ s - θ s) (fun _ => c) (Ioo 0 ℓ) := hc\n    simpa only [closure_Ioo hℓ.ne] using\n      heq.closure (hψ.continuous.sub hθ.continuous) continuous_const\n  intro s hs\n  exact (hcc hs).trans (hcc ⟨le_rfl, hℓ.le⟩).symm","truncated":false,"comment":"Equal signed curvature on the interior fixes the difference of tangent angles\nthroughout the closed interval, including both endpoints."},{"id":139,"line":45,"statement":"theorem angle_eq_of_curvature_eq_initial {θ ψ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ) (hψ : ContDiff ℝ 1 ψ)\n    (hκ : ∀ s ∈ Ioo 0 ℓ, curvature ψ s = curvature θ s)\n    (h₀ : ψ 0 = θ 0) :\n    ∀ s ∈ Icc 0 ℓ, ψ s = θ s","proof":"by\n  intro s hs\n  have h := angle_sub_eq_initial_of_curvature_eq hℓ hθ hψ hκ s hs\n  rw [h₀, sub_self] at h\n  exact sub_eq_zero.mp h","truncated":false,"comment":"Initial real angle plus the curvature function determines the angle lift."},{"id":140,"line":56,"statement":"theorem xCoord_eq_of_angle_eq {θ ψ : ℝ → ℝ} {ℓ s : ℝ}\n    (h : EqOn ψ θ (Icc 0 ℓ)) (hs : s ∈ Icc 0 ℓ) (x₀ : ℝ) :\n    xCoord ψ x₀ s = xCoord θ x₀ s","proof":"by\n  unfold xCoord\n  refine congrArg (fun z : ℝ => x₀ + z) (intervalIntegral.integral_congr ?_)\n  intro t ht\n  rw [uIcc_of_le hs.1] at ht\n  change cos (ψ t) = cos (θ t)\n  rw [h ⟨ht.1, ht.2.trans hs.2⟩]","truncated":false,"comment":"The coordinate reconstruction only reads the angle on its integration interval."},{"id":141,"line":66,"statement":"theorem yCoord_eq_of_angle_eq {θ ψ : ℝ → ℝ} {ℓ s : ℝ}\n    (h : EqOn ψ θ (Icc 0 ℓ)) (hs : s ∈ Icc 0 ℓ) (y₀ : ℝ) :\n    yCoord ψ y₀ s = yCoord θ y₀ s","proof":"by\n  unfold yCoord\n  refine congrArg (fun z : ℝ => y₀ + z) (intervalIntegral.integral_congr ?_)\n  intro t ht\n  rw [uIcc_of_le hs.1] at ht\n  change sin (ψ t) = sin (θ t)\n  rw [h ⟨ht.1, ht.2.trans hs.2⟩]","truncated":false,"comment":""},{"id":142,"line":77,"statement":"theorem reconstruction_eq_of_curvature_eq_initial {θ ψ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ) (hψ : ContDiff ℝ 1 ψ)\n    (hκ : ∀ s ∈ Ioo 0 ℓ, curvature ψ s = curvature θ s)\n    (h₀ : ψ 0 = θ 0) (x₀ y₀ : ℝ) :\n    ∀ s ∈ Icc 0 ℓ,\n      xCoord ψ x₀ s = xCoord θ x₀ s ∧ yCoord ψ y₀ s = yCoord θ y₀ s","proof":"by\n  intro s hs\n  have ha := angle_eq_of_curvature_eq_initial hℓ hθ hψ hκ h₀\n  exact ⟨xCoord_eq_of_angle_eq ha hs x₀, yCoord_eq_of_angle_eq ha hs y₀⟩","truncated":false,"comment":"Fixed initial point and initial real angle remove the remaining freedom."},{"id":143,"line":88,"statement":"theorem xCoord_add_angle {θ : ℝ → ℝ} (hθ : Continuous θ)\n    (α x₀ y₀ x₁ s : ℝ) :\n    xCoord (fun u => θ u + α) x₁ s - x₁ =\n      cos α * (xCoord θ x₀ s - x₀) - sin α * (yCoord θ y₀ s - y₀)","proof":"by\n  unfold xCoord yCoord\n  simp only [add_sub_cancel_left, cos_add]\n  rw [intervalIntegral.integral_sub\n    (f := fun u => cos (θ u) * cos α) (g := fun u => sin (θ u) * sin α)\n    (μ := volume) (a := 0) (b := s)\n    (((Real.continuous_cos.comp hθ).mul continuous_const).intervalIntegrable 0 s)\n    (((Real.continuous_sin.comp hθ).mul continuous_const).intervalIntegrable 0 s),\n    intervalIntegral.integral_mul_const, intervalIntegral.integral_mul_const]\n  ring","truncated":false,"comment":"Adding a constant angle rotates the displacement through that angle."},{"id":144,"line":102,"statement":"theorem yCoord_add_angle {θ : ℝ → ℝ} (hθ : Continuous θ)\n    (α x₀ y₀ y₁ s : ℝ) :\n    yCoord (fun u => θ u + α) y₁ s - y₁ =\n      sin α * (xCoord θ x₀ s - x₀) + cos α * (yCoord θ y₀ s - y₀)","proof":"by\n  unfold xCoord yCoord\n  simp only [add_sub_cancel_left, sin_add]\n  rw [intervalIntegral.integral_add\n    (f := fun u => sin (θ u) * cos α) (g := fun u => cos (θ u) * sin α)\n    (μ := volume) (a := 0) (b := s)\n    (((Real.continuous_sin.comp hθ).mul continuous_const).intervalIntegrable 0 s)\n    (((Real.continuous_cos.comp hθ).mul continuous_const).intervalIntegrable 0 s),\n    intervalIntegral.integral_mul_const, intervalIntegral.integral_mul_const]\n  ring","truncated":false,"comment":""},{"id":145,"line":118,"statement":"theorem reconstruction_rotation_of_curvature_eq {θ ψ : ℝ → ℝ} {ℓ α : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ) (hψ : ContDiff ℝ 1 ψ)\n    (hκ : ∀ s ∈ Ioo 0 ℓ, curvature ψ s = curvature θ s)\n    (hα : α = ψ 0 - θ 0) (x₀ y₀ x₁ y₁ : ℝ) :\n    ∀ s ∈ Icc 0 ℓ,\n      xCoord ψ x₁ s - x₁ =\n        cos α * (xCoord θ x₀ s - x₀) - sin α * (yCoord θ y₀ s - y₀) ∧\n      yCoord ψ y₁ s - y₁ =\n        sin α * (xCoord θ x₀ s - x₀) + cos α * (yCoord θ y₀ s - y₀)","proof":"by\n  have ha : EqOn ψ (fun s => θ s + α) (Icc 0 ℓ) := by\n    intro s hs\n    have h := angle_sub_eq_initial_of_curvature_eq hℓ hθ hψ hκ s hs\n    rw [← hα] at h\n    linarith\n  intro s hs\n  rw [xCoord_eq_of_angle_eq ha hs x₁, yCoord_eq_of_angle_eq ha hs y₁]\n  exact ⟨xCoord_add_angle hθ.continuous α x₀ y₀ x₁ s,\n    yCoord_add_angle hθ.continuous α x₀ y₀ y₁ s⟩","truncated":false,"comment":"Equal signed curvature gives an explicit orientation-preserving rigid motion.\nHere α is exactly the difference of the two chosen initial angle lifts."},{"id":146,"line":139,"statement":"theorem energy_eq_of_curvature_eq {θ ψ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ) (hψ : ContDiff ℝ 1 ψ)\n    (hκ : ∀ s ∈ Ioo 0 ℓ, curvature ψ s = curvature θ s) (ε : ℝ → ℝ) :\n    energy ε ψ ℓ = energy ε θ ℓ","proof":"by\n  have hcc : EqOn (deriv ψ) (deriv θ) (Icc 0 ℓ) := by\n    have heq : EqOn (deriv ψ) (deriv θ) (Ioo 0 ℓ) := hκ\n    simpa only [closure_Ioo hℓ.ne] using\n      heq.closure hψ.continuous_deriv_one hθ.continuous_deriv_one\n  unfold energy\n  apply intervalIntegral.integral_congr\n  intro s hs\n  rw [uIcc_of_le hℓ.le] at hs\n  change ε (deriv ψ s) = ε (deriv θ s)\n  rw [hcc hs]","truncated":false,"comment":"Since the density reads only signed curvature, equal curvature gives equal energy.\nNo evenness, convexity, or regularity assumption on the density is needed here."},{"id":147,"line":51,"statement":"theorem middle_replacement_boundary_and_weight_ratio\n    {ε θ φ : ℝ → ℝ} {a b ℓ : ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (hφ : ContDiff ℝ 1 φ)\n    (ha : 0 ≤ a) (hab : a ≤ b) (hb : b ≤ ℓ)\n    (hleft : EqOn θ φ (Icc 0 a)) (hright : EqOn θ φ (Icc b ℓ))\n    (hx : (∫ s in a..b, cos (θ s)) = ∫ s in a..b, cos (φ s))\n    (hy : (∫ s in a..b, sin (θ s)) = ∫ s in a..b, sin (φ s))\n    (β x₀ y₀ : ℝ) :\n    (θ 0 = φ 0 ∧ θ ℓ = φ ℓ ∧\n      xCoord θ x₀ ℓ = xCoord φ x₀ ℓ ∧ yCoord θ y₀ ℓ = yCoord φ y₀ ℓ) ∧\n    exponentialWeight β ε φ ℓ / exponentialWeight β ε θ ℓ =\n      exp (-β * ((∫ s in a..b, ε (deriv φ s)) -\n        (∫ s in a..b, ε (deriv θ s))))","proof":"by\n  refine ⟨boundary_eq_of_middle_integrals hθ.continuous hφ.continuous\n    ha hab hb hleft hright hx hy x₀ y₀, ?_⟩\n  have henergy := energy_sub_eq_middle_of_outer_angle_eq\n    hε hθ hφ ha hab hb hleft hright\n  rw [exponentialWeight, exponentialWeight, ← exp_sub, ← mul_sub, henergy]","truncated":false,"comment":"The original boundary data are preserved, and the ratio of whole-curve\nweights depends only on the middle energy difference. No sign on `β` or on the\nenergy is needed for this identity."},{"id":148,"line":73,"statement":"theorem middle_energy_lt_iff_exponentialWeight_lt\n    {ε θ φ : ℝ → ℝ} {a b ℓ β : ℝ} (hβ : 0 < β)\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (hφ : ContDiff ℝ 1 φ)\n    (ha : 0 ≤ a) (hab : a ≤ b) (hb : b ≤ ℓ)\n    (hleft : EqOn θ φ (Icc 0 a)) (hright : EqOn θ φ (Icc b ℓ)) :\n    (∫ s in a..b, ε (deriv φ s)) < (∫ s in a..b, ε (deriv θ s)) ↔\n      exponentialWeight β ε θ ℓ < exponentialWeight β ε φ ℓ","proof":"by\n  have henergy := energy_sub_eq_middle_of_outer_angle_eq\n    hε hθ hφ ha hab hb hleft hright\n  rw [← energy_lt_iff_exponentialWeight_lt hβ]\n  constructor <;> intro h <;> linarith","truncated":false,"comment":"With the exterior fixed, strict improvement of the middle energy is\nequivalent to strict increase of the whole-curve weight. Feasibility follows\nfrom the preceding theorem when the two middle displacements also match."},{"id":149,"line":89,"statement":"theorem locallyMinimizing_middle_replacement_comparison\n    {ε θ : ℝ → ℝ} {a b ℓ β : ℝ} (hβ : 0 < β)\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ)\n    (ha : 0 ≤ a) (hab : a ≤ b) (hb : b ≤ ℓ)\n    (hmin : LocallyMinimizing ε θ ℓ) :\n    ∃ r : ℝ, 0 < r ∧ ∀ φ : ℝ → ℝ, ContDiff ℝ 1 φ →\n      EqOn θ φ (Icc 0 a) → EqOn θ φ (Icc b ℓ) →\n      (∫ s in a..b, cos (θ s)) = (∫ s in a..b, cos (φ s)) →\n      (∫ s in a..b, sin (θ s)) = (∫ s in a..b, sin (φ s)) →\n      (∀ s ∈ Icc a b, |φ s - θ s| < r ∧ |deriv φ s - deriv θ s| < r) →\n      (∫ s in a..b, ε (deriv θ s)) ≤ (∫ s in a..b, ε (deriv φ s)) ∧\n        exponentialWeight β ε φ ℓ ≤ exponentialWeight β ε θ ℓ","proof":"by\n  obtain ⟨r, hr, hminimal⟩ := hmin\n  refine ⟨r, hr, ?_⟩\n  intro φ hφ hleft hright hx hy hclose\n  obtain ⟨hzero, hend, hxglobal, hyglobal⟩ := boundary_eq_of_middle_integrals\n    hθ.continuous hφ.continuous ha hab hb hleft hright hx hy 0 0\n  have hcos : (∫ s in 0..ℓ, cos (φ s)) = ∫ s in 0..ℓ, cos (θ s) := by\n    simpa only [xCoord, zero_add] using hxglobal.symm\n  have hsin : (∫ s in 0..ℓ, sin (φ s)) = ∫ s in 0..ℓ, sin (θ s) := by\n    simpa only [yCoord, zero_add] using hyglobal.symm\n  have he := hminimal φ hφ hzero.symm hend.symm hcos hsin\n    (C1_close_of_middle_close hθ hφ hr hleft hright hclose)\n  have henergy := energy_sub_eq_middle_of_outer_angle_eq\n    hε hθ hφ ha hab hb hleft hright\n  exact ⟨by linarith, (energy_le_iff_exponentialWeight_le hβ ε θ φ ℓ).mp he⟩","truncated":false,"comment":"A whole-curve C¹ local minimum cannot be improved by sufficiently small\nsmooth middle replacements preserving middle displacement. Only middle C¹\ncloseness is required: exterior derivative agreement and all global endpoint\nconditions are derived. The same replacement cannot increase the whole weight."},{"id":150,"line":119,"statement":"theorem not_locallyMinimizing_of_arbitrarily_close_middle_improvements\n    {ε θ : ℝ → ℝ} {a b ℓ : ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ)\n    (ha : 0 ≤ a) (hab : a ≤ b) (hb : b ≤ ℓ)\n    (himprove : ∀ r : ℝ, 0 < r → ∃ φ : ℝ → ℝ,\n      ContDiff ℝ 1 φ ∧ EqOn θ φ (Icc 0 a) ∧ EqOn θ φ (Icc b ℓ) ∧\n      (∫ s in a..b, cos (θ s)) = (∫ s in a..b, cos (φ s)) ∧\n      (∫ s in a..b, sin (θ s)) = (∫ s in a..b, sin (φ s)) ∧\n      (∀ s ∈ Icc a b, |φ s - θ s| < r ∧ |deriv φ s - deriv θ s| < r) ∧\n      (∫ s in a..b, ε (deriv φ s)) < (∫ s in a..b, ε (deriv θ s))) :\n    ¬ LocallyMinimizing ε θ ℓ","proof":"by\n  intro hmin\n  obtain ⟨r, hr, hcompare⟩ := locallyMinimizing_middle_replacement_comparison\n    (β := 1) zero_lt_one hε hθ ha hab hb hmin\n  obtain ⟨φ, hφ, hleft, hright, hx, hy, hclose, himproved⟩ := himprove r hr\n  exact (not_lt_of_ge (hcompare φ hφ hleft hright hx hy hclose).1) himproved","truncated":false,"comment":"Arbitrarily small C¹ middle improvements exclude a constrained local\nminimum of the whole curve. The hypothesis supplies actual globally smooth\nreplacements and their exact displacement matching, not just formal directions."},{"id":151,"line":16,"statement":"theorem second_derivative_nonneg_of_local_min {f : ℝ → ℝ} {x q : ℝ}\n    (hmin : IsLocalMin f x) (hc : ContinuousAt f x)\n    (hsecond : HasDerivAt (deriv f) q x) : 0 ≤ q","proof":"by\n  by_contra h\n  have hq : q < 0 := lt_of_not_ge h\n  have hmax : IsLocalMax f x := isLocalMax_of_deriv_deriv_neg\n    (by rw [hsecond.deriv]; exact hq) hmin.deriv_eq_zero hc\n  have heq : f =ᶠ[nhds x] fun _ => f x := by\n    filter_upwards [hmin, hmax] with y hy hy'\n    exact le_antisymm hy' hy\n  have hz : deriv (deriv f) x = 0 := by\n    simpa using heq.deriv.deriv_eq\n  rw [hsecond.deriv] at hz\n  linarith","truncated":false,"comment":"The second derivative of a continuous scalar function at a local minimum\nis nonnegative, whenever that derivative exists."},{"id":152,"line":23,"statement":"theorem contDiff_angle_scaling {θ : ℝ → ℝ} {n : WithTop ℕ∞}\n    (hθ : ContDiff ℝ n θ) (a : ℝ) :\n    ContDiff ℝ n (fun s => θ (s / a))","proof":"hθ.comp (contDiff_id.div_const a)","truncated":false,"comment":"Reparametrization by a constant scale preserves the stated smoothness."},{"id":153,"line":29,"statement":"theorem hasDerivAt_angle_scaling {θ : ℝ → ℝ} {a κ s : ℝ}\n    (hθ : HasDerivAt θ κ (s / a)) :\n    HasDerivAt (fun t => θ (t / a)) (κ / a) s","proof":"by\n  simpa only [Function.comp_def, id_eq, div_eq_mul_inv, one_mul] using\n    hθ.comp s ((hasDerivAt_id s).div_const a)","truncated":false,"comment":"Chain rule for the angle at the rescaled arc-length parameter."},{"id":154,"line":35,"statement":"theorem deriv_angle_scaling {θ : ℝ → ℝ} (hθ : Differentiable ℝ θ)\n    (a s : ℝ) :\n    deriv (fun t => θ (t / a)) s = deriv θ (s / a) / a","proof":"(hasDerivAt_angle_scaling (hθ (s / a)).hasDerivAt).deriv","truncated":false,"comment":""},{"id":155,"line":41,"statement":"theorem curvature_angle_scaling {θ : ℝ → ℝ} (hθ : Differentiable ℝ θ)\n    (a s : ℝ) :\n    curvature (fun t => θ (t / a)) s = curvature θ (s / a) / a","proof":"deriv_angle_scaling hθ a s","truncated":false,"comment":"Signed curvature scales by the reciprocal of a positive similarity."},{"id":156,"line":47,"statement":"theorem angle_scaling_endpoints (θ : ℝ → ℝ) {a : ℝ} (ha : 0 < a) (ℓ : ℝ) :\n    (fun s => θ (s / a)) 0 = θ 0 ∧\n      (fun s => θ (s / a)) (a * ℓ) = θ ℓ","proof":"by\n  simp [ha.ne']","truncated":false,"comment":"The lifted initial and terminal tangent angles are unchanged."},{"id":157,"line":53,"statement":"theorem xCoord_scaling (θ : ℝ → ℝ) {a : ℝ} (ha : 0 < a) (x₀ s : ℝ) :\n    xCoord (fun t => θ (t / a)) (a * x₀) (a * s) = a * xCoord θ x₀ s","proof":"by\n  unfold xCoord\n  rw [intervalIntegral.integral_comp_div (fun t => Real.cos (θ t)) ha.ne']\n  simp [ha.ne', smul_eq_mul, mul_add]","truncated":false,"comment":"The actual horizontal reconstruction is multiplied by the scale."},{"id":158,"line":60,"statement":"theorem yCoord_scaling (θ : ℝ → ℝ) {a : ℝ} (ha : 0 < a) (y₀ s : ℝ) :\n    yCoord (fun t => θ (t / a)) (a * y₀) (a * s) = a * yCoord θ y₀ s","proof":"by\n  unfold yCoord\n  rw [intervalIntegral.integral_comp_div (fun t => Real.sin (θ t)) ha.ne']\n  simp [ha.ne', smul_eq_mul, mul_add]","truncated":false,"comment":"The actual vertical reconstruction is multiplied by the scale."},{"id":159,"line":68,"statement":"theorem scaled_boundary_data {θ : ℝ → ℝ} {a ℓ x₀ y₀ x₁ y₁ α β : ℝ}\n    (ha : 0 < a) (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ)\n    (hx : xCoord θ x₀ ℓ = x₁) (hy : yCoord θ y₀ ℓ = y₁)\n    (hα : θ 0 = α) (hβ : θ ℓ = β) :\n    0 < a * ℓ ∧ ContDiff ℝ 1 (fun s => θ (s / a)) ∧\n      xCoord (fun s => θ (s / a)) (a * x₀) (a * ℓ) = a * x₁ ∧\n      yCoord (fun s => θ (s / a)) (a * y₀) (a * ℓ) = a * y₁ ∧\n      (fun s => θ (s / a)) 0 = α ∧\n      (fun s => θ (s / a)) (a * ℓ) = β","proof":"by\n  refine ⟨mul_pos ha hℓ, contDiff_angle_scaling hθ a, ?_, ?_, ?_, ?_⟩\n  · rw [xCoord_scaling θ ha, hx]\n  · rw [yCoord_scaling θ ha, hy]\n  · simpa only [zero_div] using hα\n  · simpa [ha.ne'] using hβ","truncated":false,"comment":"A C¹ curve with prescribed boundary data yields a C¹ curve for the scaled\nlength and positions, with exactly the same real endpoint-angle lifts."},{"id":160,"line":85,"statement":"theorem energy_scaling {ε θ : ℝ → ℝ} (hθ : Differentiable ℝ θ)\n    {a : ℝ} (ha : 0 < a) (ℓ : ℝ) :\n    energy ε (fun s => θ (s / a)) (a * ℓ) =\n      a * ∫ s in 0..ℓ, ε (deriv θ s / a)","proof":"by\n  unfold energy\n  simp_rw [deriv_angle_scaling hθ]\n  simpa [ha.ne', smul_eq_mul] using\n    (intervalIntegral.integral_comp_div (fun s => ε (deriv θ s / a))\n      (a := 0) (b := a * ℓ) ha.ne')","truncated":false,"comment":"General density transformation, obtained from the chain rule and change of\nvariables in the actual interval integral.  No homogeneity is assumed."},{"id":161,"line":97,"statement":"theorem energy_scaling_of_density_factor {ε θ : ℝ → ℝ}\n    (hθ : Differentiable ℝ θ) {a c : ℝ} (ha : 0 < a)\n    (hε : ∀ q, ε (q / a) = c * ε q) (ℓ : ℝ) :\n    energy ε (fun s => θ (s / a)) (a * ℓ) = (a * c) * energy ε θ ℓ","proof":"by\n  rw [energy_scaling hθ ha]\n  simp_rw [hε]\n  rw [intervalIntegral.integral_const_mul]\n  simp only [energy, mul_assoc]","truncated":false,"comment":"A density multiplier at the chosen scale induces the energy multiplier\n`a * c`.  The density hypothesis is separate from the general scaling identity."},{"id":162,"line":109,"statement":"theorem energy_scaling_of_homogeneous {ε θ : ℝ → ℝ}\n    (hθ : Differentiable ℝ θ) {a m : ℝ} (ha : 0 < a)\n    (hε : ∀ t : ℝ, 0 < t → ∀ q : ℝ, ε (t * q) = t ^ m * ε q) (ℓ : ℝ) :\n    energy ε (fun s => θ (s / a)) (a * ℓ) = a ^ (1 - m) * energy ε θ ℓ","proof":"by\n  have hf : ∀ q, ε (q / a) = (a⁻¹) ^ m * ε q := by\n    intro q\n    simpa only [div_eq_mul_inv, mul_comm q] using hε a⁻¹ (inv_pos.mpr ha) q\n  rw [energy_scaling_of_density_factor hθ ha hf ℓ]\n  rw [Real.inv_rpow ha.le m, Real.rpow_sub ha 1 m, Real.rpow_one]\n  rfl","truncated":false,"comment":"A density homogeneous of real degree `m` under positive scaling gives the\nenergy law `a^(1-m)`.  Homogeneity is an additional hypothesis, not a consequence\nof the general smooth-density definition."},{"id":163,"line":122,"statement":"theorem energy_scaling_quadratic {θ : ℝ → ℝ} (hθ : Differentiable ℝ θ)\n    {a : ℝ} (ha : 0 < a) (k ℓ : ℝ) :\n    energy (fun q => k * q ^ 2 / 2) (fun s => θ (s / a)) (a * ℓ) =\n      energy (fun q => k * q ^ 2 / 2) θ ℓ / a","proof":"by\n  have hf : ∀ q : ℝ, k * (q / a) ^ 2 / 2 = (a⁻¹) ^ 2 * (k * q ^ 2 / 2) := by\n    intro q\n    simp only [div_eq_mul_inv, mul_pow]\n    ring\n  rw [energy_scaling_of_density_factor hθ ha hf ℓ]\n  field_simp","truncated":false,"comment":"The classical quadratic curvature density has reciprocal energy scaling.\nThe identity holds for every coefficient `k`; positivity is not needed here."},{"id":164,"line":22,"statement":"theorem locallyMinimizing_scaling_of_density_factor {ε θ : ℝ → ℝ}\n    {a c ℓ : ℝ} (ha : 0 < a) (hc : 0 < c) (hθ : ContDiff ℝ 1 θ)\n    (hε : ∀ q, ε (q / a) = c * ε q)\n    (hmin : LocallyMinimizing ε θ ℓ) :\n    LocallyMinimizing ε (fun s => θ (s / a)) (a * ℓ)","proof":"by\n  obtain ⟨r, hr, hmin⟩ := hmin\n  let δ := r / (a + 1)\n  have hδ : 0 < δ := div_pos hr (by linarith)\n  have hδr : δ < r := (div_lt_iff₀ (by linarith : 0 < a + 1)).mpr (by nlinarith)\n  have haδr : a * δ < r := by\n    have he : δ * (a + 1) = r := div_mul_cancel₀ r (by linarith : a + 1 ≠ 0)\n    nlinarith\n  refine ⟨δ, hδ, ?_⟩\n  intro ψ hψ hψ0 hψℓ hx hy hclose\n  let φ : ℝ → ℝ := fun s => ψ (s / a⁻¹)\n  have hφ : ContDiff ℝ 1 φ := contDiff_angle_scaling hψ a⁻¹\n  have hround : (fun s => φ (s / a)) = ψ := by\n    funext s\n    simp [φ, ha.ne']\n  have hθdiff := hθ.differentiable one_ne_zero\n  have hφdiff := hφ.differentiable one_ne_zero\n  have hφ0 : φ 0 = θ 0 := by simpa [φ] using hψ0\n  have hφℓ : φ ℓ = θ ℓ := by\n    have hal : a * ℓ / a = ℓ := by field_simp\n    simp only [hal] at hψℓ\n    simpa [φ, div_inv_eq_mul, mul_comm] using hψℓ\n  have hφx : (∫ s in 0..ℓ, cos (φ s)) = (∫ s in 0..ℓ, cos (θ s)) := by\n    have heφ := xCoord_scaling φ ha 0 ℓ\n    have heθ := xCoord_scaling θ ha 0 ℓ\n    simp only [xCoord, mul_zero, zero_add] at heφ heθ\n    simp_rw [show ∀ s, φ (s / a) = ψ s from congrFun hround] at heφ\n    rw [heφ, heθ] at hx\n    exact (mul_left_cancel₀ ha.ne') hx\n  have hφy : (∫ s in 0..ℓ, sin (φ s)) = (∫ s in 0..ℓ, sin (θ s)) := by\n    have heφ := yCoord_scaling φ ha 0 ℓ\n    have heθ := yCoord_scaling θ ha 0 ℓ\n    simp only [yCoord, mul_zero, zero_add] at heφ heθ\n    simp_rw [show ∀ s, φ (s / a) = ψ s from congrFun hround] at heφ\n    rw [heφ, heθ] at hy\n    exact (mul_left_cancel₀ ha.ne') hy\n  have hφclose : ∀ s ∈ Icc 0 ℓ,\n      |φ s - θ s| < r ∧ |deriv φ s - deriv θ s| < r := by\n    intro s hs\n    have has : a * s ∈ Icc 0 (a * ℓ) :=\n      ⟨mul_nonneg ha.le hs.1, mul_le_mul_of_nonneg_left hs.2 ha.le⟩\n    obtain ⟨hval, hder⟩ := hclose (a * s) has\n    have hsa : a * s / a = s := by field_simp\n    simp only [hsa] at hval\n    constructor\n    · have hv : |φ s - θ s| < δ := by\n        simpa [φ, div_eq_mul_inv, mul_comm] using hval\n      exact hv.trans hδr\n    · rw [deriv_angle_scaling hθdiff, hsa] at hder\n      have hdφ : deriv φ s = a * deriv ψ (a * s) := by\n        rw [show φ = (fun s => ψ (s / a⁻¹)) from rfl,\n          deriv_angle_scaling (hψ.differentiable one_ne_zero)]\n        simp [div_eq_mul_inv, mul_comm]\n      have hd : deriv φ s - deriv θ s =\n          a * (deriv ψ (a * s) - deriv θ s / a) := by\n        rw [hdφ]\n        field_simp\n      rw [hd, abs_mul, abs_of_pos ha]\n      exact (mul_lt_mul_of_pos_left hder ha).trans haδr\n  have he := hmin φ hφ hφ0 hφℓ hφx hφy hφclose\n  have hscaled := mul_le_mul_of_nonneg_left he (mul_pos ha hc).le\n  rw [← energy_scaling_of_density_factor hθdiff ha hε ℓ,\n    ← energy_scaling_of_density_factor hφdiff ha hε ℓ, hround] at hscaled\n  exact hscaled","truncated":false,"comment":"A positive density multiplier transports a C¹ constrained local minimum.\nThe proof pulls every nearby scaled competitor back to the original interval.\nIf the original radius is `r`, the scaled radius `r / (a + 1)` suffices."},{"id":165,"line":93,"statement":"theorem locallyMinimizing_scaling_iff_of_density_factor {ε θ : ℝ → ℝ}\n    {a c ℓ : ℝ} (ha : 0 < a) (hc : 0 < c) (hθ : ContDiff ℝ 1 θ)\n    (hε : ∀ q, ε (q / a) = c * ε q) :\n    LocallyMinimizing ε (fun s => θ (s / a)) (a * ℓ) ↔\n      LocallyMinimizing ε θ ℓ","proof":"by\n  constructor\n  · intro hmin\n    have hi : ∀ q, ε (q / a⁻¹) = c⁻¹ * ε q := by\n      intro q\n      have he : ε q = c * ε (q / a⁻¹) := by\n        simpa [div_div, ha.ne'] using hε (q / a⁻¹)\n      calc\n        ε (q / a⁻¹) = c⁻¹ * (c * ε (q / a⁻¹)) := by simp [hc.ne']\n        _ = c⁻¹ * ε q := by rw [← he]\n    have hm := locallyMinimizing_scaling_of_density_factor\n      (inv_pos.mpr ha) (inv_pos.mpr hc) (contDiff_angle_scaling hθ a) hi hmin\n    simpa [div_eq_mul_inv, ha.ne', mul_assoc] using hm\n  · exact locallyMinimizing_scaling_of_density_factor ha hc hθ hε","truncated":false,"comment":"Positive similarity is reversible on the actual constrained C¹ local-minimum\nproperty, including its neighborhood and all endpoint constraints."},{"id":166,"line":115,"statement":"theorem locallyMinimizing_scaling_iff_of_homogeneous {ε θ : ℝ → ℝ}\n    {a m ℓ : ℝ} (ha : 0 < a) (hθ : ContDiff ℝ 1 θ)\n    (hε : ∀ t : ℝ, 0 < t → ∀ q : ℝ, ε (t * q) = t ^ m * ε q) :\n    LocallyMinimizing ε (fun s => θ (s / a)) (a * ℓ) ↔\n      LocallyMinimizing ε θ ℓ","proof":"by\n  apply locallyMinimizing_scaling_iff_of_density_factor ha\n    (Real.rpow_pos_of_pos (inv_pos.mpr ha) m) hθ\n  intro q\n  simpa only [div_eq_mul_inv, mul_comm q] using hε a⁻¹ (inv_pos.mpr ha) q","truncated":false,"comment":"Real-degree homogeneous densities transport local minima under every\npositive similarity. The degree may be arbitrary: the energy multiplier is\npositive even when the energy itself is not."},{"id":167,"line":127,"statement":"theorem locallyMinimizing_scaling_iff_quadratic {θ : ℝ → ℝ}\n    {a ℓ : ℝ} (ha : 0 < a) (hθ : ContDiff ℝ 1 θ) (k : ℝ) :\n    LocallyMinimizing (fun q => k * q ^ 2 / 2) (fun s => θ (s / a)) (a * ℓ) ↔\n      LocallyMinimizing (fun q => k * q ^ 2 / 2) θ ℓ","proof":"by\n  apply locallyMinimizing_scaling_iff_of_density_factor ha\n    (sq_pos_of_pos (inv_pos.mpr ha)) hθ\n  intro q\n  simp only [div_eq_mul_inv, mul_pow]\n  ring","truncated":false,"comment":"In particular the classical quadratic density has equivalent constrained\nlocal-minimum problems at positively scaled boundary data."},{"id":168,"line":139,"statement":"theorem exponentialWeight_scaling_of_density_factor {ε θ : ℝ → ℝ}\n    (hθ : Differentiable ℝ θ) {a c : ℝ} (ha : 0 < a)\n    (hε : ∀ q, ε (q / a) = c * ε q) (β ℓ : ℝ) :\n    exponentialWeight β ε (fun s => θ (s / a)) (a * ℓ) =\n      exponentialWeight (β * (a * c)) ε θ ℓ","proof":"by\n  unfold exponentialWeight\n  rw [energy_scaling_of_density_factor hθ ha hε ℓ]\n  congr 1\n  ring","truncated":false,"comment":"The scale factor in energy can be absorbed into the weight parameter.\nNo probabilistic interpretation of the exponential weight is required."},{"id":169,"line":151,"statement":"theorem exponentialWeight_scaling_rescaled_parameter {ε θ : ℝ → ℝ}\n    (hθ : Differentiable ℝ θ) {a c : ℝ} (ha : 0 < a) (hc : c ≠ 0)\n    (hε : ∀ q, ε (q / a) = c * ε q) (β ℓ : ℝ) :\n    exponentialWeight (β / (a * c)) ε (fun s => θ (s / a)) (a * ℓ) =\n      exponentialWeight β ε θ ℓ","proof":"by\n  rw [exponentialWeight_scaling_of_density_factor hθ ha hε]\n  rw [div_mul_cancel₀ _ (mul_ne_zero ha.ne' hc)]","truncated":false,"comment":"Changing the weight parameter by the reciprocal of the positive energy\nscale preserves the numerical weight of each curve."},{"id":170,"line":21,"statement":"theorem hasDerivAt_weighted_integral_variation {ε κ v w : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 1 ε) (hκ : Continuous κ)\n    (hv : Continuous v) (hw : Continuous w) (t₀ : ℝ) :\n    HasDerivAt (fun t : ℝ => ∫ s in 0..ℓ, ε (κ s + t * v s) * w s)\n      (∫ s in 0..ℓ, deriv ε (κ s + t₀ * v s) * v s * w s) t₀","proof":"by\n  have hεd : Differentiable ℝ ε := hε.differentiable one_ne_zero\n  have hε' : Continuous (deriv ε) := hε.continuous_deriv_one\n  have hc : Continuous\n      (fun p : ℝ × ℝ => deriv ε (κ p.2 + p.1 * v p.2) * v p.2 * w p.2) :=\n    ((hε'.comp ((hκ.comp continuous_snd).add\n      (continuous_fst.mul (hv.comp continuous_snd)))).mul\n      (hv.comp continuous_snd)).mul (hw.comp continuous_snd)\n  obtain ⟨C, hC⟩ :=\n    ((isCompact_Icc : IsCompact (Icc (t₀ - 1) (t₀ + 1))).prod\n      (isCompact_Icc : IsCompact (Icc (0 : ℝ) ℓ))).exists_bound_of_continuousOn hc.continuousOn\n  have hmeas (t : ℝ) : AEStronglyMeasurable\n      (fun s => ε (κ s + t * v s) * w s) (volume.restrict (Ioc 0 ℓ)) :=\n    ((hε.continuous.comp (hκ.add (continuous_const.mul hv))).mul hw).aestronglyMeasurable\n  have hint : Integrable (fun s => ε (κ s + t₀ * v s) * w s)\n      (volume.restrict (Ioc 0 ℓ)) :=\n    (((hε.continuous.comp (hκ.add (continuous_const.mul hv))).mul hw).intervalIntegrable 0 ℓ).1\n  have hmeas' : AEStronglyMeasurable\n      (fun s => deriv ε (κ s + t₀ * v s) * v s * w s)\n      (volume.restrict (Ioc 0 ℓ)) :=\n    (((hε'.comp (hκ.add (continuous_const.mul hv))).mul hv).mul hw).aestronglyMeasurable\n  have hbound : ∀ᵐ s ∂volume.restrict (Ioc 0 ℓ),\n      ∀ t ∈ Ioo (t₀ - 1) (t₀ + 1), ‖deriv ε (κ s + t * v s) * v s * w s‖ ≤ C := by\n    filter_upwards [ae_restrict_mem measurableSet_Ioc] with s hs\n    intro t ht\n    exact hC (t, s) ⟨⟨ht.1.le, ht.2.le⟩, ⟨hs.1.le, hs.2⟩⟩\n  have hdiff : ∀ᵐ s ∂volume.restrict (Ioc 0 ℓ), ∀ t ∈ Ioo (t₀ - 1) (t₀ + 1),\n      HasDerivAt (fun t => ε (κ s + t * v s) * w s)\n        (deriv ε (κ s + t * v s) * v s * w s) t := by\n    filter_upwards [] with s\n    intro t _\n    convert ((hεd (κ s + t * v s)).hasDerivAt.comp t\n      (((hasDerivAt_id t).mul_const (v s)).const_add (κ s))).mul_const (w s) using 1\n    all_goals first | rfl | ring\n  have h := hasDerivAt_integral_of_dominated_loc_of_deriv_le\n    (Ioo_mem_nhds (by linarith : t₀ - 1 < t₀) (by linarith : t₀ < t₀ + 1))\n    (Filter.Eventually.of_forall hmeas) hint hmeas' hbound\n    (integrable_const C) hdiff\n  simpa only [intervalIntegral.integral_of_le hℓ] using h.2","truncated":false,"comment":"A weighted form of differentiation under the curvature integral, valid at\nevery real parameter value. The weight does not depend on that parameter."},{"id":171,"line":66,"statement":"theorem hasDerivAt_energy_variation_at {ε θ η : ℝ → ℝ}
