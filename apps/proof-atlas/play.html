zero s).hasDerivAt.const_mul (c t))).deriv\n    change deriv (fun u => θ u+t*η.val u+a t*ξ₁.val u+b t*ξ₂.val u+c t*ξ₃.val u) s =\n      deriv θ s+t*deriv η.val s+a t*deriv ξ₁.val s+b t*deriv ξ₂.val s+c t*deriv ξ₃.val s at hds\n    dsimp only\n    rw [hds]\n    dsimp [B]\n    rw [LinearInputAreaParameters.parameterLinear_apply]\n    congr 2; ring\n  simp only [Function.comp_def] at hd\n  rw [he] at hd\n  simpa only [smul_apply, smul_eq_mul, B,\n    LinearInputAreaParameters.parameterLinear_apply, one_mul, zero_mul, add_zero] using hd","truncated":false,"comment":"The bending energy is differentiated along the actual corrected family.\nThe three correction coefficients have zero value and zero first derivative."},{"id":359,"line":25,"statement":"theorem contDiff_constraintParameters {θ η ξ₁ ξ₂ ξ₃ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : Continuous θ) (hη : Continuous η)\n    (hξ₁ : Continuous ξ₁) (hξ₂ : Continuous ξ₂) (hξ₃ : Continuous ξ₃) :\n    ContDiff ℝ 2 (constraintParameters θ η ξ₁ ξ₂ ξ₃ ℓ)","proof":"by\n  have hB := continuous_parameterLinear hη hξ₁ hξ₂ hξ₃\n  have hx := LinearInputAreaParameters.contDiff_two_integral_linear_parameters\n    hℓ Real.contDiff_cos hθ hB\n  have hy := LinearInputAreaParameters.contDiff_two_integral_linear_parameters\n    hℓ Real.contDiff_sin hθ hB\n  have ha := contDiff_areaParameters hℓ hθ hη hξ₁ hξ₂ hξ₃\n  exact hx.prodMk (hy.prodMk ((ha.sub (contDiff_const.mul hx)).add (contDiff_const.mul hy)))","truncated":false,"comment":""},{"id":360,"line":39,"statement":"theorem fderiv_constraintParameters_zero {θ η ξ₁ ξ₂ ξ₃ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : Continuous θ) (hη : Continuous η)\n    (hξ₁ : Continuous ξ₁) (hξ₂ : Continuous ξ₂) (hξ₃ : Continuous ξ₃)\n    (p : Parameters) :\n    fderiv ℝ (constraintParameters θ η ξ₁ ξ₂ ξ₃ ℓ) 0 p =\n      ((∫ s in 0..ℓ, -sin (θ s) * parameterLinear η ξ₁ ξ₂ ξ₃ s p),\n       ((∫ s in 0..ℓ, cos (θ s) * parameterLinear η ξ₁ ξ₂ ξ₃ s p),\n        (∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) *\n          parameterLinear η ξ₁ ξ₂ ξ₃ s p)))","proof":"by\n  let ζ : ℝ → ℝ := fun s => parameterLinear η ξ₁ ξ₂ ξ₃ s p\n  have hζ : Continuous ζ :=\n    (continuous_parameterLinear hη hξ₁ hξ₂ hξ₃).clm_apply continuous_const\n  have hx := hasDerivAt_horizontal_variation hℓ hθ hζ\n  have hy := hasDerivAt_vertical_variation hℓ hθ hζ\n  have ha := LinearInputAreaVariation.hasDerivAt_area_variation hθ hζ ℓ\n  have hadj : HasDerivAt\n      (fun t => LinearInputAreaVariation.area (angleVariation θ ζ t) ℓ -\n        yCoord θ 0 ℓ / 2 * (∫ s in 0..ℓ, cos (θ s + t * ζ s)) +\n        xCoord θ 0 ℓ / 2 * (∫ s in 0..ℓ, sin (θ s + t * ζ s)))\n      (∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * ζ s) 0 := by\n    convert (ha.sub (hx.const_mul (yCoord θ 0 ℓ / 2))).add\n      (hy.const_mul (xCoord θ 0 ℓ / 2)) using 1\n    simp only [neg_mul, intervalIntegral.integral_neg]\n    ring\n  have hd : HasDerivAt\n      (fun t : ℝ => constraintParameters θ η ξ₁ ξ₂ ξ₃ ℓ (t • p))\n      ((∫ s in 0..ℓ, -sin (θ s) * ζ s),\n        ((∫ s in 0..ℓ, cos (θ s) * ζ s),\n          (∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * ζ s))) 0 := by\n    convert hx.prodMk (hy.prodMk hadj) using 1\n    simp only [constraintParameters, areaParameters, map_smul, smul_eq_mul, ζ]\n    rfl\n  have hf := (contDiff_constraintParameters hℓ hθ hη hξ₁ hξ₂ hξ₃).differentiable\n    (by norm_num)\n  have hfd : HasDerivAt\n      (fun t : ℝ => constraintParameters θ η ξ₁ ξ₂ ξ₃ ℓ (t • p))\n      (fderiv ℝ (constraintParameters θ η ξ₁ ξ₂ ξ₃ ℓ) 0 p) 0 := by\n    have hfp : HasFDerivAt (constraintParameters θ η ξ₁ ξ₂ ξ₃ ℓ)\n        (fderiv ℝ (constraintParameters θ η ξ₁ ξ₂ ξ₃ ℓ) 0) ((0 : ℝ) • p) := by\n      simpa only [zero_smul] using (hf (0 : Parameters)).hasFDerivAt\n    have hp : HasDerivAt (fun t : ℝ => t • p) p 0 := by\n      simpa only [id_eq, one_smul] using (hasDerivAt_id (0 : ℝ)).smul_const p\n    exact hfp.comp_hasDerivAt 0 hp\n  exact hfd.unique hd","truncated":false,"comment":"The differential is calculated from actual parameter derivatives of the\nendpoint integrals and signed area, including the area boundary term."},{"id":361,"line":84,"statement":"theorem integral_parameterLinear {η ξ₁ ξ₂ ξ₃ w : ℝ → ℝ} {ℓ : ℝ}\n    (hη : Continuous η) (hξ₁ : Continuous ξ₁) (hξ₂ : Continuous ξ₂)\n    (hξ₃ : Continuous ξ₃) (hw : Continuous w) (p : Parameters) :\n    (∫ s in 0..ℓ, w s * parameterLinear η ξ₁ ξ₂ ξ₃ s p) =\n      p.1 * (∫ s in 0..ℓ, w s * η s) +\n      p.2.1 * (∫ s in 0..ℓ, w s * ξ₁ s) +\n      p.2.2.1 * (∫ s in 0..ℓ, w s * ξ₂ s) +\n      p.2.2.2 * (∫ s in 0..ℓ, w s * ξ₃ s)","proof":"by\n  have hiη : IntervalIntegrable (fun s => p.1 * (w s * η s)) volume 0 ℓ :=\n    (continuous_const.mul (hw.mul hη)).intervalIntegrable _ _\n  have hi₁ : IntervalIntegrable (fun s => p.2.1 * (w s * ξ₁ s)) volume 0 ℓ :=\n    (continuous_const.mul (hw.mul hξ₁)).intervalIntegrable _ _\n  have hi₂ : IntervalIntegrable (fun s => p.2.2.1 * (w s * ξ₂ s)) volume 0 ℓ :=\n    (continuous_const.mul (hw.mul hξ₂)).intervalIntegrable _ _\n  have hi₃ : IntervalIntegrable (fun s => p.2.2.2 * (w s * ξ₃ s)) volume 0 ℓ :=\n    (continuous_const.mul (hw.mul hξ₃)).intervalIntegrable _ _\n  calc\n    _ = ∫ s in 0..ℓ, p.1 * (w s * η s) + p.2.1 * (w s * ξ₁ s) +\n        p.2.2.1 * (w s * ξ₂ s) + p.2.2.2 * (w s * ξ₃ s) := by\n      apply intervalIntegral.integral_congr\n      intro s _\n      dsimp only\n      rw [parameterLinear_apply]\n      ring\n    _ = _ := by\n      rw [intervalIntegral.integral_add ((hiη.add hi₁).add hi₂) hi₃,\n        intervalIntegral.integral_add (hiη.add hi₁) hi₂,\n        intervalIntegral.integral_add hiη hi₁]\n      simp only [intervalIntegral.integral_const_mul]","truncated":false,"comment":""},{"id":362,"line":115,"statement":"theorem exists_implicit_correction {f : Parameters → ℝ × (ℝ × ℝ)}\n    (hf : ContDiff ℝ 2 f)\n    (ht : (fderiv ℝ f 0).comp (ContinuousLinearMap.inl ℝ ℝ (ℝ × (ℝ × ℝ))) = 0)\n    (hc : (fderiv ℝ f 0).comp (ContinuousLinearMap.inr ℝ ℝ (ℝ × (ℝ × ℝ))) =\n      ContinuousLinearMap.id ℝ (ℝ × (ℝ × ℝ))) :\n    ∃ g : ℝ → ℝ × (ℝ × ℝ), ContDiffAt ℝ 2 g 0 ∧ g 0 = 0 ∧ HasDerivAt g 0 0 ∧\n      ∀ᶠ t in 𝓝 0, f (t, g t) = f 0","proof":"by\n  have hi : ((fderiv ℝ f 0).comp\n      (ContinuousLinearMap.inr ℝ ℝ (ℝ × (ℝ × ℝ)))).IsInvertible := by\n    rw [hc]\n    exact ⟨ContinuousLinearEquiv.refl ℝ (ℝ × (ℝ × ℝ)), rfl⟩\n  let h := hf.contDiffAt (x := (0 : Parameters))\n  let g := h.implicitFunction (by norm_num) hi\n  refine ⟨g, h.contDiffAt_implicitFunction (by norm_num) hi,\n    h.implicitFunction_apply_self (by norm_num) hi, ?_,\n    h.eventually_apply_implicitFunction (by norm_num) hi⟩\n  have hd := h.hasStrictFDerivAt_implicitFunction (by norm_num) hi\n  rw [ht] at hd\n  simpa using hd.hasFDerivAt.hasDerivAt","truncated":false,"comment":"The actual finite-dimensional IFT for three correction coordinates."},{"id":363,"line":138,"statement":"theorem exists_exact_area_variation {θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hnonconst : ¬ ∃ K : ℝ, ∀ s ∈ Ioo 0 ℓ, deriv θ s = K)\n    (η : variationSpace ℓ)\n    (hηx : (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0)\n    (hηy : (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0)\n    (hηa : (∫ s in 0..ℓ,\n      (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * η.val s) = 0) :\n    ∃ ξ₁ ξ₂ ξ₃ : variationSpace ℓ, ∃ a b c : ℝ → ℝ,\n      ContDiffAt ℝ 2 a 0 ∧ ContDiffAt ℝ 2 b 0 ∧ ContDiffAt ℝ 2 c 0 ∧\n      a 0 = 0 ∧ b 0 = 0 ∧ c 0 = 0 ∧\n      HasDerivAt a 0 0 ∧ HasDerivAt b 0 0 ∧ HasDerivAt c 0 0 ∧\n      ∀ᶠ t in 𝓝 0,\n        (∫ s in 0..ℓ, cos\n          (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s)) =\n          (∫ s in 0..ℓ, cos (θ s)) ∧\n        (∫ s in 0..ℓ, sin\n          (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s)) =\n          (∫ s in 0..ℓ, sin (θ s)) ∧\n        LinearInputAreaVariation.area\n          (fun s => θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s) ℓ =\n            LinearInputAreaVariation.area θ ℓ","proof":"by\n  obtain ⟨ξ₁, ξ₂, ξ₃, ⟨hx₁, hy₁, ha₁⟩, ⟨hx₂, hy₂, ha₂⟩, ⟨hx₃, hy₃, ha₃⟩⟩ :=\n    LinearInputAreaRegularity.exists_normalized_constraint_directions hℓ hθ hnonconst\n  let f := constraintParameters θ η.val ξ₁.val ξ₂.val ξ₃.val ℓ\n  have hf : ContDiff ℝ 2 f := contDiff_constraintParameters hℓ.le hθ.continuous\n    η.property.1.continuous ξ₁.property.1.continuous ξ₂.property.1.continuous ξ₃.property.1.continuous\n  have hd (p : Parameters) := fderiv_constraintParameters_zero hℓ.le hθ.continuous\n    η.property.1.continuous ξ₁.property.1.continuous ξ₂.property.1.continuous ξ₃.property.1.continuous p\n  have hi (w : ℝ → ℝ) (hw : Continuous w) (p : Parameters) :=\n    integral_parameterLinear (ℓ := ℓ) η.property.1.continuous ξ₁.property.1.continuous\n      ξ₂.property.1.continuous ξ₃.property.1.continuous hw p\n  have ht : (fderiv ℝ f 0).comp\n      (ContinuousLinearMap.inl ℝ ℝ (ℝ × (ℝ × ℝ))) = 0 := by\n    apply ContinuousLinearMap.ext\n    intro t\n    change fderiv ℝ f 0 (t, (0, (0, 0))) = (0, (0, 0))\n    rw [hd]\n    rw [hi (fun s => -sin (θ s)) (by fun_prop), hi _ hθ.cos.continuous,\n      hi _ (LinearInputAreaVariation.continuous_moment hθ.continuous)]\n    simp only [hηx, hηy, hηa, mul_zero, zero_mul, add_zero]\n  have hc : (fderiv ℝ f 0).comp\n      (ContinuousLinearMap.inr ℝ ℝ (ℝ × (ℝ × ℝ))) =\n      ContinuousLinearMap.id ℝ (ℝ × (ℝ × ℝ)) := by\n    apply ContinuousLinearMap.ext\n    intro p\n    change fderiv ℝ f 0 (0, p) = p\n    rw [hd]\n    rw [hi (fun s => -sin (θ s)) (by fun_prop), hi _ hθ.cos.continuous,\n      hi _ (LinearInputAreaVariation.continuous_moment hθ.continuous)]\n    rw [hx₁, hy₁, ha₁, hx₂, hy₂, ha₂, hx₃, hy₃, ha₃]\n    simp\n  obtain ⟨g, hg, hg₀, hgd, hge⟩ := exists_implicit_correction hf ht hc\n  refine ⟨ξ₁, ξ₂, ξ₃, (fun t => (g t).1), (fun t => (g t).2.1),\n    (fun t => (g t).2.2), hg.fst, hg.snd.fst, hg.snd.snd,\n    congrArg Prod.fst hg₀, congrArg (fun q => q.2.1) hg₀,\n    congrArg (fun q => q.2.2) hg₀, hgd.fst, hgd.snd.fst, hgd.snd.snd, ?_⟩\n  filter_upwards [hge] with t ht\n  simp only [add_assoc]\n  have hx := congrArg Prod.fst ht\n  have hy := congrArg (fun q => q.2.1) ht\n  have ha := congrArg (fun q => q.2.2) ht\n  simp [f, constraintParameters, areaParameters, parameterLinear_apply, add_assoc] at hx hy ha\n  refine ⟨hx, hy, ?_⟩\n  rw [hx, hy] at ha\n  linarith","truncated":false,"comment":"Every first-order feasible direction at a nonconstant-curvature curve is\nrealized by an actual C²-parameter family preserving both endpoint coordinates\nand signed area exactly.  All three correction derivatives vanish at zero."},{"id":364,"line":29,"statement":"theorem locallyMinimizing_isLocalMin_corrected_family {θ : ℝ → ℝ} {k ℓ : ℝ}\n    (hθ : ContDiff ℝ 1 θ) (hmin : LocallyMinimizing k θ ℓ)\n    (η ξ₁ ξ₂ ξ₃ : variationSpace ℓ) {a b c : ℝ → ℝ}\n    (ha : ContinuousAt a 0) (hb : ContinuousAt b 0) (hc : ContinuousAt c 0)\n    (ha0 : a 0 = 0) (hb0 : b 0 = 0) (hc0 : c 0 = 0)\n    (hexact : ∀ᶠ t in 𝓝 (0 : ℝ),\n      (∫ s in 0..ℓ, cos\n        (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s)) =\n        (∫ s in 0..ℓ, cos (θ s)) ∧\n      (∫ s in 0..ℓ, sin\n        (θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s)) =\n        (∫ s in 0..ℓ, sin (θ s)) ∧\n      LinearInputAreaVariation.area\n        (fun s => θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s) ℓ =\n          LinearInputAreaVariation.area θ ℓ) :\n    IsLocalMin (fun t => energy (fun q => k * q ^ 2 / 2)\n      (fun s => θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s) ℓ) 0","proof":"by\n  obtain ⟨r, hr, hminimal⟩ := hmin\n  have hclose := LinearInputAreaFamily.corrected_family_C1_close hθ η ξ₁ ξ₂ ξ₃\n    ha hb hc ha0 hb0 hc0 hr\n  change ∀ᶠ t in 𝓝 (0 : ℝ),\n    energy (fun q => k * q ^ 2 / 2)\n      (fun s => θ s + 0 * η.val s + a 0 * ξ₁.val s + b 0 * ξ₂.val s + c 0 * ξ₃.val s) ℓ ≤ _\n  simp only [ha0, hb0, hc0, zero_mul, add_zero]\n  filter_upwards [hclose, hexact] with t ht hx\n  apply hminimal\n    (fun s => θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s)\n  · exact (((hθ.add (contDiff_const.mul η.property.1)).add\n      (contDiff_const.mul ξ₁.property.1)).add\n        (contDiff_const.mul ξ₂.property.1)).add (contDiff_const.mul ξ₃.property.1)\n  · simp only [η.property.2.1, ξ₁.property.2.1, ξ₂.property.2.1, ξ₃.property.2.1,\n      mul_zero, add_zero]\n  · simp only [η.property.2.2, ξ₁.property.2.2, ξ₂.property.2.2, ξ₃.property.2.2,\n      mul_zero, add_zero]\n  · exact hx.1\n  · exact hx.2.1\n  · exact hx.2.2\n  · exact ht","truncated":false,"comment":"An exact family induces a scalar local minimum from the actual C¹\ncomparison hypothesis.  Local minimality of the scalar path is not assumed."},{"id":365,"line":71,"statement":"theorem locallyMinimizing_areaStationary {θ : ℝ → ℝ} {k ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ) (hmin : LocallyMinimizing k θ ℓ) :\n    LinearInputPressureStationary.AreaStationary k θ ℓ","proof":"by\n  by_cases hconst : ∃ K : ℝ, ∀ s ∈ Ioo 0 ℓ, deriv θ s = K\n  · obtain ⟨K, hK⟩ := hconst\n    exact LinearInputAreaRegularity.areaStationary_of_constant_curvature hℓ hθ hK\n  · intro η hx hy ha\n    have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n    have hx' := (hasDerivAt_horizontal_variation hℓ.le hθ.continuous\n      η.property.1.continuous).deriv.symm.trans hx\n    have hy' := (hasDerivAt_vertical_variation hℓ.le hθ.continuous\n      η.property.1.continuous).deriv.symm.trans hy\n    have ha' := (LinearInputAreaVariation.hasDerivAt_area_variation_feasible\n      hℓ.le hθ.continuous η.property.1.continuous hx' hy').deriv.symm.trans ha\n    obtain ⟨ξ₁, ξ₂, ξ₃, a, b, c, hca, hcb, hcc, ha0, hb0, hc0, hda, hdb, hdc, hexact⟩ :=\n      LinearInputAreaExactVariation.exists_exact_area_variation hℓ hθ hconst η hx' hy' ha'\n    have hm := locallyMinimizing_isLocalMin_corrected_family hθ1 hmin η ξ₁ ξ₂ ξ₃\n      hca.continuousAt hcb.continuousAt hcc.continuousAt ha0 hb0 hc0 hexact\n    have hd := LinearInputAreaFamily.hasDerivAt_corrected_energy_feasible (k := k) hℓ.le hθ1\n      η ξ₁ ξ₂ ξ₃ hda hdb hdc ha0 hb0 hc0\n    have hz := hd.deriv.symm.trans hm.deriv_eq_zero\n    have he := (hasDerivAt_energy_variation hℓ.le\n      (show ContDiff ℝ 1 (fun q : ℝ => k * q ^ 2 / 2) by fun_prop)\n        hθ1 η.property.1).deriv\n    have hquad (q : ℝ) : deriv (fun q : ℝ => k * q ^ 2 / 2) q = k * q :=\n      (quadratic_density_hasDerivAt k q).deriv\n    simp_rw [hquad] at he\n    exact he.trans hz","truncated":false,"comment":"A true C¹ local minimum with exact signed area has actual linearized\narea-constrained stationarity.  Constant-curvature curves are treated directly;\nall other curves use a proved three-constraint implicit-function correction."},{"id":366,"line":102,"statement":"theorem locallyMinimizing_existsUnique_pressure {θ : ℝ → ℝ} {k ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hnonconst : ¬ ∃ K : ℝ, ∀ s ∈ Ioo 0 ℓ, deriv θ s = K)\n    (hmin : LocallyMinimizing k θ ℓ) :\n    ∃! p : ℝ, LinearInputPressureStationary.Stationary k p θ ℓ","proof":"by\n  obtain ⟨p, hp⟩ := LinearInputPressureStationary.areaStationary_exists_pressure\n    hℓ.le (hθ.of_le (by norm_num)) (locallyMinimizing_areaStationary hℓ hθ hmin)\n  refine ⟨p, hp, fun q hq => ?_⟩\n  exact LinearInputAreaRegularity.pressure_coefficient_unique hℓ hθ hnonconst hq hp","truncated":false,"comment":"On a fixed nonconstant-curvature minimizer the pressure multiplier is\nunique.  Its nonzero value is not asserted."},{"id":367,"line":114,"statement":"theorem locallyMinimizing_curvature {θ : ℝ → ℝ} {k ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ) (hmin : LocallyMinimizing k θ ℓ) :\n    ∃ p σ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      k * deriv (deriv (deriv θ)) s + k * (deriv θ s) ^ 3 / 2 -\n        σ * deriv θ s = p","proof":"by\n  obtain ⟨p, hp⟩ := LinearInputPressureStationary.areaStationary_exists_pressure\n    hℓ.le (hθ.of_le (by norm_num)) (locallyMinimizing_areaStationary hℓ hθ hmin)\n  obtain ⟨σ, hσ⟩ := LinearInputPressureStationary.stationary_curvature hℓ hθ hp\n  exact ⟨p, σ, hσ⟩","truncated":false,"comment":"The pressure forcing is a conclusion of exact-area constrained local\nminimality, with its coefficient supplied by the multiplier theorem."},{"id":368,"line":127,"statement":"theorem locallyMinimizing_phase_energy {θ : ℝ → ℝ} {k ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hk : 0 < k) (hθ : ContDiff ℝ 3 θ)\n    (hmin : LocallyMinimizing k θ ℓ) :\n    ∃ p σ c : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      LinearInputDesign.E (1 / 2) (-σ / k) (p / k) (deriv θ s)\n        (deriv (deriv θ) s + sqrt 2 * deriv θ s) = c ∧\n      HasDerivAt (deriv θ)\n        (LinearInputGradient.gy (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s ∧\n      HasDerivAt (fun t => deriv (deriv θ) t + sqrt 2 * deriv θ t)\n        (-LinearInputGradient.gx (1 / 2) (-σ / k) (p / k) (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s","proof":"by\n  exact LinearInputPressureStationary.areaStationary_phase_energy hℓ hk hθ\n    (locallyMinimizing_areaStationary hℓ hθ hmin)","truncated":false,"comment":"The complete connection begins with a genuine exact-area constrained\nlocal minimum, and concludes with the actual forced arclength phase curve and\nits conserved quartic energy.  No stationarity or pressure is supplied."},{"id":369,"line":18,"statement":"theorem error_eq_initial_mul_exp_integral {e g : ℝ → ℝ} {gamma : ℝ}\n    (hg : ContinuousOn g (Ici (0 : ℝ)))\n    (hd : ∀ t ∈ Ici (0 : ℝ), HasDerivAt e (-gamma * e t * g t) t)\n    {t : ℝ} (ht : 0 ≤ t) :\n    e t = e 0 * Real.exp (-gamma * (∫ s in 0..t, g s))","proof":"by\n  let q : ℝ → ℝ := fun s => g (max s 0)\n  have hq : Continuous q := hg.comp_continuous\n    (continuous_id.max continuous_const) (fun s => le_max_right s 0)\n  have hqe (s : ℝ) (hs : 0 ≤ s) : q s = g s := by\n    simp only [q, max_eq_left hs]\n  let G : ℝ → ℝ := fun s => ∫ v in 0..s, q v\n  have hG (s : ℝ) : HasDerivAt G (q s) s :=\n    (hq.integral_hasStrictDerivAt 0 s).hasDerivAt\n  let w : ℝ → ℝ := fun s => e s * Real.exp (gamma * G s)\n  have hw (s : ℝ) (hs : s ∈ Ici (0 : ℝ)) : HasDerivAt w 0 s := by\n    convert (hd s hs).mul ((hG s).const_mul gamma).exp using 1\n    rw [hqe s hs]\n    ring\n  have hc : ContinuousOn w (Ici (0 : ℝ)) :=\n    fun s hs => (hw s hs).continuousAt.continuousWithinAt\n  have hanti : AntitoneOn w (Ici (0 : ℝ)) :=\n    antitoneOn_of_hasDerivWithinAt_nonpos (convex_Ici (0 : ℝ)) hc\n      (fun s hs => (hw s (interior_subset hs)).hasDerivWithinAt)\n      (fun _ _ => le_refl 0)\n  have hmono : MonotoneOn w (Ici (0 : ℝ)) :=\n    monotoneOn_of_hasDerivWithinAt_nonneg (convex_Ici (0 : ℝ)) hc\n      (fun s hs => (hw s (interior_subset hs)).hasDerivWithinAt)\n      (fun _ _ => le_refl 0)\n  have hconst : w t = w 0 := le_antisymm\n    (hanti (show (0 : ℝ) ∈ Ici 0 by simp) ht ht)\n    (hmono (show (0 : ℝ) ∈ Ici 0 by simp) ht ht)\n  have hvalue : e t * Real.exp (gamma * G t) = e 0 := by\n    simpa only [w, G, intervalIntegral.integral_same, mul_zero, Real.exp_zero, mul_one] using hconst\n  have hGt : G t = ∫ s in 0..t, g s := by\n    apply intervalIntegral.integral_congr\n    intro s hs\n    rw [uIcc_of_le ht] at hs\n    exact hqe s hs.1\n  have he : e t = e 0 / Real.exp (gamma * G t) :=\n    (eq_div_iff (Real.exp_ne_zero _)).2 hvalue\n  rw [he, hGt]\n  simp only [div_eq_mul_inv, ← Real.exp_neg, neg_mul]","truncated":false,"comment":"The exact integrating-factor formula only needs continuity of the actual\ncoefficient on nonnegative time.  No positivity of the damping is assumed."},{"id":370,"line":62,"statement":"theorem error_pos {e g : ℝ → ℝ} {gamma : ℝ}\n    (hg : ContinuousOn g (Ici (0 : ℝ)))\n    (hd : ∀ t ∈ Ici (0 : ℝ), HasDerivAt e (-gamma * e t * g t) t)\n    (he0 : 0 < e 0) {t : ℝ} (ht : 0 ≤ t) : 0 < e t","proof":"by\n  rw [error_eq_initial_mul_exp_integral hg hd ht]\n  exact mul_pos he0 (Real.exp_pos _)","truncated":false,"comment":"A positive initial scalar gap cannot become zero at a finite time."},{"id":371,"line":71,"statement":"theorem continuousOn_gradient_coefficient {lam r u gamma target : ℝ}\n    {x y b : ℝ → ℝ} (htraj : IsTrajectory lam r u gamma target x y b) :\n    ContinuousOn (fun t => gSq lam r u (x t) (y t)) (Ici (0 : ℝ))","proof":"by\n  intro t ht\n  have hx : ContinuousAt x t := (htraj t ht).1.continuousAt\n  have hy : ContinuousAt y t := (htraj t ht).2.continuousAt\n  have hxy : ContinuousAt (fun s => (x s, y s)) t := hx.prodMk hy\n  exact ((continuous_gSq lam r u).continuousAt.comp hxy).continuousWithinAt","truncated":false,"comment":"The coefficient in the energy law is continuous along the actual curve;\nno continuity of b is needed once both actual coordinate derivatives exist."},{"id":372,"line":82,"statement":"theorem energy_gap_exact {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    {t : ℝ} (ht : 0 ≤ t) :\n    E lam r u (x t) (y t) - target =\n      (E lam r u (x 0) (y 0) - target) *\n        Real.exp (-gamma * (∫ s in 0..t, gSq lam r u (x s) (y s)))","proof":"by\n  exact error_eq_initial_mul_exp_integral (continuousOn_gradient_coefficient htraj)\n    (fun s hs => hasDerivAt_gap_of_trajectory htraj hs) ht","truncated":false,"comment":"Exact gap evolution along a supplied trajectory, with its actual gradient\ncoefficient inside the integral."},{"id":373,"line":93,"statement":"theorem energy_eq_target_iff {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    {t : ℝ} (ht : 0 ≤ t) :\n    E lam r u (x t) (y t) = target ↔ E lam r u (x 0) (y 0) = target","proof":"by\n  rw [← sub_eq_zero, energy_gap_exact htraj ht, mul_eq_zero]\n  simp only [Real.exp_ne_zero, or_false, sub_eq_zero]","truncated":false,"comment":"Reaching the target at a finite time is equivalent to starting there.\nThus the strict-gap hypothesis in the no-return results is substantive."},{"id":374,"line":102,"statement":"theorem energy_strictly_above_target {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target < E lam r u (x 0) (y 0))\n    {t : ℝ} (ht : 0 ≤ t) : target < E lam r u (x t) (y t)","proof":"by\n  have hpos := error_pos (continuousOn_gradient_coefficient htraj)\n    (fun s hs => hasDerivAt_gap_of_trajectory htraj hs) (sub_pos.mpr hinit) ht\n  exact sub_pos.mp hpos","truncated":false,"comment":"Strict separation from the target is preserved at every finite time.\nUnlike strict decay, this conclusion needs no sign assumption on gamma."},{"id":375,"line":112,"statement":"theorem energy_deriv_neg {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target < E lam r u (x 0) (y 0))\n    {t : ℝ} (ht : 0 ≤ t) :\n    deriv (fun s => E lam r u (x s) (y s)) t < 0","proof":"by\n  have he := energy_strictly_above_target htraj hinit ht\n  have hg := gSq_pos_on_band hlam htarget he.le\n  have hd := hasDerivAt_energy_fixed_input lam r u gamma target (b t)\n    (htraj t ht).1 (htraj t ht).2\n  rw [hd.deriv]\n  have hpos := mul_pos (mul_pos hgamma (sub_pos.mpr he)) hg\n  nlinarith","truncated":false,"comment":"Above all critical values the actual energy derivative is strictly\nnegative along a trajectory starting strictly above its target."},{"id":376,"line":128,"statement":"theorem energy_strictAntiOn {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target < E lam r u (x 0) (y 0)) :\n    StrictAntiOn (fun t => E lam r u (x t) (y t)) (Ici (0 : ℝ))","proof":"by\n  apply strictAntiOn_of_deriv_neg (convex_Ici (0 : ℝ))\n  · intro t ht\n    exact (hasDerivAt_energy_fixed_input lam r u gamma target (b t)\n      (htraj t ht).1 (htraj t ht).2).continuousAt.continuousWithinAt\n  · intro t ht\n    exact energy_deriv_neg hlam hgamma htarget htraj hinit (interior_subset ht)","truncated":false,"comment":"The actual energy is strictly antitone on the entire nonnegative time axis."},{"id":377,"line":142,"statement":"theorem trajectory_injOn {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target < E lam r u (x 0) (y 0)) :\n    InjOn (fun t => (x t, y t)) (Ici (0 : ℝ))","proof":"by\n  intro s hs t ht heq\n  have hxs : x s = x t := congrArg Prod.fst heq\n  have hys : y s = y t := congrArg Prod.snd heq\n  have hE : E lam r u (x s) (y s) = E lam r u (x t) (y t) := by rw [hxs, hys]\n  exact (energy_strictAntiOn hlam hgamma htarget htraj hinit).injOn hs ht hE","truncated":false,"comment":"No two distinct nonnegative times visit the same spatial state."},{"id":378,"line":155,"statement":"theorem trajectory_no_return {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target < E lam r u (x 0) (y 0))\n    {s T : ℝ} (hs : 0 ≤ s) (hT : 0 < T) :\n    (x (s + T), y (s + T)) ≠ (x s, y s)","proof":"by\n  intro heq\n  have h := trajectory_injOn hlam hgamma htarget htraj hinit\n    (add_nonneg hs hT.le) hs heq\n  linarith","truncated":false,"comment":"In particular, no spatial return occurs after a strictly positive time."},{"id":379,"line":168,"statement":"theorem trajectory_not_periodic {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target < E lam r u (x 0) (y 0))\n    {T : ℝ} (hT : 0 < T) :\n    ¬ Function.Periodic (fun t => (x t, y t)) T","proof":"by\n  intro hp\n  exact trajectory_no_return hlam hgamma htarget htraj hinit (le_refl 0) hT (hp 0)","truncated":false,"comment":"A positive finite period is impossible under the same strict initial gap."},{"id":380,"line":180,"statement":"theorem error_eq_initial_mul_exp_integral_on_Icc {e g : ℝ → ℝ} {gamma T : ℝ}\n    (hg : ContinuousOn g (Icc (0 : ℝ) T)) (hT : 0 ≤ T)\n    (hd : ∀ s ∈ Icc (0 : ℝ) T, HasDerivAt e (-gamma * e s * g s) s)\n    {t : ℝ} (ht : t ∈ Icc (0 : ℝ) T) :\n    e t = e 0 * Real.exp (-gamma * (∫ s in 0..t, g s))","proof":"by\n  let q : ℝ → ℝ := fun s => g (max 0 (min s T))\n  have hq : Continuous q := hg.comp_continuous\n    (continuous_const.max (continuous_id.min continuous_const))\n    (fun s => ⟨le_max_left 0 (min s T), max_le hT (min_le_right s T)⟩)\n  have hqe (s : ℝ) (hs : s ∈ Icc (0 : ℝ) T) : q s = g s := by\n    simp only [q, min_eq_left hs.2, max_eq_right hs.1]\n  let G : ℝ → ℝ := fun s => ∫ v in 0..s, q v\n  have hG (s : ℝ) : HasDerivAt G (q s) s :=\n    (hq.integral_hasStrictDerivAt 0 s).hasDerivAt\n  let w : ℝ → ℝ := fun s => e s * Real.exp (gamma * G s)\n  have hw (s : ℝ) (hs : s ∈ Icc (0 : ℝ) T) : HasDerivAt w 0 s := by\n    convert (hd s hs).mul ((hG s).const_mul gamma).exp using 1\n    rw [hqe s hs]\n    ring\n  have hc : ContinuousOn w (Icc (0 : ℝ) T) :=\n    fun s hs => (hw s hs).continuousAt.continuousWithinAt\n  have hanti : AntitoneOn w (Icc (0 : ℝ) T) :=\n    antitoneOn_of_hasDerivWithinAt_nonpos (convex_Icc (0 : ℝ) T) hc\n      (fun s hs => (hw s (interior_subset hs)).hasDerivWithinAt)\n      (fun _ _ => le_refl 0)\n  have hmono : MonotoneOn w (Icc (0 : ℝ) T) :=\n    monotoneOn_of_hasDerivWithinAt_nonneg (convex_Icc (0 : ℝ) T) hc\n      (fun s hs => (hw s (interior_subset hs)).hasDerivWithinAt)\n      (fun _ _ => le_refl 0)\n  have hzero : (0 : ℝ) ∈ Icc 0 T := ⟨le_refl 0, hT⟩\n  have hconst : w t = w 0 :=\n    le_antisymm (hanti hzero ht ht.1) (hmono hzero ht ht.1)\n  have hvalue : e t * Real.exp (gamma * G t) = e 0 := by\n    simpa only [w, G, intervalIntegral.integral_same, mul_zero, Real.exp_zero, mul_one] using hconst\n  have hGt : G t = ∫ s in 0..t, g s := by\n    apply intervalIntegral.integral_congr\n    intro s hs\n    rw [uIcc_of_le ht.1] at hs\n    exact hqe s ⟨hs.1, hs.2.trans ht.2⟩\n  have he : e t = e 0 / Real.exp (gamma * G t) :=\n    (eq_div_iff (Real.exp_ne_zero _)).2 hvalue\n  rw [he, hGt]\n  simp only [div_eq_mul_inv, ← Real.exp_neg, neg_mul]","truncated":false,"comment":"A local version of the exact scalar formula uses only data on a finite\nclosed interval.  It is suitable for an actually constructed local solution."},{"id":381,"line":226,"statement":"theorem energy_gap_exact_on_Icc {lam r u gamma target T : ℝ} {x y b : ℝ → ℝ}\n    (hT : 0 ≤ T)\n    (hode : ∀ s ∈ Icc (0 : ℝ) T,\n      HasDerivAt x\n        (-gamma * (E lam r u (x s) (y s) - target) * gx lam r u (x s) (y s)\n          - b s * gy (x s) (y s)) s ∧\n      HasDerivAt y\n        (-gamma * (E lam r u (x s) (y s) - target) * gy (x s) (y s)\n          + b s * gx lam r u (x s) (y s)) s)\n    {t : ℝ} (ht : t ∈ Icc (0 : ℝ) T) :\n    E lam r u (x t) (y t) - target =\n      (E lam r u (x 0) (y 0) - target) *\n        Real.exp (-gamma * (∫ s in 0..t, gSq lam r u (x s) (y s)))","proof":"by\n  have hg : ContinuousOn (fun s => gSq lam r u (x s) (y s)) (Icc (0 : ℝ) T) := by\n    intro s hs\n    have hxy : ContinuousAt (fun v => (x v, y v)) s :=\n      (hode s hs).1.continuousAt.prodMk (hode s hs).2.continuousAt\n    exact ((continuous_gSq lam r u).continuousAt.comp hxy).continuousWithinAt\n  apply error_eq_initial_mul_exp_integral_on_Icc hg hT ?_ ht\n  intro s hs\n  exact (hasDerivAt_energy_fixed_input lam r u gamma target (b s)\n    (hode s hs).1 (hode s hs).2).sub_const target","truncated":false,"comment":"Exact energy evolution on a finite interval follows from coordinate ODEs\non that interval alone; no global trajectory premise is required."},{"id":382,"line":14,"statement":"theorem reduced_energy_bound {lam : ℝ} (hlam : 0 < lam) (r x : ℝ) :\n    -3 * lam * x ^ 4 / 4 - r * x ^ 2 / 2 ≤ (max (-r) 0) ^ 2 / (12 * lam)","proof":"by\n  have h := LinearInputCalculus.critical_value_le\n    (r := r) (u := lam * x ^ 3 + r * x) (x := x) hlam rfl\n  rw [LinearInputCalculus.critical_value rfl] at h\n  exact h","truncated":false,"comment":"The quartic remainder in the energy-gradient identity has the same bound\nas the already proved critical values, without a stationarity assumption."},{"id":383,"line":22,"statement":"theorem energy_gradient_identity (lam r u x y : ℝ) :\n    E lam r u x y = -3 * lam * x ^ 4 / 4 - r * x ^ 2 / 2 +\n      x * gx lam r u x y + Real.sqrt 2 * x * gy x y + (gy x y) ^ 2 / 2","proof":"by\n  unfold E f gx gy\n  ring_nf\n  rw [Real.sq_sqrt (by norm_num : (0 : ℝ) ≤ 2)]\n  ring","truncated":false,"comment":"Energy is its bounded quartic remainder plus an actual-gradient term."},{"id":384,"line":31,"statement":"theorem gradient_linear_term_sq (x a b : ℝ) :\n    (x * a + Real.sqrt 2 * x * b) ^ 2 ≤ 3 * x ^ 2 * (a ^ 2 + b ^ 2)","proof":"by\n  have hi : 3 * x ^ 2 * (a ^ 2 + b ^ 2) -\n      (x * a + Real.sqrt 2 * x * b) ^ 2 = x ^ 2 * (Real.sqrt 2 * a - b) ^ 2 := by\n    ring_nf\n    rw [Real.sq_sqrt (by norm_num : (0 : ℝ) ≤ 2)]\n    ring\n  have hn : 0 ≤ x ^ 2 * (Real.sqrt 2 * a - b) ^ 2 := by positivity\n  linarith","truncated":false,"comment":"The exact two-dimensional Cauchy estimate uses sqrt(2)^2 = 2."},{"id":385,"line":47,"statement":"theorem explicit_gradient_bound_pos {lam r u target upper : ℝ}\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target) :\n    0 < gradientLowerBound lam r u target upper","proof":"by\n  have hd : 0 < target - (max (-r) 0) ^ 2 / (12 * lam) := sub_pos.mpr htarget\n  have hS : 0 ≤ max (upper + lowerBoundConstant lam r u) 0 := le_max_right _ _\n  unfold gradientLowerBound\n  exact div_pos (sq_pos_of_pos hd) (by positivity)","truncated":false,"comment":""},{"id":386,"line":56,"statement":"theorem explicit_gradient_bound {lam r u target upper x y : ℝ}\n    (hlam : 0 < lam)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (hlo : target ≤ E lam r u x y) (hhi : E lam r u x y ≤ upper) :\n    gradientLowerBound lam r u target upper ≤ gSq lam r u x y","proof":"by\n  let delta := target - (max (-r) 0) ^ 2 / (12 * lam)\n  let S := max (upper + lowerBoundConstant lam r u) 0\n  let g := gSq lam r u x y\n  let L := x * gx lam r u x y + Real.sqrt 2 * x * gy x y\n  have hd : 0 < delta := sub_pos.mpr htarget\n  have hS : 0 ≤ S := le_max_right _ _\n  have hg : 0 ≤ g := gSq_nonneg lam r u x y\n  have hx : x ^ 2 ≤ S := by\n    have hc := coercive_lower_bound hlam r u x y\n    have hs : upper + lowerBoundConstant lam r u ≤ S := le_max_left _ _\n    nlinarith [sq_nonneg (y - Real.sqrt 2 * x)]\n  have he : delta ≤ L + g / 2 := by\n    have hi := energy_gradient_identity lam r u x y\n    have hb := reduced_energy_bound hlam r x\n    have hgy : (gy x y) ^ 2 ≤ g := by\n      dsimp [g, gSq]\n      nlinarith [sq_nonneg (gx lam r u x y)]\n    dsimp only [delta, L]\n    linarith\n  have hL : L ^ 2 ≤ 3 * S * g := by\n    have hc := gradient_linear_term_sq x (gx lam r u x y) (gy x y)\n    change L ^ 2 ≤ 3 * x ^ 2 * g at hc\n    have hm := mul_nonneg (sub_nonneg.mpr hx) hg\n    nlinarith\n  have hy : 2 * delta * L ≤ delta ^ 2 + 3 * S * g := by\n    nlinarith [sq_nonneg (L - delta)]\n  have hm : delta ^ 2 ≤ (3 * S + delta) * g := by\n    have he' := mul_le_mul_of_nonneg_left he (by positivity : 0 ≤ 2 * delta)\n    nlinarith\n  change delta ^ 2 / (3 * S + delta) ≤ g\n  apply (div_le_iff₀ (by positivity : 0 < 3 * S + delta)).2\n  nlinarith","truncated":false,"comment":"A fully explicit lower bound for the squared actual gradient on the band."},{"id":387,"line":96,"statement":"theorem gradient_bound_of_initial {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (hlam : 0 < lam) (hgamma : 0 ≤ gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target ≤ E lam r u (x 0) (y 0)) :\n    ∀ t ∈ Set.Ici (0 : ℝ),\n      gradientLowerBound lam r u target (E lam r u (x 0) (y 0)) ≤\n        gSq lam r u (x t) (y t)","proof":"by\n  intro t ht\n  have hb := energy_band_of_trajectory hgamma htraj hinit t ht\n  exact explicit_gradient_bound hlam htarget hb.1 hb.2","truncated":false,"comment":"The computed band constant applies for all nonnegative times, with band\ninvariance derived from the initial condition and actual trajectory equations."},{"id":388,"line":110,"statement":"theorem energy_error_exponential_of_initial {lam r u gamma target : ℝ}\n    (hlam : 0 < lam) (hgamma : 0 ≤ gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    {x y b : ℝ → ℝ} (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target ≤ E lam r u (x 0) (y 0)) {t : ℝ} (ht : 0 ≤ t) :\n    0 ≤ E lam r u (x t) (y t) - target ∧\n      E lam r u (x t) (y t) - target ≤\n        (E lam r u (x 0) (y 0) - target) * Real.exp\n          (-(gamma * gradientLowerBound lam r u target (E lam r u (x 0) (y 0))) * t)","proof":"by\n  have hband := energy_band_of_trajectory hgamma htraj hinit\n  have hg := gradient_bound_of_initial hlam hgamma htarget htraj hinit\n  refine ⟨sub_nonneg.mpr (hband t ht).1, ?_⟩\n  apply LinearInputDissipation.exponential_bound\n    (v := fun s => E lam r u (x s) (y s) - target)\n    (q := fun s => -gamma * (E lam r u (x s) (y s) - target) *\n      gSq lam r u (x s) (y s))\n    (k := gamma * gradientLowerBound lam r u target (E lam r u (x 0) (y 0)))\n  · intro s hs\n    exact hasDerivAt_gap_of_trajectory htraj hs\n  · intro s hs\n    have hn := mul_nonneg (mul_nonneg hgamma (sub_nonneg.mpr (hband s hs).1))\n      (sub_nonneg.mpr (hg s hs))\n    nlinarith\n  · exact ht","truncated":false,"comment":"Explicit exponential decay of the energy error itself, not only its square.\nNo global trajectory existence is asserted."},{"id":389,"line":136,"statement":"theorem squared_error_exponential_of_initial {lam r u gamma target : ℝ}\n    (hlam : 0 < lam) (hgamma : 0 ≤ gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    {x y b : ℝ → ℝ} (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target ≤ E lam r u (x 0) (y 0)) {t : ℝ} (ht : 0 ≤ t) :\n    (E lam r u (x t) (y t) - target) ^ 2 ≤\n      (E lam r u (x 0) (y 0) - target) ^ 2 * Real.exp\n        (-(2 * gamma * gradientLowerBound lam r u target (E lam r u (x 0) (y 0))) * t)","proof":"by\n  exact LinearInputDissipation.squared_error_exponential hgamma\n    (fun _ hs => hasDerivAt_gap_of_trajectory htraj hs)\n    (gradient_bound_of_initial hlam hgamma htarget htraj hinit) ht","truncated":false,"comment":"The same explicit positive constant gives the square-error estimate."},{"id":390,"line":13,"statement":"theorem square_bound {θ f : ℝ → ℝ} {κ ρ M : ℝ}\n    (hκ : 0 < κ) (hM : 0 ≤ M)\n    (hd : ∀ t ∈ Ici (0 : ℝ), HasDerivAt θ (-κ * θ t + ρ * f t) t)\n    (hf : ∀ t ∈ Ici (0 : ℝ), |f t| ≤ M)\n    {t : ℝ} (ht : 0 ≤ t) :\n    (θ t)^2 ≤ (θ 0)^2 * exp (-κ*t) + (ρ*M/κ)^2 * (1-exp (-κ*t))","proof":"by\n  let C : ℝ := (ρ*M/κ)^2\n  have hC : κ^2 * C = ρ^2 * M^2 := by\n    dsimp [C]\n    field_simp\n  have hv : ∀ s ∈ Ici (0 : ℝ),\n      HasDerivAt (fun s => (θ s)^2-C) (2*θ s*(-κ*θ s+ρ*f s)) s := by\n    intro s hs\n    convert ((hd s hs).pow 2).sub_const C using 1; ring\n  have hi : ∀ s ∈ Ici (0 : ℝ),\n      2*θ s*(-κ*θ s+ρ*f s) ≤ -κ*((θ s)^2-C) := by\n    intro s hs\n    have hf2 : (f s)^2 ≤ M^2 := by\n      nlinarith [sq_abs (f s), hf s hs, abs_nonneg (f s)]\n    have hforce : ρ^2*(f s)^2 ≤ ρ^2*M^2 :=\n      mul_le_mul_of_nonneg_left hf2 (sq_nonneg ρ)\n    have hscaled : κ*(2*θ s*(-κ*θ s+ρ*f s)+κ*((θ s)^2-C)) ≤ 0 := by\n      nlinarith [sq_nonneg (κ*θ s-ρ*f s)]\n    have hsum : 2*θ s*(-κ*θ s+ρ*f s)+κ*((θ s)^2-C) ≤ 0 := by\n      nlinarith\n    linarith\n  have hb := LinearInputDissipation.exponential_bound hv hi ht\n  dsimp [C] at *\n  nlinarith","truncated":false,"comment":"A bounded forcing gives an explicit estimate for the actual square of a\nsupplied internal coordinate."},{"id":391,"line":44,"statement":"theorem square_le_max {θ f : ℝ → ℝ} {κ ρ M : ℝ}\n    (hκ : 0 < κ) (hM : 0 ≤ M)\n    (hd : ∀ t ∈ Ici (0 : ℝ), HasDerivAt θ (-κ * θ t + ρ * f t) t)\n    (hf : ∀ t ∈ Ici (0 : ℝ), |f t| ≤ M)\n    {t : ℝ} (ht : 0 ≤ t) :\n    (θ t)^2 ≤ max ((θ 0)^2) ((ρ*M/κ)^2)","proof":"by\n  have hb := square_bound hκ hM hd hf ht\n  have he0 : 0 ≤ exp (-κ*t) := (exp_pos _).le\n  have he1 : exp (-κ*t) ≤ 1 := exp_le_one_iff.mpr (by nlinarith)\n  have h₁ := mul_le_mul_of_nonneg_right\n    (le_max_left ((θ 0)^2) ((ρ*M/κ)^2)) he0\n  have h₂ := mul_le_mul_of_nonneg_right\n    (le_max_right ((θ 0)^2) ((ρ*M/κ)^2)) (sub_nonneg.mpr he1)\n  nlinarith","truncated":false,"comment":"Uniform square bound, including the initial transient."},{"id":392,"line":61,"statement":"theorem exists_forcing_bound {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (hlam : 0 < lam) (hgamma : 0 ≤ gamma)\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target ≤ E lam r u (x 0) (y 0))\n    {Φ : ℝ × ℝ → ℝ} (hΦ : Continuous Φ) :\n    ∃ M : ℝ, 0 ≤ M ∧ ∀ t ∈ Ici (0 : ℝ), |Φ (x t,y t)| ≤ M","proof":"by\n  have hcompact := LinearInputCoercivity.isCompact_band hlam r u target\n    (E lam r u (x 0) (y 0))\n  obtain ⟨C,hC⟩ := hcompact.exists_bound_of_continuousOn hΦ.continuousOn\n  refine ⟨max C 0, le_max_right _ _, fun t ht => ?_⟩\n  have hz := LinearInputInvariance.energy_band_of_trajectory hgamma htraj hinit t ht\n  have hb := hC (x t,y t) hz\n  exact (show |Φ (x t,y t)| ≤ C by simpa only [Real.norm_eq_abs] using hb).trans\n    (le_max_left _ _)","truncated":false,"comment":"Continuity of a forcing on the plane gives a uniform bound along the\nsupplied trajectory, using its derived compact energy confinement."},{"id":393,"line":78,"statement":"theorem internal_update_bounded {lam r u gamma target κ ρ : ℝ}\n    {x y b θ : ℝ → ℝ} {Φ : ℝ × ℝ → ℝ}\n    (hlam : 0 < lam) (hgamma : 0 ≤ gamma) (hκ : 0 < κ)\n    (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target ≤ E lam r u (x 0) (y 0)) (hΦ : Continuous Φ)\n    (hd : ∀ t ∈ Ici (0 : ℝ), HasDerivAt θ (-κ*θ t+ρ*Φ (x t,y t)) t) :\n    ∃ C : ℝ, 0 ≤ C ∧ ∀ t ∈ Ici (0 : ℝ), (θ t)^2 ≤ C","proof":"by\n  obtain ⟨M,hM,hf⟩ := exists_forcing_bound hlam hgamma htraj hinit hΦ\n  refine ⟨max ((θ 0)^2) ((ρ*M/κ)^2), (sq_nonneg _).trans (le_max_left _ _), ?_⟩\n  exact fun t ht => square_le_max hκ hM hd hf ht","truncated":false,"comment":"The damped internal coordinate is bounded whenever it is driven by a\ncontinuous observable of a confined supplied spatial trajectory."},{"id":394,"line":24,"statement":"theorem contDiff_vectorField {n : WithTop ℕ∞} {b : ℝ × ℝ → ℝ}\n    (hb : ContDiff ℝ n b) (lam r u gamma target : ℝ) :\n    ContDiff ℝ n (vectorField lam r u gamma target b)","proof":"by\n  unfold vectorField E f gx gy\n  fun_prop","truncated":false,"comment":""},{"id":395,"line":31,"statement":"theorem exists_local_solution {b : ℝ × ℝ → ℝ} (hb : ContDiff ℝ 1 b)\n    (lam r u gamma target : ℝ) (z₀ : ℝ × ℝ) (t₀ : ℝ) :\n    ∃ z : ℝ → ℝ × ℝ, z t₀ = z₀ ∧ ∃ ε > (0 : ℝ),\n      ∀ t ∈ Ioo (t₀ - ε) (t₀ + ε),\n        HasDerivAt z (vectorField lam r u gamma target b (z t)) t","proof":"by\n  exact ContDiffAt.exists_forall_mem_closedBall_exists_eq_forall_mem_Ioo_hasDerivAt₀\n    ((contDiff_vectorField hb lam r u gamma target).contDiffAt (x := z₀)) t₀","truncated":false,"comment":"Picard-Lindelof supplies an actual solution on a two-sided open time interval."},{"id":396,"line":40,"statement":"theorem local_solution_unique {b : ℝ × ℝ → ℝ} (hb : ContDiff ℝ 1 b)\n    {lam r u gamma target t₀ : ℝ} {z w : ℝ → ℝ × ℝ}\n    (hz : IsIntegralCurveAt z (fun _ => vectorField lam r u gamma target b) t₀)\n    (hw : IsIntegralCurveAt w (fun _ => vectorField lam r u gamma target b) t₀)\n    (heq : z t₀ = w t₀) : z =ᶠ[𝓝 t₀] w","proof":"by\n  obtain ⟨K, s, hs, hlip⟩ :=\n    (contDiff_vectorField hb lam r u gamma target).contDiffAt\n      (x := z t₀) |>.exists_lipschitzOnWith\n  have hzs : ∀ᶠ t in 𝓝 t₀, z t ∈ s := hz.continuousAt.preimage_mem_nhds hs\n  have hws : ∀ᶠ t in 𝓝 t₀, w t ∈ s := hw.continuousAt.preimage_mem_nhds (heq ▸ hs)\n  exact ODE_solution_unique_of_eventually (v := fun _ => vectorField lam r u gamma target b)\n    (s := fun _ => s) (Eventually.of_forall fun _ => hlip) (hz.and hzs) (hw.and hws) heq","truncated":false,"comment":"C1 coefficients give local uniqueness without a global Lipschitz hypothesis."},{"id":397,"line":54,"statement":"theorem solution_unique_on_interval {b : ℝ × ℝ → ℝ} (hb : ContDiff ℝ 1 b)\n    {lam r u gamma target a c t₀ : ℝ} {z w : ℝ → ℝ × ℝ}\n    (ht₀ : t₀ ∈ Ioo a c)\n    (hz : ∀ t ∈ Ioo a c, HasDerivAt z (vectorField lam r u gamma target b (z t)) t)\n    (hw : ∀ t ∈ Ioo a c, HasDerivAt w (vectorField lam r u gamma target b (w t)) t)\n    (heq : z t₀ = w t₀) : EqOn z w (Ioo a c)","proof":"by\n  let s := {t | z t = w t} ∩ Ioo a c\n  suffices hsub : Ioo a c ⊆ s from fun t ht => (hsub ht).1\n  apply isPreconnected_Ioo.subset_of_closure_inter_subset (s := Ioo a c) (u := s) _\n    ⟨t₀, ⟨ht₀, ⟨heq, ht₀⟩⟩⟩\n  · change closure ({t | z t = w t} ∩ Ioo a c) ∩ Ioo a c ⊆\n      {t | z t = w t} ∩ Ioo a c\n    rw [inter_comm, ← Subtype.image_preimage_val, inter_comm, ← Subtype.image_preimage_val,\n      image_subset_image_iff Subtype.val_injective, preimage_ofPred_eq]\n    intro t ht\n    change (t : ℝ) ∈ closure (Subtype.val '' (Subtype.val ⁻¹' {t | z t = w t})) at ht\n    rw [← closure_subtype] at ht\n    revert ht t\n    apply IsClosed.closure_subset (isClosed_eq _ _)\n    · rw [continuous_iff_continuousAt]\n      rintro ⟨t, ht⟩\n      exact (hz t ht).continuousAt.comp continuousAt_subtype_val\n    · rw [continuous_iff_continuousAt]\n      rintro ⟨t, ht⟩\n      exact (hw t ht).continuousAt.comp continuousAt_subtype_val\n  · rw [isOpen_iff_mem_nhds]\n    intro t ht\n    have hmem := Ioo_mem_nhds ht.2.1 ht.2.2\n    have hzl : IsIntegralCurveAt z (fun _ => vectorField lam r u gamma target b) t := by\n      filter_upwards [hmem] with q hq\n      exact hz q hq\n    have hwl : IsIntegralCurveAt w (fun _ => vectorField lam r u gamma target b) t := by\n      filter_upwards [hmem] with q hq\n      exact hw q hq\n    exact (local_solution_unique hb hzl hwl ht.1).and hmem","truncated":false,"comment":"Local uniqueness propagates over the common open interval of two actual solutions."},{"id":398,"line":91,"statement":"theorem exists_local_unique_solution {b : ℝ × ℝ → ℝ} (hb : ContDiff ℝ 1 b)\n    (lam r u gamma target : ℝ) (z₀ : ℝ × ℝ) (t₀ : ℝ) :\n    ∃ z : ℝ → ℝ × ℝ, z t₀ = z₀ ∧\n      IsIntegralCurveAt z (fun _ => vectorField lam r u gamma target b) t₀ ∧\n      ∀ w : ℝ → ℝ × ℝ, w t₀ = z₀ →\n        IsIntegralCurveAt w (fun _ => vectorField lam r u gamma target b) t₀ →\n        z =ᶠ[𝓝 t₀] w","proof":"by\n  obtain ⟨z, hz₀, ε, hε, hz⟩ := exists_local_solution hb lam r u gamma target z₀ t₀\n  have hlocal : IsIntegralCurveAt z (fun _ => vectorField lam r u gamma target b) t₀ := by\n    filter_upwards [Ioo_mem_nhds (by linarith : t₀ - ε < t₀)\n      (by linarith : t₀ < t₀ + ε)] with t ht\n    exact hz t ht\n  refine ⟨z, hz₀, hlocal, fun w hw₀ hw => ?_⟩\n  exact local_solution_unique hb hlocal hw (hz₀.trans hw₀.symm)","truncated":false,"comment":"Existence and uniqueness are combined at the actual initial state."},{"id":399,"line":107,"statement":"theorem exists_local_solution_one_add_sq {Q : ℝ × ℝ → ℝ} (hQ : ContDiff ℝ 1 Q)\n    (lam r u gamma target : ℝ) (z₀ : ℝ × ℝ) (t₀ : ℝ) :\n    ∃ z : ℝ → ℝ × ℝ, z t₀ = z₀ ∧ ∃ ε > (0 : ℝ),\n      ∀ t ∈ Ioo (t₀ - ε) (t₀ + ε),\n        HasDerivAt z (vectorField lam r u gamma target (fun q => 1 + Q q ^ 2) (z t)) t","proof":"exists_local_solution (contDiff_const.add (hQ.pow 2)) lam r u gamma target z₀ t₀","truncated":false,"comment":"The original positive rotation coefficient is a direct instance for every C1 Q."},{"id":400,"line":115,"statement":"theorem hasDerivAt_vectorField_iff {lam r u gamma target : ℝ}\n    {b : ℝ × ℝ → ℝ} {x y : ℝ → ℝ} {t : ℝ} :\n    HasDerivAt (fun s => (x s, y s))\n      (vectorField lam r u gamma target b (x t, y t)) t ↔\n      HasDerivAt x\n        (-gamma * (E lam r u (x t) (y t) - target) * gx lam r u (x t) (y t)\n          - b (x t, y t) * gy (x t) (y t)) t ∧\n      HasDerivAt y\n        (-gamma * (E lam r u (x t) (y t) - target) * gy (x t) (y t)\n          + b (x t, y t) * gx lam r u (x t) (y t)) t","proof":"by\n  constructor\n  · intro h\n    exact ⟨h.fst, h.snd⟩\n  · rintro ⟨hx, hy⟩\n    exact hx.prodMk hy","truncated":false,"comment":"The vector ODE is exactly the two coordinate equations used in the energy proofs."},{"id":401,"line":132,"statement":"theorem exists_local_coordinate_solution {b : ℝ × ℝ → ℝ} (hb : ContDiff ℝ 1 b)\n    (lam r u gamma target x₀ y₀ : ℝ) :\n    ∃ ε > (0 : ℝ), ∃ x y : ℝ → ℝ, x 0 = x₀ ∧ y 0 = y₀ ∧\n      ∀ t ∈ Ioo (-ε) ε,\n        HasDerivAt x\n          (-gamma * (E lam r u (x t) (y t) - target) * gx lam r u (x t) (y t)\n            - b (x t, y t) * gy (x t) (y t)) t ∧\n        HasDerivAt y\n          (-gamma * (E lam r u (x t) (y t) - target) * gy (x t) (y t)\n            + b (x t, y t) * gx lam r u (x t) (y t)) t","proof":"by\n  obtain ⟨z, hz₀, ε, hε, hz⟩ := exists_local_solution hb lam r u gamma target (x₀, y₀) 0\n  refine ⟨ε, hε, fun t => (z t).1, fun t => (z t).2,\n    congrArg Prod.fst hz₀, congrArg Prod.snd hz₀, fun t ht => ?_⟩\n  have h := hz t (by simpa only [zero_sub, zero_add] using ht)\n  exact ⟨h.fst, h.snd⟩","truncated":false,"comment":"A genuine local solution exists in the coordinate notation of the original ODE."},{"id":402,"line":149,"statement":"theorem hasDerivAt_energy_of_solution {lam r u gamma target : ℝ}\n    {b : ℝ × ℝ → ℝ} {z : ℝ → ℝ × ℝ} {t : ℝ}\n    (hz : HasDerivAt z (vectorField lam r u gamma target b (z t)) t) :\n    HasDerivAt (fun s => E lam r u (z s).1 (z s).2)\n      (-gamma * (E lam r u (z t).1 (z t).2 - target) *\n        gSq lam r u (z t).1 (z t).2) t","proof":"by\n  exact hasDerivAt_energy_fixed_input lam r u gamma target (b (z t)) hz.fst hz.snd","truncated":false,"comment":"The actual local solution satisfies the proved energy identity."},{"id":403,"line":159,"statement":"theorem exists_local_solution_energy_formula {b : ℝ × ℝ → ℝ} (hb : ContDiff ℝ 1 b)\n    (lam r u gamma target : ℝ) (z₀ : ℝ × ℝ) :\n    ∃ T > (0 : ℝ), ∃ z : ℝ → ℝ × ℝ, z 0 = z₀ ∧\n      (∀ t ∈ Icc (0 : ℝ) T,\n        HasDerivAt z (vectorField lam r u gamma target b (z t)) t) ∧\n      ∀ t ∈ Icc (0 : ℝ) T,\n        E lam r u (z t).1 (z t).2 - target =\n          (E lam r u z₀.1 z₀.2 - target) *\n            Real.exp (-gamma * (∫ s in 0..t, gSq lam r u (z s).1 (z s).2))","proof":"by\n  obtain ⟨z, hz₀, ε, hε, hz⟩ := exists_local_solution hb lam r u gamma target z₀ 0\n  have hd : ∀ t ∈ Icc (0 : ℝ) (ε / 2),\n      HasDerivAt z (vectorField lam r u gamma target b (z t)) t := by\n    intro t ht\n    apply hz t\n    constructor\n    · linarith [ht.1]\n    · linarith [ht.2]\n  refine ⟨ε / 2, half_pos hε, z, hz₀, hd, fun t ht => ?_⟩\n  have he := LinearInputStrictEnergy.energy_gap_exact_on_Icc\n    (lam := lam) (r := r) (u := u) (gamma := gamma) (target := target)\n    (x := fun s => (z s).1) (y := fun s => (z s).2) (b := fun s => b (z s))\n    (le_of_lt (half_pos hε)) (fun s hs => ⟨(hd s hs).fst, (hd s hs).snd⟩) ht\n  simpa only [hz₀] using he","truncated":false,"comment":"An actually constructed solution obeys the exact energy formula on a nonzero\nclosed forward interval. This conclusion does not presume a global trajectory."},{"id":404,"line":185,"statement":"theorem isTrajectory_of_global_solution {lam r u gamma target : ℝ}\n    {b : ℝ × ℝ → ℝ} {z : ℝ → ℝ × ℝ}\n    (hz : ∀ t ∈ Ici (0 : ℝ), HasDerivAt z (vectorField lam r u gamma target b (z t)) t) :\n    IsTrajectory lam r u gamma target (fun t => (z t).1) (fun t => (z t).2)\n      (fun t => b (z t))","proof":"fun t ht => ⟨(hz t ht).fst, (hz t ht).snd⟩","truncated":false,"comment":"A supplied forward-global vector solution matches the existing trajectory predicate.\nThis bridge does not claim that the local solution is already global."},{"id":405,"line":8,"statement":"theorem error_band_on_Icc {e g : ℝ → ℝ} {gamma T : ℝ}\n    (hgamma : 0 ≤ gamma) (hT : 0 ≤ T)\n    (hg : ContinuousOn g (Icc (0 : ℝ) T))\n    (hd : ∀ s ∈ Icc (0 : ℝ) T, HasDerivAt e (-gamma * e s * g s) s)\n    (hgn : ∀ s ∈ Icc (0 : ℝ) T, 0 ≤ g s) (hinit : 0 ≤ e 0)\n    {t : ℝ} (ht : t ∈ Icc (0 : ℝ) T) : 0 ≤ e t ∧ e t ≤ e 0","proof":"by\n  rw [LinearInputStrictEnergy.error_eq_initial_mul_exp_integral_on_Icc hg hT hd ht]\n  have hi : 0 ≤ ∫ s in 0..t, g s :=\n    intervalIntegral.integral_nonneg ht.1 (fun s hs => hgn s ⟨hs.1, hs.2.trans ht.2⟩)\n  have he : Real.exp (-gamma * (∫ s in 0..t, g s)) ≤ 1 :=\n    Real.exp_le_one_iff.mpr (by nlinarith)\n  exact ⟨mul_nonneg hinit (Real.exp_pos _).le,\n    (mul_le_mul_of_nonneg_left he hinit).trans_eq (mul_one _)⟩","truncated":false,"comment":"A nonnegative coefficient preserves the initial error interval on [0,T]."},{"id":406,"line":23,"statement":"theorem energy_band_on_Icc {lam r u gamma target T : ℝ} {b : ℝ × ℝ → ℝ}\n    {z : ℝ → ℝ × ℝ} (hgamma : 0 ≤ gamma) (hT : 0 ≤ T)\n    (hode : ∀ s ∈ Icc (0 : ℝ) T,\n      HasDerivAt z (vectorField lam r u gamma target b (z s)) s)\n    (hinit : target ≤ E lam r u (z 0).1 (z 0).2)\n    {t : ℝ} (ht : t ∈ Icc (0 : ℝ) T) :\n    target ≤ E lam r u (z t).1 (z t).2 ∧\n      E lam r u (z t).1 (z t).2 ≤ E lam r u (z 0).1 (z 0).2","proof":"by\n  have hg : ContinuousOn (fun s => gSq lam r u (z s).1 (z s).2) (Icc (0 : ℝ) T) := by\n    intro s hs\n    exact ((continuous_gSq lam r u).continuousAt.comp (hode s hs).continuousAt).continuousWithinAt\n  have h := error_band_on_Icc hgamma hT hg\n    (fun s hs => (hasDerivAt_energy_of_solution (hode s hs)).sub_const target)\n    (fun s _ => gSq_nonneg lam r u (z s).1 (z s).2) (sub_nonneg.mpr hinit) ht\n  constructor <;> linarith [h.1, h.2]","truncated":false,"comment":"The actual vector ODE on a finite interval implies energy-band confinement."},{"id":407,"line":40,"statement":"theorem energy_band_on_Ioo {lam r u gamma target eps a : ℝ} {b : ℝ × ℝ → ℝ}\n    {z : ℝ → ℝ × ℝ} (hgamma : 0 ≤ gamma) (heps : 0 < eps)\n    (hode : ∀ s ∈ Ioo (-eps) a,\n      HasDerivAt z (vectorField lam r u gamma target b (z s)) s)\n    (hinit : target ≤ E lam r u (z 0).1 (z 0).2)\n    {t : ℝ} (ht : 0 ≤ t) (hta : t < a) :\n    target ≤ E lam r u (z t).1 (z t).2 ∧\n      E lam r u (z t).1 (z t).2 ≤ E lam r u (z 0).1 (z 0).2","proof":"by\n  apply energy_band_on_Icc (b := b) (z := z) hgamma ht (T := t) ?_ hinit ⟨ht, le_rfl⟩\n  intro s hs\n  exact hode s ⟨by linarith [hs.1], hs.2.trans_lt hta⟩","truncated":false,"comment":"The same confinement holds in the nonnegative part of an open solution interval."},{"id":408,"line":18,"statement":"theorem exists_uniform_local_time {F : V → V} {K : Set V}\n    (hF : ContDiff ℝ 1 F) (hK : IsCompact K) :\n    ∃ ε : ℝ, 0 < ε ∧ ∀ x ∈ K, ∃ z : ℝ → V,\n      z 0 = x ∧ ∀ t ∈ Ioo (-ε) ε, HasDerivAt z (F (z t)) t","proof":"by\n  classical\n  have hlocal (x : V) :=\n    (hF.contDiffAt (x := x)).exists_forall_mem_closedBall_exists_eq_forall_mem_Ioo_hasDerivAt 0\n  choose r hr d hd hz using hlocal\n  obtain ⟨s, hs⟩ := hK.elim_finite_subcover (fun x => ball x (r x))\n    (fun _ => isOpen_ball) (by\n      intro x _\n      exact mem_iUnion.mpr ⟨x, mem_ball_self (hr x)⟩)\n  have hsmall : ∀ a : Finset V, ∃ ε : ℝ, 0 < ε ∧ ∀ x ∈ a, ε ≤ d x := by\n    intro a\n    induction a using Finset.induction_on with\n    | empty => exact ⟨1, by norm_num, by simp⟩\n    | @insert x a hxa ih =>\n      obtain ⟨ε, hε, he⟩ := ih\n      refine ⟨min (d x) ε, lt_min (hd x) hε, ?_⟩\n      intro y hy\n      rcases Finset.mem_insert.mp hy with hxy | hya\n      · subst y\n        exact min_le_left _ _\n      · exact (min_le_right _ _).trans (he y hya)\n  obtain ⟨ε, hε, he⟩ := hsmall s\n  refine ⟨ε, hε, ?_⟩\n  intro x hx\n  obtain ⟨y, hys, hxy⟩ := mem_iUnion₂.mp (hs hx)\n  obtain ⟨z, hz0, hzd⟩ := hz y x (ball_subset_closedBall hxy)\n  refine ⟨z, hz0, ?_⟩\n  intro t ht\n  apply hzd t\n  have hed := he y hys\n  constructor <;> linarith [ht.1, ht.2]","truncated":false,"comment":"Uniform local existence at every point of a compact set, obtained by a\nfinite subcover of the actual nearby-initial-data Picard-Lindelöf neighborhoods."},{"id":409,"line":15,"statement":"theorem local_unique {F : V → V} (hF : ContDiff ℝ 1 F)\n    {t₀ : ℝ} {z w : ℝ → V}\n    (hz : IsIntegralCurveAt z (fun _ => F) t₀)\n    (hw : IsIntegralCurveAt w (fun _ => F) t₀)\n    (heq : z t₀ = w t₀) : z =ᶠ[𝓝 t₀] w","proof":"by\n  obtain ⟨K, s, hs, hlip⟩ := hF.contDiffAt (x := z t₀) |>.exists_lipschitzOnWith\n  have hzs : ∀ᶠ t in 𝓝 t₀, z t ∈ s := hz.continuousAt.preimage_mem_nhds hs\n  have hws : ∀ᶠ t in 𝓝 t₀, w t ∈ s := hw.continuousAt.preimage_mem_nhds (heq ▸ hs)\n  exact ODE_solution_unique_of_eventually (v := fun _ => F)\n    (s := fun _ => s) (Eventually.of_forall fun _ => hlip) (hz.and hzs) (hw.and hws) heq","truncated":false,"comment":""},{"id":410,"line":26,"statement":"theorem unique_on_Ioo {F : V → V} (hF : ContDiff ℝ 1 F)\n    {a c t₀ : ℝ} {z w : ℝ → V}\n    (ht₀ : t₀ ∈ Ioo a c)\n    (hz : ∀ t ∈ Ioo a c, HasDerivAt z (F (z t)) t)\n    (hw : ∀ t ∈ Ioo a c, HasDerivAt w (F (w t)) t)\n    (heq : z t₀ = w t₀) : EqOn z w (Ioo a c)","proof":"by\n  let s := {t | z t = w t} ∩ Ioo a c\n  suffices hsub : Ioo a c ⊆ s from fun t ht => (hsub ht).1\n  apply isPreconnected_Ioo.subset_of_closure_inter_subset (s := Ioo a c) (u := s) _\n    ⟨t₀, ⟨ht₀, ⟨heq, ht₀⟩⟩⟩\n  · change closure ({t | z t = w t} ∩ Ioo a c) ∩ Ioo a c ⊆\n      {t | z t = w t} ∩ Ioo a c\n    rw [inter_comm, ← Subtype.image_preimage_val, inter_comm, ← Subtype.image_preimage_val,\n      image_subset_image_iff Subtype.val_injective, preimage_ofPred_eq]\n    intro t ht\n    change (t : ℝ) ∈ closure (Subtype.val '' (Subtype.val ⁻¹' {t | z t = w t})) at ht\n    rw [← closure_subtype] at ht\n    revert ht t\n    apply IsClosed.closure_subset (isClosed_eq _ _)\n    · rw [continuous_iff_continuousAt]\n      rintro ⟨t, ht⟩\n      exact (hz t ht).continuousAt.comp continuousAt_subtype_val\n    · rw [continuous_iff_continuousAt]\n      rintro ⟨t, ht⟩\n      exact (hw t ht).continuousAt.comp continuousAt_subtype_val\n  · rw [isOpen_iff_mem_nhds]\n    intro t ht\n    have hmem := Ioo_mem_nhds ht.2.1 ht.2.2\n    have hzl : IsIntegralCurveAt z (fun _ => F) t := by\n      filter_upwards [hmem] with q hq\n      exact hz q hq\n    have hwl : IsIntegralCurveAt w (fun _ => F) t := by\n      filter_upwards [hmem] with q hq\n      exact hw q hq\n    exact (local_unique hF hzl hwl ht.1).and hmem","truncated":false,"comment":""},{"id":411,"line":63,"statement":"theorem piecewise_eqOn {F : V → V} (hF : ContDiff ℝ 1 F)\n    {a b c d t₀ : ℝ} {z w : ℝ → V}\n    (hz : ∀ t ∈ Ioo a b, HasDerivAt z (F (z t)) t)\n    (hw : ∀ t ∈ Ioo c d, HasDerivAt w (F (w t)) t)\n    (ht₀ : t₀ ∈ Ioo a b ∩ Ioo c d) (heq : z t₀ = w t₀) :\n    EqOn ((Ioo a b).piecewise z w) w (Ioo c d)","proof":"by\n  classical\n  have hu : EqOn z w (Ioo (max a c) (min b d)) :=\n    unique_on_Ioo hF ⟨max_lt ht₀.1.1 ht₀.2.1, lt_min ht₀.1.2 ht₀.2.2⟩\n      (fun t ht => hz t ⟨lt_of_le_of_lt (le_max_left _ _) ht.1,\n        lt_of_lt_of_le ht.2 (min_le_left _ _)⟩)\n      (fun t ht => hw t ⟨lt_of_le_of_lt (le_max_right _ _) ht.1,\n        lt_of_lt_of_le ht.2 (min_le_right _ _)⟩) heq\n  intro t ht\n  by_cases hmem : t ∈ Ioo a b\n  · rw [piecewise, ite_eq_left hmem]\n    exact hu ⟨max_lt hmem.1 ht.1, lt_min hmem.2 ht.2⟩\n  · rw [piecewise, ite_eq_right hmem]","truncated":false,"comment":"The piecewise extension agrees with the second solution everywhere on its interval."},{"id":412,"line":83,"statement":"theorem hasDerivAt_piecewise {F : V → V} (hF : ContDiff ℝ 1 F)\n    {a b c d t₀ : ℝ} {z w : ℝ → V}\n    (hz : ∀ t ∈ Ioo a b, HasDerivAt z (F (z t)) t)\n    (hw : ∀ t ∈ Ioo c d, HasDerivAt w (F (w t)) t)\n    (ht₀ : t₀ ∈ Ioo a b ∩ Ioo c d) (heq : z t₀ = w t₀) :\n    ∀ t ∈ Ioo a b ∪ Ioo c d,\n      HasDerivAt ((Ioo a b).piecewise z w) (F (((Ioo a b).piecewise z w) t)) t","proof":"by\n  classical\n  intro t ht\n  by_cases hmem : t ∈ Ioo a b\n  · have hh : (Ioo a b).piecewise z w =ᶠ[𝓝 t] z := by\n      filter_upwards [Ioo_mem_nhds hmem.1 hmem.2] with s hs\n      exact piecewise_eq_of_mem (Ioo a b) z w hs\n    have hv := hh.eq_of_nhds\n    rw [hv]\n    exact (hz t hmem).congr_of_eventuallyEq hh\n  · have hmem' : t ∈ Ioo c d := ht.resolve_left hmem\n    have hh : (Ioo a b).piecewise z w =ᶠ[𝓝 t] w := by\n      filter_upwards [Ioo_mem_nhds hmem'.1 hmem'.2] with s hs\n      exact piecewise_eqOn hF hz hw ht₀ heq hs\n    have hv := hh.eq_of_nhds\n    rw [hv]\n    exact (hw t hmem').congr_of_eventuallyEq hh","truncated":false,"comment":"Overlapping actual solutions glue to an actual solution on the union."},{"id":413,"line":108,"statement":"theorem exists_arbitrarily_long_solution\n    {F : V → V} (hF : ContDiff ℝ 1 F)\n    {K : Set V} {z₀ : V} (hz₀ : z₀ ∈ K)\n    {ε : ℝ} (hε : 0 < ε)\n    (hloc : ∀ x ∈ K, ∃ z : ℝ → V, z 0 = x ∧\n      ∀ t ∈ Ioo (-ε) ε, HasDerivAt z (F (z t)) t)\n    (hstay : ∀ (a : ℝ) (z : ℝ → V), z 0 = z₀ →\n      (∀ t ∈ Ioo (-ε) a, HasDerivAt z (F (z t)) t) →\n      ∀ t : ℝ, 0 ≤ t → t < a → z t ∈ K) :\n    ∀ a : ℝ, ∃ z : ℝ → V, z 0 = z₀ ∧\n      ∀ t ∈ Ioo (-ε) a, HasDerivAt z (F (z t)) t","proof":"by\n  classical\n  let S : Set ℝ := {a | ∃ z : ℝ → V, z 0 = z₀ ∧\n    ∀ t ∈ Ioo (-ε) a, HasDerivAt z (F (z t)) t}\n  have hbase : ε ∈ S := hloc z₀ hz₀\n  have hnbdd : ¬ BddAbove S := by\n    intro hbdd\n    let A := sSup S\n    have hεA : ε ≤ A := le_csSup hbdd hbase\n    obtain ⟨a, ha, hlt⟩ := Real.add_neg_lt_sSup\n      (⟨ε, hbase⟩ : S.Nonempty) (ε := -(ε / 2)) (by linarith)\n    change sSup S + -(ε / 2) < a at hlt\n    have hta : A - ε / 2 < a := by dsimp [A]; linarith\n    obtain ⟨z, hzinit, hz⟩ := ha\n    have hstate : z (A - ε / 2) ∈ K :=\n      hstay a z hzinit hz (A - ε / 2) (by linarith) hta\n    obtain ⟨w, hwinit, hw⟩ := hloc _ hstate\n    let v : ℝ → V := fun t => w (t - (A - ε / 2))\n    have hvinit : v (A - ε / 2) = z (A - ε / 2) := by\n      simp only [v, sub_self, hwinit]\n    have hv : ∀ t ∈ Ioo (A - ε / 2 - ε) (A - ε / 2 + ε),\n        HasDerivAt v (F (v t)) t := by\n      intro t ht\n      have ht' : t - (A - ε / 2) ∈ Ioo (-ε) ε := by constructor <;> linarith [ht.1, ht.2]\n      have hshift : HasDerivAt (fun s : ℝ => s - (A - ε / 2)) 1 t := by\n        simpa using (hasDerivAt_id t).sub_const (A - ε / 2)\n      simpa only [v, one_smul, Function.comp_def] using (hw _ ht').scomp t hshift\n    let q : ℝ → V := (Ioo (-ε) a).piecewise z v\n    have hqinit : q 0 = z₀ := by\n      change (Ioo (-ε) a).piecewise z v 0 = z₀\n      rw [piecewise, ite_eq_left (show (0 : ℝ) ∈ Ioo (-ε) a from ⟨by linarith, by linarith⟩)]\n      exact hzinit\n    have hq : ∀ t ∈ Ioo (-ε) (A + ε / 2), HasDerivAt q (F (q t)) t := by\n      have hpatch := hasDerivAt_piecewise hF hz hv\n        (t₀ := A - ε / 2)\n        (show A - ε / 2 ∈ Ioo (-ε) a ∩ Ioo (A - ε / 2 - ε) (A - ε / 2 + ε)\n          from ⟨⟨by linarith, hta⟩, ⟨by linarith, by linarith⟩⟩) hvinit.symm\n      intro t ht\n      apply hpatch t\n      by_cases hta' : t < a\n      · exact Or.inl ⟨ht.1, hta'⟩\n      · exact Or.inr ⟨by linarith [ht.1], by linarith [ht.2]⟩\n    have hmem : A + ε / 2 ∈ S := ⟨q, hqinit, hq⟩\n    have hbound : A + ε / 2 ≤ A := le_csSup hbdd hmem\n    linarith\n  rw [not_bddAbove_iff] at hnbdd\n  intro a\n  obtain ⟨c, ⟨z, hzinit, hz⟩, hac⟩ := hnbdd a\n  exact ⟨z, hzinit, fun t ht => hz t ⟨ht.1, lt_trans ht.2 hac⟩⟩","truncated":false,"comment":"Uniform local existence on an invariant set prevents a finite forward endpoint."},{"id":414,"line":169,"statement":"theorem exists_forward_solution\n    {F : V → V} (hF : ContDiff ℝ 1 F)\n    {K : Set V} {z₀ : V} (hz₀ : z₀ ∈ K)\n    {ε : ℝ} (hε : 0 < ε)\n    (hloc : ∀ x ∈ K, ∃ z : ℝ → V, z 0 = x ∧\n      ∀ t ∈ Ioo (-ε) ε, HasDerivAt z (F (z t)) t)\n    (hstay : ∀ (a : ℝ) (z : ℝ → V), z 0 = z₀ →\n      (∀ t ∈ Ioo (-ε) a, HasDerivAt z (F (z t)) t) →\n      ∀ t : ℝ, 0 ≤ t → t < a → z t ∈ K) :\n    ∃ z : ℝ → V, z 0 = z₀ ∧\n      ∀ t : ℝ, 0 ≤ t → HasDerivAt z (F (z t)) t","proof":"by\n  classical\n  have hall := exists_arbitrarily_long_solution hF hz₀ hε hloc hstay\n  choose q hqinit hq using hall\n  let z : ℝ → V := fun t => q (max t 0 + 1) t\n  have hagree (a : ℝ) (ha : 0 < a) : EqOn z (q a) (Ioo (-ε) a) := by\n    intro t ht\n    have hc : 0 < max t 0 + 1 := by linarith [le_max_right t (0 : ℝ)]\n    have hu : EqOn (q (max t 0 + 1)) (q a) (Ioo (-ε) (min (max t 0 + 1) a)) :=\n      unique_on_Ioo hF ⟨by linarith, lt_min hc ha⟩\n        (fun s hs => hq _ s ⟨hs.1, lt_of_lt_of_le hs.2 (min_le_left _ _)⟩)\n        (fun s hs => hq _ s ⟨hs.1, lt_of_lt_of_le hs.2 (min_le_right _ _)⟩)\n        ((hqinit _).trans (hqinit _).symm)\n    exact hu ⟨ht.1, lt_min (by linarith [le_max_left t (0 : ℝ)]) ht.2⟩\n  refine ⟨z, by dsimp [z]; exact hqinit _, fun t ht => ?_⟩\n  have hdom : t ∈ Ioo (-ε) (t + 1) := ⟨by linarith, by linarith⟩\n  have hh : z =ᶠ[𝓝 t] q (t + 1) := by\n    filter_upwards [Ioo_mem_nhds hdom.1 hdom.2] with s hs\n    exact hagree (t + 1) (by linarith) hs\n  rw [hh.eq_of_nhds]\n  exact (hq (t + 1) t hdom).congr_of_eventuallyEq hh","truncated":false,"comment":"Arbitrarily long compatible actual solutions give a forward-global solution."},{"id":415,"line":11,"statement":"theorem exists_global_solution {lam r u gamma target : ℝ} {b : ℝ × ℝ → ℝ}\n    (hb : ContDiff ℝ 1 b) (hlam : 0 < lam) (hgamma : 0 ≤ gamma)\n    (z₀ : ℝ × ℝ) (hinit : target ≤ E lam r u z₀.1 z₀.2) :\n    ∃ z : ℝ → ℝ × ℝ, z 0 = z₀ ∧\n      (∀ t : ℝ, 0 ≤ t → HasDerivAt z (vectorField lam r u gamma target b (z t)) t) ∧\n      (∀ t : ℝ, 0 ≤ t → target ≤ E lam r u (z t).1 (z t).2 ∧\n        E lam r u (z t).1 (z t).2 ≤ E lam r u z₀.1 z₀.2)","proof":"by\n  let K : Set (ℝ × ℝ) := {z | target ≤ E lam r u z.1 z.2 ∧\n    E lam r u z.1 z.2 ≤ E lam r u z₀.1 z₀.2}\n  have hK : IsCompact K :=\n    LinearInputCoercivity.isCompact_band hlam r u target (E lam r u z₀.1 z₀.2)\n  have hstart : z₀ ∈ K := ⟨hinit, le_refl _⟩\n  have hF : ContDiff ℝ 1 (vectorField lam r u gamma target b) :=\n    contDiff_vectorField hb lam r u gamma target\n  obtain ⟨ε, hε, hlocal⟩ := LinearInputCompactLocalExistence.exists_uniform_local_time hF hK\n  have hstay : ∀ (a : ℝ) (z : ℝ → ℝ × ℝ), z 0 = z₀ →\n      (∀ t ∈ Ioo (-ε) a,\n        HasDerivAt z (vectorField lam r u gamma target b (z t)) t) →\n      ∀ t : ℝ, 0 ≤ t → t < a → z t ∈ K := by\n    intro a z hz₀ hz t ht hta\n    have hi : target ≤ E lam r u (z 0).1 (z 0).2 := by simpa only [hz₀] using hinit\n    have he := LinearInputFiniteBand.energy_band_on_Ioo hgamma hε hz hi ht hta\n    simpa only [K, mem_ofPred_eq, hz₀] using he\n  obtain ⟨z, hz₀, hz⟩ :=\n    LinearInputGlobalContinuation.exists_forward_solution hF hstart hε hlocal hstay\n  refine ⟨z, hz₀, hz, fun t ht => ?_⟩\n  have hi : target ≤ E lam r u (z 0).1 (z 0).2 := by simpa only [hz₀] using hinit\n  have he := LinearInputFiniteBand.energy_band_on_Icc hgamma ht\n    (fun s hs => hz s hs.1) hi (show t ∈ Icc (0 : ℝ) t from ⟨ht, le_refl t⟩)\n  simpa only [hz₀] using he","truncated":false,"comment":"Every initial state above the target has an actual forward-global solution.\nThe compact band and the required uniform continuation time are derived."},{"id":416,"line":43,"statement":"theorem exists_global_coordinate_trajectory {lam r u gamma target : ℝ} {b : ℝ × ℝ → ℝ}\n    (hb : ContDiff ℝ 1 b) (hlam : 0 < lam) (hgamma : 0 ≤ gamma)\n    (x₀ y₀ : ℝ) (hinit : target ≤ E lam r u x₀ y₀) :\n    ∃ x y : ℝ → ℝ, x 0 = x₀ ∧ y 0 = y₀ ∧\n      IsTrajectory lam r u gamma target x y (fun t => b (x t, y t)) ∧\n      ∀ t : ℝ, 0 ≤ t → target ≤ E lam r u (x t) (y t) ∧\n        E lam r u (x t) (y t) ≤ E lam r u x₀ y₀","proof":"by\n  obtain ⟨z, hz₀, hz, hband⟩ := exists_global_solution hb hlam hgamma (x₀, y₀) hinit\n  refine ⟨fun t => (z t).1, fun t => (z t).2,\n    congrArg Prod.fst hz₀, congrArg Prod.snd hz₀, ?_, hband⟩\n  exact isTrajectory_of_global_solution hz","truncated":false,"comment":"The existing coordinate trajectory predicate now has actual global inhabitants."},{"id":417,"line":56,"statement":"theorem exists_global_solution_one_add_sq {lam r u gamma target : ℝ}\n    {Q : ℝ × ℝ → ℝ} (hQ : ContDiff ℝ 1 Q) (hlam : 0 < lam) (hgamma : 0 ≤ gamma)\n    (z₀ : ℝ × ℝ) (hinit : target ≤ E lam r u z₀.1 z₀.2) :\n    ∃ z : ℝ → ℝ × ℝ, z 0 = z₀ ∧\n      (∀ t : ℝ, 0 ≤ t →\n        HasDerivAt z (vectorField lam r u gamma target (fun q => 1 + Q q ^ 2) (z t)) t) ∧\n      (∀ t : ℝ, 0 ≤ t → target ≤ E lam r u (z t).1 (z t).2 ∧\n        E lam r u (z t).1 (z t).2 ≤ E lam r u z₀.1 z₀.2)","proof":"exists_global_solution (contDiff_const.add (hQ.pow 2)) hlam hgamma z₀ hinit","truncated":false,"comment":"The original positive tangential coefficient admits actual forward-global solutions."},{"id":418,"line":22,"statement":"theorem solution_unique_on_Icc {F : V → V} {a c : ℝ}\n    {z w : ℝ → V} (hF : ContDiff ℝ 1 F)\n    (hz : ∀ t ∈ Icc a c, HasDerivAt z (F (z t)) t)\n    (hw : ∀ t ∈ Icc a c, HasDerivAt w (F (w t)) t)\n    (heq : z a = w a) : EqOn z w (Icc a c)","proof":"by\n  have hzc : ContinuousOn z (Icc a c) :=\n    fun t ht => (hz t ht).continuousAt.continuousWithinAt\n  have hwc : ContinuousOn w (Icc a c) :=\n    fun t ht => (hw t ht).continuousAt.continuousWithinAt\n  let K : Set V := z '' Icc a c ∪ w '' Icc a c\n  have hK : IsCompact K :=\n    (isCompact_Icc.image_of_continuousOn hzc).union\n      (isCompact_Icc.image_of_continuousOn hwc)\n  obtain ⟨L, hL⟩ := LocallyLipschitzOn.exists_lipschitzOnWith_of_compact hK\n    hF.locallyLipschitz.locallyLipschitzOn\n  apply ODE_solution_unique_of_mem_Icc_right (v := fun _ => F) (s := fun _ => K)\n    (K := L) (fun _ _ => hL) hzc\n    (fun t ht => (hz t ⟨ht.1, ht.2.le⟩).hasDerivWithinAt) ?_ hwc\n    (fun t ht => (hw t ⟨ht.1, ht.2.le⟩).hasDerivWithinAt) ?_ heq\n  · intro t ht\n    exact Or.inl ⟨t, ⟨ht.1, ht.2.le⟩, rfl⟩\n  · intro t ht\n    exact Or.inr ⟨t, ⟨ht.1, ht.2.le⟩, rfl⟩","truncated":false,"comment":"Two actual solutions of a C¹ vector field with the same initial value\nagree on a closed time interval.  Their own compact images supply the common\nLipschitz set; neither an energy band nor a global Lipschitz bound is assumed."},{"id":419,"line":48,"statement":"theorem solution_unique_on_Ici {F : V → V} {a : ℝ}\n    {z w : ℝ → V} (hF : ContDiff ℝ 1 F)\n    (hz : ∀ t ∈ Ici a, HasDerivAt z (F (z t)) t)\n    (hw : ∀ t ∈ Ici a, HasDerivAt w (F (w t)) t)\n    (heq : z a = w a) : EqOn z w (Ici a)","proof":"by\n  intro t ht\n  exact solution_unique_on_Icc hF\n    (fun s hs => hz s hs.1) (fun s hs => hw s hs.1) heq ⟨ht, le_refl t⟩","truncated":false,"comment":"The finite-interval uniqueness theorem gives uniqueness on a forward\nhalf-line.  No assumptions are made about the negative-time extensions."},{"id":420,"line":59,"statement":"theorem feedback_solution_unique_on_Icc {b : ℝ × ℝ → ℝ}\n    (hb : ContDiff ℝ 1 b) {lam r u gamma target a c : ℝ} {z w : ℝ → ℝ × ℝ}\n    (hz : ∀ t ∈ Icc a c,\n      HasDerivAt z (vectorField lam r u gamma target b (z t)) t)\n    (hw : ∀ t ∈ Icc a c,\n      HasDerivAt w (vectorField lam r u gamma target b (w t)) t)\n    (heq : z a = w a) : EqOn z w (Icc a c)","proof":"solution_unique_on_Icc (contDiff_vectorField hb lam r u gamma target) hz hw heq","truncated":false,"comment":"The feedback vector solutions are unique on every finite forward interval,\nfor every real parameter choice and every C¹ autonomous tangential coefficient."},{"id":421,"line":70,"statement":"theorem feedback_solution_unique_on_Ici {b : ℝ × ℝ → ℝ}\n    (hb : ContDiff ℝ 1 b) {lam r u gamma target : ℝ} {z w : ℝ → ℝ × ℝ}\n    (hz : ∀ t ∈ Ici (0 : ℝ),\n      HasDerivAt z (vectorField lam r u gamma target b (z t)) t)\n    (hw : ∀ t ∈ Ici (0 : ℝ),\n      HasDerivAt w (vectorField lam r u gamma target b (w t)) t)\n    (heq : z 0 = w 0) : EqOn z w (Ici (0 : ℝ))","proof":"solution_unique_on_Ici (contDiff_vectorField hb lam r u gamma target) hz hw heq","truncated":false,"comment":"Supplied feedback vector solutions with the same initial state agree for\nall nonnegative times.  Existence remains a separate assertion."},{"id":422,"line":81,"statement":"theorem coordinate_solution_unique_on_Ici {b : ℝ × ℝ → ℝ}\n    (hb : ContDiff ℝ 1 b) {lam r u gamma target : ℝ}\n    {x₁ y₁ x₂ y₂ : ℝ → ℝ}\n    (h₁ : IsTrajectory lam r u gamma target x₁ y₁ (fun t => b (x₁ t, y₁ t)))\n    (h₂ : IsTrajectory lam r u gamma target x₂ y₂ (fun t => b (x₂ t, y₂ t)))\n    (hx : x₁ 0 = x₂ 0) (hy : y₁ 0 = y₂ 0) :\n    EqOn x₁ x₂ (Ici (0 : ℝ)) ∧ EqOn y₁ y₂ (Ici (0 : ℝ))","proof":"by\n  have heq : EqOn (fun t => (x₁ t, y₁ t)) (fun t => (x₂ t, y₂ t)) (Ici (0 : ℝ)) :=\n    feedback_solution_unique_on_Ici hb\n      (fun t ht => hasDerivAt_vectorField_iff.mpr (h₁ t ht))\n      (fun t ht => hasDerivAt_vectorField_iff.mpr (h₂ t ht)) (Prod.ext hx hy)\n  exact ⟨fun _ ht => congrArg Prod.fst (heq ht),\n    fun _ ht => congrArg Prod.snd (heq ht)⟩","truncated":false,"comment":"The same uniqueness statement in the original coordinate trajectory\npredicate.  Both curves use the same state-dependent coefficient b."},{"id":423,"line":10,"statement":"theorem exists_global_convergent_solution {lam r u gamma target : ℝ}\n    {b : ℝ × ℝ → ℝ} (hb : ContDiff ℝ 1 b)\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (z₀ : ℝ × ℝ) (hinit : target ≤ E lam r u z₀.1 z₀.2) :\n    ∃ z : ℝ → ℝ × ℝ, z 0 = z₀ ∧\n      (∀ t : ℝ, 0 ≤ t → HasDerivAt z (vectorField lam r u gamma target b (z t)) t) ∧\n      (∀ t : ℝ, 0 ≤ t →\n        0 ≤ E lam r u (z t).1 (z t).2 - target ∧\n        E lam r u (z t).1 (z t).2 - target ≤\n          (E lam r u z₀.1 z₀.2 - target) * Real.exp\n            (-(gamma * gradientLowerBound lam r u target (E lam r u z₀.1 z₀.2)) * t)) ∧\n      Tendsto (fun t => E lam r u (z t).1 (z t).2) atTop (𝓝 target)","proof":"by\n  obtain ⟨z, hz₀, hz, _⟩ := LinearInputGlobalTrajectory.exists_global_solution\n    hb hlam hgamma.le z₀ hinit\n  have htraj := isTrajectory_of_global_solution hz\n  have hi : target ≤ E lam r u (z 0).1 (z 0).2 := by simpa only [hz₀] using hinit\n  obtain ⟨_, _, _, hlimit⟩ := LinearInputInvariance.energy_convergence_of_initial\n    hlam hgamma htarget htraj hi\n  refine ⟨z, hz₀, hz, ?_, hlimit⟩\n  intro t ht\n  simpa only [hz₀] using energy_error_exponential_of_initial\n    hlam hgamma.le htarget htraj hi ht","truncated":false,"comment":"Actual global existence and the explicit convergence bound in one theorem."},{"id":424,"line":35,"statement":"theorem exists_global_injective_convergent_solution {lam r u gamma target : ℝ}\n    {b : ℝ × ℝ → ℝ} (hb : ContDiff ℝ 1 b)\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (z₀ : ℝ × ℝ) (hinit : target < E lam r u z₀.1 z₀.2) :\n    ∃ z : ℝ → ℝ × ℝ, z 0 = z₀ ∧\n      (∀ t : ℝ, 0 ≤ t → HasDerivAt z (vectorField lam r u gamma target b (z t)) t) ∧\n      (∀ t : ℝ, 0 ≤ t → target < E lam r u (z t).1 (z t).2) ∧\n      StrictAntiOn (fun t => E lam r u (z t).1 (z t).2) (Ici (0 : ℝ)) ∧\n      InjOn z (Ici (0 : ℝ)) ∧\n      Tendsto (fun t => E lam r u (z t).1 (z t).2) atTop (𝓝 target)","proof":"by\n  obtain ⟨z, hz₀, hz, _, hlimit⟩ := exists_global_convergent_solution\n    hb hlam hgamma htarget z₀ hinit.le\n  have htraj := isTrajectory_of_global_solution hz\n  have hi : target < E lam r u (z 0).1 (z 0).2 := by simpa only [hz₀] using hinit\n  refine ⟨z, hz₀, hz, ?_,\n    LinearInputStrictEnergy.energy_strictAntiOn hlam hgamma htarget htraj hi,\n    ?_, hlimit⟩\n  · intro t ht\n    exact LinearInputStrictEnergy.energy_strictly_above_target htraj hi ht\n  · simpa only [Prod.eta] using\n      LinearInputStrictEnergy.trajectory_injOn hlam hgamma htarget htraj hi","truncated":false,"comment":"Above the target, the constructed convergent global solution is injective in time."},{"id":425,"line":14,"statement":"theorem radial_gradient_lower_bound {lam : ℝ} (hlam : 0 < lam)\n    (r u x y : ℝ) :\n    E lam r u x y - (max (-r) 0) ^ 2 / (12 * lam) ≤\n      x * gx lam r u x y + y * gy x y","proof":"by\n  have hi := energy_gradient_identity lam r u x y\n  have hb := reduced_energy_bound hlam r x\n  have hy : y * gy x y = Real.sqrt 2 * x * gy x y + (gy x y) ^ 2 := by\n    unfold gy\n    ring\n  nlinarith [sq_nonneg (gy x y)]","truncated":false,"comment":""},{"id":426,"line":25,"statement":"theorem radial_gradient_pos {lam r u x y : ℝ} (hlam : 0 < lam)\n    (he : (max (-r) 0) ^ 2 / (12 * lam) < E lam r u x y) :\n    0 < x * gx lam r u x y + y * gy x y","proof":"by\n  linarith [radial_gradient_lower_bound hlam r u x y]","truncated":false,"comment":""},{"id":427,"line":30,"statement":"theorem quadratic_remainder_bound {lam : ℝ} (hlam : 0 < lam)\n    (r : ℝ) {q : ℝ} (hq : 0 ≤ q) :\n    -3 * lam * q ^ 2 / 4 - r * q / 2 ≤ (max (-r) 0) ^ 2 / (12 * lam)","proof":"by\n  have h := reduced_energy_bound hlam r (Real.sqrt q)\n  have h4 : (Real.sqrt q) ^ 4 = q ^ 2 := by\n    rw [show (Real.sqrt q) ^ 4 = ((Real.sqrt q) ^ 2) ^ 2 by ring, Real.sq_sqrt hq]\n  simpa only [h4, Real.sq_sqrt hq] using h","truncated":false,"comment":""},{"id":428,"line":39,"statement":"theorem energy_outward_scaling {lam : ℝ} (hlam : 0 < lam)\n    (r u x y : ℝ) {t : ℝ} (ht : 1 ≤ t) :\n    t * (E lam r u x y - (max (-r) 0) ^ 2 / (12 * lam)) ≤\n      E lam r u (t * x) (t * y) - (max (-r) 0) ^ 2 / (12 * lam)","proof":"by\n  let B := (max (-r) 0) ^ 2 / (12 * lam)\n  have hb := quadratic_remainder_bound hlam r (q := t * x ^ 2) (by positivity)\n  have hi : E lam r u (t*x) (t*y) - B - t * (E lam r u x y - B) =\n      (t - 1) * (B + 3 * lam * (t * x ^ 2) ^ 2 / 4 + r * (t * x ^ 2) / 2 +\n        lam * t * (t - 1) ^ 2 * x ^ 4 / 4 + t * (y - Real.sqrt 2 * x) ^ 2 / 2) := by\n    unfold E f\n    ring\n  have hn : 0 ≤ B + 3 * lam * (t * x ^ 2) ^ 2 / 4 + r * (t * x ^ 2) / 2 := by\n    change -3 * lam * (t * x ^ 2) ^ 2 / 4 - r * (t * x ^ 2) / 2 ≤ B at hb\n    linarith\n  have hp : 0 ≤ lam * t * (t - 1) ^ 2 * x ^ 4 / 4 + t * (y - Real.sqrt 2 * x) ^ 2 / 2 := by\n    positivity\n  have hm := mul_nonneg (sub_nonneg.mpr ht) (add_nonneg hn hp)\n  change t * (E lam r u x y - B) ≤ E lam r u (t*x) (t*y) - B\n  linarith","truncated":false,"comment":"Outside the critical-value threshold, outward dilation strictly raises energy."},{"id":429,"line":59,"statement":"theorem energy_outward_strict {lam r u x y t : ℝ} (hlam : 0 < lam)\n    (he : (max (-r) 0) ^ 2 / (12 * lam) < E lam r u x y) (ht : 1 < t) :\n    E lam r u x y < E lam r u (t*x) (t*y)","proof":"by\n  have hs := energy_outward_scaling hlam r u x y (le_of_lt ht)\n  have hp := mul_pos (sub_pos.mpr ht) (sub_pos.mpr he)\n  nlinarith","truncated":false,"comment":""},{"id":430,"line":67,"statement":"theorem existsUnique_positive_radius {lam r u e x y : ℝ} (hlam : 0 < lam)\n    (he : (max (-r) 0) ^ 2 / (12 * lam) < e) (hz : x ≠ 0 ∨ y ≠ 0) :\n    ∃! t : ℝ, 0 < t ∧ E lam r u (t*x) (t*y) = e","proof":"by\n  have hB : 0 ≤ (max (-r) 0) ^ 2 / (12 * lam) := by positivity\n  have he0 : 0 < e := lt_of_le_of_lt hB he\n  let q := x ^ 2 + (y - Real.sqrt 2 * x) ^ 2 / 2\n  have hq : 0 < q := by\n    dsimp [q]\n    rcases hz with hx | hy\n    · nlinarith [sq_pos_of_ne_zero hx, sq_nonneg (y - Real.sqrt 2 * x)]\n    · by_cases hx : x = 0\n      · have hysq := sq_pos_of_ne_zero hy\n        simpa [hx] using (div_pos hysq (by norm_num : (0 : ℝ) < 2))\n      · nlinarith [sq_pos_of_ne_zero hx, sq_nonneg (y - Real.sqrt 2 * x)]\n  let T := Real.sqrt ((max (e + lowerBoundConstant lam r u) 0 + 1) / q)\n  have hT : 0 < T := Real.sqrt_pos.2 (div_pos (by positivity) hq)\n  have hTsq : T ^ 2 * q = max (e + lowerBoundConstant lam r u) 0 + 1 := by\n    dsimp [T]\n    rw [Real.sq_sqrt (by positivity)]\n    field_simp\n  have hout : e < E lam r u (T*x) (T*y) := by\n    have hc := coercive_lower_bound hlam r u (T*x) (T*y)\n    have hi : (T*x)^2 + (T*y - Real.sqrt 2*(T*x))^2/2 = T^2*q := by dsimp [q]; ring\n    rw [hi, hTsq] at hc\n    have hm := le_max_left (e + lowerBoundConstant lam r u) 0\n    linarith\n  have hcont : Continuous (fun t : ℝ => E lam r u (t*x) (t*y)) := by unfold E f; fun_prop\n  have hzE : E lam r u (0*x) (0*y) = 0 := by simp [E, f]\n  obtain ⟨t, ht, hte⟩ := intermediate_value_Icc (le_of_lt hT) hcont.continuousOn\n    (show e ∈ Set.Icc (E lam r u (0*x) (0*y)) (E lam r u (T*x) (T*y)) by\n      rw [hzE]; exact ⟨le_of_lt he0, le_of_lt hout⟩)\n  change E lam r u (t*x) (t*y) = e at hte\n  have htpos : 0 < t := by\n    have htne : t ≠ 0 := by intro h; rw [h, hzE] at hte; linarith\n    exact lt_of_le_of_ne ht.1 (Ne.symm htne)\n  refine ⟨t, ⟨htpos, hte⟩, ?_⟩\n  intro a ha\n  rcases lt_trichotomy a t with hat | hat | hat\n  · have hratio : 1 < t / a := (lt_div_iff₀ ha.1).2 (by simpa using hat)\n    have hh := energy_outward_strict hlam (by rwa [ha.2]) hratio\n    have hx : (t/a)*(a*x) = t*x := by field_simp [ne_of_gt ha.1]\n    have hy : (t/a)*(a*y) = t*y := by field_simp [ne_of_gt ha.1]\n    rw [hx, hy, ha.2, hte] at hh\n    exact (lt_irrefl e hh).elim\n  · exact hat\n  · have hratio : 1 < a / t := (lt_div_iff₀ htpos).2 (by simpa using hat)\n    have hh := energy_outward_strict hlam (by rwa [hte]) hratio\n    have hx : (a/t)*(t*x) = a*x := by field_simp [ne_of_gt htpos]\n    have hy : (a/t)*(t*y) = a*y := by field_simp [ne_of_gt htpos]\n    rw [hx, hy, ha.2, hte] at hh\n    exact (lt_irrefl e hh).elim","truncated":false,"comment":"Each nonzero ray meets each energy level above the threshold exactly once."},{"id":431,"line":124,"statement":"theorem radius_pos {z : ℝ × ℝ} (hz : z.1 ≠ 0 ∨ z.2 ≠ 0) : 0 < radius z","proof":"by\n  apply Real.sqrt_pos.2\n  rcases hz with h | h\n  · nlinarith [sq_pos_of_ne_zero h, sq_nonneg z.2]\n  · nlinarith [sq_pos_of_ne_zero h, sq_nonneg z.1]","truncated":false,"comment":""},{"id":432,"line":130,"statement":"theorem radius_pos_of_energy {lam r u : ℝ} (hlam : 0 < lam) {z : ℝ × ℝ}\n    (he : (max (-r) 0) ^ 2 / (12 * lam) < E lam r u z.1 z.2) : 0 < radius z",
