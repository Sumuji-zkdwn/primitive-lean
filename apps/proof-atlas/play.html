 : ContDiff ℝ 2 kappa)\n    (heq : k * deriv (deriv kappa) s + k * (kappa s) ^ 3 / 2 - sigma * kappa s = 0) :\n    HasDerivAt kappa (gy (kappa s) (deriv kappa s + Real.sqrt 2 * kappa s)) s ∧\n    HasDerivAt (fun t => deriv kappa t + Real.sqrt 2 * kappa t)\n      (-gx (1 / 2) (-sigma / k) 0 (kappa s)\n        (deriv kappa s + Real.sqrt 2 * kappa s)) s","proof":"by\n  exact forced_phase_hasDerivAt hk hκ (by simpa only [mul_zero] using heq)","truncated":false,"comment":"The unforced classical elastica curvature equation gives the zero-input phase system."},{"id":291,"line":65,"statement":"theorem forced_curvature_of_phase {k sigma u s : ℝ} {kappa : ℝ → ℝ}\n    (hk : k ≠ 0) (hκ : ContDiff ℝ 2 kappa)\n    (hy : HasDerivAt (fun t => deriv kappa t + Real.sqrt 2 * kappa t)\n      (-gx (1 / 2) (-sigma / k) u (kappa s)\n        (deriv kappa s + Real.sqrt 2 * kappa s)) s) :\n    k * deriv (deriv kappa) s + k * (kappa s) ^ 3 / 2 - sigma * kappa s = k * u","proof":"by\n  have hx := (hκ.differentiable (by norm_num) s).hasDerivAt\n  have hp := (hκ.differentiable_deriv_two s).hasDerivAt\n  have h := hy.unique (hp.add (hx.const_mul (Real.sqrt 2)))\n  rw [gx_shear] at h\n  have hmul := congrArg (fun q : ℝ => k * q) h\n  field_simp at hmul\n  nlinarith [hmul]","truncated":false,"comment":"Conversely the phase velocities imply the same forced curvature equation.\nThe derivative here is the actual derivative of the sheared curvature curve."},{"id":292,"line":80,"statement":"theorem forced_energy_hasDerivAt_zero {k sigma u s : ℝ} {kappa : ℝ → ℝ}\n    (hk : k ≠ 0) (hκ : ContDiff ℝ 2 kappa)\n    (heq : k * deriv (deriv kappa) s + k * (kappa s) ^ 3 / 2 - sigma * kappa s = k * u) :\n    HasDerivAt (fun t => E (1 / 2) (-sigma / k) u (kappa t)\n      (deriv kappa t + Real.sqrt 2 * kappa t)) 0 s","proof":"by\n  obtain ⟨hx, hy⟩ := forced_phase_hasDerivAt hk hκ heq\n  convert hasDerivAt_energy_curve (1 / 2) (-sigma / k) hx hy (hasDerivAt_const s u) using 1\n  ring","truncated":false,"comment":"The actual derivative of the energy vanishes along a fixed-input phase curve."},{"id":293,"line":89,"statement":"theorem energy_hasDerivAt_zero {k sigma s : ℝ} {kappa : ℝ → ℝ}\n    (hk : k ≠ 0) (hκ : ContDiff ℝ 2 kappa)\n    (heq : k * deriv (deriv kappa) s + k * (kappa s) ^ 3 / 2 - sigma * kappa s = 0) :\n    HasDerivAt (fun t => E (1 / 2) (-sigma / k) 0 (kappa t)\n      (deriv kappa t + Real.sqrt 2 * kappa t)) 0 s","proof":"by\n  exact forced_energy_hasDerivAt_zero hk hκ (by simpa only [mul_zero] using heq)","truncated":false,"comment":""},{"id":294,"line":97,"statement":"theorem forced_energy_constant {k sigma u a b : ℝ} {kappa : ℝ → ℝ}\n    (hk : k ≠ 0) (hκ : ContDiff ℝ 2 kappa)\n    (heq : ∀ s ∈ Ioo a b,\n      k * deriv (deriv kappa) s + k * (kappa s) ^ 3 / 2 - sigma * kappa s = k * u) :\n    ∃ c : ℝ, ∀ s ∈ Ioo a b,\n      E (1 / 2) (-sigma / k) u (kappa s)\n        (deriv kappa s + Real.sqrt 2 * kappa s) = c","proof":"by\n  apply isOpen_Ioo.exists_is_const_of_deriv_eq_zero (convex_Ioo a b).isPreconnected\n  · intro s hs\n    exact (forced_energy_hasDerivAt_zero hk hκ (heq s hs)).differentiableAt.differentiableWithinAt\n  · intro s hs\n    exact (forced_energy_hasDerivAt_zero hk hκ (heq s hs)).deriv","truncated":false,"comment":"A connected open interval turns the actual vanishing derivative into a conserved value."},{"id":295,"line":110,"statement":"theorem energy_constant {k sigma a b : ℝ} {kappa : ℝ → ℝ}\n    (hk : k ≠ 0) (hκ : ContDiff ℝ 2 kappa)\n    (heq : ∀ s ∈ Ioo a b,\n      k * deriv (deriv kappa) s + k * (kappa s) ^ 3 / 2 - sigma * kappa s = 0) :\n    ∃ c : ℝ, ∀ s ∈ Ioo a b,\n      E (1 / 2) (-sigma / k) 0 (kappa s)\n        (deriv kappa s + Real.sqrt 2 * kappa s) = c","proof":"by\n  exact forced_energy_constant hk hκ (fun s hs => by simpa only [mul_zero] using heq s hs)","truncated":false,"comment":""},{"id":296,"line":18,"statement":"theorem energy_linear_density {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (u : ℝ) :\n    energy (fun q => ε q - u * q) θ ℓ =\n      energy ε θ ℓ - u * (θ ℓ - θ 0)","proof":"by\n  have h := energy_affine_density hε hθ (-u) 0 ℓ\n  simpa only [neg_mul, add_neg_cancel, zero_mul, add_zero, sub_eq_add_neg] using h","truncated":false,"comment":"A curvature-linear density changes the actual energy only by the endpoint\nangle difference.  Here the endpoint angles are real-valued lifts."},{"id":297,"line":27,"statement":"theorem stationary_linear_density_iff {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (u : ℝ) :\n    Stationary (fun q => ε q - u * q) θ ℓ ↔ Stationary ε θ ℓ","proof":"by\n  simpa only [neg_mul, add_zero, sub_eq_add_neg] using\n    stationary_affine_density_iff hε hθ (-u) 0","truncated":false,"comment":"Fixed endpoint-angle variations have the same actual derivative\nstationarity after adding a curvature-linear density."},{"id":298,"line":35,"statement":"theorem locallyMinimizing_linear_density_iff {ε θ : ℝ → ℝ} {ℓ : ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (u : ℝ) :\n    LocallyMinimizing (fun q => ε q - u * q) θ ℓ ↔\n      LocallyMinimizing ε θ ℓ","proof":"by\n  simpa only [neg_mul, add_zero, sub_eq_add_neg] using\n    locallyMinimizing_affine_density_iff hε hθ (-u) 0","truncated":false,"comment":"The original constrained local-minimum predicate is unchanged by this\nlinear density, including its original C¹ neighborhood definition."},{"id":299,"line":44,"statement":"theorem stationary_quadratic_curvature {θ : ℝ → ℝ} {ℓ k : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hstat : Stationary (fun q => k * q ^ 2 / 2) θ ℓ) :\n    ∃ σ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      k * deriv (deriv (deriv θ)) s + k * (deriv θ s) ^ 3 / 2 -\n        σ * deriv θ s = 0","proof":"by\n  obtain ⟨lam, μ, σ, heq⟩ :=\n    stationary_angle_firstIntegral_curvature hℓ (by fun_prop) hθ hstat\n  refine ⟨σ, fun s hs => ?_⟩\n  exact quadratic_curvature_equation (hθ.deriv' (n := 2)) (heq s hs).2.2","truncated":false,"comment":"The actual constrained stationarity theorem supplies the classical\ncurvature equation; it is not assumed as extra input."},{"id":300,"line":57,"statement":"theorem stationary_quadratic_phase_energy {θ : ℝ → ℝ} {ℓ k : ℝ}\n    (hℓ : 0 < ℓ) (hk : 0 < k) (hθ : ContDiff ℝ 3 θ)\n    (hstat : Stationary (fun q => k * q ^ 2 / 2) θ ℓ) :\n    ∃ σ c : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      E (1 / 2) (-σ / k) 0 (deriv θ s)\n        (deriv (deriv θ) s + sqrt 2 * deriv θ s) = c ∧\n      HasDerivAt (deriv θ)\n        (gy (deriv θ s) (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s ∧\n      HasDerivAt (fun t => deriv (deriv θ) t + sqrt 2 * deriv θ t)\n        (-gx (1 / 2) (-σ / k) 0 (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s","proof":"by\n  obtain ⟨σ, heq⟩ := stationary_quadratic_curvature hℓ hθ hstat\n  have hκ : ContDiff ℝ 2 (deriv θ) := hθ.deriv' (n := 2)\n  obtain ⟨c, hc⟩ := LinearInputCurvatureBridge.energy_constant (ne_of_gt hk) hκ heq\n  refine ⟨σ, c, fun s hs => ⟨hc s hs, ?_⟩⟩\n  exact LinearInputCurvatureBridge.phase_hasDerivAt (ne_of_gt hk) hκ (heq s hs)","truncated":false,"comment":"Actual constrained stationarity produces the quartic phase energy and its\nHamiltonian equations along arc length.  The phase input is exactly zero."},{"id":301,"line":78,"statement":"theorem locallyMinimizing_linear_quadratic_phase_energy\n    {θ : ℝ → ℝ} {ℓ k u : ℝ}\n    (hℓ : 0 < ℓ) (hk : 0 < k) (hθ : ContDiff ℝ 3 θ)\n    (hne : ¬ ∀ s ∈ Icc 0 ℓ, θ s = θ 0)\n    (hmin : LocallyMinimizing (fun q => k * q ^ 2 / 2 - u * q) θ ℓ) :\n    ∃ σ c : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      E (1 / 2) (-σ / k) 0 (deriv θ s)\n        (deriv (deriv θ) s + sqrt 2 * deriv θ s) = c ∧\n      HasDerivAt (deriv θ)\n        (gy (deriv θ s) (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s ∧\n      HasDerivAt (fun t => deriv (deriv θ) t + sqrt 2 * deriv θ t)\n        (-gx (1 / 2) (-σ / k) 0 (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s","proof":"by\n  have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n  have hmin0 : LocallyMinimizing (fun q => k * q ^ 2 / 2) θ ℓ :=\n    (locallyMinimizing_linear_density_iff (by fun_prop) hθ1 u).mp hmin\n  have hstat := locallyMinimizing_stationary_of_nonstraight hℓ (by fun_prop) hθ1\n    (exists_nonzero_curvature_of_nonconstant hℓ hθ1 hne) hmin0\n  exact stationary_quadratic_phase_energy hℓ hk hθ hstat","truncated":false,"comment":"A nonstraight constrained local minimum of the quadratic density with\nany curvature-linear addition yields the same unforced quartic phase system.\nNeither stationarity nor the curvature equation is supplied as a hypothesis.\nThe constant σ is chosen for the quadratic representative of the density."},{"id":302,"line":12,"statement":"theorem feedback_rate (px py gamma gap b : ℝ) :\n    px * (-gamma * gap * px - b * py) +\n      py * (-gamma * gap * py + b * px) =\n        -gamma * gap * (px ^ 2 + py ^ 2)","proof":"by\n  ring","truncated":false,"comment":"Every feedback velocity satisfies the chosen energy-rate identity."},{"id":303,"line":19,"statement":"theorem feedback_coefficient {px py : ℝ} (hpos : 0 < px ^ 2 + py ^ 2)\n    (gamma gap b : ℝ) :\n    (px * (-gamma * gap * py + b * px) -\n      py * (-gamma * gap * px - b * py)) / (px ^ 2 + py ^ 2) = b","proof":"by\n  apply (div_eq_iff (ne_of_gt hpos)).2\n  ring","truncated":false,"comment":"At a regular point the coefficient is recovered by the oriented area."},{"id":304,"line":27,"statement":"theorem decomposition_of_rate {px py vx vy gamma gap : ℝ}\n    (hpos : 0 < px ^ 2 + py ^ 2)\n    (hrate : px * vx + py * vy = -gamma * gap * (px ^ 2 + py ^ 2)) :\n    vx = -gamma * gap * px -\n        ((px * vy - py * vx) / (px ^ 2 + py ^ 2)) * py ∧\n      vy = -gamma * gap * py +\n        ((px * vy - py * vx) / (px ^ 2 + py ^ 2)) * px","proof":"by\n  have hn : px ^ 2 + py ^ 2 ≠ 0 := ne_of_gt hpos\n  constructor\n  · field_simp\n    nlinarith [congrArg (fun q : ℝ => q * px) hrate]\n  · field_simp\n    nlinarith [congrArg (fun q : ℝ => q * py) hrate]","truncated":false,"comment":"The scalar rate constraint gives the explicit tangential decomposition."},{"id":305,"line":43,"statement":"theorem rate_iff_exists_unique_feedback {px py vx vy gamma gap : ℝ}\n    (hpos : 0 < px ^ 2 + py ^ 2) :\n    (px * vx + py * vy = -gamma * gap * (px ^ 2 + py ^ 2)) ↔\n      ∃! b : ℝ, vx = -gamma * gap * px - b * py ∧\n        vy = -gamma * gap * py + b * px","proof":"by\n  constructor\n  · intro hrate\n    refine ⟨(px * vy - py * vx) / (px ^ 2 + py ^ 2),\n      decomposition_of_rate hpos hrate, ?_⟩\n    intro b hb\n    rw [hb.1, hb.2]\n    exact (feedback_coefficient hpos gamma gap b).symm\n  · rintro ⟨b, hb, _⟩\n    rw [hb.1, hb.2]\n    exact feedback_rate px py gamma gap b","truncated":false,"comment":"The coefficient is unique for each velocity, although the rate law allows\nevery coefficient and thus does not select a velocity."},{"id":306,"line":61,"statement":"theorem zero_gradient_rate (vx vy gamma gap : ℝ) :\n    (0 : ℝ) * vx + 0 * vy = -gamma * gap * (0 ^ 2 + 0 ^ 2)","proof":"by\n  ring","truncated":false,"comment":"Without a regularity hypothesis the rate constraint imposes no velocity\nrestriction at a zero gradient."},{"id":307,"line":66,"statement":"theorem zero_gradient_feedback_iff (vx vy gamma gap : ℝ) :\n    (∃ b : ℝ, vx = -gamma * gap * 0 - b * 0 ∧\n      vy = -gamma * gap * 0 + b * 0) ↔ vx = 0 ∧ vy = 0","proof":"by\n  simp","truncated":false,"comment":"At a zero gradient the feedback expression only represents zero velocity."},{"id":308,"line":73,"statement":"theorem zero_gradient_counterexample (gamma gap : ℝ) :\n    (0 : ℝ) * 1 + 0 * 0 = -gamma * gap * (0 ^ 2 + 0 ^ 2) ∧\n      ¬ ∃ b : ℝ, (1 : ℝ) = -gamma * gap * 0 - b * 0 ∧\n        (0 : ℝ) = -gamma * gap * 0 + b * 0","proof":"by\n  norm_num","truncated":false,"comment":"The unit horizontal velocity is an exact obstruction to extending the\ndecomposition equivalence across zero gradients."},{"id":309,"line":81,"statement":"theorem energy_rate_iff_exists_unique_feedback {lam r u x y vx vy gamma target : ℝ}\n    (hpos : 0 < gSq lam r u x y) :\n    (gx lam r u x y * vx + gy x y * vy =\n      -gamma * (E lam r u x y - target) * gSq lam r u x y) ↔\n      ∃! b : ℝ,\n        vx = -gamma * (E lam r u x y - target) * gx lam r u x y - b * gy x y ∧\n        vy = -gamma * (E lam r u x y - target) * gy x y + b * gx lam r u x y","proof":"by\n  exact rate_iff_exists_unique_feedback hpos","truncated":false,"comment":"Instantiation uses the actual polynomial partial derivatives proved in\nLinearInputGradient, without assuming a derivative formula."},{"id":310,"line":92,"statement":"theorem hasDerivAt_energy_iff_exists_unique_feedback\n    {x y : ℝ → ℝ} {t vx vy lam r u gamma target : ℝ}\n    (hx : HasDerivAt x vx t) (hy : HasDerivAt y vy t)\n    (hpos : 0 < gSq lam r u (x t) (y t)) :\n    HasDerivAt (fun s => E lam r u (x s) (y s))\n      (-gamma * (E lam r u (x t) (y t) - target) *\n        gSq lam r u (x t) (y t)) t ↔\n      ∃! b : ℝ,\n        vx = -gamma * (E lam r u (x t) (y t) - target) *\n          gx lam r u (x t) (y t) - b * gy (x t) (y t) ∧\n        vy = -gamma * (E lam r u (x t) (y t) - target) *\n          gy (x t) (y t) + b * gx lam r u (x t) (y t)","proof":"by\n  have hd : HasDerivAt (fun s => E lam r u (x s) (y s))\n      (gx lam r u (x t) (y t) * vx + gy (x t) (y t) * vy) t := by\n    simpa only [mul_zero, sub_zero] using\n      hasDerivAt_energy_curve lam r hx hy (hasDerivAt_const t u)\n  rw [← energy_rate_iff_exists_unique_feedback hpos]\n  constructor\n  · intro h\n    exact hd.unique h\n  · intro h\n    rwa [h] at hd","truncated":false,"comment":"The same equivalence expressed as an actual derivative along a curve,\nusing the already proved polynomial chain rule and uniqueness of derivatives."},{"id":311,"line":116,"statement":"theorem energy_rate_iff_exists_unique_feedback_on_band\n    {lam r u x y vx vy gamma target : ℝ} (hlam : 0 < lam)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (he : target ≤ E lam r u x y) :\n    (gx lam r u x y * vx + gy x y * vy =\n      -gamma * (E lam r u x y - target) * gSq lam r u x y) ↔\n      ∃! b : ℝ,\n        vx = -gamma * (E lam r u x y - target) * gx lam r u x y - b * gy x y ∧\n        vy = -gamma * (E lam r u x y - target) * gy x y + b * gx lam r u x y","proof":"by\n  exact energy_rate_iff_exists_unique_feedback (gSq_pos_on_band hlam htarget he)","truncated":false,"comment":"Above the critical-value bound, regularity follows from the energy band."},{"id":312,"line":10,"statement":"theorem exists_three_multipliers_of_kernel\n    {V : Type*} [AddCommGroup V] [Module ℝ V]\n    (f c₁ c₂ c₃ : V →ₗ[ℝ] ℝ)\n    (h : ∀ v, c₁ v = 0 → c₂ v = 0 → c₃ v = 0 → f v = 0) :\n    ∃ lam mu p : ℝ, ∀ v,\n      f v + lam * c₁ v + mu * c₂ v + p * c₃ v = 0","proof":"by\n  let c : V →ₗ[ℝ] ℝ × (ℝ × ℝ) := c₁.prod (c₂.prod c₃)\n  have hf : f ∈ (LinearMap.ker c).dualAnnihilator := by\n    rw [Submodule.mem_dualAnnihilator]\n    intro v hv\n    have hv' : c v = 0 := hv\n    exact h v (congrArg Prod.fst hv')\n      (congrArg (fun z : ℝ × (ℝ × ℝ) => z.2.1) hv')\n      (congrArg (fun z : ℝ × (ℝ × ℝ) => z.2.2) hv')\n  rw [← LinearMap.range_dualMap_eq_dualAnnihilator_ker] at hf\n  obtain ⟨g, hg⟩ := hf\n  refine ⟨-g (1, (0, 0)), -g (0, (1, 0)), -g (0, (0, 1)), ?_⟩\n  intro v\n  have hgv : g (c v) = f v := DFunLike.congr_fun hg v\n  have hc : c v = (c₁ v) • (1, (0, 0)) +\n      (c₂ v) • (0, (1, 0)) + (c₃ v) • (0, (0, 1)) := by\n    ext <;> simp [c]\n  rw [hc, map_add, map_add, map_smul, map_smul, map_smul] at hgv\n  simp only [smul_eq_mul] at hgv\n  nlinarith","truncated":false,"comment":""},{"id":313,"line":21,"statement":"theorem hasDerivAt_parameter_integral\n    {G D : ℝ → ℝ → ℝ} (hG : Continuous (Function.uncurry G))\n    (hD : Continuous (Function.uncurry D))\n    (hd : ∀ t s, HasDerivAt (fun p => G p s) (D t s) t) (ℓ t₀ : ℝ) :\n    HasDerivAt (fun t => ∫ s in 0..ℓ, G t s) (∫ s in 0..ℓ, D t₀ s) t₀","proof":"by\n  obtain ⟨C, hC⟩ :=\n    ((isCompact_closedBall t₀ 1).prod (isCompact_uIcc : IsCompact (uIcc (0 : ℝ) ℓ))).exists_bound_of_continuousOn\n      hD.continuousOn\n  have hGs (t : ℝ) : Continuous (G t) := hG.comp (continuous_const.prodMk continuous_id)\n  have hDs (t : ℝ) : Continuous (D t) := hD.comp (continuous_const.prodMk continuous_id)\n  apply (intervalIntegral.hasDerivAt_integral_of_dominated_loc_of_deriv_le\n    (s := ball t₀ 1) (bound := fun _ => C) (ball_mem_nhds t₀ one_pos)\n    (Eventually.of_forall fun t => (hGs t).aestronglyMeasurable)\n    ((hGs t₀).intervalIntegrable 0 ℓ) (hDs t₀).aestronglyMeasurable\n    ?_ (continuous_const.intervalIntegrable 0 ℓ) ?_).2\n  · filter_upwards [] with s hs\n    intro t ht\n    exact hC (t, s) ⟨ball_subset_closedBall ht, uIoc_subset_uIcc hs⟩\n  · filter_upwards [] with s _ t _\n    exact hd t s","truncated":false,"comment":"Compact domination for a genuine continuous parameter derivative."},{"id":314,"line":43,"statement":"theorem continuous_primitive_parameter {G : ℝ → ℝ → ℝ}\n    (hG : Continuous (Function.uncurry G)) :\n    Continuous (fun p : ℝ × ℝ => ∫ s in 0..p.2, G p.1 s)","proof":"by\n  apply intervalIntegral.continuous_parametric_intervalIntegral_of_continuous\n    (s := fun p : ℝ × ℝ => p.2) ?_ continuous_snd\n  exact hG.comp ((continuous_fst.fst).prodMk continuous_snd)","truncated":false,"comment":"A primitive with jointly continuous parameter and endpoint."},{"id":315,"line":51,"statement":"theorem hasDerivAt_xCoord_variation {θ η : ℝ → ℝ}\n    (hθ : Continuous θ) (hη : Continuous η) (t s : ℝ) :\n    HasDerivAt (fun p => xCoord (angleVariation θ η p) 0 s)\n      (∫ q in 0..s, -sin (θ q + t * η q) * η q) t","proof":"by\n  have hc : Continuous (fun p : ℝ × ℝ => θ p.2 + p.1 * η p.2) :=\n    (hθ.comp continuous_snd).add (continuous_fst.mul (hη.comp continuous_snd))\n  have h := hasDerivAt_parameter_integral\n    (G := fun p q => cos (θ q + p * η q))\n    (D := fun p q => -sin (θ q + p * η q) * η q)\n    (Real.continuous_cos.comp hc)\n    (((Real.continuous_sin.comp hc).neg).mul (hη.comp continuous_snd))\n    (fun p q => by simpa using (((hasDerivAt_id p).mul_const (η q)).const_add (θ q)).cos) s t\n  simpa only [xCoord, angleVariation, zero_add] using h","truncated":false,"comment":"Parameter derivative of the actual horizontal reconstructed coordinate."},{"id":316,"line":66,"statement":"theorem hasDerivAt_yCoord_variation {θ η : ℝ → ℝ}\n    (hθ : Continuous θ) (hη : Continuous η) (t s : ℝ) :\n    HasDerivAt (fun p => yCoord (angleVariation θ η p) 0 s)\n      (∫ q in 0..s, cos (θ q + t * η q) * η q) t","proof":"by\n  have hc : Continuous (fun p : ℝ × ℝ => θ p.2 + p.1 * η p.2) :=\n    (hθ.comp continuous_snd).add (continuous_fst.mul (hη.comp continuous_snd))\n  have h := hasDerivAt_parameter_integral\n    (G := fun p q => sin (θ q + p * η q))\n    (D := fun p q => cos (θ q + p * η q) * η q)\n    (Real.continuous_sin.comp hc)\n    ((Real.continuous_cos.comp hc).mul (hη.comp continuous_snd))\n    (fun p q => by simpa using (((hasDerivAt_id p).mul_const (η q)).const_add (θ q)).sin) s t\n  simpa only [yCoord, angleVariation, zero_add] using h","truncated":false,"comment":"Parameter derivative of the actual vertical reconstructed coordinate."},{"id":317,"line":81,"statement":"theorem continuous_moment {θ : ℝ → ℝ} (hθ : Continuous θ) :\n    Continuous (fun s => xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s))","proof":"by\n  have hx : Continuous (xCoord θ 0) :=\n    continuous_iff_continuousAt.mpr fun s => (hasDerivAt_xCoord hθ 0 s).continuousAt\n  have hy : Continuous (yCoord θ 0) :=\n    continuous_iff_continuousAt.mpr fun s => (hasDerivAt_yCoord hθ 0 s).continuousAt\n  exact (hx.mul (Real.continuous_cos.comp hθ)).add (hy.mul (Real.continuous_sin.comp hθ))","truncated":false,"comment":"Continuity of the area moment entering the first variation."},{"id":318,"line":90,"statement":"theorem hasDerivAt_area_variation_raw {θ η : ℝ → ℝ}\n    (hθ : Continuous θ) (hη : Continuous η) (ℓ : ℝ) :\n    HasDerivAt (fun t => area (angleVariation θ η t) ℓ)\n      ((1 / 2) * ∫ s in 0..ℓ,\n        (∫ q in 0..s, -sin (θ q) * η q) * sin (θ s) +\n          xCoord θ 0 s * (cos (θ s) * η s) -\n        ((∫ q in 0..s, cos (θ q) * η q) * cos (θ s) +\n          yCoord θ 0 s * (-sin (θ s) * η s))) 0","proof":"by\n  have hc : Continuous (fun p : ℝ × ℝ => θ p.2 + p.1 * η p.2) :=\n    (hθ.comp continuous_snd).add (continuous_fst.mul (hη.comp continuous_snd))\n  have hX : Continuous (fun p : ℝ × ℝ => xCoord (angleVariation θ η p.1) 0 p.2) := by\n    simpa only [xCoord, angleVariation, zero_add] using\n      continuous_primitive_parameter (G := fun t s => cos (θ s + t * η s))\n        (Real.continuous_cos.comp hc)\n  have hY : Continuous (fun p : ℝ × ℝ => yCoord (angleVariation θ η p.1) 0 p.2) := by\n    simpa only [yCoord, angleVariation, zero_add] using\n      continuous_primitive_parameter (G := fun t s => sin (θ s + t * η s))\n        (Real.continuous_sin.comp hc)\n  have hU : Continuous (fun p : ℝ × ℝ => ∫ q in 0..p.2, -sin (θ q + p.1 * η q) * η q) :=\n    continuous_primitive_parameter (G := fun t q => -sin (θ q + t * η q) * η q)\n      ((Real.continuous_sin.comp hc).neg.mul (hη.comp continuous_snd))\n  have hV : Continuous (fun p : ℝ × ℝ => ∫ q in 0..p.2, cos (θ q + p.1 * η q) * η q) :=\n    continuous_primitive_parameter (G := fun t q => cos (θ q + t * η q) * η q)\n      ((Real.continuous_cos.comp hc).mul (hη.comp continuous_snd))\n  have hd := hasDerivAt_parameter_integral\n    (G := fun t s => xCoord (angleVariation θ η t) 0 s * sin (θ s + t * η s) -\n      yCoord (angleVariation θ η t) 0 s * cos (θ s + t * η s))\n    (D := fun t s =>\n      (∫ q in 0..s, -sin (θ q + t * η q) * η q) * sin (θ s + t * η s) +\n        xCoord (angleVariation θ η t) 0 s * (cos (θ s + t * η s) * η s) -\n      ((∫ q in 0..s, cos (θ q + t * η q) * η q) * cos (θ s + t * η s) +\n        yCoord (angleVariation θ η t) 0 s * (-sin (θ s + t * η s) * η s)))\n    ((hX.mul (Real.continuous_sin.comp hc)).sub (hY.mul (Real.continuous_cos.comp hc)))\n    (((hU.mul (Real.continuous_sin.comp hc)).add\n      (hX.mul ((Real.continuous_cos.comp hc).mul (hη.comp continuous_snd)))).sub\n      ((hV.mul (Real.continuous_cos.comp hc)).add\n        (hY.mul ((Real.continuous_sin.comp hc).neg.mul (hη.comp continuous_snd)))))\n    (fun t s => by\n      have ha : HasDerivAt (fun p => θ s + p * η s) (η s) t := by\n        simpa using ((hasDerivAt_id t).mul_const (η s)).const_add (θ s)\n      exact ((hasDerivAt_xCoord_variation hθ hη t s).mul ha.sin).sub\n        ((hasDerivAt_yCoord_variation hθ hη t s).mul ha.cos)) ℓ 0\n  have hzero : angleVariation θ η 0 = θ := by ext s; simp [angleVariation]\n  have hh := hd.const_mul (1 / 2)\n  rw [hzero] at hh\n  simpa only [area, angleVariation, zero_mul, add_zero] using hh","truncated":false,"comment":"Differentiate the reconstructed area integral before removing its boundary term."},{"id":319,"line":138,"statement":"theorem area_variation_integral_eq {θ η : ℝ → ℝ}\n    (hθ : Continuous θ) (hη : Continuous η) (ℓ : ℝ) :\n    ((1 / 2) * ∫ s in 0..ℓ,\n        (∫ q in 0..s, -sin (θ q) * η q) * sin (θ s) +\n          xCoord θ 0 s * (cos (θ s) * η s) -\n        ((∫ q in 0..s, cos (θ q) * η q) * cos (θ s) +\n          yCoord θ 0 s * (-sin (θ s) * η s))) =\n      (∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * η s) -\n      (xCoord θ 0 ℓ * (∫ s in 0..ℓ, cos (θ s) * η s) +\n        yCoord θ 0 ℓ * (∫ s in 0..ℓ, sin (θ s) * η s)) / 2","proof":"by\n  let U := fun s => ∫ q in 0..s, -sin (θ q) * η q\n  let V := fun s => ∫ q in 0..s, cos (θ q) * η q\n  have hC := Real.continuous_cos.comp hθ\n  have hS := Real.continuous_sin.comp hθ\n  have hX : Continuous (xCoord θ 0) :=\n    continuous_iff_continuousAt.mpr fun s => (hasDerivAt_xCoord hθ 0 s).continuousAt\n  have hY : Continuous (yCoord θ 0) :=\n    continuous_iff_continuousAt.mpr fun s => (hasDerivAt_yCoord hθ 0 s).continuousAt\n  have hUd (s : ℝ) : HasDerivAt U (-sin (θ s) * η s) s :=\n    ((hS.neg.mul hη).integral_hasStrictDerivAt 0 s).hasDerivAt\n  have hVd (s : ℝ) : HasDerivAt V (cos (θ s) * η s) s :=\n    ((hC.mul hη).integral_hasStrictDerivAt 0 s).hasDerivAt\n  have hU : Continuous U := continuous_iff_continuousAt.mpr fun s => (hUd s).continuousAt\n  have hV : Continuous V := continuous_iff_continuousAt.mpr fun s => (hVd s).continuousAt\n  have hpartsU : (∫ s in 0..ℓ, U s * sin (θ s)) =\n      U ℓ * yCoord θ 0 ℓ - (∫ s in 0..ℓ, yCoord θ 0 s * (-sin (θ s) * η s)) := by\n    have h := intervalIntegral.integral_mul_deriv_eq_deriv_mul\n      (fun s _ => hUd s) (fun s _ => hasDerivAt_yCoord hθ 0 s)\n      ((hS.neg.mul hη).intervalIntegrable 0 ℓ) (hS.intervalIntegrable 0 ℓ)\n    simpa only [yCoord_zero, mul_zero, zero_mul, sub_zero, mul_comm] using h\n  have hpartsV : (∫ s in 0..ℓ, V s * cos (θ s)) =\n      V ℓ * xCoord θ 0 ℓ - (∫ s in 0..ℓ, xCoord θ 0 s * (cos (θ s) * η s)) := by\n    have h := intervalIntegral.integral_mul_deriv_eq_deriv_mul\n      (fun s _ => hVd s) (fun s _ => hasDerivAt_xCoord hθ 0 s)\n      ((hC.mul hη).intervalIntegrable 0 ℓ) (hC.intervalIntegrable 0 ℓ)\n    simpa only [xCoord_zero, mul_zero, zero_mul, sub_zero, mul_comm] using h\n  have hmoment :\n      (∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * η s) =\n      (∫ s in 0..ℓ, xCoord θ 0 s * (cos (θ s) * η s)) -\n      (∫ s in 0..ℓ, yCoord θ 0 s * (-sin (θ s) * η s)) := by\n    rw [← intervalIntegral.integral_sub (μ := volume)\n      (f := fun s => xCoord θ 0 s * (cos (θ s) * η s))\n      (g := fun s => yCoord θ 0 s * (-sin (θ s) * η s))\n      ((hX.mul (hC.mul hη)).intervalIntegrable 0 ℓ)\n      ((hY.mul (hS.neg.mul hη)).intervalIntegrable 0 ℓ)]\n    apply intervalIntegral.integral_congr\n    intro s _\n    ring\n  have hUne : U ℓ = -(∫ s in 0..ℓ, sin (θ s) * η s) := by\n    simp only [U, neg_mul, intervalIntegral.integral_neg]\n  change (1 / 2) * (∫ s in 0..ℓ, U s * sin (θ s) +\n      xCoord θ 0 s * (cos (θ s) * η s) -\n      (V s * cos (θ s) + yCoord θ 0 s * (-sin (θ s) * η s))) = _\n  rw [intervalIntegral.integral_sub (μ := volume)\n    (f := fun s => U s * sin (θ s) + xCoord θ 0 s * (cos (θ s) * η s))\n    (g := fun s => V s * cos (θ s) + yCoord θ 0 s * (-sin (θ s) * η s))\n    (((hU.mul hS).add (hX.mul (hC.mul hη))).intervalIntegrable 0 ℓ)\n    (((hV.mul hC).add (hY.mul (hS.neg.mul hη))).intervalIntegrable 0 ℓ),\n    intervalIntegral.integral_add (μ := volume)\n      (f := fun s => U s * sin (θ s))\n      (g := fun s => xCoord θ 0 s * (cos (θ s) * η s))\n      ((hU.mul hS).intervalIntegrable 0 ℓ)\n      ((hX.mul (hC.mul hη)).intervalIntegrable 0 ℓ),\n    intervalIntegral.integral_add (μ := volume)\n      (f := fun s => V s * cos (θ s))\n      (g := fun s => yCoord θ 0 s * (-sin (θ s) * η s))\n      ((hV.mul hC).intervalIntegrable 0 ℓ)\n      ((hY.mul (hS.neg.mul hη)).intervalIntegrable 0 ℓ),\n    hpartsU, hpartsV, hmoment, hUne]\n  dsimp [V]\n  ring","truncated":false,"comment":"Integration by parts displays the endpoint contribution of the actual area derivative."},{"id":320,"line":211,"statement":"theorem hasDerivAt_area_variation {θ η : ℝ → ℝ}\n    (hθ : Continuous θ) (hη : Continuous η) (ℓ : ℝ) :\n    HasDerivAt (fun t => area (angleVariation θ η t) ℓ)\n      ((∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * η s) -\n      (xCoord θ 0 ℓ * (∫ s in 0..ℓ, cos (θ s) * η s) +\n        yCoord θ 0 ℓ * (∫ s in 0..ℓ, sin (θ s) * η s)) / 2) 0","proof":"by\n  rw [← area_variation_integral_eq hθ hη ℓ]\n  exact hasDerivAt_area_variation_raw hθ hη ℓ","truncated":false,"comment":"First variation of signed area with its explicit endpoint correction."},{"id":321,"line":221,"statement":"theorem hasDerivAt_area_variation_feasible {θ η : ℝ → ℝ} {ℓ : ℝ}\n    (_hℓ : 0 ≤ ℓ) (hθ : Continuous θ) (hη : Continuous η)\n    (hx : (∫ s in 0..ℓ, -sin (θ s) * η s) = 0)\n    (hy : (∫ s in 0..ℓ, cos (θ s) * η s) = 0) :\n    HasDerivAt (fun t => area (angleVariation θ η t) ℓ)\n      (∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * η s) 0","proof":"by\n  have hx' : (∫ s in 0..ℓ, sin (θ s) * η s) = 0 := by\n    simpa only [neg_mul, intervalIntegral.integral_neg, neg_eq_zero] using hx\n  simpa only [hy, hx', mul_zero, add_zero, zero_div, sub_zero] using\n    hasDerivAt_area_variation hθ hη ℓ","truncated":false,"comment":"Endpoint-feasible directions cancel the complete boundary correction."},{"id":322,"line":18,"statement":"theorem pressure_firstIntegral_hasDerivAt\n    {θ : ℝ → ℝ} {k p lam μ s : ℝ}\n    (hθ : ContDiff ℝ 3 θ)\n    (hAngle : HasDerivAt (fun t => k * deriv θ t)\n      (p * (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) -\n        lam * sin (θ s) + μ * cos (θ s)) s) :\n    HasDerivAt (fun t => k * (deriv θ t) ^ 2 / 2 -\n      (lam - p * yCoord θ 0 t) * cos (θ t) -\n      (μ + p * xCoord θ 0 t) * sin (θ t)) 0 s","proof":"by\n  have ht := (hθ.differentiable (by norm_num) s).hasDerivAt\n  have hκ := ((hθ.deriv' (n := 2)).differentiable (by norm_num) s).hasDerivAt\n  have hX := hasDerivAt_xCoord hθ.continuous 0 s\n  have hY := hasDerivAt_yCoord hθ.continuous 0 s\n  have hmoment := (hκ.const_mul k).unique hAngle\n  convert (((hκ.pow 2).const_mul k).div_const 2).sub\n    (((hasDerivAt_const s lam).sub (hY.const_mul p)).mul ht.cos) |>.sub\n      (((hasDerivAt_const s μ).add (hX.const_mul p)).mul ht.sin) using 1\n  norm_num only [Nat.reduceSub, pow_one, Nat.cast_ofNat, Pi.sub_apply, Pi.add_apply]\n  nlinarith [congrArg (fun q : ℝ => q * deriv θ s) hmoment]","truncated":false,"comment":"The force components are `(lam - p Y, mu + p X)`. Their tangent projection\nhas a quadratic-curvature first integral, derived from the angle equation."},{"id":323,"line":40,"statement":"theorem pressure_angleForce_hasDerivAt\n    {θ : ℝ → ℝ} {p lam μ s : ℝ} (hθ : ContDiff ℝ 3 θ) :\n    HasDerivAt (fun t =>\n      p * (xCoord θ 0 t * cos (θ t) + yCoord θ 0 t * sin (θ t)) -\n        lam * sin (θ t) + μ * cos (θ t))\n      (p - ((lam - p * yCoord θ 0 s) * cos (θ s) +\n        (μ + p * xCoord θ 0 s) * sin (θ s)) * deriv θ s) s","proof":"by\n  have ht := (hθ.differentiable (by norm_num) s).hasDerivAt\n  have hX := hasDerivAt_xCoord hθ.continuous 0 s\n  have hY := hasDerivAt_yCoord hθ.continuous 0 s\n  convert ((((hX.mul ht.cos).add (hY.mul ht.sin)).const_mul p).sub\n    (ht.sin.const_mul lam)).add (ht.cos.const_mul μ) using 1\n  nlinarith [congrArg (fun q : ℝ => p * q) (sin_sq_add_cos_sq (θ s))]","truncated":false,"comment":"The pressure contribution to the differentiated moment equation is exactly\n`p`, using unit arclength speed. The other term is the tangential force."},{"id":324,"line":56,"statement":"theorem pressure_angle_firstIntegral_curvature\n    {θ : ℝ → ℝ} {ℓ k p lam μ : ℝ} (hθ : ContDiff ℝ 3 θ)\n    (hAngle : ∀ s ∈ Ioo 0 ℓ, HasDerivAt (fun t => k * deriv θ t)\n      (p * (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) -\n        lam * sin (θ s) + μ * cos (θ s)) s) :\n    ∃ σ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      (k * (deriv θ s) ^ 2 / 2 -\n        (lam - p * yCoord θ 0 s) * cos (θ s) -\n        (μ + p * xCoord θ 0 s) * sin (θ s) = σ) ∧\n      (k * deriv (deriv (deriv θ)) s + k * (deriv θ s) ^ 3 / 2 -\n        σ * deriv θ s = p)","proof":"by\n  have hfirst : ∃ σ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      k * (deriv θ s) ^ 2 / 2 -\n        (lam - p * yCoord θ 0 s) * cos (θ s) -\n        (μ + p * xCoord θ 0 s) * sin (θ s) = σ := by\n    apply isOpen_Ioo.exists_is_const_of_deriv_eq_zero (convex_Ioo 0 ℓ).isPreconnected\n    · intro s hs\n      exact (pressure_firstIntegral_hasDerivAt hθ (hAngle s hs)).differentiableAt.differentiableWithinAt\n    · intro s hs\n      exact (pressure_firstIntegral_hasDerivAt hθ (hAngle s hs)).deriv\n  obtain ⟨σ, hσ⟩ := hfirst\n  refine ⟨σ, fun s hs => ⟨hσ s hs, ?_⟩⟩\n  have hκ : ContDiff ℝ 2 (deriv θ) := hθ.deriv' (n := 2)\n  have heq : deriv (fun t => k * deriv θ t) =ᶠ[𝓝 s]\n      (fun t => p * (xCoord θ 0 t * cos (θ t) + yCoord θ 0 t * sin (θ t)) -\n        lam * sin (θ t) + μ * cos (θ t)) := by\n    filter_upwards [isOpen_Ioo.mem_nhds hs] with t ht\n    exact (hAngle t ht).deriv\n  have hsecond := ((pressure_angleForce_hasDerivAt (p := p) (lam := lam)\n    (μ := μ) (s := s) hθ).congr_of_eventuallyEq heq).deriv\n  have hfun : deriv (fun t => k * deriv θ t) =\n      (fun t => k * deriv (deriv θ) t) := by\n    funext t\n    exact ((hκ.differentiable (by norm_num) t).hasDerivAt.const_mul k).deriv\n  rw [hfun, ((hκ.differentiable_deriv_two s).hasDerivAt.const_mul k).deriv] at hsecond\n  nlinarith [congrArg (fun q : ℝ => q * deriv θ s) (hσ s hs)]","truncated":false,"comment":"The same constant in the force first integral yields the forced curvature\nequation. The second derivative is obtained from the actual angle equation."},{"id":325,"line":94,"statement":"theorem pressure_angle_curvature\n    {θ : ℝ → ℝ} {ℓ k p lam μ : ℝ} (hθ : ContDiff ℝ 3 θ)\n    (hAngle : ∀ s ∈ Ioo 0 ℓ, HasDerivAt (fun t => k * deriv θ t)\n      (p * (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) -\n        lam * sin (θ s) + μ * cos (θ s)) s) :\n    ∃ σ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      k * deriv (deriv (deriv θ)) s + k * (deriv θ s) ^ 3 / 2 -\n        σ * deriv θ s = p","proof":"by\n  obtain ⟨σ, hσ⟩ := pressure_angle_firstIntegral_curvature hθ hAngle\n  exact ⟨σ, fun s hs => (hσ s hs).2⟩","truncated":false,"comment":"Projection to the curvature equation, with pressure as its explicit forcing."},{"id":326,"line":107,"statement":"theorem pressure_angle_phase_energy\n    {θ : ℝ → ℝ} {ℓ k p lam μ : ℝ} (hk : 0 < k) (hθ : ContDiff ℝ 3 θ)\n    (hAngle : ∀ s ∈ Ioo 0 ℓ, HasDerivAt (fun t => k * deriv θ t)\n      (p * (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) -\n        lam * sin (θ s) + μ * cos (θ s)) s) :\n    ∃ σ c : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      E (1 / 2) (-σ / k) (p / k) (deriv θ s)\n        (deriv (deriv θ) s + sqrt 2 * deriv θ s) = c ∧\n      HasDerivAt (deriv θ)\n        (gy (deriv θ s) (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s ∧\n      HasDerivAt (fun t => deriv (deriv θ) t + sqrt 2 * deriv θ t)\n        (-gx (1 / 2) (-σ / k) (p / k) (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s","proof":"by\n  obtain ⟨σ, heq⟩ := pressure_angle_curvature hθ hAngle\n  have hκ : ContDiff ℝ 2 (deriv θ) := hθ.deriv' (n := 2)\n  have hforced : ∀ s ∈ Ioo 0 ℓ,\n      k * deriv (deriv (deriv θ)) s + k * (deriv θ s) ^ 3 / 2 -\n        σ * deriv θ s = k * (p / k) := by\n    intro s hs\n    rw [heq s hs]\n    field_simp\n  obtain ⟨c, hc⟩ := LinearInputCurvatureBridge.forced_energy_constant (ne_of_gt hk) hκ hforced\n  refine ⟨σ, c, fun s hs => ⟨hc s hs, ?_⟩⟩\n  exact LinearInputCurvatureBridge.forced_phase_hasDerivAt (ne_of_gt hk) hκ (hforced s hs)","truncated":false,"comment":"Pressure determines the phase input `u = p / k`, which may be nonzero. These are actual\ncoordinate derivatives and a constant energy along arclength."},{"id":327,"line":134,"statement":"theorem pressure_angle_eq_phase_energy\n    {θ : ℝ → ℝ} {ℓ k p lam μ : ℝ} (hk : 0 < k) (hθ : ContDiff ℝ 3 θ)\n    (hAngle : ∀ s ∈ Ioo 0 ℓ, deriv (fun t => k * deriv θ t) s =\n      p * (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) -\n        lam * sin (θ s) + μ * cos (θ s)) :\n    ∃ σ c : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      E (1 / 2) (-σ / k) (p / k) (deriv θ s)\n        (deriv (deriv θ) s + sqrt 2 * deriv θ s) = c ∧\n      HasDerivAt (deriv θ)\n        (gy (deriv θ s) (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s ∧\n      HasDerivAt (fun t => deriv (deriv θ) t + sqrt 2 * deriv θ t)\n        (-gx (1 / 2) (-σ / k) (p / k) (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s","proof":"by\n  apply pressure_angle_phase_energy hk hθ\n  intro s hs\n  have hd := ((hθ.deriv' (n := 2)).differentiable (by norm_num) s).hasDerivAt.const_mul k\n  exact hd.congr_deriv (hd.deriv.symm.trans (hAngle s hs))","truncated":false,"comment":"Equality of actual first derivatives suffices; C3 regularity supplies the\nHasDerivAt form used by the preceding pressure-to-phase theorem."},{"id":328,"line":15,"statement":"theorem contDiff_xCoord {θ : ℝ → ℝ} (hθ : Continuous θ) :\n    ContDiff ℝ 1 (xCoord θ 0)","proof":"by\n  apply contDiff_one_iff_deriv.mpr\n  refine ⟨fun s => (hasDerivAt_xCoord hθ 0 s).differentiableAt, ?_⟩\n  have hd : deriv (xCoord θ 0) = fun s => cos (θ s) :=\n    funext (deriv_xCoord hθ 0)\n  rw [hd]\n  exact Real.continuous_cos.comp hθ","truncated":false,"comment":""},{"id":329,"line":24,"statement":"theorem contDiff_yCoord {θ : ℝ → ℝ} (hθ : Continuous θ) :\n    ContDiff ℝ 1 (yCoord θ 0)","proof":"by\n  apply contDiff_one_iff_deriv.mpr\n  refine ⟨fun s => (hasDerivAt_yCoord hθ 0 s).differentiableAt, ?_⟩\n  have hd : deriv (yCoord θ 0) = fun s => sin (θ s) :=\n    funext (deriv_yCoord hθ 0)\n  rw [hd]\n  exact Real.continuous_sin.comp hθ","truncated":false,"comment":""},{"id":330,"line":34,"statement":"theorem contDiff_area_weight {θ : ℝ → ℝ} (hθ : ContDiff ℝ 1 θ) :\n    ContDiff ℝ 1 (fun s =>\n      xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s))","proof":"((contDiff_xCoord hθ.continuous).mul hθ.cos).add\n    ((contDiff_yCoord hθ.continuous).mul hθ.sin)","truncated":false,"comment":"The spatial weight in the actual area variation is C¹."},{"id":331,"line":42,"statement":"theorem weighted_angleEquation_of_stationary {θ M w : ℝ → ℝ} {ℓ p : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ) (hM : ContDiff ℝ 2 M)\n    (hw : ContDiff ℝ 1 w)\n    (hstat : ∀ η : variationSpace ℓ,\n      (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, M s * deriv η.val s) +\n        p * (∫ s in 0..ℓ, w s * η.val s) = 0) :\n    ∃ lam μ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      deriv M s = p * w s - lam * sin (θ s) + μ * cos (θ s)","proof":"by\n  obtain ⟨lam, μ, hm⟩ := exists_multipliers_of_kernel\n    (firstVariationLinear ℓ M hM.continuous +\n      p • constraintLinear ℓ w hw.continuous)\n    (constraintLinear ℓ (fun s => -sin (θ s)) hθ.sin.continuous.neg)\n    (constraintLinear ℓ (fun s => cos (θ s)) hθ.cos.continuous) hstat\n  have hq : ContDiff ℝ 1 (fun s =>\n      p * w s + (-lam * sin (θ s) + μ * cos (θ s))) :=\n    (contDiff_const.mul hw).add\n      ((contDiff_const.mul hθ.sin).add (contDiff_const.mul hθ.cos))\n  have hangle := residual_zero_of_augmented_stationary hℓ hM hq (by\n    intro η\n    have hi : (∫ s in 0..ℓ,\n        (p * w s + (-lam * sin (θ s) + μ * cos (θ s))) * η.val s) =\n        p * (∫ s in 0..ℓ, w s * η.val s) +\n        lam * (∫ s in 0..ℓ, -sin (θ s) * η.val s) +\n        μ * (∫ s in 0..ℓ, cos (θ s) * η.val s) := by\n      have hadd : (∫ s in 0..ℓ,\n          (p * w s + (-lam * sin (θ s) + μ * cos (θ s))) * η.val s) =\n          ∫ s in 0..ℓ, p * w s * η.val s +\n            (-lam * sin (θ s) + μ * cos (θ s)) * η.val s := by\n        apply intervalIntegral.integral_congr\n        intro s _\n        ring\n      rw [hadd]\n      have hi₁ : IntervalIntegrable (fun s => p * w s * η.val s) volume 0 ℓ :=\n        ((continuous_const.mul hw.continuous).mul η.property.1.continuous).intervalIntegrable _ _\n      have hi₂ : IntervalIntegrable\n          (fun s => (-lam * sin (θ s) + μ * cos (θ s)) * η.val s) volume 0 ℓ :=\n        (((continuous_const.mul hθ.sin.continuous).add\n          (continuous_const.mul hθ.cos.continuous)).mul\n            η.property.1.continuous).intervalIntegrable _ _\n      rw [intervalIntegral.integral_add hi₁ hi₂]\n      have hp : (∫ s in 0..ℓ, p * w s * η.val s) =\n          p * (∫ s in 0..ℓ, w s * η.val s) := by\n        simp_rw [mul_assoc]\n        exact intervalIntegral.integral_const_mul _ _\n      rw [hp, force_integral hθ.continuous η]\n      ring\n    rw [hi]\n    have hh := hm η\n    change (∫ s in 0..ℓ, M s * deriv η.val s) +\n      p * (∫ s in 0..ℓ, w s * η.val s) +\n      lam * (∫ s in 0..ℓ, -sin (θ s) * η.val s) +\n      μ * (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 at hh\n    linarith)\n  refine ⟨lam, μ, fun s hs => ?_⟩\n  calc\n    deriv M s = p * w s + (-lam * sin (θ s) + μ * cos (θ s)) := hangle s hs\n    _ = _ := by ring","truncated":false,"comment":"Two endpoint constraints give two force multipliers even with a spatial\nloading term.  This is the finite-codimensional and integration-by-parts step."},{"id":332,"line":117,"statement":"theorem hasDerivAt_pressureEnergy_variation_feasible {k p ℓ : ℝ} {θ : ℝ → ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : ContDiff ℝ 1 θ) (η : variationSpace ℓ)\n    (hx : (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0)\n    (hy : (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0) :\n    HasDerivAt (fun t => pressureEnergy k p (angleVariation θ η.val t) ℓ)\n      ((∫ s in 0..ℓ, k * deriv θ s * deriv η.val s) +\n        p * (∫ s in 0..ℓ,\n          (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * η.val s)) 0","proof":"by\n  have he := hasDerivAt_energy_variation hℓ\n    (show ContDiff ℝ 1 (fun q : ℝ => k * q ^ 2 / 2) by fun_prop) hθ η.property.1\n  have hd (q : ℝ) : deriv (fun q : ℝ => k * q ^ 2 / 2) q = k * q :=\n    (quadratic_density_hasDerivAt k q).deriv\n  simp_rw [hd] at he\n  have ha := LinearInputAreaVariation.hasDerivAt_area_variation_feasible\n    hℓ hθ.continuous η.property.1.continuous hx hy\n  exact he.add (ha.const_mul p)","truncated":false,"comment":"Genuine differentiation of the full functional, using the independently\nproved signed-area derivative.  Feasibility removes its boundary contribution."},{"id":333,"line":135,"statement":"theorem stationary_iff_firstVariation {k p ℓ : ℝ} {θ : ℝ → ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : ContDiff ℝ 1 θ) :\n    Stationary k p θ ℓ ↔\n      ∀ η : variationSpace ℓ,\n        (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0 →\n        (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 →\n        (∫ s in 0..ℓ, k * deriv θ s * deriv η.val s) +\n          p * (∫ s in 0..ℓ,\n            (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * η.val s) = 0","proof":"by\n  unfold Stationary\n  constructor <;> intro h η hx hy\n  · have hdx := (hasDerivAt_horizontal_variation hℓ hθ.continuous\n      η.property.1.continuous).deriv\n    have hdy := (hasDerivAt_vertical_variation hℓ hθ.continuous\n      η.property.1.continuous).deriv\n    have he := (hasDerivAt_pressureEnergy_variation_feasible\n      (k := k) (p := p) hℓ hθ η hx hy).deriv\n    rw [← he]\n    exact h η (hdx.trans hx) (hdy.trans hy)\n  · have hdx := (hasDerivAt_horizontal_variation hℓ hθ.continuous\n      η.property.1.continuous).deriv\n    have hdy := (hasDerivAt_vertical_variation hℓ hθ.continuous\n      η.property.1.continuous).deriv\n    have hx' := hdx.symm.trans hx\n    have hy' := hdy.symm.trans hy\n    rw [(hasDerivAt_pressureEnergy_variation_feasible\n      (k := k) (p := p) hℓ hθ η hx' hy').deriv]\n    exact h η hx' hy'","truncated":false,"comment":"The integral characterization is a consequence of actual derivatives."},{"id":334,"line":166,"statement":"theorem stationary_angleEquation {k p ℓ : ℝ} {θ : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hstat : Stationary k p θ ℓ) :\n    ∃ lam μ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      deriv (fun t => k * deriv θ t) s =\n        p * (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) -\n          lam * sin (θ s) + μ * cos (θ s)","proof":"by\n  have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n  exact weighted_angleEquation_of_stationary hℓ hθ1\n    (contDiff_const.mul (hθ.deriv' (n := 2))) (contDiff_area_weight hθ1)\n    ((stationary_iff_firstVariation hℓ.le hθ1).mp hstat)","truncated":false,"comment":"Actual stationarity of bending energy plus signed area gives the pressure\nangle equation; the formula is a conclusion, not a hypothesis."},{"id":335,"line":180,"statement":"theorem stationary_curvature {k p ℓ : ℝ} {θ : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hstat : Stationary k p θ ℓ) :\n    ∃ σ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      k * deriv (deriv (deriv θ)) s + k * (deriv θ s) ^ 3 / 2 -\n        σ * deriv θ s = p","proof":"by\n  obtain ⟨lam, μ, hangle⟩ := stationary_angleEquation hℓ hθ hstat\n  apply LinearInputPressureCurvature.pressure_angle_curvature hθ\n  intro s hs\n  have hd := ((hθ.deriv' (n := 2)).differentiable (by norm_num) s).hasDerivAt.const_mul k\n  exact hd.congr_deriv (hd.deriv.symm.trans (hangle s hs))","truncated":false,"comment":"The forcing p in the curvature equation is derived from the actual area\nterm in the curve functional."},{"id":336,"line":194,"statement":"theorem stationary_phase_energy {k p ℓ : ℝ} {θ : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hk : 0 < k) (hθ : ContDiff ℝ 3 θ)\n    (hstat : Stationary k p θ ℓ) :\n    ∃ σ c : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      LinearInputDesign.E (1 / 2) (-σ / k) (p / k) (deriv θ s)\n        (deriv (deriv θ) s + sqrt 2 * deriv θ s) = c ∧\n      HasDerivAt (deriv θ)\n        (LinearInputGradient.gy (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s ∧\n      HasDerivAt (fun t => deriv (deriv θ) t + sqrt 2 * deriv θ t)\n        (-LinearInputGradient.gx (1 / 2) (-σ / k) (p / k) (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s","proof":"by\n  obtain ⟨lam, μ, hangle⟩ := stationary_angleEquation hℓ hθ hstat\n  exact LinearInputPressureCurvature.pressure_angle_eq_phase_energy hk hθ hangle","truncated":false,"comment":"End-to-end pressure connection: actual constrained stationarity of a curve\nfunctional gives the quartic phase input u=p/k and its conserved energy."},{"id":337,"line":222,"statement":"theorem areaStationary_exists_pressure {k ℓ : ℝ} {θ : ℝ → ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : ContDiff ℝ 1 θ)\n    (hstat : AreaStationary k θ ℓ) :\n    ∃ p : ℝ, Stationary k p θ ℓ","proof":"by\n  let w : ℝ → ℝ := fun s =>\n    xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)\n  have hw : Continuous w := (contDiff_area_weight hθ).continuous\n  have hM : Continuous (fun s => k * deriv θ s) :=\n    continuous_const.mul hθ.continuous_deriv_one\n  obtain ⟨lam, μ, p, hm⟩ := LinearInputConstraints.exists_three_multipliers_of_kernel\n    (firstVariationLinear ℓ (fun s => k * deriv θ s) hM)\n    (constraintLinear ℓ (fun s => -sin (θ s)) hθ.sin.continuous.neg)\n    (constraintLinear ℓ (fun s => cos (θ s)) hθ.cos.continuous)\n    (constraintLinear ℓ w hw) (by\n      intro η hx hy ha\n      have hdx := (hasDerivAt_horizontal_variation hℓ hθ.continuous\n        η.property.1.continuous).deriv\n      have hdy := (hasDerivAt_vertical_variation hℓ hθ.continuous\n        η.property.1.continuous).deriv\n      have hda := (LinearInputAreaVariation.hasDerivAt_area_variation_feasible\n        hℓ hθ.continuous η.property.1.continuous hx hy).deriv\n      have he := (hasDerivAt_energy_variation hℓ\n        (show ContDiff ℝ 1 (fun q : ℝ => k * q ^ 2 / 2) by fun_prop)\n          hθ η.property.1).deriv\n      have hd (q : ℝ) : deriv (fun q : ℝ => k * q ^ 2 / 2) q = k * q :=\n        (quadratic_density_hasDerivAt k q).deriv\n      simp_rw [hd] at he\n      change (∫ s in 0..ℓ, k * deriv θ s * deriv η.val s) = 0\n      rw [← he]\n      exact hstat η (hdx.trans hx) (hdy.trans hy) (hda.trans ha))\n  refine ⟨p, (stationary_iff_firstVariation hℓ hθ).mpr ?_⟩\n  intro η hx hy\n  have hh := hm η\n  change (∫ s in 0..ℓ, k * deriv θ s * deriv η.val s) +\n    lam * (∫ s in 0..ℓ, -sin (θ s) * η.val s) +\n    μ * (∫ s in 0..ℓ, cos (θ s) * η.val s) +\n    p * (∫ s in 0..ℓ, w s * η.val s) = 0 at hh\n  simpa only [hx, hy, mul_zero, add_zero] using hh","truncated":false,"comment":"The pressure coefficient can be derived as an area multiplier.  No\nindependence assumption is needed for this implication from stationarity."},{"id":338,"line":263,"statement":"theorem areaStationary_phase_energy {k ℓ : ℝ} {θ : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hk : 0 < k) (hθ : ContDiff ℝ 3 θ)\n    (hstat : AreaStationary k θ ℓ) :\n    ∃ p σ c : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      LinearInputDesign.E (1 / 2) (-σ / k) (p / k) (deriv θ s)\n        (deriv (deriv θ) s + sqrt 2 * deriv θ s) = c ∧\n      HasDerivAt (deriv θ)\n        (LinearInputGradient.gy (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s ∧\n      HasDerivAt (fun t => deriv (deriv θ) t + sqrt 2 * deriv θ t)\n        (-LinearInputGradient.gx (1 / 2) (-σ / k) (p / k) (deriv θ s)\n          (deriv (deriv θ) s + sqrt 2 * deriv θ s)) s","proof":"by\n  obtain ⟨p, hp⟩ := areaStationary_exists_pressure hℓ.le (hθ.of_le (by norm_num)) hstat\n  obtain ⟨σ, c, hc⟩ := stationary_phase_energy hℓ hk hθ hp\n  exact ⟨p, σ, c, hc⟩","truncated":false,"comment":"The area-constrained stationary curve has a pressure multiplier and hence\nthe corresponding forced quartic phase energy."},{"id":339,"line":18,"statement":"theorem constraint_coefficients_zero {θ : ℝ → ℝ} {ℓ a b c : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hnonconst : ¬ ∃ K : ℝ, ∀ s ∈ Ioo 0 ℓ, deriv θ s = K)\n    (h : ∀ η : variationSpace ℓ,\n      a * (∫ s in 0..ℓ, -sin (θ s) * η.val s) +\n      b * (∫ s in 0..ℓ, cos (θ s) * η.val s) +\n      c * (∫ s in 0..ℓ,\n        (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * η.val s) = 0) :\n    a = 0 ∧ b = 0 ∧ c = 0","proof":"by\n  classical\n  have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n  by_cases hc : c = 0\n  · have hne : ∃ s ∈ Ioo 0 ℓ, deriv θ s ≠ 0 := by\n      by_contra hn\n      push Not at hn\n      exact hnonconst ⟨0, hn⟩\n    obtain ⟨ha, hb⟩ := Elastica.constraint_coefficients_zero hℓ hθ1 hne (by\n      intro η\n      simpa only [hc, zero_mul, add_zero] using h η)\n    exact ⟨ha, hb, hc⟩\n  · let A : ℝ → ℝ := fun s => c * xCoord θ 0 s + b\n    let B : ℝ → ℝ := fun s => c * yCoord θ 0 s - a\n    let q : ℝ → ℝ := fun s => A s * cos (θ s) + B s * sin (θ s)\n    let F : ℝ → ℝ := fun s => -(A s * sin (θ s)) + B s * cos (θ s)\n    have hA : ContDiff ℝ 1 A :=\n      (contDiff_const.mul (LinearInputPressureStationary.contDiff_xCoord hθ.continuous)).add contDiff_const\n    have hB : ContDiff ℝ 1 B :=\n      (contDiff_const.mul (LinearInputPressureStationary.contDiff_yCoord hθ.continuous)).sub contDiff_const\n    have hq : ContDiff ℝ 1 q := (hA.mul hθ1.cos).add (hB.mul hθ1.sin)\n    let η : variationSpace ℓ := ⟨fun s => s * (ℓ - s) * q s,\n      ⟨(contDiff_id.mul (contDiff_const.sub contDiff_id)).mul hq, by simp, by simp⟩⟩\n    have hint : (∫ s in 0..ℓ, q s * η.val s) = 0 := by\n      have hi : (∫ s in 0..ℓ, q s * η.val s) =\n          (∫ s in 0..ℓ, (-a * sin (θ s) + b * cos (θ s)) * η.val s) +\n          c * (∫ s in 0..ℓ,\n            (xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s)) * η.val s) := by\n        have hi₁ : IntervalIntegrable\n            (fun s => (-a * sin (θ s) + b * cos (θ s)) * η.val s) volume 0 ℓ :=\n          ((((continuous_const.mul hθ1.sin.continuous).add\n            (continuous_const.mul hθ1.cos.continuous)).mul η.property.1.continuous).intervalIntegrable 0 ℓ)\n        have hi₂ : IntervalIntegrable\n            (fun s => c * ((xCoord θ 0 s * cos (θ s) +\n              yCoord θ 0 s * sin (θ s)) * η.val s)) volume 0 ℓ :=\n          ((continuous_const.mul ((LinearInputAreaVariation.continuous_moment hθ.continuous).mul\n            η.property.1.continuous)).intervalIntegrable 0 ℓ)\n        rw [← intervalIntegral.integral_const_mul, ← intervalIntegral.integral_add hi₁ hi₂]\n        apply intervalIntegral.integral_congr\n        intro s _\n        dsimp [q, A, B]\n        ring\n      rw [hi, force_integral hθ.continuous η]\n      exact h η\n    have hz : (∫ s in 0..ℓ, s * (ℓ - s) * (q s) ^ 2) = 0 := by\n      convert hint using 1\n      apply intervalIntegral.integral_congr\n      intro s _\n      change s * (ℓ - s) * q s ^ 2 = q s * (s * (ℓ - s) * q s)\n      ring\n    have hzero := residual_zero_of_weighted_square_integral hℓ hq.continuous hz\n    have hdq (s : ℝ) : HasDerivAt q (c + deriv θ s * F s) s := by\n      have ht := (hθ1.differentiable one_ne_zero s).hasDerivAt\n      have hx := (hasDerivAt_xCoord hθ.continuous 0 s).const_mul c |>.add_const b\n      have hy := (hasDerivAt_yCoord hθ.continuous 0 s).const_mul c |>.sub_const a\n      convert (hx.mul ht.cos).add (hy.mul ht.sin) using 1\n      dsimp [F, A, B]\n      nlinarith [congrArg (fun v : ℝ => c * v) (sin_sq_add_cos_sq (θ s))]\n    have hdF (s : ℝ) : HasDerivAt F (-deriv θ s * q s) s := by\n      have ht := (hθ1.differentiable one_ne_zero s).hasDerivAt\n      have hx := (hasDerivAt_xCoord hθ.continuous 0 s).const_mul c |>.add_const b\n      have hy := (hasDerivAt_yCoord hθ.continuous 0 s).const_mul c |>.sub_const a\n      convert ((hx.mul ht.sin).neg).add (hy.mul ht.cos) using 1\n      dsimp [q, A, B]\n      ring\n    have hrel : ∀ s ∈ Ioo 0 ℓ, c + deriv θ s * F s = 0 := by\n      intro s hs\n      have heq : q =ᶠ[𝓝 s] fun _ => 0 := by\n        filter_upwards [isOpen_Ioo.mem_nhds hs] with t ht using hzero t ht\n      exact (hdq s).unique ((hasDerivAt_const s (0 : ℝ)).congr_of_eventuallyEq heq)\n    have hFd : ∀ s ∈ Ioo 0 ℓ, HasDerivAt F 0 s := by\n      intro s hs\n      simpa only [hzero s hs, mul_zero] using hdF s\n    obtain ⟨d, hd⟩ : ∃ d : ℝ, ∀ s ∈ Ioo 0 ℓ, F s = d := by\n      apply isOpen_Ioo.exists_is_const_of_deriv_eq_zero (convex_Ioo 0 ℓ).isPreconnected\n      · intro s hs\n        exact (hFd s hs).differentiableAt.differentiableWithinAt\n      · intro s hs\n        exact (hFd s hs).deriv\n    have hmid : ℓ / 2 ∈ Ioo 0 ℓ := by constructor <;> linarith\n    have hdne : d ≠ 0 := by\n      intro hd0\n      have hm := hrel (ℓ / 2) hmid\n      rw [hd (ℓ / 2) hmid, hd0, mul_zero, add_zero] at hm\n      exact hc hm\n    exfalso\n    apply hnonconst\n    refine ⟨-c / d, fun s hs => ?_⟩\n    apply (eq_div_iff hdne).2\n    have hr := hrel s hs\n    rw [hd s hs] at hr\n    linarith","truncated":false,"comment":"Nonconstant curvature makes the two endpoint differentials and the area\nmoment differential independent. The true area differential differs from the\nmoment by a linear combination of the first two differentials."},{"id":340,"line":121,"statement":"theorem exists_normalized_constraint_directions {θ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hnonconst : ¬ ∃ K : ℝ, ∀ s ∈ Ioo 0 ℓ, deriv θ s = K) :\n    ∃ ξ₁ ξ₂ ξ₃ : variationSpace ℓ,\n      ((∫ s in 0..ℓ, -sin (θ s) * ξ₁.val s) = 1 ∧\n       (∫ s in 0..ℓ, cos (θ s) * ξ₁.val s) = 0 ∧\n       (∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) +\n         yCoord θ 0 s * sin (θ s)) * ξ₁.val s) = 0) ∧\n      ((∫ s in 0..ℓ, -sin (θ s) * ξ₂.val s) = 0 ∧\n       (∫ s in 0..ℓ, cos (θ s) * ξ₂.val s) = 1 ∧\n       (∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) +\n         yCoord θ 0 s * sin (θ s)) * ξ₂.val s) = 0) ∧\n      ((∫ s in 0..ℓ, -sin (θ s) * ξ₃.val s) = 0 ∧\n       (∫ s in 0..ℓ, cos (θ s) * ξ₃.val s) = 0 ∧\n       (∫ s in 0..ℓ, (xCoord θ 0 s * cos (θ s) +\n         yCoord θ 0 s * sin (θ s)) * ξ₃.val s) = 1)","proof":"by\n  let cx := constraintLinear ℓ (fun s => -sin (θ s)) hθ.sin.continuous.neg\n  let cy := constraintLinear ℓ (fun s => cos (θ s)) hθ.cos.continuous\n  let ca := constraintLinear ℓ (fun s => xCoord θ 0 s * cos (θ s) + yCoord θ 0 s * sin (θ s))\n    (LinearInputAreaVariation.continuous_moment hθ.continuous)\n  let C : variationSpace ℓ →ₗ[ℝ] ℝ × (ℝ × ℝ) := cx.prod (cy.prod ca)\n  have hev (f : (ℝ × (ℝ × ℝ)) →ₗ[ℝ] ℝ) (x y z : ℝ) :\n      f (x, (y, z)) = f (1, (0, 0)) * x + f (0, (1, 0)) * y + f (0, (0, 1)) * z := by\n    have hp : (x, (y, z)) = x • (1, (0, 0)) + y • (0, (1, 0)) + z • (0, (0, 1)) := by\n      ext <;> simp\n    rw [hp, map_add, map_add, map_smul, map_smul, map_smul]\n    simp only [smul_eq_mul]\n    ring\n  have ha : (LinearMap.range C).dualAnnihilator = ⊥ := by\n    apply le_antisymm _ bot_le\n    intro f hf\n    rw [Submodule.mem_dualAnnihilator] at hf\n    have habc : f (1, (0, 0)) = 0 ∧ f (0, (1, 0)) = 0 ∧ f (0, (0, 1)) = 0 := by\n      apply constraint_coefficients_zero hℓ hθ hnonconst\n      intro η\n      have hfc : f (C η) = 0 := hf (C η) ⟨η, rfl⟩\n      change f (cx η, (cy η, ca η)) = 0 at hfc\n      rw [hev] at hfc\n      exact hfc\n    change f = 0\n    apply LinearMap.ext\n    intro p\n    change f (p.1, (p.2.1, p.2.2)) = 0\n    rw [hev, habc.1, habc.2.1, habc.2.2]\n    ring\n  have hsurj : Function.Surjective C :=\n    LinearMap.range_eq_top.mp (Submodule.dualAnnihilator_eq_bot_iff.mp ha)\n  obtain ⟨ξ₁, h₁⟩ := hsurj (1, (0, 0))\n  obtain ⟨ξ₂, h₂⟩ := hsurj (0, (1, 0))\n  obtain ⟨ξ₃, h₃⟩ := hsurj (0, (0, 1))\n  refine ⟨ξ₁, ξ₂, ξ₃, ?_, ?_, ?_⟩\n  · exact ⟨congrArg Prod.fst h₁, congrArg (fun z => z.2.1) h₁, congrArg (fun z => z.2.2) h₁⟩\n  · exact ⟨congrArg Prod.fst h₂, congrArg (fun z => z.2.1) h₂, congrArg (fun z => z.2.2) h₂⟩\n  · exact ⟨congrArg Prod.fst h₃, congrArg (fun z => z.2.1) h₃, congrArg (fun z => z.2.2) h₃⟩","truncated":false,"comment":"Three fixed-angle variations can independently correct endpoint position\nand area moment when the curvature is not constant."},{"id":341,"line":179,"statement":"theorem pressure_coefficient_unique {θ : ℝ → ℝ} {ℓ k p₁ p₂ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hnonconst : ¬ ∃ K : ℝ, ∀ s ∈ Ioo 0 ℓ, deriv θ s = K)\n    (hp₁ : LinearInputPressureStationary.Stationary k p₁ θ ℓ)\n    (hp₂ : LinearInputPressureStationary.Stationary k p₂ θ ℓ) : p₁ = p₂","proof":"by\n  obtain ⟨ξ₁, ξ₂, ξ₃, _, _, h₃⟩ :=\n    exists_normalized_constraint_directions hℓ hθ hnonconst\n  have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n  have hv₁ := (LinearInputPressureStationary.stationary_iff_firstVariation hℓ.le hθ1).mp\n    hp₁ ξ₃ h₃.1 h₃.2.1\n  have hv₂ := (LinearInputPressureStationary.stationary_iff_firstVariation hℓ.le hθ1).mp\n    hp₂ ξ₃ h₃.1 h₃.2.1\n  rw [h₃.2.2, mul_one] at hv₁ hv₂\n  linarith","truncated":false,"comment":"The pressure multiplier is unique on a fixed nonconstant-curvature curve.\nThis does not assert that the multiplier is nonzero, and it does not apply to\nthe constant-curvature cases where the third differential loses rank."},{"id":342,"line":197,"statement":"theorem areaStationary_of_constant_curvature {θ : ℝ → ℝ} {ℓ k K : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 3 θ)\n    (hconst : ∀ s ∈ Ioo 0 ℓ, deriv θ s = K) :\n    LinearInputPressureStationary.AreaStationary k θ ℓ","proof":"by\n  have hθ1 : ContDiff ℝ 1 θ := hθ.of_le (by norm_num)\n  intro η _ _ _\n  have he := hasDerivAt_energy_variation hℓ.le\n    (show ContDiff ℝ 1 (fun q : ℝ => k * q ^ 2 / 2) by fun_prop) hθ1 η.property.1\n  have hd (q : ℝ) : deriv (fun q : ℝ => k * q ^ 2 / 2) q = k * q :=\n    (quadratic_density_hasDerivAt k q).deriv\n  simp_rw [hd] at he\n  rw [he.deriv]\n  have hi := intervalIntegral.integral_eq_sub_of_hasDerivAt_of_le\n    (f := fun s => (k * K) * η.val s)\n    (f' := fun s => k * deriv θ s * deriv η.val s)\n    hℓ.le (continuous_const.mul η.property.1.continuous).continuousOn\n    (fun s hs => by\n      simpa only [hconst s hs] using\n        ((η.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (k * K)))\n    (((continuous_const.mul hθ1.continuous_deriv_one).mul\n      η.property.1.continuous_deriv_one).intervalIntegrable 0 ℓ)\n  simpa only [η.property.2.1, η.property.2.2, mul_zero, sub_self] using hi","truncated":false,"comment":"At constant curvature the pure bending first variation vanishes for every\nfixed-angle direction. No exact-constraint correction or rank hypothesis is\nneeded; this includes straight curves."},{"id":343,"line":21,"statement":"theorem continuous_parameter_intervalIntegral\n    {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]\n    {G : Parameters → ℝ → E} {ℓ : ℝ}\n    (hG : Continuous (Function.uncurry G)) :\n    Continuous (fun p => ∫ s in 0..ℓ, G p s)","proof":"intervalIntegral.continuous_parametric_intervalIntegral_of_continuous' hG 0 ℓ","truncated":false,"comment":""},{"id":344,"line":28,"statement":"theorem continuous_parameter_primitive\n    {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]\n    {G : Parameters → ℝ → E} (hG : Continuous (Function.uncurry G)) :\n    Continuous (fun p : Parameters × ℝ => ∫ s in 0..p.2, G p.1 s)","proof":"by\n  apply intervalIntegral.continuous_parametric_intervalIntegral_of_continuous\n    (s := fun p : Parameters × ℝ => p.2) ?_ continuous_snd\n  exact hG.comp ((continuous_fst.fst).prodMk continuous_snd)","truncated":false,"comment":""},{"id":345,"line":36,"statement":"theorem hasFDerivAt_parameter_intervalIntegral_any\n    {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E] [CompleteSpace E]\n    {G : Parameters → ℝ → E} {D : Parameters → ℝ → Parameters →L[ℝ] E}\n    {ℓ : ℝ}\n    (hG : Continuous (Function.uncurry G)) (hD : Continuous (Function.uncurry D))\n    (hd : ∀ p s, HasFDerivAt (fun q => G q s) (D p s) p) (p₀ : Parameters) :\n    HasFDerivAt (fun p => ∫ s in 0..ℓ, G p s) (∫ s in 0..ℓ, D p₀ s) p₀","proof":"by\n  obtain ⟨C, hC⟩ :=\n    ((isCompact_closedBall p₀ 1).prod (isCompact_uIcc : IsCompact (uIcc (0 : ℝ) ℓ))).exists_bound_of_continuousOn\n      hD.continuousOn\n  have hGs (p : Parameters) : Continuous (G p) := hG.comp (continuous_const.prodMk continuous_id)\n  have hDs (p : Parameters) : Continuous (D p) := hD.comp (continuous_const.prodMk continuous_id)\n  apply intervalIntegral.hasFDerivAt_integral_of_dominated_of_fderiv_le\n    (s := ball p₀ 1) (bound := fun _ => C) (ball_mem_nhds p₀ one_pos)\n    (Eventually.of_forall fun p => (hGs p).aestronglyMeasurable)\n    ((hGs p₀).intervalIntegrable 0 ℓ) (hDs p₀).aestronglyMeasurable\n  · filter_upwards [] with s hs\n    intro p hp\n    exact hC (p, s) ⟨ball_subset_closedBall hp, uIoc_subset_uIcc hs⟩\n  · exact continuous_const.intervalIntegrable 0 ℓ\n  · filter_upwards [] with s _ p _\n    exact hd p s","truncated":false,"comment":""},{"id":346,"line":59,"statement":"theorem hasFDerivAt_parameter_intervalIntegral\n    {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E] [CompleteSpace E]\n    {G : Parameters → ℝ → E} {D : Parameters → ℝ → Parameters →L[ℝ] E}\n    {ℓ : ℝ} (_hℓ : 0 ≤ ℓ)\n    (hG : Continuous (Function.uncurry G)) (hD : Continuous (Function.uncurry D))\n    (hd : ∀ p s, HasFDerivAt (fun q => G q s) (D p s) p) (p₀ : Parameters) :\n    HasFDerivAt (fun p => ∫ s in 0..ℓ, G p s) (∫ s in 0..ℓ, D p₀ s) p₀","proof":"hasFDerivAt_parameter_intervalIntegral_any hG hD hd p₀","truncated":false,"comment":""},{"id":347,"line":68,"statement":"theorem contDiff_two_parameter_intervalIntegral\n    {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E] [CompleteSpace E]\n    {G : Parameters → ℝ → E} {D : Parameters → ℝ → Parameters →L[ℝ] E}\n    {D₂ : Parameters → ℝ → Parameters →L[ℝ] (Parameters →L[ℝ] E)}\n    {ℓ : ℝ} (hℓ : 0 ≤ ℓ)\n    (hG : Continuous (Function.uncurry G)) (hD : Continuous (Function.uncurry D))\n    (hD₂ : Continuous (Function.uncurry D₂))\n    (hd : ∀ p s, HasFDerivAt (fun q => G q s) (D p s) p)\n    (hd₂ : ∀ p s, HasFDerivAt (fun q => D q s) (D₂ p s) p) :\n    ContDiff ℝ 2 (fun p => ∫ s in 0..ℓ, G p s)","proof":"by\n  have h₁ := hasFDerivAt_parameter_intervalIntegral hℓ hG hD hd\n  have h₂ := hasFDerivAt_parameter_intervalIntegral hℓ hD hD₂ hd₂\n  have heq : fderiv ℝ (fun p => ∫ s in 0..ℓ, G p s) = fun p => ∫ s in 0..ℓ, D p s :=\n    funext fun p => (h₁ p).fderiv\n  rw [show (2 : WithTop ENat) = 1 + 1 from rfl, contDiff_succ_iff_fderiv]\n  refine ⟨fun p => (h₁ p).differentiableAt, by simp, ?_⟩\n  rw [heq, contDiff_one_iff_fderiv]\n  refine ⟨fun p => (h₂ p).differentiableAt, ?_⟩\n  have heq₂ : fderiv ℝ (fun p => ∫ s in 0..ℓ, D p s) = fun p => ∫ s in 0..ℓ, D₂ p s :=\n    funext fun p => (h₂ p).fderiv\n  rw [heq₂]\n  exact continuous_parameter_intervalIntegral hD₂","truncated":false,"comment":""},{"id":348,"line":91,"statement":"theorem hasFDerivAt_integral_linear_parameters\n    {ρ κ : ℝ → ℝ} {B : ℝ → Parameters →L[ℝ] ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hρ : ContDiff ℝ 1 ρ) (hκ : Continuous κ) (hB : Continuous B)\n    (p : Parameters) :\n    HasFDerivAt (fun p => ∫ s in 0..ℓ, ρ (κ s + B s p))\n      (∫ s in 0..ℓ, deriv ρ (κ s + B s p) • B s) p","proof":"by\n  have hp : Continuous (fun q : Parameters × ℝ => κ q.2 + B q.2 q.1) :=\n    (hκ.comp continuous_snd).add ((hB.comp continuous_snd).clm_apply continuous_fst)\n  apply hasFDerivAt_parameter_intervalIntegral\n    (G := fun p s => ρ (κ s + B s p))\n    (D := fun p s => deriv ρ (κ s + B s p) • B s) hℓ (hρ.continuous.comp hp)\n    ((hρ.continuous_deriv_one.comp hp).smul (hB.comp continuous_snd))\n  intro p s\n  exact (hρ.differentiable one_ne_zero _).hasDerivAt.comp_hasFDerivAt p\n    ((B s).hasFDerivAt.const_add (κ s))","truncated":false,"comment":""},{"id":349,"line":107,"statement":"theorem contDiff_two_integral_linear_parameters\n    {ρ κ : ℝ → ℝ} {B : ℝ → Parameters →L[ℝ] ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hρ : ContDiff ℝ 2 ρ) (hκ : Continuous κ) (hB : Continuous B) :\n    ContDiff ℝ 2 (fun p => ∫ s in 0..ℓ, ρ (κ s + B s p))","proof":"by\n  let D := fun (p : Parameters) (s : ℝ) => deriv ρ (κ s + B s p) • B s\n  let D₂ := fun (p : Parameters) (s : ℝ) =>\n    (deriv (deriv ρ) (κ s + B s p) • B s).smulRight (B s)\n  have hp : Continuous (fun q : Parameters × ℝ => κ q.2 + B q.2 q.1) :=\n    (hκ.comp continuous_snd).add ((hB.comp continuous_snd).clm_apply continuous_fst)\n  have hρ₁ : ContDiff ℝ 1 (deriv ρ) := hρ.deriv'\n  have hD : Continuous (Function.uncurry D) :=\n    ((hρ₁.continuous.comp hp).smul (hB.comp continuous_snd))\n  have hD₂ : Continuous (Function.uncurry D₂) := by\n    dsimp [D₂, Function.uncurry]\n    exact (isBoundedBilinearMap_smulRight (𝕜 := ℝ) (E := Parameters)\n      (F := Parameters →L[ℝ] ℝ)).continuous.comp\n      (((hρ₁.continuous_deriv_one.comp hp).smul (hB.comp continuous_snd)).prodMk\n        (hB.comp continuous_snd))\n  apply contDiff_two_parameter_intervalIntegral\n    (G := fun p s => ρ (κ s + B s p)) (D := D) (D₂ := D₂)\n    hℓ (hρ.continuous.comp hp) hD hD₂\n  · intro p s\n    exact (hρ.differentiable (by norm_num) _).hasDerivAt.comp_hasFDerivAt p\n      ((B s).hasFDerivAt.const_add (κ s))\n  · intro p s\n    exact ((hρ₁.differentiable one_ne_zero _).hasDerivAt.comp_hasFDerivAt p\n      ((B s).hasFDerivAt.const_add (κ s))).smul_const (B s)","truncated":false,"comment":""},{"id":350,"line":135,"statement":"theorem continuous_smulRight_parameter\n    {F : Type*} [NormedAddCommGroup F] [NormedSpace ℝ F]\n    {A : Parameters × ℝ → Parameters →L[ℝ] ℝ} {B : Parameters × ℝ → F}\n    (hA : Continuous A) (hB : Continuous B) :\n    Continuous (fun q => (A q).smulRight (B q))","proof":"(isBoundedBilinearMap_smulRight (𝕜 := ℝ) (E := Parameters) (F := F)).continuous.comp\n    (hA.prodMk hB)","truncated":false,"comment":""},{"id":351,"line":144,"statement":"theorem contDiff_two_integral_mul\n    {A B : Parameters → ℝ → ℝ}\n    {D E : Parameters → ℝ → Parameters →L[ℝ] ℝ}\n    {D₂ E₂ : Parameters → ℝ → Parameters →L[ℝ] (Parameters →L[ℝ] ℝ)}\n    {ℓ : ℝ} (hℓ : 0 ≤ ℓ)\n    (hA : Continuous (Function.uncurry A)) (hB : Continuous (Function.uncurry B))\n    (hD : Continuous (Function.uncurry D)) (hE : Continuous (Function.uncurry E))\n    (hD₂ : Continuous (Function.uncurry D₂)) (hE₂ : Continuous (Function.uncurry E₂))\n    (hdA : ∀ p s, HasFDerivAt (fun q => A q s) (D p s) p)\n    (hdB : ∀ p s, HasFDerivAt (fun q => B q s) (E p s) p)\n    (hdD : ∀ p s, HasFDerivAt (fun q => D q s) (D₂ p s) p)\n    (hdE : ∀ p s, HasFDerivAt (fun q => E q s) (E₂ p s) p) :\n    ContDiff ℝ 2 (fun p => ∫ s in 0..ℓ, A p s * B p s)","proof":"by\n  apply contDiff_two_parameter_intervalIntegral\n    (G := fun p s => A p s * B p s)\n    (D := fun p s => A p s • E p s + B p s • D p s)\n    (D₂ := fun p s =>\n      (A p s • E₂ p s + (D p s).smulRight (E p s)) +\n      (B p s • D₂ p s + (E p s).smulRight (D p s))) hℓ\n    (hA.mul hB) ((hA.smul hE).add (hB.smul hD))\n    (((hA.smul hE₂).add (continuous_smulRight_parameter hD hE)).add\n      ((hB.smul hD₂).add (continuous_smulRight_parameter hE hD)))\n  · intro p s\n    exact (hdA p s).mul (hdB p s)\n  · intro p s\n    exact ((hdA p s).smul (hdE p s)).add ((hdB p s).smul (hdD p s))","truncated":false,"comment":"Product closure before integration, with both actual parameter derivatives."},{"id":352,"line":172,"statement":"theorem contDiff_two_integral_primitive_mul\n    {ρ τ θ : ℝ → ℝ} {B : ℝ → Parameters →L[ℝ] ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hρ : ContDiff ℝ 2 ρ) (hτ : ContDiff ℝ 2 τ)\n    (hθ : Continuous θ) (hB : Continuous B) :\n    ContDiff ℝ 2 (fun p => ∫ s in 0..ℓ,\n      (∫ q in 0..s, ρ (θ q + B q p)) * τ (θ s + B s p))","proof":"by\n  let R := fun (p : Parameters) (s : ℝ) => ρ (θ s + B s p)\n  let D := fun (p : Parameters) (s : ℝ) => deriv ρ (θ s + B s p) • B s\n  let D₂ := fun (p : Parameters) (s : ℝ) =>\n    (deriv (deriv ρ) (θ s + B s p) • B s).smulRight (B s)\n  let T := fun (p : Parameters) (s : ℝ) => τ (θ s + B s p)\n  let E := fun (p : Parameters) (s : ℝ) => deriv τ (θ s + B s p) • B s\n  let E₂ := fun (p : Parameters) (s : ℝ) =>\n    (deriv (deriv τ) (θ s + B s p) • B s).smulRight (B s)\n  have hp : Continuous (fun q : Parameters × ℝ => θ q.2 + B q.2 q.1) :=\n    (hθ.comp continuous_snd).add ((hB.comp continuous_snd).clm_apply continuous_fst)\n  have hρ₁ : ContDiff ℝ 1 (deriv ρ) := hρ.deriv'\n  have hτ₁ : ContDiff ℝ 1 (deriv τ) := hτ.deriv'\n  have hR : Continuous (Function.uncurry R) := hρ.continuous.comp hp\n  have hD : Continuous (Function.uncurry D) :=\n    (hρ₁.continuous.comp hp).smul (hB.comp continuous_snd)\n  have hD₂ : Continuous (Function.uncurry D₂) :=\n    continuous_smulRight_parameter\n      ((hρ₁.continuous_deriv_one.comp hp).smul (hB.comp continuous_snd))\n      (hB.comp continuous_snd)\n  have hT : Continuous (Function.uncurry T) := hτ.continuous.comp hp\n  have hE : Continuous (Function.uncurry E) :=\n    (hτ₁.continuous.comp hp).smul (hB.comp continuous_snd)\n  have hE₂ : Continuous (Function.uncurry E₂) :=\n    continuous_smulRight_parameter\n      ((hτ₁.continuous_deriv_one.comp hp).smul (hB.comp continuous_snd))\n      (hB.comp continuous_snd)\n  have hdR (p : Parameters) (s : ℝ) : HasFDerivAt (fun q => R q s) (D p s) p :=\n    (hρ.differentiable (by norm_num) _).hasDerivAt.comp_hasFDerivAt p\n      ((B s).hasFDerivAt.const_add (θ s))\n  have hdD (p : Parameters) (s : ℝ) : HasFDerivAt (fun q => D q s) (D₂ p s) p :=\n    ((hρ₁.differentiable one_ne_zero _).hasDerivAt.comp_hasFDerivAt p\n      ((B s).hasFDerivAt.const_add (θ s))).smul_const (B s)\n  have hdT (p : Parameters) (s : ℝ) : HasFDerivAt (fun q => T q s) (E p s) p :=\n    (hτ.differentiable (by norm_num) _).hasDerivAt.comp_hasFDerivAt p\n      ((B s).hasFDerivAt.const_add (θ s))\n  have hdE (p : Parameters) (s : ℝ) : HasFDerivAt (fun q => E q s) (E₂ p s) p :=\n    ((hτ₁.differentiable one_ne_zero _).hasDerivAt.comp_hasFDerivAt p\n      ((B s).hasFDerivAt.const_add (θ s))).smul_const (B s)\n  exact contDiff_two_integral_mul\n    (A := fun p s => ∫ q in 0..s, R p q) (B := T)\n    (D := fun p s => ∫ q in 0..s, D p q) (E := E)\n    (D₂ := fun p s => ∫ q in 0..s, D₂ p q) (E₂ := E₂) hℓ\n    (continuous_parameter_primitive hR) hT\n    (continuous_parameter_primitive hD) hE\n    (continuous_parameter_primitive\n      (E := Parameters →L[ℝ] (Parameters →L[ℝ] ℝ)) (G := D₂) hD₂) hE₂\n    (fun p s => hasFDerivAt_parameter_intervalIntegral_any hR hD hdR p)\n    hdT\n    (fun p s => hasFDerivAt_parameter_intervalIntegral_any hD hD₂ hdD p)\n    hdE","truncated":false,"comment":"One primitive factor and one pointwise factor, each depending on actual linear parameters."},{"id":353,"line":240,"statement":"theorem parameterLinear_apply (η ξ₁ ξ₂ ξ₃ : ℝ → ℝ) (s : ℝ) (p : Parameters) :\n    parameterLinear η ξ₁ ξ₂ ξ₃ s p =\n      p.1 * η s + p.2.1 * ξ₁ s + p.2.2.1 * ξ₂ s + p.2.2.2 * ξ₃ s","proof":"by\n  change η s * p.1 + ξ₁ s * p.2.1 + ξ₂ s * p.2.2.1 + ξ₃ s * p.2.2.2 = _\n  ring","truncated":false,"comment":""},{"id":354,"line":246,"statement":"theorem continuous_parameterLinear {η ξ₁ ξ₂ ξ₃ : ℝ → ℝ}\n    (hη : Continuous η) (hξ₁ : Continuous ξ₁) (hξ₂ : Continuous ξ₂) (hξ₃ : Continuous ξ₃) :\n    Continuous (parameterLinear η ξ₁ ξ₂ ξ₃)","proof":"by\n  unfold parameterLinear\n  exact (((hη.smul continuous_const).add (hξ₁.smul continuous_const)).add\n    (hξ₂.smul continuous_const)).add (hξ₃.smul continuous_const)","truncated":false,"comment":""},{"id":355,"line":257,"statement":"theorem contDiff_area_linear_parameters\n    {θ : ℝ → ℝ} {B : ℝ → Parameters →L[ℝ] ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : Continuous θ) (hB : Continuous B) :\n    ContDiff ℝ 2 (fun p => area (fun s => θ s + B s p) ℓ)","proof":"by\n  have h₁ := contDiff_two_integral_primitive_mul hℓ Real.contDiff_cos Real.contDiff_sin hθ hB\n  have h₂ := contDiff_two_integral_primitive_mul hℓ Real.contDiff_sin Real.contDiff_cos hθ hB\n  have he : (fun p => area (fun s => θ s + B s p) ℓ) =\n      (fun p => (1 / 2) *\n        ((∫ s in 0..ℓ, (∫ q in 0..s, cos (θ q + B q p)) * sin (θ s + B s p)) -\n         (∫ s in 0..ℓ, (∫ q in 0..s, sin (θ q + B q p)) * cos (θ s + B s p)))) := by\n    funext p\n    have hp : Continuous (fun s => θ s + B s p) := hθ.add (hB.clm_apply continuous_const)\n    have hX : Continuous (xCoord (fun s => θ s + B s p) 0) :=\n      continuous_iff_continuousAt.mpr fun s => (hasDerivAt_xCoord hp 0 s).continuousAt\n    have hY : Continuous (yCoord (fun s => θ s + B s p) 0) :=\n      continuous_iff_continuousAt.mpr fun s => (hasDerivAt_yCoord hp 0 s).continuousAt\n    unfold area\n    rw [intervalIntegral.integral_sub (μ := volume)\n      (f := fun s => xCoord (fun s => θ s + B s p) 0 s * sin (θ s + B s p))\n      (g := fun s => yCoord (fun s => θ s + B s p) 0 s * cos (θ s + B s p))\n      ((hX.mul (Real.continuous_sin.comp hp)).intervalIntegrable 0 ℓ)\n      ((hY.mul (Real.continuous_cos.comp hp)).intervalIntegrable 0 ℓ)]\n    simp only [xCoord, yCoord, zero_add]\n  rw [he]\n  exact contDiff_const.mul (h₁.sub h₂)","truncated":false,"comment":"The area functional is genuinely C² in the four parameters."},{"id":356,"line":283,"statement":"theorem contDiff_areaParameters {θ η ξ₁ ξ₂ ξ₃ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : Continuous θ) (hη : Continuous η)\n    (hξ₁ : Continuous ξ₁) (hξ₂ : Continuous ξ₂) (hξ₃ : Continuous ξ₃) :\n    ContDiff ℝ 2 (areaParameters θ η ξ₁ ξ₂ ξ₃ ℓ)","proof":"contDiff_area_linear_parameters hℓ hθ (continuous_parameterLinear hη hξ₁ hξ₂ hξ₃)","truncated":false,"comment":""},{"id":357,"line":28,"statement":"theorem corrected_family_C1_close {θ : ℝ → ℝ} {ℓ : ℝ}\n    (hθ : ContDiff ℝ 1 θ) (η ξ₁ ξ₂ ξ₃ : variationSpace ℓ)\n    {a b c : ℝ → ℝ} (ha : ContinuousAt a 0) (hb : ContinuousAt b 0) (hc : ContinuousAt c 0)\n    (ha0 : a 0 = 0) (hb0 : b 0 = 0) (hc0 : c 0 = 0) {r : ℝ} (hr : 0 < r) :\n    ∀ᶠ t in 𝓝 (0 : ℝ), ∀ s ∈ Icc 0 ℓ,\n      |(θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s) - θ s| < r ∧\n      |deriv (fun u => θ u + t * η.val u + a t * ξ₁.val u + b t * ξ₂.val u + c t * ξ₃.val u) s -\n        deriv θ s| < r","proof":"by\n  let G : ℝ → ℝ := fun s =>\n    |η.val s| + |deriv η.val s| + |ξ₁.val s| + |deriv ξ₁.val s| +\n      |ξ₂.val s| + |deriv ξ₂.val s| + |ξ₃.val s| + |deriv ξ₃.val s|\n  have hG : Continuous G :=\n    ((((((η.property.1.continuous.abs.add η.property.1.continuous_deriv_one.abs).add\n      ξ₁.property.1.continuous.abs).add ξ₁.property.1.continuous_deriv_one.abs).add\n        ξ₂.property.1.continuous.abs).add ξ₂.property.1.continuous_deriv_one.abs).add ξ₃.property.1.continuous.abs).add\n      ξ₃.property.1.continuous_deriv_one.abs\n  obtain ⟨C, hC⟩ := (isCompact_Icc : IsCompact (Icc (0 : ℝ) ℓ)).exists_bound_of_continuousOn\n    hG.continuousOn\n  have hbounds (s : ℝ) (hs : s ∈ Icc 0 ℓ) :\n      |η.val s| ≤ C ∧ |deriv η.val s| ≤ C ∧\n      |ξ₁.val s| ≤ C ∧ |deriv ξ₁.val s| ≤ C ∧\n      |ξ₂.val s| ≤ C ∧ |deriv ξ₂.val s| ≤ C ∧\n      |ξ₃.val s| ≤ C ∧ |deriv ξ₃.val s| ≤ C := by\n    have hg : G s ≤ C := (le_abs_self (G s)).trans (by\n      simpa only [Real.norm_eq_abs] using hC s hs)\n    dsimp [G] at hg\n    have h₁ := abs_nonneg (η.val s)\n    have h₂ := abs_nonneg (deriv η.val s)\n    have h₃ := abs_nonneg (ξ₁.val s)\n    have h₄ := abs_nonneg (deriv ξ₁.val s)\n    have h₅ := abs_nonneg (ξ₂.val s)\n    have h₆ := abs_nonneg (deriv ξ₂.val s)\n    have h₇ := abs_nonneg (ξ₃.val s)\n    have h₈ := abs_nonneg (deriv ξ₃.val s)\n    refine ⟨?_, ?_, ?_, ?_, ?_, ?_, ?_, ?_⟩ <;> linarith\n  have hcont : ContinuousAt (fun t : ℝ => (|t| + |a t| + |b t| + |c t|) * C) 0 :=\n    (((continuousAt_id.abs.add ha.abs).add hb.abs).add hc.abs).mul continuousAt_const\n  have hsmall : ∀ᶠ t in 𝓝 (0 : ℝ), (|t| + |a t| + |b t| + |c t|) * C < r :=\n    hcont.eventually (Iio_mem_nhds (by simpa [ha0, hb0, hc0] using hr))\n  filter_upwards [hsmall] with t ht\n  intro s hs\n  obtain ⟨h₁, h₂, h₃, h₄, h₅, h₆, h₇, h₈⟩ := hbounds s hs\n  have hd : deriv (fun u => θ u + t * η.val u + a t * ξ₁.val u + b t * ξ₂.val u + c t * ξ₃.val u) s =\n      deriv θ s + t * deriv η.val s + a t * deriv ξ₁.val s + b t * deriv ξ₂.val s + c t * deriv ξ₃.val s :=\n    (((((hθ.differentiable one_ne_zero s).hasDerivAt.add\n      ((η.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul t)).add\n        ((ξ₁.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (a t))).add\n          ((ξ₂.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (b t))).add\n            ((ξ₃.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (c t))).deriv\n  constructor\n  · have he : θ s + t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s - θ s =\n        t * η.val s + a t * ξ₁.val s + b t * ξ₂.val s + c t * ξ₃.val s := by ring\n    rw [he]\n    exact (abs_four_term_bound h₁ h₃ h₅ h₇).trans_lt ht\n  · rw [hd]\n    have he : deriv θ s + t * deriv η.val s + a t * deriv ξ₁.val s +\n        b t * deriv ξ₂.val s + c t * deriv ξ₃.val s - deriv θ s =\n        t * deriv η.val s + a t * deriv ξ₁.val s + b t * deriv ξ₂.val s + c t * deriv ξ₃.val s := by ring\n    rw [he]\n    exact (abs_four_term_bound h₂ h₄ h₆ h₈).trans_lt ht","truncated":false,"comment":"A continuous finite-parameter correction tending to zero tends to the base\nangle in the C¹ neighborhood on the fixed compact interval."},{"id":358,"line":92,"statement":"theorem hasDerivAt_corrected_energy_feasible {k ℓ : ℝ} {θ : ℝ → ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : ContDiff ℝ 1 θ) (η ξ₁ ξ₂ ξ₃ : variationSpace ℓ)\n    {a b c : ℝ → ℝ} (ha : HasDerivAt a 0 0) (hb : HasDerivAt b 0 0)\n    (hc : HasDerivAt c 0 0) (ha0 : a 0 = 0) (hb0 : b 0 = 0) (hc0 : c 0 = 0) :\n    HasDerivAt (fun t => energy (fun q => k*q^2/2)\n      (fun s => θ s + t*η.val s + a t*ξ₁.val s + b t*ξ₂.val s + c t*ξ₃.val s) ℓ)\n      (∫ s in 0..ℓ, k * deriv θ s * deriv η.val s) 0","proof":"by\n  let B := LinearInputAreaParameters.parameterLinear\n    (deriv η.val) (deriv ξ₁.val) (deriv ξ₂.val) (deriv ξ₃.val)\n  have hB : Continuous B := LinearInputAreaParameters.continuous_parameterLinear\n    η.property.1.continuous_deriv_one ξ₁.property.1.continuous_deriv_one\n    ξ₂.property.1.continuous_deriv_one ξ₃.property.1.continuous_deriv_one\n  have hf := LinearInputAreaParameters.hasFDerivAt_integral_linear_parameters\n    hℓ (show ContDiff ℝ 1 (fun q : ℝ => k*q^2/2) by fun_prop)\n      hθ.continuous_deriv_one hB (0 : LinearInputAreaParameters.Parameters)\n  have hden (q : ℝ) : deriv (fun q : ℝ => k*q^2/2) q = k*q :=\n    (quadratic_density_hasDerivAt k q).deriv\n  have hf' : HasFDerivAt\n      (fun p : LinearInputAreaParameters.Parameters => ∫ s in 0..ℓ, k*(deriv θ s+B s p)^2/2)\n      (∫ s in 0..ℓ, (k*deriv θ s) • B s) (0, (a 0, (b 0, c 0))) := by\n    convert hf using 1 <;> simp only [map_zero, add_zero, hden, ha0, hb0, hc0]\n    rfl\n  have hp : HasDerivAt (fun t : ℝ => (t, (a t, (b t, c t))))\n      (1, (0, (0, 0))) 0 := (hasDerivAt_id 0).prodMk (ha.prodMk (hb.prodMk hc))\n  have hd := hf'.comp_hasDerivAt 0 hp\n  have hint : IntervalIntegrable (fun s => (k*deriv θ s) • B s) volume 0 ℓ :=\n    ((continuous_const.mul hθ.continuous_deriv_one).smul hB).intervalIntegrable _ _\n  rw [ContinuousLinearMap.intervalIntegral_apply hint] at hd\n  have he : (fun t => ∫ s in 0..ℓ, k*(deriv θ s+B s (t,(a t,(b t,c t))))^2/2) =\n      (fun t => energy (fun q => k*q^2/2)\n        (fun s => θ s+t*η.val s+a t*ξ₁.val s+b t*ξ₂.val s+c t*ξ₃.val s) ℓ) := by\n    funext t\n    unfold energy\n    apply intervalIntegral.integral_congr\n    intro s _\n    have hds := (((((hθ.differentiable one_ne_zero s).hasDerivAt.add\n      ((η.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul t)).add\n      ((ξ₁.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (a t))).add\n      ((ξ₂.property.1.differentiable one_ne_zero s).hasDerivAt.const_mul (b t))).add\n      ((ξ₃.property.1.differentiable one_ne_
