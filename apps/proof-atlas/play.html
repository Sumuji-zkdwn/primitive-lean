 {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 1 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) (t : ℝ) :\n    HasDerivAt (fun u => energy ε (angleVariation θ η u) ℓ)\n      (∫ s in 0..ℓ, deriv ε (deriv θ s + t * deriv η s) * deriv η s) t","proof":"by\n  have h := hasDerivAt_weighted_integral_variation (w := fun _ => 1) hℓ hε\n    hθ.continuous_deriv_one hη.continuous_deriv_one continuous_const t\n  simpa only [mul_one, energy,\n    deriv_angleVariation (hθ.differentiable one_ne_zero) (hη.differentiable one_ne_zero)] using h","truncated":false,"comment":"The first derivative of the actual energy at every variation parameter."},{"id":172,"line":78,"statement":"theorem hasDerivAt_deriv_energy_variation {ε θ η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) :\n    HasDerivAt (deriv (fun t => energy ε (angleVariation θ η t) ℓ))\n      (∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s) ^ 2) 0","proof":"by\n  have hd : deriv (fun t => energy ε (angleVariation θ η t) ℓ) =\n      fun t => ∫ s in 0..ℓ, deriv ε (deriv θ s + t * deriv η s) * deriv η s := by\n    funext t\n    exact (hasDerivAt_energy_variation_at hℓ (hε.of_le (by norm_num)) hθ hη t).deriv\n  rw [hd]\n  have h := hasDerivAt_weighted_integral_variation (ε := deriv ε)\n    (κ := deriv θ) (v := deriv η) (w := deriv η) hℓ hε.deriv'\n    hθ.continuous_deriv_one hη.continuous_deriv_one hη.continuous_deriv_one 0\n  simpa only [zero_mul, add_zero, mul_assoc, ← pow_two] using h","truncated":false,"comment":"Differentiate the already identified first derivative of the actual energy.\nIts second variation is the curvature-density second derivative times `(η')²`."},{"id":173,"line":94,"statement":"theorem secondVariation_energy {ε θ η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) :\n    deriv (deriv (fun t => energy ε (angleVariation θ η t) ℓ)) 0 =\n      ∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * (deriv η s) ^ 2","proof":"(hasDerivAt_deriv_energy_variation hℓ hε hθ hη).deriv","truncated":false,"comment":"The actual second derivative, rather than a separately defined quadratic form."},{"id":174,"line":102,"statement":"theorem mixedVariation_energy {ε θ η ξ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) (hξ : ContDiff ℝ 1 ξ) :\n    deriv (fun t => deriv\n      (fun u => energy ε (angleVariation (angleVariation θ η t) ξ u) ℓ) 0) 0 =\n      ∫ s in 0..ℓ, deriv (deriv ε) (deriv θ s) * deriv η s * deriv ξ s","proof":"by\n  have hd (t : ℝ) :\n      deriv (fun u => energy ε (angleVariation (angleVariation θ η t) ξ u) ℓ) 0 =\n        ∫ s in 0..ℓ, deriv ε (deriv θ s + t * deriv η s) * deriv ξ s := by\n    have ht : ContDiff ℝ 1 (angleVariation θ η t) :=\n      hθ.add (contDiff_const.mul hη)\n    simpa only [deriv_angleVariation (hθ.differentiable one_ne_zero)\n      (hη.differentiable one_ne_zero)] using\n      (hasDerivAt_energy_variation hℓ (hε.of_le (by norm_num)) ht hξ).deriv\n  simp_rw [hd]\n  have h := hasDerivAt_weighted_integral_variation (ε := deriv ε)\n    (κ := deriv θ) (v := deriv η) (w := deriv ξ) hℓ hε.deriv'\n    hθ.continuous_deriv_one hη.continuous_deriv_one hξ.continuous_deriv_one 0\n  simpa only [zero_mul, add_zero] using h.deriv","truncated":false,"comment":"The actual mixed derivative for the two angle directions `η` and `ξ`."},{"id":175,"line":123,"statement":"theorem mixedVariation_energy_symmetric {ε θ η ξ : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 2 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) (hξ : ContDiff ℝ 1 ξ) :\n    deriv (fun t => deriv\n      (fun u => energy ε (angleVariation (angleVariation θ η t) ξ u) ℓ) 0) 0 =\n    deriv (fun u => deriv\n      (fun t => energy ε (angleVariation (angleVariation θ ξ u) η t) ℓ) 0) 0","proof":"by\n  rw [mixedVariation_energy hℓ hε hθ hη hξ, mixedVariation_energy hℓ hε hθ hξ hη]\n  apply intervalIntegral.integral_congr\n  intro s _\n  dsimp\n  ring","truncated":false,"comment":"Interchanging the two angle-variation directions preserves the mixed derivative."},{"id":176,"line":20,"statement":"theorem exists_multipliers_of_kernel\n    {V : Type*} [AddCommGroup V] [Module ℝ V]\n    (f c₁ c₂ : V →ₗ[ℝ] ℝ)\n    (h : ∀ v, c₁ v = 0 → c₂ v = 0 → f v = 0) :\n    ∃ lam μ : ℝ, ∀ v, f v + lam * c₁ v + μ * c₂ v = 0","proof":"by\n  let c : V →ₗ[ℝ] ℝ × ℝ := c₁.prod c₂\n  have hf : f ∈ (LinearMap.ker c).dualAnnihilator := by\n    rw [Submodule.mem_dualAnnihilator]\n    intro v hv\n    have hv' : c v = 0 := hv\n    exact h v (congrArg Prod.fst hv') (congrArg Prod.snd hv')\n  rw [← LinearMap.range_dualMap_eq_dualAnnihilator_ker] at hf\n  obtain ⟨g, hg⟩ := hf\n  refine ⟨-g (1, 0), -g (0, 1), ?_⟩\n  intro v\n  have hgv : g (c v) = f v := DFunLike.congr_fun hg v\n  have hc : c v = (c₁ v) • (1, 0) + (c₂ v) • (0, 1) := by\n    ext <;> simp [c]\n  rw [hc, map_add, map_smul, map_smul] at hgv\n  simp only [smul_eq_mul] at hgv\n  nlinarith","truncated":false,"comment":"Vanishing on the kernel of two linear constraints gives two multipliers.\nNo rank or independence assumption is needed for this implication."},{"id":177,"line":94,"statement":"theorem stationary_multipliers {ℓ : ℝ} {θ M : ℝ → ℝ}\n    (hθ : Continuous θ) (hM : Continuous M)\n    (hstat : ∀ η : variationSpace ℓ,\n      (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, M s * deriv η.val s) = 0) :\n    ∃ lam μ : ℝ, ∀ η : variationSpace ℓ,\n      (∫ s in 0..ℓ, M s * deriv η.val s) +\n      lam * (∫ s in 0..ℓ, -sin (θ s) * η.val s) +\n      μ * (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0","proof":"by\n  exact exists_multipliers_of_kernel (firstVariationLinear ℓ M hM)\n    (constraintLinear ℓ (fun s => -sin (θ s)) (Real.continuous_sin.comp hθ).neg)\n    (constraintLinear ℓ (fun s => cos (θ s)) (Real.continuous_cos.comp hθ)) hstat","truncated":false,"comment":"The multiplier theorem for the actual elastica integral functionals."},{"id":178,"line":109,"statement":"theorem residual_zero_of_weighted_square_integral {ℓ : ℝ} {r : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hr : Continuous r)\n    (hint : (∫ s in 0..ℓ, s * (ℓ - s) * (r s) ^ 2) = 0) :\n    ∀ s ∈ Ioo 0 ℓ, r s = 0","proof":"by\n  intro s hs\n  by_contra hne\n  have hcont : Continuous (fun t : ℝ => t * (ℓ - t) * (r t) ^ 2) := by fun_prop\n  have hpos : 0 < ∫ t in 0..ℓ, t * (ℓ - t) * (r t) ^ 2 := by\n    have h := intervalIntegral.integral_lt_integral_of_continuousOn_of_le_of_exists_lt\n      hℓ continuousOn_const hcont.continuousOn\n      (fun t ht => mul_nonneg (mul_nonneg ht.1.le (sub_nonneg.mpr ht.2)) (sq_nonneg _))\n      ⟨s, ⟨hs.1.le, hs.2.le⟩, mul_pos (mul_pos hs.1 (sub_pos.mpr hs.2)) (sq_pos_of_ne_zero hne)⟩\n    simpa using h\n  linarith","truncated":false,"comment":"Weighted square form of the fundamental lemma, with explicit positivity."},{"id":179,"line":125,"statement":"theorem firstVariation_by_parts {ℓ : ℝ} {M : ℝ → ℝ}\n    (hM : ContDiff ℝ 1 M) (η : variationSpace ℓ) :\n    (∫ s in 0..ℓ, M s * deriv η.val s) =\n      -(∫ s in 0..ℓ, deriv M s * η.val s)","proof":"by\n  have h := intervalIntegral.integral_mul_deriv_eq_deriv_mul\n    (fun s _ => (hM.differentiable one_ne_zero s).hasDerivAt)\n    (fun s _ => (η.property.1.differentiable one_ne_zero s).hasDerivAt)\n    (hM.continuous_deriv_one.intervalIntegrable 0 ℓ)\n    (η.property.1.continuous_deriv_one.intervalIntegrable 0 ℓ)\n  simpa [η.property.2.1, η.property.2.2] using h","truncated":false,"comment":"Integration by parts with the two fixed-end boundary terms removed."},{"id":180,"line":137,"statement":"theorem augmented_integral_eq_residual {ℓ : ℝ} {M q : ℝ → ℝ}\n    (hM : ContDiff ℝ 1 M) (hq : Continuous q) (η : variationSpace ℓ) :\n    (∫ s in 0..ℓ, M s * deriv η.val s) + (∫ s in 0..ℓ, q s * η.val s) =\n      ∫ s in 0..ℓ, (-deriv M s + q s) * η.val s","proof":"by\n  rw [firstVariation_by_parts hM η]\n  simp_rw [add_mul, neg_mul]\n  have he := intervalIntegral.integral_add\n    (μ := volume) (a := 0) (b := ℓ)\n    (f := fun s => -(deriv M s * η.val s)) (g := fun s => q s * η.val s)\n    ((hM.continuous_deriv_one.mul η.property.1.continuous).neg.intervalIntegrable _ _)\n    ((hq.mul η.property.1.continuous).intervalIntegrable _ _)\n  simpa only [intervalIntegral.integral_neg] using he.symm","truncated":false,"comment":"Combining the two terms of a first variation into its Euler residual."},{"id":181,"line":152,"statement":"theorem residual_zero_of_augmented_stationary {ℓ : ℝ} {M q : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hM : ContDiff ℝ 2 M) (hq : ContDiff ℝ 1 q)\n    (hstat : ∀ η : variationSpace ℓ,\n      (∫ s in 0..ℓ, M s * deriv η.val s) + (∫ s in 0..ℓ, q s * η.val s) = 0) :\n    ∀ s ∈ Ioo 0 ℓ, deriv M s = q s","proof":"by\n  let r : ℝ → ℝ := fun s => -deriv M s + q s\n  have hr : ContDiff ℝ 1 r := (hM.deriv').neg.add hq\n  let η : variationSpace ℓ :=\n    ⟨fun s => s * (ℓ - s) * r s,\n      ⟨(contDiff_id.mul (contDiff_const.sub contDiff_id)).mul hr, by simp, by simp⟩⟩\n  have hint := hstat η\n  rw [augmented_integral_eq_residual (hM.of_le (by norm_num)) hq.continuous η] at hint\n  have hint' : (∫ s in 0..ℓ, s * (ℓ - s) * (r s) ^ 2) = 0 := by\n    convert hint using 1\n    apply intervalIntegral.integral_congr\n    intro s _\n    change s * (ℓ - s) * (r s) ^ 2 = r s * (s * (ℓ - s) * r s)\n    ring\n  have hz := residual_zero_of_weighted_square_integral hℓ hr.continuous hint'\n  intro s hs\n  have := hz s hs\n  dsimp [r] at this\n  linarith","truncated":false,"comment":"The residual-derived test function is C¹ and has zero endpoint values.\nThis is the step that keeps the fundamental lemma within the stated variation family."},{"id":182,"line":178,"statement":"theorem augmented_stationary_of_residual_zero {ℓ : ℝ} {M q : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hM : ContDiff ℝ 1 M) (hq : Continuous q)\n    (hEL : ∀ s ∈ Ioo 0 ℓ, deriv M s = q s) :\n    ∀ η : variationSpace ℓ,\n      (∫ s in 0..ℓ, M s * deriv η.val s) + (∫ s in 0..ℓ, q s * η.val s) = 0","proof":"by\n  have hcc : EqOn (deriv M) q (Icc 0 ℓ) := by\n    have hh : EqOn (deriv M) q (Ioo 0 ℓ) := hEL\n    have hc := hh.closure hM.continuous_deriv_one hq\n    simpa only [closure_Ioo hℓ.ne] using hc\n  intro η\n  rw [augmented_integral_eq_residual hM hq η]\n  calc\n    _ = ∫ s in 0..ℓ, (0 : ℝ) := by\n      apply intervalIntegral.integral_congr\n      intro s hs\n      rw [uIcc_of_le hℓ.le] at hs\n      change (-deriv M s + q s) * η.val s = 0\n      rw [hcc hs]\n      ring\n    _ = 0 := by simp","truncated":false,"comment":"The converse integration-by-parts implication needs only C¹ for M.\nEquality on the interior extends to the endpoints by continuity."},{"id":183,"line":200,"statement":"theorem augmented_stationary_iff_residual_zero {ℓ : ℝ} {M q : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hM : ContDiff ℝ 2 M) (hq : ContDiff ℝ 1 q) :\n    (∀ η : variationSpace ℓ,\n      (∫ s in 0..ℓ, M s * deriv η.val s) + (∫ s in 0..ℓ, q s * η.val s) = 0) ↔\n      ∀ s ∈ Ioo 0 ℓ, deriv M s = q s","proof":"⟨residual_zero_of_augmented_stationary hℓ hM hq,\n    augmented_stationary_of_residual_zero hℓ (hM.of_le (by norm_num)) hq.continuous⟩","truncated":false,"comment":"For this smoothness class the integral condition and angle residual are equivalent."},{"id":184,"line":209,"statement":"theorem force_integral {ℓ lam μ : ℝ} {θ : ℝ → ℝ}\n    (hθ : Continuous θ) (η : variationSpace ℓ) :\n    (∫ s in 0..ℓ, (-lam * sin (θ s) + μ * cos (θ s)) * η.val s) =\n      lam * (∫ s in 0..ℓ, -sin (θ s) * η.val s) +\n      μ * (∫ s in 0..ℓ, cos (θ s) * η.val s)","proof":"by\n  have hi₁ : IntervalIntegrable (fun s => lam * (-sin (θ s) * η.val s)) volume 0 ℓ :=\n    (continuous_const.mul ((Real.continuous_sin.comp hθ).neg.mul η.property.1.continuous)).intervalIntegrable _ _\n  have hi₂ : IntervalIntegrable (fun s => μ * (cos (θ s) * η.val s)) volume 0 ℓ :=\n    (continuous_const.mul ((Real.continuous_cos.comp hθ).mul η.property.1.continuous)).intervalIntegrable _ _\n  calc\n    _ = ∫ s in 0..ℓ,\n        lam * (-sin (θ s) * η.val s) + μ * (cos (θ s) * η.val s) := by\n      apply intervalIntegral.integral_congr\n      intro s _\n      ring\n    _ = _ := by rw [intervalIntegral.integral_add hi₁ hi₂,\n      intervalIntegral.integral_const_mul, intervalIntegral.integral_const_mul]","truncated":false,"comment":"The integrated force term is the linear combination of endpoint constraints."},{"id":185,"line":228,"statement":"theorem angleEquation_of_stationary {ℓ : ℝ} {θ M : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ) (hM : ContDiff ℝ 2 M)\n    (hstat : ∀ η : variationSpace ℓ,\n      (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, M s * deriv η.val s) = 0) :\n    ∃ lam μ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      deriv M s = -lam * sin (θ s) + μ * cos (θ s)","proof":"by\n  obtain ⟨lam, μ, hm⟩ := stationary_multipliers hθ.continuous hM.continuous hstat\n  refine ⟨lam, μ, residual_zero_of_augmented_stationary hℓ hM\n    ((contDiff_const.mul hθ.sin).add (contDiff_const.mul hθ.cos)) ?_⟩\n  intro η\n  rw [force_integral hθ.continuous η]\n  linarith [hm η]","truncated":false,"comment":"Concrete constrained stationarity implies the classical angle equation."},{"id":186,"line":244,"statement":"theorem stationary_of_angleEquation {ℓ lam μ : ℝ} {θ M : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hθ : Continuous θ) (hM : ContDiff ℝ 1 M)\n    (hEL : ∀ s ∈ Ioo 0 ℓ, deriv M s = -lam * sin (θ s) + μ * cos (θ s)) :\n    ∀ η : variationSpace ℓ,\n      (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, M s * deriv η.val s) = 0","proof":"by\n  have hq : Continuous (fun s => -lam * sin (θ s) + μ * cos (θ s)) :=\n    (continuous_const.mul (Real.continuous_sin.comp hθ)).add\n      (continuous_const.mul (Real.continuous_cos.comp hθ))\n  intro η hx hy\n  have h := augmented_stationary_of_residual_zero hℓ hM hq hEL η\n  rw [force_integral hθ η, hx, hy] at h\n  simpa using h","truncated":false,"comment":"A solution of the angle equation is stationary under the linearized constraints."},{"id":187,"line":262,"statement":"theorem stationary_iff_exists_angleEquation {ℓ : ℝ} {θ M : ℝ → ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ) (hM : ContDiff ℝ 2 M) :\n    (∀ η : variationSpace ℓ,\n      (∫ s in 0..ℓ, -sin (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, cos (θ s) * η.val s) = 0 →\n      (∫ s in 0..ℓ, M s * deriv η.val s) = 0) ↔\n    (∃ lam μ : ℝ, ∀ s ∈ Ioo 0 ℓ,\n      deriv M s = -lam * sin (θ s) + μ * cos (θ s))","proof":"by\n  constructor\n  · exact angleEquation_of_stationary hℓ hθ hM\n  · rintro ⟨lam, μ, hEL⟩\n    exact stationary_of_angleEquation hℓ hθ.continuous (hM.of_le (by norm_num)) hEL","truncated":false,"comment":"Full equivalence with the linearized fixed-position constraints.\nIt says neither that a stationary curve minimizes energy nor that admissible\ncurves exist for arbitrary boundary data."},{"id":188,"line":24,"statement":"theorem cos_eq_one_of_xCoord_eq_length {θ : ℝ → ℝ} {ℓ x₀ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : Continuous θ)\n    (hx : xCoord θ x₀ ℓ = x₀ + ℓ) :\n    ∀ s ∈ Icc 0 ℓ, cos (θ s) = 1","proof":"by\n  have hi : (∫ s in 0..ℓ, cos (θ s)) = ℓ := by\n    unfold xCoord at hx\n    linarith\n  intro s hs\n  by_contra hne\n  have hp : cos (θ s) < 1 := lt_of_le_of_ne (cos_le_one _) hne\n  have hlt := intervalIntegral.integral_lt_integral_of_continuousOn_of_le_of_exists_lt\n    hℓ (continuous_cos.comp hθ).continuousOn continuousOn_const\n    (fun t _ => cos_le_one (θ t)) ⟨s, hs, hp⟩\n  have : (∫ t in 0..ℓ, cos (θ t)) < ℓ := by simpa using hlt\n  linarith","truncated":false,"comment":"Saturation of the horizontal displacement bound forces the horizontal\ntangent component to be one, including at the endpoints."},{"id":189,"line":41,"statement":"theorem sin_eq_zero_of_xCoord_eq_length {θ : ℝ → ℝ} {ℓ x₀ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : Continuous θ)\n    (hx : xCoord θ x₀ ℓ = x₀ + ℓ) :\n    ∀ s ∈ Icc 0 ℓ, sin (θ s) = 0","proof":"by\n  intro s hs\n  have hc := cos_eq_one_of_xCoord_eq_length hℓ hθ hx s hs\n  have hh := sin_sq_add_cos_sq (θ s)\n  rw [hc] at hh\n  nlinarith [sq_nonneg (sin (θ s))]","truncated":false,"comment":"The vertical tangent component vanishes under the same saturated constraint."},{"id":190,"line":52,"statement":"theorem curvature_zero_of_xCoord_eq_length {θ : ℝ → ℝ} {ℓ x₀ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ)\n    (hx : xCoord θ x₀ ℓ = x₀ + ℓ) :\n    ∀ s ∈ Icc 0 ℓ, curvature θ s = 0","proof":"by\n  have hc := cos_eq_one_of_xCoord_eq_length hℓ hθ.continuous hx\n  have hs := sin_eq_zero_of_xCoord_eq_length hℓ hθ.continuous hx\n  have hd : EqOn (deriv θ) (fun _ => (0 : ℝ)) (Ioo 0 ℓ) := by\n    intro s hsi\n    have he : (fun t => sin (θ t)) =ᶠ[𝓝 s] (fun _ => (0 : ℝ)) := by\n      filter_upwards [isOpen_Ioo.mem_nhds hsi] with t ht\n      exact hs t ⟨ht.1.le, ht.2.le⟩\n    have hh := ((hθ.differentiable one_ne_zero s).hasDerivAt.sin).deriv\n    rw [he.deriv_eq, deriv_const, hc s ⟨hsi.1.le, hsi.2.le⟩, one_mul] at hh\n    exact hh.symm\n  have hclosed := hd.closure hθ.continuous_deriv_one continuous_const\n  simpa only [curvature, closure_Ioo hℓ.ne, Set.EqOn] using hclosed","truncated":false,"comment":"For C¹ angles, the signed curvature also vanishes on the closed interval."},{"id":191,"line":71,"statement":"theorem angle_eq_initial_of_xCoord_eq_length {θ : ℝ → ℝ} {ℓ x₀ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ)\n    (hx : xCoord θ x₀ ℓ = x₀ + ℓ) :\n    ∀ s ∈ Icc 0 ℓ, θ s = θ 0","proof":"by\n  apply angle_eq_of_curvature_eq_initial (θ := fun _ => θ 0) hℓ contDiff_const hθ\n  · intro s hs\n    simpa using curvature_zero_of_xCoord_eq_length hℓ hθ hx s ⟨hs.1.le, hs.2.le⟩\n  · rfl","truncated":false,"comment":"Fixing the initial real angle removes the possible multiples of 2π:\nthe whole lifted angle is exactly its initial value."},{"id":192,"line":82,"statement":"theorem energy_eq_straight_of_xCoord_eq_length {θ : ℝ → ℝ} {ℓ x₀ : ℝ}\n    (hℓ : 0 < ℓ) (hθ : ContDiff ℝ 1 θ)\n    (hx : xCoord θ x₀ ℓ = x₀ + ℓ) (ε : ℝ → ℝ) :\n    energy ε θ ℓ = ℓ * ε 0","proof":"by\n  unfold energy\n  have he : (∫ s in 0..ℓ, ε (deriv θ s)) = ∫ s in 0..ℓ, ε 0 := by\n    apply intervalIntegral.integral_congr\n    intro s hs\n    rw [uIcc_of_le hℓ.le] at hs\n    exact congrArg ε (curvature_zero_of_xCoord_eq_length hℓ hθ hx s hs)\n  rw [he]\n  simp","truncated":false,"comment":"Every exactly feasible curve for the saturated horizontal displacement has\nthe same energy, for any density; no sign assumption on its second derivative."},{"id":193,"line":98,"statement":"theorem straight_is_global_minimum_on_horizontal_constraint {ℓ : ℝ}\n    (hℓ : 0 < ℓ) (ε : ℝ → ℝ) (θ : ℝ → ℝ)\n    (hθ : ContDiff ℝ 1 θ) (hx : xCoord θ 0 ℓ = ℓ) :\n    energy ε (fun _ => 0) ℓ ≤ energy ε θ ℓ","proof":"by\n  rw [energy_const, energy_eq_straight_of_xCoord_eq_length\n    (x₀ := 0) hℓ hθ (by simpa using hx)]","truncated":false,"comment":"In particular the straight curve is a global minimizer among all C¹ angles\nwith the saturated horizontal displacement, for every density. Adding the\nfixed vertical endpoint and fixed end angles only restricts this feasible set."},{"id":194,"line":106,"statement":"theorem straight_polynomial_hasDerivAt (s : ℝ) :\n    HasDerivAt (fun u : ℝ => u * (1 - u) * (u - 1 / 2))\n      (-3 * s ^ 2 + 3 * s - 1 / 2) s","proof":"by\n  convert (((hasDerivAt_id s).mul ((hasDerivAt_const s (1 : ℝ)).sub (hasDerivAt_id s))).mul\n    ((hasDerivAt_id s).sub_const (1 / 2))) using 1\n  all_goals first | rfl | (simp only [id_eq, Pi.sub_apply, Pi.mul_apply]; ring)","truncated":false,"comment":"Derivative of the explicit fixed-end polynomial variation."},{"id":195,"line":115,"statement":"theorem straight_polynomial_integral :\n    (∫ s in (0 : ℝ)..1, s * (1 - s) * (s - 1 / 2)) = 0","proof":"by\n  have hd (s : ℝ) :\n      HasDerivAt (fun u : ℝ => -(u ^ 4) / 4 + u ^ 3 / 2 - u ^ 2 / 4)\n        (s * (1 - s) * (s - 1 / 2)) s := by\n    convert ((((hasDerivAt_id s).pow 4).neg.div_const 4).add\n      (((hasDerivAt_id s).pow 3).div_const 2)).sub\n        (((hasDerivAt_id s).pow 2).div_const 4) using 1\n    all_goals first | rfl | (simp only [id_eq]; norm_num; ring)\n  have hc : Continuous (fun s : ℝ => s * (1 - s) * (s - 1 / 2)) := by fun_prop\n  have h := intervalIntegral.integral_eq_sub_of_hasDerivAt\n    (a := (0 : ℝ)) (b := 1) (fun s _ => hd s) (hc.intervalIntegrable 0 1)\n  norm_num at h ⊢\n  exact h","truncated":false,"comment":"Its average is zero, hence it lies in the vertical linearized constraint\nkernel at a horizontal straight curve."},{"id":196,"line":131,"statement":"theorem straight_polynomial_deriv_square_integral :\n    (∫ s in (0 : ℝ)..1,\n      (deriv (fun u : ℝ => u * (1 - u) * (u - 1 / 2)) s) ^ 2) = 1 / 20","proof":"by\n  have hd (s : ℝ) :\n      HasDerivAt (fun u : ℝ => 9 * u ^ 5 / 5 - 9 * u ^ 4 / 2 +\n        4 * u ^ 3 - 3 * u ^ 2 / 2 + u / 4)\n        ((-3 * s ^ 2 + 3 * s - 1 / 2) ^ 2) s := by\n    convert ((((((hasDerivAt_id s).pow 5).const_mul 9).div_const 5).sub\n      ((((hasDerivAt_id s).pow 4).const_mul 9).div_const 2)).add\n        (((hasDerivAt_id s).pow 3).const_mul 4)).sub\n          ((((hasDerivAt_id s).pow 2).const_mul 3).div_const 2) |>.add\n            ((hasDerivAt_id s).div_const 4) using 1\n    all_goals first | rfl | (simp only [id_eq]; norm_num; ring)\n  have hc : Continuous (fun s : ℝ => (-3 * s ^ 2 + 3 * s - 1 / 2) ^ 2) := by fun_prop\n  have h := intervalIntegral.integral_eq_sub_of_hasDerivAt\n    (a := (0 : ℝ)) (b := 1) (fun s _ => hd s) (hc.intervalIntegrable 0 1)\n  simp_rw [(straight_polynomial_hasDerivAt _).deriv]\n  norm_num at h ⊢\n  exact h","truncated":false,"comment":"Its derivative has strictly positive squared integral, evaluated exactly."},{"id":197,"line":151,"statement":"theorem negative_quadratic_second_deriv (q : ℝ) :\n    deriv (deriv (fun x : ℝ => -(x ^ 2) / 2)) q = -1","proof":"by\n  have hd : deriv (fun x : ℝ => -(x ^ 2) / 2) = fun x => -x := by\n    funext x\n    have h : HasDerivAt (fun u : ℝ => -(u ^ 2) / 2) (-x) x := by\n      convert ((hasDerivAt_id x).pow 2).neg.div_const 2 using 1\n      all_goals first | rfl | (simp only [id_eq]; norm_num; ring)\n    exact h.deriv\n  rw [hd]\n  exact (hasDerivAt_id q).neg.deriv","truncated":false,"comment":""},{"id":198,"line":164,"statement":"theorem straight_polynomial_variation_not_exactly_feasible {t : ℝ} (ht : t ≠ 0) :\n    xCoord (angleVariation (fun _ => 0)\n      (fun s : ℝ => s * (1 - s) * (s - 1 / 2)) t) 0 1 < 1","proof":"by\n  let θ : ℝ → ℝ := angleVariation (fun _ => 0)\n    (fun s : ℝ => s * (1 - s) * (s - 1 / 2)) t\n  have hθ : ContDiff ℝ 1 θ := by\n    change ContDiff ℝ 1 (fun s : ℝ => 0 + t * (s * (1 - s) * (s - 1 / 2)))\n    fun_prop\n  have hne : xCoord θ 0 1 ≠ 1 := by\n    intro hx\n    have ha := angle_eq_initial_of_xCoord_eq_length (ℓ := 1) (x₀ := 0)\n      (by norm_num) hθ (by simpa using hx) (1 / 4) (by constructor <;> norm_num)\n    norm_num [θ, angleVariation] at ha\n    exact ht (by linarith)\n  have habs := abs_x_displacement_le θ 0 1 (by norm_num)\n  have hle : xCoord θ 0 1 ≤ 1 := by\n    simpa using (le_abs_self (xCoord θ 0 1)).trans (by simpa using habs)\n  exact lt_of_le_of_ne hle hne","truncated":false,"comment":"Although its first endpoint derivative is zero, every nonzero member of\nthis additive variation has strictly smaller horizontal displacement."},{"id":199,"line":186,"statement":"theorem straight_negative_secondVariation_counterexample :\n    (∀ θ : ℝ → ℝ, ContDiff ℝ 1 θ → xCoord θ 0 1 = 1 →\n      energy (fun q : ℝ => -(q ^ 2) / 2) (fun _ => 0) 1 ≤\n        energy (fun q : ℝ => -(q ^ 2) / 2) θ 1) ∧\n    ∃ η : ℝ → ℝ, ContDiff ℝ 1 η ∧ η 0 = 0 ∧ η 1 = 0 ∧\n      deriv (fun t : ℝ => ∫ s in 0..1, cos (t * η s)) 0 = 0 ∧\n      deriv (fun t : ℝ => ∫ s in 0..1, sin (t * η s)) 0 = 0 ∧\n      deriv (deriv (fun t =>\n        energy (fun q : ℝ => -(q ^ 2) / 2)\n          (angleVariation (fun _ => 0) η t) 1)) 0 = -1 / 20","proof":"by\n  refine ⟨fun θ hθ hx => straight_is_global_minimum_on_horizontal_constraint\n    (by norm_num) _ θ hθ hx, ?_⟩\n  let η : ℝ → ℝ := fun s => s * (1 - s) * (s - 1 / 2)\n  have hη : ContDiff ℝ 1 η := by dsimp [η]; fun_prop\n  refine ⟨η, hη, by simp [η], by simp [η], ?_, ?_, ?_⟩\n  · simpa only [zero_add, sin_zero, neg_zero, zero_mul, intervalIntegral.integral_zero] using\n      (hasDerivAt_horizontal_variation (θ := fun _ => 0)\n        (ℓ := 1) (by norm_num) continuous_const hη.continuous).deriv\n  · have h := (hasDerivAt_vertical_variation (θ := fun _ => 0)\n      (ℓ := 1) (by norm_num) continuous_const hη.continuous).deriv\n    simpa only [zero_add, cos_zero, one_mul, η, straight_polynomial_integral] using h\n  · rw [secondVariation_energy (by norm_num)\n      (show ContDiff ℝ 2 (fun q : ℝ => -(q ^ 2) / 2) by fun_prop) contDiff_const hη]\n    simp_rw [negative_quadratic_second_deriv]\n    rw [intervalIntegral.integral_const_mul]\n    have hi : (∫ s in (0 : ℝ)..1, (deriv η s) ^ 2) = 1 / 20 :=\n      straight_polynomial_deriv_square_integral\n    rw [hi]\n    norm_num","truncated":false,"comment":"The straight curve is an exact constrained global minimizer, but this C¹\nfixed-end direction belongs to both linearized endpoint kernels and has a\nnegative actual energy second derivative. The singular constraint is essential."},{"id":200,"line":32,"statement":"theorem deriv_angleVariation {θ η : ℝ → ℝ} (hθ : Differentiable ℝ θ)\n    (hη : Differentiable ℝ η) (t s : ℝ) :\n    deriv (angleVariation θ η t) s = deriv θ s + t * deriv η s","proof":"by\n  exact ((hθ s).hasDerivAt.add ((hη s).hasDerivAt.const_mul t)).deriv","truncated":false,"comment":"Its curvature is the sum of the original curvature and the varied derivative."},{"id":201,"line":41,"statement":"theorem hasDerivAt_integral_variation {ε κ v : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 1 ε) (hκ : Continuous κ) (hv : Continuous v) :\n    HasDerivAt (fun t : ℝ => ∫ s in 0..ℓ, ε (κ s + t * v s))\n      (∫ s in 0..ℓ, deriv ε (κ s) * v s) 0","proof":"by\n  have hεd : Differentiable ℝ ε := hε.differentiable (by norm_num)\n  have hε' : Continuous (deriv ε) := hε.continuous_deriv (by norm_num)\n  have hc : Continuous (fun p : ℝ × ℝ => deriv ε (κ p.2 + p.1 * v p.2) * v p.2) :=\n    (hε'.comp ((hκ.comp continuous_snd).add\n      (continuous_fst.mul (hv.comp continuous_snd)))).mul (hv.comp continuous_snd)\n  obtain ⟨C, hC⟩ :=\n    ((isCompact_Icc : IsCompact (Icc (-1 : ℝ) 1)).prod\n      (isCompact_Icc : IsCompact (Icc (0 : ℝ) ℓ))).exists_bound_of_continuousOn hc.continuousOn\n  have hmeas (t : ℝ) : AEStronglyMeasurable\n      (fun s => ε (κ s + t * v s)) (volume.restrict (Ioc 0 ℓ)) :=\n    (hε.continuous.comp (hκ.add (continuous_const.mul hv))).aestronglyMeasurable\n  have hint : Integrable (fun s => ε (κ s + (0 : ℝ) * v s))\n      (volume.restrict (Ioc 0 ℓ)) := by\n    exact ((hε.continuous.comp (hκ.add (continuous_const.mul hv))).intervalIntegrable 0 ℓ).1\n  have hmeas' : AEStronglyMeasurable\n      (fun s => deriv ε (κ s + (0 : ℝ) * v s) * v s)\n      (volume.restrict (Ioc 0 ℓ)) :=\n    ((hε'.comp (hκ.add (continuous_const.mul hv))).mul hv).aestronglyMeasurable\n  have hbound : ∀ᵐ s ∂volume.restrict (Ioc 0 ℓ),\n      ∀ t ∈ Ioo (-1 : ℝ) 1, ‖deriv ε (κ s + t * v s) * v s‖ ≤ C := by\n    filter_upwards [ae_restrict_mem measurableSet_Ioc] with s hs\n    intro t ht\n    exact hC (t, s) ⟨⟨le_of_lt ht.1, le_of_lt ht.2⟩, ⟨le_of_lt hs.1, hs.2⟩⟩\n  have hdiff : ∀ᵐ s ∂volume.restrict (Ioc 0 ℓ), ∀ t ∈ Ioo (-1 : ℝ) 1,\n      HasDerivAt (fun t => ε (κ s + t * v s))\n        (deriv ε (κ s + t * v s) * v s) t := by\n    filter_upwards [] with s\n    intro t _\n    convert (hεd (κ s + t * v s)).hasDerivAt.comp t\n      (((hasDerivAt_id t).mul_const (v s)).const_add (κ s)) using 1\n    all_goals first | (funext x; rfl) | ring\n  have h := hasDerivAt_integral_of_dominated_loc_of_deriv_le\n    (Ioo_mem_nhds (by norm_num : (-1 : ℝ) < 0) (by norm_num : (0 : ℝ) < 1))\n    (Filter.Eventually.of_forall hmeas) hint hmeas' hbound\n    (integrable_const C) hdiff\n  simpa only [intervalIntegral.integral_of_le hℓ, zero_mul, add_zero] using h.2","truncated":false,"comment":"Differentiating a general density under a finite curvature integral.\n\nThe compact rectangle supplies the bound; boundedness of the density derivative\non all of ℝ is not assumed."},{"id":202,"line":83,"statement":"theorem hasDerivAt_energy_variation {ε θ η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 1 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) :\n    HasDerivAt (fun t => energy ε (angleVariation θ η t) ℓ)\n      (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv η s) 0","proof":"by\n  have h := hasDerivAt_integral_variation hℓ hε\n    (hθ.continuous_deriv (by norm_num)) (hη.continuous_deriv (by norm_num))\n  simpa only [energy, deriv_angleVariation\n    (hθ.differentiable (by norm_num)) (hη.differentiable (by norm_num))] using h","truncated":false,"comment":"First variation of the energy evaluated at the genuinely varied angle."},{"id":203,"line":94,"statement":"theorem hasDerivAt_horizontal_variation {θ η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : Continuous θ) (hη : Continuous η) :\n    HasDerivAt (fun t => ∫ s in 0..ℓ, Real.cos (θ s + t * η s))\n      (∫ s in 0..ℓ, -Real.sin (θ s) * η s) 0","proof":"by\n  simpa only [Real.deriv_cos] using\n    (hasDerivAt_integral_variation hℓ Real.contDiff_cos hθ hη)","truncated":false,"comment":"First variation of the horizontal displacement."},{"id":204,"line":102,"statement":"theorem hasDerivAt_vertical_variation {θ η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hθ : Continuous θ) (hη : Continuous η) :\n    HasDerivAt (fun t => ∫ s in 0..ℓ, Real.sin (θ s + t * η s))\n      (∫ s in 0..ℓ, Real.cos (θ s) * η s) 0","proof":"by\n  simpa only [Real.deriv_sin] using\n    (hasDerivAt_integral_variation hℓ Real.contDiff_sin hθ hη)","truncated":false,"comment":"First variation of the vertical displacement."},{"id":205,"line":15,"statement":"theorem powerLog_zero_exponentialWeight (β : ℝ) (ε θ : ℝ → ℝ) (ℓ : ℝ) :\n    powerLog 0 (exponentialWeight β ε θ ℓ) = -β * energy ε θ ℓ","proof":"by\n  rw [powerLog_zero, log_exponentialWeight]","truncated":false,"comment":"At exponent zero, the composed representation recovers the energy exactly."},{"id":206,"line":21,"statement":"theorem tendsto_powerLog_exponentialWeight_zero (β : ℝ) (ε θ : ℝ → ℝ) (ℓ : ℝ) :\n    Tendsto (fun p => powerLog p (exponentialWeight β ε θ ℓ)) (𝓝 0)\n      (𝓝 (-β * energy ε θ ℓ))","proof":"by\n  simpa only [log_exponentialWeight] using\n    tendsto_powerLog_exponent_zero (exponentialWeight_pos β ε θ ℓ)","truncated":false,"comment":"The positive weight makes the existing exponent-zero limit applicable to\nevery energy value, regardless of the sign of the curvature or the density."},{"id":207,"line":28,"statement":"theorem hasDerivAt_powerLog_exp_neg_mul {f : ℝ → ℝ} {x d : ℝ}\n    (p β : ℝ) (hf : HasDerivAt f d x) :\n    HasDerivAt (fun t => powerLog p (exp (-β * f t)))\n      (-β * exp (-p * β * f x) * d) x","proof":"by\n  have he : exp (-β * f x) ^ (p - 1) * exp (-β * f x) =\n      exp (-p * β * f x) := by\n    rw [rpow_def_of_pos (exp_pos _), log_exp, ← exp_add]\n    congr 1\n    ring\n  convert (hasDerivAt_powerLog (p := p) (exp_pos (-β * f x))).comp x\n    (hasDerivAt_exp_neg_mul β hf) using 1\n  · rfl\n  · calc\n      -β * exp (-p * β * f x) * d =\n          -β * (exp (-β * f x) ^ (p - 1) * exp (-β * f x)) * d := by rw [he]\n      _ = _ := by ring","truncated":false,"comment":"Chain the two already proved derivatives and simplify the positive factor."},{"id":208,"line":46,"statement":"theorem strictAnti_powerLog_exp_neg_mul (p : ℝ) {β : ℝ} (hβ : 0 < β) :\n    StrictAnti (fun x : ℝ => powerLog p (exp (-β * x)))","proof":"by\n  apply strictAnti_of_deriv_neg\n  intro x\n  have hd : HasDerivAt (fun t : ℝ => powerLog p (exp (-β * t)))\n      (-β * exp (-p * β * x) * 1) x := by\n    simpa only [id_eq] using hasDerivAt_powerLog_exp_neg_mul p β (hasDerivAt_id x)\n  rw [hd.deriv]\n  simpa only [mul_one] using mul_neg_of_neg_of_pos (neg_neg_of_pos hβ) (exp_pos _)","truncated":false,"comment":"All real response exponents reverse energy order when β is positive."},{"id":209,"line":58,"statement":"theorem energy_le_iff_powerLog_exponentialWeight_le (p : ℝ) {β : ℝ}\n    (hβ : 0 < β) (ε θ ψ : ℝ → ℝ) (ℓ : ℝ) :\n    energy ε θ ℓ ≤ energy ε ψ ℓ ↔\n      powerLog p (exponentialWeight β ε ψ ℓ) ≤\n        powerLog p (exponentialWeight β ε θ ℓ)","proof":"by\n  exact (strictAnti_powerLog_exp_neg_mul p hβ).le_iff_ge.symm","truncated":false,"comment":"Exact comparison on the same curves, with no regularity requirement for\nthis order-theoretic identity."},{"id":210,"line":67,"statement":"theorem locallyMinimizing_iff_powerLog_weight_local_maximum (p : ℝ) {β : ℝ}\n    (hβ : 0 < β) (ε θ : ℝ → ℝ) (ℓ : ℝ) :\n    LocallyMinimizing ε θ ℓ ↔\n      ∃ r : ℝ, 0 < r ∧ ∀ ψ : ℝ → ℝ, ContDiff ℝ 1 ψ →\n        ψ 0 = θ 0 → ψ ℓ = θ ℓ →\n        (∫ s in 0..ℓ, cos (ψ s)) = (∫ s in 0..ℓ, cos (θ s)) →\n        (∫ s in 0..ℓ, sin (ψ s)) = (∫ s in 0..ℓ, sin (θ s)) →\n        (∀ s ∈ Icc 0 ℓ,\n          |ψ s - θ s| < r ∧ |deriv ψ s - deriv θ s| < r) →\n        powerLog p (exponentialWeight β ε ψ ℓ) ≤\n          powerLog p (exponentialWeight β ε θ ℓ)","proof":"by\n  simp only [LocallyMinimizing, energy_le_iff_powerLog_exponentialWeight_le p hβ]","truncated":false,"comment":"Compose with the existing constrained C¹ neighborhood, retaining all\nendpoint data rather than replacing it by an unconstrained scalar problem."},{"id":211,"line":81,"statement":"theorem hasDerivAt_powerLog_weight_variation {ε θ η : ℝ → ℝ} {ℓ : ℝ}\n    (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 1 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) (p β : ℝ) :\n    HasDerivAt (fun t => powerLog p\n      (exponentialWeight β ε (angleVariation θ η t) ℓ))\n      (-β * exp (-p * β * energy ε θ ℓ) *\n        (∫ s in 0..ℓ, deriv ε (deriv θ s) * deriv η s)) 0","proof":"by\n  have hzero : angleVariation θ η 0 = θ := by\n    funext s\n    simp only [angleVariation, zero_mul, add_zero]\n  simpa only [exponentialWeight, hzero] using\n    hasDerivAt_powerLog_exp_neg_mul p β (hasDerivAt_energy_variation hℓ hε hθ hη)","truncated":false,"comment":"Actual differentiation along the existing angle variation."},{"id":212,"line":95,"statement":"theorem powerLog_weight_variation_stationary_iff {ε θ η : ℝ → ℝ} {ℓ β : ℝ}\n    (hβ : β ≠ 0) (hℓ : 0 ≤ ℓ) (hε : ContDiff ℝ 1 ε)\n    (hθ : ContDiff ℝ 1 θ) (hη : ContDiff ℝ 1 η) (p : ℝ) :\n    deriv (fun t => powerLog p\n      (exponentialWeight β ε (angleVariation θ η t) ℓ)) 0 = 0 ↔\n      deriv (fun t => energy ε (angleVariation θ η t) ℓ) 0 = 0","proof":"by\n  rw [(hasDerivAt_powerLog_weight_variation hℓ hε hθ hη p β).deriv,\n    (hasDerivAt_energy_variation hℓ hε hθ hη).deriv]\n  simp only [mul_eq_zero, neg_eq_zero, hβ, exp_ne_zero, false_or]","truncated":false,"comment":"Vanishing of the actual first variation is unchanged for every exponent."},{"id":213,"line":107,"statement":"theorem powerLog_exponentialWeight_split {ε θ : ℝ → ℝ}\n    (hε : Continuous ε) (hθ : ContDiff ℝ 1 θ) (p β a ℓ : ℝ) :\n    powerLog p (exponentialWeight β ε θ ℓ) =\n      powerLog p (exponentialWeight β ε θ a) +\n      powerLog p (exp (-β * (∫ s in a..ℓ, ε (deriv θ s)))) +\n      p * powerLog p (exponentialWeight β ε θ a) *\n        powerLog p (exp (-β * (∫ s in a..ℓ, ε (deriv θ s))))","proof":"by\n  rw [exponentialWeight_split hε hθ β a ℓ]\n  exact powerLog_mul p (exponentialWeight_pos β ε θ a) (exp_pos _)","truncated":false,"comment":"Interval composition transports through the already established product\nidentity for normalized powers; p=0 reduces to additive negative energy."},{"id":214,"line":30,"statement":"theorem scalar_gap (lam r a x : ℝ) :\n    f lam r (input lam r a) x - f lam r (input lam r a) a =\n      (x - a) ^ 2 * (lam / 4 * (x + a) ^ 2 + (lam * a ^ 2 + r) / 2)","proof":"by\n  unfold f input\n  ring","truncated":false,"comment":""},{"id":215,"line":36,"statement":"theorem energy_gap (lam r a x y : ℝ) :\n    E lam r (input lam r a) x y - E lam r (input lam r a) a (Real.sqrt 2 * a) =\n      (y - Real.sqrt 2 * x) ^ 2 / 2 +\n        (x - a) ^ 2 * (lam / 4 * (x + a) ^ 2 + (lam * a ^ 2 + r) / 2)","proof":"by\n  unfold E\n  rw [sub_self, zero_pow (by decide : 2 ≠ 0), zero_div, add_zero]\n  linarith [scalar_gap lam r a x]","truncated":false,"comment":""},{"id":216,"line":45,"statement":"theorem globalMin_of_margin {lam r a : ℝ} (hlam : 0 ≤ lam)\n    (hmargin : 0 ≤ lam * a ^ 2 + r) : GlobalMin lam r a","proof":"by\n  intro x y\n  have hb : 0 ≤ lam / 4 * (x + a) ^ 2 + (lam * a ^ 2 + r) / 2 := by\n    positivity\n  have hp := mul_nonneg (sq_nonneg (x - a)) hb\n  have ht : 0 ≤ (y - Real.sqrt 2 * x) ^ 2 / 2 := by positivity\n  linarith [energy_gap lam r a x y]","truncated":false,"comment":"A nonnegative certificate gives an actual global minimum."},{"id":217,"line":55,"statement":"theorem margin_of_globalMin {lam r a : ℝ} (hlam : 0 < lam)\n    (hmin : GlobalMin lam r a) : 0 ≤ lam * a ^ 2 + r","proof":"by\n  by_cases ha : a = 0\n  · subst a\n    simp only [zero_pow (by decide : 2 ≠ 0), mul_zero, zero_add]\n    by_contra hn\n    have hr : r < 0 := lt_of_not_ge hn\n    let t : ℝ := Real.sqrt (-r / lam)\n    have hq : 0 < -r / lam := div_pos (neg_pos.mpr hr) hlam\n    have ht : 0 < t := Real.sqrt_pos.2 hq\n    have ht2 : t ^ 2 = -r / lam := Real.sq_sqrt (le_of_lt hq)\n    have hlt : lam * t ^ 2 = -r := by\n      rw [ht2]\n      field_simp\n    have hg := energy_gap lam r 0 t (Real.sqrt 2 * t)\n    have hm := hmin t (Real.sqrt 2 * t)\n    simp only [mul_zero] at hm\n    have hneg : t ^ 2 * r < 0 := mul_neg_of_pos_of_neg (sq_pos_of_pos ht) hr\n    simp only [sub_self, zero_pow (by decide : 2 ≠ 0), zero_div, zero_add,\n      sub_zero, add_zero, mul_zero] at hg\n    nlinarith [congrArg (fun q : ℝ => q * t ^ 2) hlt]\n  · have hm := hmin (-a) (Real.sqrt 2 * (-a))\n    have hg := energy_gap lam r a (-a) (Real.sqrt 2 * (-a))\n    have ha2 : 0 < a ^ 2 := sq_pos_of_ne_zero ha\n    by_contra hn\n    have hmarg : lam * a ^ 2 + r < 0 := lt_of_not_ge hn\n    have hnprod : a ^ 2 * (lam * a ^ 2 + r) < 0 :=\n      mul_neg_of_pos_of_neg ha2 hmarg\n    simp only [sub_self, zero_pow (by decide : 2 ≠ 0), zero_div, zero_add,\n      neg_add_cancel, mul_zero] at hg\n    nlinarith","truncated":false,"comment":"Necessity includes the degenerate target a = 0, via a concrete square-root witness."},{"id":218,"line":87,"statement":"theorem globalMin_iff_margin {lam r a : ℝ} (hlam : 0 < lam) :\n    GlobalMin lam r a ↔ 0 ≤ lam * a ^ 2 + r","proof":"⟨margin_of_globalMin hlam, globalMin_of_margin (le_of_lt hlam)⟩","truncated":false,"comment":""},{"id":219,"line":92,"statement":"theorem quadratic_gap_bound {lam r a : ℝ} (hlam : 0 ≤ lam) (x y : ℝ) :\n    (lam * a ^ 2 + r) / 2 * (x - a) ^ 2 ≤\n      E lam r (input lam r a) x y - E lam r (input lam r a) a (Real.sqrt 2 * a)","proof":"by\n  have hp : 0 ≤ (x - a) ^ 2 * (lam / 4 * (x + a) ^ 2) := by positivity\n  have ht : 0 ≤ (y - Real.sqrt 2 * x) ^ 2 / 2 := by positivity\n  linarith [energy_gap lam r a x y]","truncated":false,"comment":"The certificate also controls the squared location error."},{"id":220,"line":100,"statement":"theorem unique_of_margin_pos {lam r a : ℝ} (hlam : 0 ≤ lam)\n    (hmargin : 0 < lam * a ^ 2 + r) {x y : ℝ}\n    (he : E lam r (input lam r a) x y =\n      E lam r (input lam r a) a (Real.sqrt 2 * a)) :\n    x = a ∧ y = Real.sqrt 2 * a","proof":"by\n  have hb := quadratic_gap_bound (r := r) (a := a) hlam x y\n  have hsq : (x - a) ^ 2 = 0 := by\n    have hnonneg := sq_nonneg (x - a)\n    nlinarith\n  have hx : x = a := by nlinarith [sq_nonneg (x - a)]\n  subst x\n  have hg := energy_gap lam r a a y\n  have hy : (y - Real.sqrt 2 * a) ^ 2 = 0 := by\n    simp only [sub_self, zero_pow (by decide : 2 ≠ 0), zero_mul, add_zero] at hg\n    linarith\n  exact ⟨rfl, by nlinarith [sq_nonneg (y - Real.sqrt 2 * a)]⟩","truncated":false,"comment":"Positive margin forces every point with the same energy to be the target."},{"id":221,"line":119,"statement":"theorem equal_energy_iff_of_margin_zero {lam r a : ℝ} (hlam : 0 < lam)\n    (hmargin : lam * a ^ 2 + r = 0) (x y : ℝ) :\n    E lam r (input lam r a) x y =\n      E lam r (input lam r a) a (Real.sqrt 2 * a) ↔\n      (x = a ∨ x = -a) ∧ y = Real.sqrt 2 * x","proof":"by\n  have hg := energy_gap lam r a x y\n  rw [hmargin, zero_div, add_zero] at hg\n  have hfirst : 0 ≤ (y - Real.sqrt 2 * x) ^ 2 / 2 := by positivity\n  have hsecond : 0 ≤ (x - a) ^ 2 * (lam / 4 * (x + a) ^ 2) := by positivity\n  constructor\n  · intro he\n    have hs : (x - a) ^ 2 * (lam / 4 * (x + a) ^ 2) = 0 := by linarith\n    have hy0 : (y - Real.sqrt 2 * x) ^ 2 = 0 := by linarith\n    have hy : y = Real.sqrt 2 * x := by nlinarith\n    refine ⟨?_, hy⟩\n    rcases mul_eq_zero.mp hs with hleft | hright\n    · left\n      nlinarith\n    · have hl : lam / 4 ≠ 0 := ne_of_gt (by positivity)\n      have hx : (x + a) ^ 2 = 0 := (mul_eq_zero.mp hright).resolve_left hl\n      right\n      nlinarith\n  · rintro ⟨hx | hx, hy⟩\n    · subst x\n      subst y\n      rfl\n    · subst x\n      subst y\n      simp only [sub_self, neg_add_cancel, zero_pow (by decide : 2 ≠ 0),\n        zero_div, mul_zero, zero_add] at hg\n      linarith","truncated":false,"comment":"At zero margin the complete equality set is the two reflected targets.\nWhen a = 0 the two descriptions coincide, so this also covers the quartic minimum."},{"id":222,"line":152,"statement":"theorem squared_position_error {lam r a x y eps : ℝ} (hlam : 0 ≤ lam)\n    (hmargin : 0 < lam * a ^ 2 + r)\n    (herror : E lam r (input lam r a) x y -\n      E lam r (input lam r a) a (Real.sqrt 2 * a) ≤ eps) :\n    (x - a) ^ 2 ≤ 2 * eps / (lam * a ^ 2 + r)","proof":"by\n  apply (le_div_iff₀ hmargin).2\n  have hb := quadratic_gap_bound (r := r) (a := a) hlam x y\n  nlinarith","truncated":false,"comment":"A measured energy error supplies a certified squared position-error bound."},{"id":223,"line":162,"statement":"theorem position_error {lam r a x y eps : ℝ} (hlam : 0 ≤ lam)\n    (hmargin : 0 < lam * a ^ 2 + r)\n    (herror : E lam r (input lam r a) x y -\n      E lam r (input lam r a) a (Real.sqrt 2 * a) ≤ eps) :\n    |x - a| ≤ Real.sqrt (2 * eps / (lam * a ^ 2 + r))","proof":"by\n  exact Real.abs_le_sqrt (squared_position_error hlam hmargin herror)","truncated":false,"comment":"The square-root error estimate displayed by the companion is certified too."},{"id":224,"line":19,"statement":"theorem input_shift {S : Type*} (A X : S → ℝ) (u v : ℝ) (z : S) :\n    energy A X v z = energy A X u z - (v - u) * X z","proof":"by\n  unfold energy\n  ring","truncated":false,"comment":""},{"id":225,"line":24,"statement":"theorem recover_coordinate {S : Type*} (A X : S → ℝ) (u v : ℝ)\n    (huv : u ≠ v) (z : S) :\n    (energy A X u z - energy A X v z) / (v - u) = X z","proof":"by\n  apply (div_eq_iff (sub_ne_zero.mpr (Ne.symm huv))).2\n  unfold energy\n  ring","truncated":false,"comment":""},{"id":226,"line":31,"statement":"theorem recover_zero_input_energy {S : Type*} (A X : S → ℝ) (u v : ℝ)\n    (huv : u ≠ v) (z : S) :\n    (v * energy A X u z - u * energy A X v z) / (v - u) = A z","proof":"by\n  apply (div_eq_iff (sub_ne_zero.mpr (Ne.symm huv))).2\n  unfold energy\n  ring","truncated":false,"comment":""},{"id":227,"line":38,"statement":"theorem pair_suffices {S : Type*} (A X : S → ℝ) (z w : S)\n    (hA : A z = A w) (hX : X z = X w) (u : ℝ) :\n    energy A X u z = energy A X u w","proof":"by\n  simp only [energy, hA, hX]","truncated":false,"comment":""},{"id":228,"line":43,"statement":"theorem all_inputs_iff_pair {S : Type*} (A X : S → ℝ) (z w : S) :\n    (∀ u : ℝ, energy A X u z = energy A X u w) ↔\n      A z = A w ∧ X z = X w","proof":"by\n  constructor\n  · intro h\n    have hA : A z = A w := by simpa [energy] using h 0\n    have h1 := h 1\n    simp only [energy, one_mul] at h1\n    exact ⟨hA, by linarith⟩\n  · rintro ⟨hA, hX⟩ u\n    exact pair_suffices A X z w hA hX u","truncated":false,"comment":""},{"id":229,"line":55,"statement":"theorem two_inputs_iff_pair {S : Type*} (A X : S → ℝ) (z w : S)\n    (u v : ℝ) (huv : u ≠ v) :\n    (energy A X u z = energy A X u w ∧\n      energy A X v z = energy A X v w) ↔\n      A z = A w ∧ X z = X w","proof":"by\n  constructor\n  · rintro ⟨hu, hv⟩\n    have hX : X z = X w := by\n      rw [← recover_coordinate A X u v huv z,\n        ← recover_coordinate A X u v huv w, hu, hv]\n    have hA : A z = A w := by\n      rw [← recover_zero_input_energy A X u v huv z,\n        ← recover_zero_input_energy A X u v huv w, hu, hv]\n    exact ⟨hA, hX⟩\n  · rintro ⟨hA, hX⟩\n    exact ⟨pair_suffices A X z w hA hX u,\n      pair_suffices A X z w hA hX v⟩\n\n/- Any summary that permits every energy observation also permits the pair.\nThis is a factorization statement, not a claim about dimension or bit count. -/","truncated":false,"comment":""},{"id":230,"line":75,"statement":"theorem summary_decodes_pair {S T : Type*} (A X : S → ℝ) (summary : S → T)\n    (decode : ℝ → T → ℝ)\n    (hdecode : ∀ u z, decode u (summary z) = energy A X u z) :\n    ∃ pairDecode : T → ℝ × ℝ,\n      ∀ z, pairDecode (summary z) = (A z, X z)","proof":"by\n  refine ⟨fun t => (decode 0 t, decode 0 t - decode 1 t), ?_⟩\n  intro z\n  simp [hdecode, energy]","truncated":false,"comment":""},{"id":231,"line":84,"statement":"theorem pair_decodes_all {S T : Type*} (A X : S → ℝ) (summary : S → T)\n    (pairDecode : T → ℝ × ℝ)\n    (hdecode : ∀ z, pairDecode (summary z) = (A z, X z)) :\n    ∃ decode : ℝ → T → ℝ,\n      ∀ u z, decode u (summary z) = energy A X u z","proof":"by\n  refine ⟨fun u t => (pairDecode t).1 - u * (pairDecode t).2, ?_⟩\n  intro u z\n  simp only [hdecode, energy]","truncated":false,"comment":""},{"id":232,"line":93,"statement":"theorem recovery_error_identity {S : Type*} (A X : S → ℝ) (u v : ℝ)\n    (huv : u ≠ v) (z : S) (errorU errorV : ℝ) :\n    ((energy A X u z + errorU) - (energy A X v z + errorV)) / (v - u)\n      - X z = (errorU - errorV) / (v - u)","proof":"by\n  have hden : v - u ≠ 0 := sub_ne_zero.mpr (Ne.symm huv)\n  unfold energy\n  field_simp\n  ring","truncated":false,"comment":""},{"id":233,"line":102,"statement":"theorem recovery_error_bound {S : Type*} (A X : S → ℝ) (u v : ℝ)\n    (huv : u ≠ v) (z : S) (errorU errorV epsU epsV : ℝ)\n    (hU : |errorU| ≤ epsU) (hV : |errorV| ≤ epsV) :\n    |((energy A X u z + errorU) - (energy A X v z + errorV)) / (v - u)\n      - X z| ≤ (epsU + epsV) / |v - u|","proof":"by\n  rw [recovery_error_identity A X u v huv z errorU errorV, abs_div]\n  apply div_le_div_of_nonneg_right _ (abs_nonneg (v - u))\n  exact (abs_sub errorU errorV).trans (add_le_add hU hV)","truncated":false,"comment":""},{"id":234,"line":111,"statement":"theorem minimizer_monotone (V : ℝ → ℝ) (u v xu xv : ℝ) (huv : u < v)\n    (hu : ∀ x, V xu - u * xu ≤ V x - u * x)\n    (hv : ∀ x, V xv - v * xv ≤ V x - v * x) :\n    xu ≤ xv","proof":"by\n  have h1 := hu xv\n  have h2 := hv xu\n  have hprod : 0 ≤ (v - u) * (xv - xu) := by nlinarith\n  by_contra h\n  have hneg : xv - xu < 0 := sub_neg.mpr (lt_of_not_ge h)\n  have : (v - u) * (xv - xu) < 0 :=\n    mul_neg_of_pos_of_neg (sub_pos.mpr huv) hneg\n  linarith","truncated":false,"comment":""},{"id":235,"line":19,"statement":"theorem hasDerivAt_potential (lam r u x : ℝ) :\n    HasDerivAt (potential lam r u) (lam * x ^ 3 + r * x - u) x","proof":"by\n  convert ((((hasDerivAt_id x).pow 4).const_mul lam).div_const 4).add\n    ((((hasDerivAt_id x).pow 2).const_mul r).div_const 2) |>.sub\n    ((hasDerivAt_id x).const_mul u) using 1\n  · rfl\n  · simp only [id_eq]\n    ring","truncated":false,"comment":""},{"id":236,"line":28,"statement":"theorem deriv_potential (lam r u x : ℝ) :\n    deriv (potential lam r u) x = lam * x ^ 3 + r * x - u","proof":"(hasDerivAt_potential lam r u x).deriv","truncated":false,"comment":""},{"id":237,"line":32,"statement":"theorem stationary_iff_input (lam r u x : ℝ) :\n    deriv (potential lam r u) x = 0 ↔ u = lam * x ^ 3 + r * x","proof":"by\n  rw [deriv_potential]\n  constructor <;> intro h <;> linarith","truncated":false,"comment":""},{"id":238,"line":37,"statement":"theorem global_minimum_forces_input {lam r u a : ℝ}\n    (hmin : ∀ t : ℝ, potential lam r u a ≤ potential lam r u t) :\n    u = lam * a ^ 3 + r * a","proof":"by\n  have hm : IsMinOn (potential lam r u) Set.univ a := fun t _ => hmin t\n  have hz := (hm.isLocalMin Filter.univ_mem).hasDerivAt_eq_zero\n    (hasDerivAt_potential lam r u a)\n  linarith","truncated":false,"comment":""},{"id":239,"line":45,"statement":"theorem critical_value {lam r u x : ℝ} (hu : u = lam * x ^ 3 + r * x) :\n    potential lam r u x = -3 * lam * x ^ 4 / 4 - r * x ^ 2 / 2","proof":"by\n  rw [hu]\n  unfold potential\n  ring","truncated":false,"comment":""},{"id":240,"line":51,"statement":"theorem critical_value_le {lam r u x : ℝ} (hlam : 0 < lam)\n    (hu : u = lam * x ^ 3 + r * x) :\n    potential lam r u x ≤ (max (-r) 0) ^ 2 / (12 * lam)","proof":"by\n  rw [critical_value hu]\n  by_cases hr : 0 ≤ r\n  · rw [max_eq_right (by linarith : -r ≤ 0)]\n    have h4 : 0 ≤ lam * x ^ 4 := by positivity\n    have h2 : 0 ≤ r * x ^ 2 := mul_nonneg hr (sq_nonneg x)\n    norm_num\n    nlinarith\n  · rw [max_eq_left (by linarith : 0 ≤ -r)]\n    apply (le_div_iff₀ (by positivity : (0 : ℝ) < 12 * lam)).2\n    nlinarith [sq_nonneg (3 * lam * x ^ 2 + r)]","truncated":false,"comment":""},{"id":241,"line":65,"statement":"theorem critical_value_below_target {lam r u x target : ℝ} (hlam : 0 < lam)\n    (hu : u = lam * x ^ 3 + r * x)\n    (ht : (max (-r) 0) ^ 2 / (12 * lam) < target) :\n    potential lam r u x < target","proof":"lt_of_le_of_lt (critical_value_le hlam hu) ht","truncated":false,"comment":""},{"id":242,"line":71,"statement":"theorem positive_target_counterexample :\n    deriv (potential 1 (-1) (10 / 27)) (-2 / 3) = 0 ∧\n    potential 1 (-1) (10 / 27) (-2 / 3) = 2 / 27 ∧\n    (0 : ℝ) < 1 / 27 ∧ (1 / 27 : ℝ) < 2 / 27","proof":"by\n  rw [deriv_potential]\n  norm_num [potential]","truncated":false,"comment":""},{"id":243,"line":9,"statement":"theorem global_minimum_forces_design {lam r u a : ℝ}\n    (hmin : ∀ x y : ℝ, E lam r u a (Real.sqrt 2 * a) ≤ E lam r u x y) :\n    u = input lam r a","proof":"by\n  apply LinearInputCalculus.global_minimum_forces_input\n    (lam := lam) (r := r) (a := a)\n  intro t\n  have ht := hmin t (Real.sqrt 2 * t)\n  simpa [E, f, LinearInputCalculus.potential] using ht","truncated":false,"comment":"An arbitrary input making the target a global minimum must be the design input.\nThis uses the actual derivative and Fermat's theorem, not a stationarity hypothesis."},{"id":244,"line":19,"statement":"theorem global_minimum_iff_input_and_margin {lam r u a : ℝ} (hlam : 0 < lam) :\n    (∀ x y : ℝ, E lam r u a (Real.sqrt 2 * a) ≤ E lam r u x y) ↔\n      u = input lam r a ∧ 0 ≤ lam * a ^ 2 + r","proof":"by\n  constructor\n  · intro h\n    have hu := global_minimum_forces_design h\n    refine ⟨hu, ?_⟩\n    rw [hu] at h\n    exact margin_of_globalMin hlam h\n  · rintro ⟨hu, hm⟩\n    rw [hu]\n    exact globalMin_of_margin (le_of_lt hlam) hm","truncated":false,"comment":"Full characterization for an arbitrary input, not only a preselected input."},{"id":245,"line":33,"statement":"theorem exists_input_global_minimum_iff {lam r a : ℝ} (hlam : 0 < lam) :\n    (∃ u : ℝ, ∀ x y : ℝ,\n      E lam r u a (Real.sqrt 2 * a) ≤ E lam r u x y) ↔\n      0 ≤ lam * a ^ 2 + r","proof":"by\n  constructor\n  · rintro ⟨u, hu⟩\n    exact ((global_minimum_iff_input_and_margin hlam).mp hu).2\n  · intro hm\n    exact ⟨input lam r a, globalMin_of_margin (le_of_lt hlam) hm⟩","truncated":false,"comment":"Realizability of a prescribed location by some linear input is exactly the margin test."},{"id":246,"line":19,"statement":"theorem continuous_energy (lam r u : ℝ) :\n    Continuous (fun z : ℝ × ℝ => E lam r u z.1 z.2)","proof":"by\n  unfold E f\n  fun_prop","truncated":false,"comment":""},{"id":247,"line":25,"statement":"theorem coercive_identity {lam : ℝ} (hlam : lam ≠ 0) (r u x y : ℝ) :\n    E lam r u x y + lowerBoundConstant lam r u -\n      (x ^ 2 + (y - Real.sqrt 2 * x) ^ 2 / 2) =\n    (lam * x ^ 2 + r - 3) ^ 2 / (4 * lam) + (x - u) ^ 2 / 2","proof":"by\n  unfold E f lowerBoundConstant\n  field_simp\n  ring","truncated":false,"comment":"An explicit sum-of-squares certificate, valid at every state."},{"id":248,"line":33,"statement":"theorem coercive_lower_bound {lam : ℝ} (hlam : 0 < lam) (r u x y : ℝ) :\n    x ^ 2 + (y - Real.sqrt 2 * x) ^ 2 / 2 ≤\n      E lam r u x y + lowerBoundConstant lam r u","proof":"by\n  have hs : 0 ≤ (lam * x ^ 2 + r - 3) ^ 2 / (4 * lam) + (x - u) ^ 2 / 2 := by\n    positivity\n  linarith [coercive_identity (ne_of_gt hlam) r u x y]","truncated":false,"comment":""},{"id":249,"line":41,"statement":"theorem isCompact_sublevel {lam : ℝ} (hlam : 0 < lam) (r u c : ℝ) :\n    IsCompact {z : ℝ × ℝ | E lam r u z.1 z.2 ≤ c}","proof":"by\n  let R : ℝ := |c + lowerBoundConstant lam r u| + 1\n  have hR : 0 < R := by dsimp [R]; positivity\n  have hm : c + lowerBoundConstant lam r u ≤ R - 1 := by\n    dsimp [R]\n    simpa using le_abs_self (c + lowerBoundConstant lam r u)\n  have hs : IsClosed {z : ℝ × ℝ | E lam r u z.1 z.2 ≤ c} :=\n    isClosed_le (continuous_energy lam r u) continuous_const\n  apply (isCompact_Icc.prod isCompact_Icc).of_isClosed_subset hs\n  intro z hz\n  change z.1 ∈ Set.Icc (-R) R ∧ z.2 ∈ Set.Icc (-(4 * R)) (4 * R)\n  have hc := coercive_lower_bound hlam r u z.1 z.2\n  have hx2 : z.1 ^ 2 ≤ R - 1 := by\n    have hsq := sq_nonneg (z.2 - Real.sqrt 2 * z.1)\n    dsimp at hz\n    linarith\n  have ht2 : (z.2 - Real.sqrt 2 * z.1) ^ 2 ≤ 2 * (R - 1) := by\n    have hsq := sq_nonneg z.1\n    dsimp at hz\n    linarith\n  have hx : |z.1| ≤ R := by\n    have habs := sq_abs z.1\n    have hsq := sq_nonneg (R - 1)\n    nlinarith [sq_nonneg (|z.1| - R)]\n  have ht : |z.2 - Real.sqrt 2 * z.1| ≤ 2 * R := by\n    have habs := sq_abs (z.2 - Real.sqrt 2 * z.1)\n    have hsq := sq_nonneg (R - 1)\n    nlinarith [sq_nonneg (|z.2 - Real.sqrt 2 * z.1| - 2 * R)]\n  have hsqrt : |Real.sqrt 2| ≤ 2 := by\n    rw [abs_of_nonneg (Real.sqrt_nonneg _)]\n    nlinarith [Real.sq_sqrt (show (0 : ℝ) ≤ 2 by norm_num), Real.sqrt_nonneg 2]\n  have hy : |z.2| ≤ 4 * R := by\n    calc\n      |z.2| = |(z.2 - Real.sqrt 2 * z.1) + Real.sqrt 2 * z.1| := by ring_nf\n      _ ≤ |z.2 - Real.sqrt 2 * z.1| + |Real.sqrt 2 * z.1| := abs_add_le _ _\n      _ = |z.2 - Real.sqrt 2 * z.1| + |Real.sqrt 2| * |z.1| := by rw [abs_mul]\n      _ ≤ 2 * R + 2 * R := add_le_add ht (mul_le_mul hsqrt hx (abs_nonneg _) (by norm_num))\n      _ = 4 * R := by ring\n  exact ⟨abs_le.mp hx, abs_le.mp hy⟩","truncated":false,"comment":"Compactness includes empty sublevels and uses no lower restriction on c."},{"id":250,"line":82,"statement":"theorem isCompact_band {lam : ℝ} (hlam : 0 < lam) (r u lo hi : ℝ) :\n    IsCompact {z : ℝ × ℝ | lo ≤ E lam r u z.1 z.2 ∧ E lam r u z.1 z.2 ≤ hi}","proof":"by\n  have hs : IsClosed {z : ℝ × ℝ | lo ≤ E lam r u z.1 z.2 ∧ E lam r u z.1 z.2 ≤ hi} :=\n    (isClosed_le continuous_const (continuous_energy lam r u)).inter\n      (isClosed_le (continuous_energy lam r u) continuous_const)\n  exact (isCompact_sublevel hlam r u hi).of_isClosed_subset hs (fun _ hz => hz.2)","truncated":false,"comment":""},{"id":251,"line":89,"statement":"theorem exists_global_minimum {lam : ℝ} (hlam : 0 < lam) (r u : ℝ) :\n    ∃ z : ℝ × ℝ, ∀ w : ℝ × ℝ, E lam r u z.1 z.2 ≤ E lam r u w.1 w.2","proof":"by\n  let S : Set (ℝ × ℝ) := {z | E lam r u z.1 z.2 ≤ E lam r u 0 0}\n  have hne : S.Nonempty := ⟨(0, 0), by change E lam r u 0 0 ≤ E lam r u 0 0; exact le_refl _⟩\n  obtain ⟨z, hz, hmin⟩ := (isCompact_sublevel hlam r u (E lam r u 0 0)).exists_isMinOn\n    hne (continuous_energy lam r u).continuousOn\n  refine ⟨z, fun w => ?_⟩\n  by_cases hw : w ∈ S\n  · exact hmin hw\n  · exact le_trans hz (le_of_lt (lt_of_not_ge hw))","truncated":false,"comment":""},{"id":252,"line":18,"statement":"theorem hasDerivAt_E_x (lam r u x y : ℝ) :\n    HasDerivAt (fun t : ℝ => E lam r u t y) (gx lam r u x y) x","proof":"by\n  have hf : HasDerivAt (f lam r u) (lam * x ^ 3 + r * x - u) x :=\n    LinearInputCalculus.hasDerivAt_potential lam r u x\n  convert hf.add (((hasDerivAt_const x y).sub\n    ((hasDerivAt_id x).const_mul (Real.sqrt 2))).pow 2 |>.div_const 2) using 1\n  · rfl\n  · dsimp [gx]\n    ring_nf\n    rw [Real.sq_sqrt (by norm_num : (0 : ℝ) ≤ 2)]\n    ring","truncated":false,"comment":""},{"id":253,"line":30,"statement":"theorem hasDerivAt_E_y (lam r u x y : ℝ) :\n    HasDerivAt (fun t : ℝ => E lam r u x t) (gy x y) y","proof":"by\n  convert (hasDerivAt_const y (f lam r u x)).add\n    (((hasDerivAt_id y).sub_const (Real.sqrt 2 * x)).pow 2 |>.div_const 2) using 1\n  · rfl\n  · dsimp [gy]\n    ring","truncated":false,"comment":""},{"id":254,"line":38,"statement":"theorem hasDerivAt_E_input (lam r u x y : ℝ) :\n    HasDerivAt (fun t : ℝ => E lam r t x y) (-x) u","proof":"by\n  convert ((hasDerivAt_const u (lam * x ^ 4 / 4 + r * x ^ 2 / 2)).sub\n    ((hasDerivAt_id u).mul_const x)).add_const\n    ((y - Real.sqrt 2 * x) ^ 2 / 2) using 1\n  · rfl\n  · simp","truncated":false,"comment":""},{"id":255,"line":46,"statement":"theorem deriv_E_x (lam r u x y : ℝ) :\n    deriv (fun t : ℝ => E lam r u t y) x = gx lam r u x y","proof":"(hasDerivAt_E_x lam r u x y).deriv","truncated":false,"comment":""},{"id":256,"line":50,"statement":"theorem deriv_E_y (lam r u x y : ℝ) :\n    deriv (fun t : ℝ => E lam r u x t) y = gy x y","proof":"(hasDerivAt_E_y lam r u x y).deriv","truncated":false,"comment":""},{"id":257,"line":54,"statement":"theorem stationary_iff (lam r u x y : ℝ) :\n    gx lam r u x y = 0 ∧ gy x y = 0 ↔\n      y = Real.sqrt 2 * x ∧ u = lam * x ^ 3 + r * x","proof":"by\n  have hs : (Real.sqrt (2 : ℝ)) ^ 2 = 2 := Real.sq_sqrt (by norm_num)\n  dsimp [gx, gy]\n  constructor\n  · rintro ⟨hx, hy⟩\n    have hy' : y = Real.sqrt 2 * x := by linarith\n    refine ⟨hy', ?_⟩\n    rw [hy'] at hx\n    nlinarith [congrArg (fun s : ℝ => s * x) hs]\n  · rintro ⟨hy, hu⟩\n    rw [hy, hu]\n    constructor\n    · nlinarith [congrArg (fun s : ℝ => s * x) hs]\n    · ring","truncated":false,"comment":""},{"id":258,"line":71,"statement":"theorem partials_zero_iff (lam r u x y : ℝ) :\n    (deriv (fun t : ℝ => E lam r u t y) x = 0 ∧\n      deriv (fun t : ℝ => E lam r u x t) y = 0) ↔\n      y = Real.sqrt 2 * x ∧ u = lam * x ^ 3 + r * x","proof":"by\n  rw [deriv_E_x, deriv_E_y, stationary_iff]","truncated":false,"comment":""},{"id":259,"line":77,"statement":"theorem stationary_value_le {lam r u x y : ℝ} (hlam : 0 < lam)\n    (hg : gx lam r u x y = 0 ∧ gy x y = 0) :\n    E lam r u x y ≤ (max (-r) 0) ^ 2 / (12 * lam)","proof":"by\n  obtain ⟨hy, hu⟩ := (stationary_iff lam r u x y).1 hg\n  rw [hy]\n  simpa only [E, f, LinearInputCalculus.potential, sub_self, zero_pow (by decide : 2 ≠ 0), zero_div, add_zero]\n    using LinearInputCalculus.critical_value_le hlam hu","truncated":false,"comment":""},{"id":260,"line":85,"statement":"theorem no_stationary_on_band {lam r u x y target : ℝ} (hlam : 0 < lam)\n    (ht : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (he : target ≤ E lam r u x y) :\n    ¬ (gx lam r u x y = 0 ∧ gy x y = 0)","proof":"by\n  intro hg\n  linarith [stationary_value_le hlam hg]","truncated":false,"comment":""},{"id":261,"line":92,"statement":"theorem gSq_nonneg (lam r u x y : ℝ) : 0 ≤ gSq lam r u x y","proof":"by\n  unfold gSq\n  positivity","truncated":false,"comment":""},{"id":262,"line":96,"statement":"theorem gSq_eq_zero_iff (lam r u x y : ℝ) :\n    gSq lam r u x y = 0 ↔ gx lam r u x y = 0 ∧ gy x y = 0","proof":"by\n  unfold gSq\n  constructor\n  · intro h\n    constructor <;> nlinarith [sq_nonneg (gx lam r u x y), sq_nonneg (gy x y)]\n  · rintro ⟨hx, hy⟩\n    rw [hx, hy]\n    norm_num","truncated":false,"comment":""},{"id":263,"line":106,"statement":"theorem gSq_pos_on_band {lam r u x y target : ℝ} (hlam : 0 < lam)\n    (ht : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    (he : target ≤ E lam r u x y) :\n    0 < gSq lam r u x y","proof":"by\n  have hn := gSq_nonneg lam r u x y\n  have hne : gSq lam r u x y ≠ 0 := by\n    intro hz\n    exact no_stationary_on_band hlam ht he ((gSq_eq_zero_iff lam r u x y).1 hz)\n  exact lt_of_le_of_ne hn (Ne.symm hne)","truncated":false,"comment":""},{"id":264,"line":116,"statement":"theorem continuous_E (lam r u : ℝ) :\n    Continuous (fun z : ℝ × ℝ => E lam r u z.1 z.2)","proof":"by\n  exact (((continuous_const.mul (continuous_fst.pow 4)).div_const 4).add\n    ((continuous_const.mul (continuous_fst.pow 2)).div_const 2) |>.sub\n    (continuous_const.mul continuous_fst)).add\n    ((continuous_snd.sub (continuous_const.mul continuous_fst)).pow 2 |>.div_const 2)","truncated":false,"comment":""},{"id":265,"line":123,"statement":"theorem continuous_gSq (lam r u : ℝ) :\n    Continuous (fun z : ℝ × ℝ => gSq lam r u z.1 z.2)","proof":"by\n  exact ((((continuous_const.mul (continuous_fst.pow 3)).add\n    (continuous_const.mul continuous_fst)).sub\n    (continuous_const.mul continuous_snd) |>.sub continuous_const).pow 2).add\n    ((continuous_snd.sub (continuous_const.mul continuous_fst)).pow 2)","truncated":false,"comment":""},{"id":266,"line":131,"statement":"theorem hasDerivAt_energy_curve {x y u : ℝ → ℝ} {t x' y' u' : ℝ}\n    (lam r : ℝ) (hx : HasDerivAt x x' t) (hy : HasDerivAt y y' t)\n    (hu : HasDerivAt u u' t) :\n    HasDerivAt (fun s => E lam r (u s) (x s) (y s))\n      (gx lam r (u t) (x t) (y t) * x' + gy (x t) (y t) * y' - x t * u') t","proof":"by\n  convert (((((hx.pow 4).const_mul lam).div_const 4).add\n    (((hx.pow 2).const_mul r).div_const 2)).sub (hu.mul hx)).add\n    (((hy.sub (hx.const_mul (Real.sqrt 2))).pow 2).div_const 2) using 1\n  · rfl\n  · dsimp [gx, gy]\n    ring_nf\n    rw [Real.sq_sqrt (by norm_num : (0 : ℝ) ≤ 2)]\n    ring","truncated":false,"comment":"The input is allowed to move: its work term is forced by the actual chain rule."},{"id":267,"line":147,"statement":"theorem hasDerivAt_energy_of_velocity {x y u : ℝ → ℝ} {t u' : ℝ}\n    (lam r gamma target b : ℝ)\n    (hx : HasDerivAt x\n      (-gamma * (E lam r (u t) (x t) (y t) - target) * gx lam r (u t) (x t) (y t)\n        - b * gy (x t) (y t)) t)\n    (hy : HasDerivAt y\n      (-gamma * (E lam r (u t) (x t) (y t) - target) * gy (x t) (y t)\n        + b * gx lam r (u t) (x t) (y t)) t)\n    (hu : HasDerivAt u u' t) :\n    HasDerivAt (fun s => E lam r (u s) (x s) (y s))\n      (-gamma * (E lam r (u t) (x t) (y t) - target) *\n        gSq lam r (u t) (x t) (y t) - x t * u') t","proof":"by\n  convert hasDerivAt_energy_curve lam r hx hy hu using 1\n  unfold gSq\n  ring","truncated":false,"comment":"Conditional on actual coordinate velocities, the tangential part cancels.\nThe moving input contributes the term `-x t * u'`; no existence assertion is made."},{"id":268,"line":164,"statement":"theorem hasDerivAt_energy_fixed_input {x y : ℝ → ℝ} {t : ℝ}\n    (lam r u gamma target b : ℝ)\n    (hx : HasDerivAt x\n      (-gamma * (E lam r u (x t) (y t) - target) * gx lam r u (x t) (y t)\n        - b * gy (x t) (y t)) t)\n    (hy : HasDerivAt y\n      (-gamma * (E lam r u (x t) (y t) - target) * gy (x t) (y t)\n        + b * gx lam r u (x t) (y t)) t) :\n    HasDerivAt (fun s => E lam r u (x s) (y s))\n      (-gamma * (E lam r u (x t) (y t) - target) *\n        gSq lam r u (x t) (y t)) t","proof":"by\n  simpa only [mul_zero, sub_zero] using\n    hasDerivAt_energy_of_velocity (u := fun _ => u) lam r gamma target b hx hy\n      (hasDerivAt_const t u)","truncated":false,"comment":"With fixed input, this is the genuine energy derivative along any such curve."},{"id":269,"line":180,"statement":"theorem hasDerivAt_squared_gap_fixed_input {x y : ℝ → ℝ} {t : ℝ}\n    (lam r u gamma target b : ℝ)\n    (hx : HasDerivAt x\n      (-gamma * (E lam r u (x t) (y t) - target) * gx lam r u (x t) (y t)\n        - b * gy (x t) (y t)) t)\n    (hy : HasDerivAt y\n      (-gamma * (E lam r u (x t) (y t) - target) * gy (x t) (y t)\n        + b * gx lam r u (x t) (y t)) t) :\n    HasDerivAt (fun s => (E lam r u (x s) (y s) - target) ^ 2)\n      (-2 * gamma * (E lam r u (x t) (y t) - target) ^ 2 *\n        gSq lam r u (x t) (y t)) t","proof":"by\n  convert ((hasDerivAt_energy_fixed_input lam r u gamma target b hx hy).sub_const\n    target).pow 2 using 1\n  ring","truncated":false,"comment":"The squared energy gap has the expected derivative, derived by the chain rule."},{"id":270,"line":17,"statement":"theorem exponential_bound {v q : ℝ → ℝ} {k : ℝ}\n    (hd : ∀ t ∈ Set.Ici (0 : ℝ), HasDerivAt v (q t) t)\n    (hi : ∀ t ∈ Set.Ici (0 : ℝ), q t ≤ -k * v t)\n    {t : ℝ} (ht : 0 ≤ t) :\n    v t ≤ v 0 * Real.exp (-k * t)","proof":"by\n  let w : ℝ → ℝ := fun s => Real.exp (k * s) * v s\n  let dw : ℝ → ℝ := fun s => Real.exp (k * s) * (k * v s + q s)\n  have hw : ∀ s ∈ Set.Ici (0 : ℝ), HasDerivAt w (dw s) s := by\n    intro s hs\n    convert (((hasDerivAt_id s).const_mul k).exp.mul (hd s hs)) using 1\n    · rfl\n    · dsimp [dw]\n      ring\n  have hc : ContinuousOn w (Set.Ici (0 : ℝ)) := fun s hs =>\n    (hw s hs).continuousAt.continuousWithinAt\n  have ha : AntitoneOn w (Set.Ici (0 : ℝ)) :=\n    antitoneOn_of_hasDerivWithinAt_nonpos (convex_Ici (0 : ℝ)) hc\n      (fun s hs => (hw s (interior_subset hs)).hasDerivWithinAt)\n      (fun s hs => by\n        dsimp [dw]\n        apply mul_nonpos_of_nonneg_of_nonpos (le_of_lt (Real.exp_pos _))\n        have h := hi s (interior_subset hs)\n        linarith)\n  have hvalue : Real.exp (k * t) * v t ≤ v 0 := by\n    simpa [w] using ha (show (0 : ℝ) ∈ Set.Ici 0 by simp) ht ht\n  have hdiv : v t ≤ v 0 / Real.exp (k * t) := by\n    apply (le_div_iff₀ (Real.exp_pos _)).2\n    simpa only [mul_comm] using hvalue\n  simpa only [div_eq_mul_inv, ← Real.exp_neg, neg_mul] using hdiv","truncated":false,"comment":"Integrating-factor estimate; no sign assumption on v or the rate is needed."},{"id":271,"line":49,"statement":"theorem squared_error_exponential {e g : ℝ → ℝ} {gamma m : ℝ}\n    (hgamma : 0 ≤ gamma)\n    (hd : ∀ t ∈ Set.Ici (0 : ℝ),\n      HasDerivAt e (-gamma * e t * g t) t)\n    (hg : ∀ t ∈ Set.Ici (0 : ℝ), m ≤ g t)\n    {t : ℝ} (ht : 0 ≤ t) :\n    (e t) ^ 2 ≤ (e 0) ^ 2 * Real.exp (-(2 * gamma * m) * t)","proof":"by\n  apply exponential_bound\n    (v := fun s => (e s) ^ 2) (k := 2 * gamma * m) (t := t)\n    (q := fun s => -2 * gamma * (e s) ^ 2 * g s)\n  · intro s hs\n    convert (hd s hs).pow 2 using 1\n    ring\n  · intro s hs\n    have hp : 0 ≤ gamma * (e s) ^ 2 * (g s - m) :=\n      mul_nonneg (mul_nonneg hgamma (sq_nonneg _)) (sub_nonneg.mpr (hg s hs))\n    nlinarith\n  · exact ht","truncated":false,"comment":"A nonnegative damping coefficient gives a square-energy exponential bound\nwhenever a supplied solution has a common positive (or zero) damping bound."},{"id":272,"line":69,"statement":"theorem squared_error_tendsto_zero {e g : ℝ → ℝ} {gamma m : ℝ}\n    (hgamma : 0 < gamma) (hm : 0 < m)\n    (hd : ∀ t ∈ Set.Ici (0 : ℝ),\n      HasDerivAt e (-gamma * e t * g t) t)\n    (hg : ∀ t ∈ Set.Ici (0 : ℝ), m ≤ g t) :\n    Filter.Tendsto (fun t => (e t) ^ 2) Filter.atTop (nhds 0)","proof":"by\n  have hc : Filter.Tendsto (fun t : ℝ => (2 * gamma * m) * t)\n      Filter.atTop Filter.atTop :=\n    Filter.tendsto_id.const_mul_atTop (by positivity)\n  have hb : Filter.Tendsto\n      (fun t : ℝ => (e 0) ^ 2 * Real.exp (-(2 * gamma * m) * t))\n      Filter.atTop (nhds 0) := by\n    simpa only [Function.comp_def, neg_mul, mul_zero] using\n      (Real.tendsto_exp_neg_atTop_nhds_zero.comp hc).const_mul ((e 0) ^ 2)\n  apply squeeze_zero' (Filter.Eventually.of_forall (fun t => sq_nonneg (e t))) _ hb\n  exact (Filter.eventually_ge_atTop (0 : ℝ)).mono\n    (fun t ht => squared_error_exponential (le_of_lt hgamma) hd hg ht)","truncated":false,"comment":"Squared error tends to zero for a supplied trajectory with positive rate."},{"id":273,"line":87,"statement":"theorem error_tendsto_zero {e g : ℝ → ℝ} {gamma m : ℝ}\n    (hgamma : 0 < gamma) (hm : 0 < m)\n    (hd : ∀ t ∈ Set.Ici (0 : ℝ),\n      HasDerivAt e (-gamma * e t * g t) t)\n    (hg : ∀ t ∈ Set.Ici (0 : ℝ), m ≤ g t) :\n    Filter.Tendsto e Filter.atTop (nhds 0)","proof":"by\n  rw [tendsto_zero_iff_abs_tendsto_zero]\n  simpa only [Real.sqrt_sq_eq_abs, Real.sqrt_zero, Function.comp_def] using\n    (squared_error_tendsto_zero hgamma hm hd hg).sqrt","truncated":false,"comment":""},{"id":274,"line":10,"statement":"theorem band_nonempty {lam r u lo hi : ℝ} (hlo : 0 ≤ lo) (horder : lo ≤ hi) :\n    {z : ℝ × ℝ | lo ≤ E lam r u z.1 z.2 ∧ E lam r u z.1 z.2 ≤ hi}.Nonempty","proof":"by\n  have he : E lam r u 0 (Real.sqrt (2 * lo)) = lo := by\n    simp only [E, f, zero_pow (by decide : 4 ≠ 0), zero_pow (by decide : 2 ≠ 0),\n      mul_zero, zero_div, zero_add, sub_zero]\n    rw [Real.sq_sqrt (mul_nonneg (by norm_num : (0 : ℝ) ≤ 2) hlo)]\n    ring\n  refine ⟨(0, Real.sqrt (2 * lo)), ?_⟩\n  change lo ≤ E lam r u 0 (Real.sqrt (2 * lo)) ∧ E lam r u 0 (Real.sqrt (2 * lo)) ≤ hi\n  rw [he]\n  exact ⟨le_refl lo, horder⟩","truncated":false,"comment":""},{"id":275,"line":23,"statement":"theorem exists_positive_gradient_bound {lam r u lo hi : ℝ} (hlam : 0 < lam)\n    (hlo : (max (-r) 0) ^ 2 / (12 * lam) < lo) :\n    ∃ m : ℝ, 0 < m ∧ ∀ z : ℝ × ℝ,\n      (lo ≤ E lam r u z.1 z.2 ∧ E lam r u z.1 z.2 ≤ hi) →\n      m ≤ gSq lam r u z.1 z.2","proof":"by\n  exact (LinearInputCoercivity.isCompact_band hlam r u lo hi).exists_forall_le'\n    (continuous_gSq lam r u).continuousOn\n    (fun z hz => gSq_pos_on_band hlam hlo hz.1)","truncated":false,"comment":"The positive lower bound depends on the fixed input and the fixed band."},{"id":276,"line":33,"statement":"theorem exists_valley_global_minimum {lam : ℝ} (hlam : 0 < lam) (r u : ℝ) :\n    ∃ a : ℝ, ∀ x y : ℝ, E lam r u a (Real.sqrt 2 * a) ≤ E lam r u x y","proof":"by\n  obtain ⟨z, hz⟩ := LinearInputCoercivity.exists_global_minimum hlam r u\n  have hc := hz (z.1, Real.sqrt 2 * z.1)\n  have hy : z.2 = Real.sqrt 2 * z.1 := by\n    simp only [E, sub_self, zero_pow (by decide : 2 ≠ 0), zero_div, add_zero] at hc\n    nlinarith [sq_nonneg (z.2 - Real.sqrt 2 * z.1)]\n  refine ⟨z.1, fun x y => ?_⟩\n  simpa only [hy] using hz (x, y)","truncated":false,"comment":"For every fixed input the global minimum exists on the valley y = sqrt(2) x."},{"id":277,"line":43,"statement":"theorem exists_minimizing_stationary_root {lam : ℝ} (hlam : 0 < lam) (r u : ℝ) :\n    ∃ a : ℝ, u = input lam r a ∧ 0 ≤ lam * a ^ 2 + r ∧\n      ∀ x y : ℝ, E lam r u a (Real.sqrt 2 * a) ≤ E lam r u x y","proof":"by\n  obtain ⟨a, ha⟩ := exists_valley_global_minimum hlam r u\n  obtain ⟨hu, hm⟩ := (LinearInputConsequences.global_minimum_iff_input_and_margin hlam).mp ha\n  exact ⟨a, hu, hm, ha⟩","truncated":false,"comment":""},{"id":278,"line":51,"statement":"theorem exists_unique_global_minimum_of_input_ne_zero {lam r u : ℝ}\n    (hlam : 0 < lam) (hu : u ≠ 0) :\n    ∃! z : ℝ × ℝ, ∀ w : ℝ × ℝ, E lam r u z.1 z.2 ≤ E lam r u w.1 w.2","proof":"by\n  obtain ⟨a, hui, hm, ha⟩ := exists_minimizing_stationary_root hlam r u\n  have hp : 0 < lam * a ^ 2 + r := by\n    by_contra hn\n    have hz : lam * a ^ 2 + r = 0 := le_antisymm (le_of_not_gt hn) hm\n    apply hu\n    rw [hui]\n    unfold input\n    nlinarith [congrArg (fun s : ℝ => s * a) hz]\n  refine ⟨(a, Real.sqrt 2 * a), fun w => ha w.1 w.2, ?_⟩\n  intro z hz\n  have he : E lam r (input lam r a) z.1 z.2 =\n      E lam r (input lam r a) a (Real.sqrt 2 * a) := by\n    rw [← hui]\n    exact le_antisymm (hz (a, Real.sqrt 2 * a)) (ha z.1 z.2)\n  obtain ⟨hx, hy⟩ := unique_of_margin_pos (le_of_lt hlam) hp he\n  exact Prod.ext hx hy","truncated":false,"comment":"Every nonzero fixed input has a unique full-plane global minimizer."},{"id":279,"line":82,"statement":"theorem hasDerivAt_gap_of_trajectory {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (htraj : IsTrajectory lam r u gamma target x y b) {t : ℝ} (ht : 0 ≤ t) :\n    HasDerivAt (fun s => E lam r u (x s) (y s) - target)\n      (-gamma * (E lam r u (x t) (y t) - target) * gSq lam r u (x t) (y t)) t","proof":"(hasDerivAt_energy_fixed_input lam r u gamma target (b t)\n    (htraj t ht).1 (htraj t ht).2).sub_const target","truncated":false,"comment":""},{"id":280,"line":91,"statement":"theorem energy_convergence_in_band {lam r u gamma target upper : ℝ}\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    {x y b : ℝ → ℝ} (htraj : IsTrajectory lam r u gamma target x y b)\n    (hband : ∀ t ∈ Set.Ici (0 : ℝ),\n      target ≤ E lam r u (x t) (y t) ∧ E lam r u (x t) (y t) ≤ upper) :\n    ∃ m : ℝ, 0 < m ∧\n      (∀ t : ℝ, 0 ≤ t →\n        (E lam r u (x t) (y t) - target) ^ 2 ≤\n          (E lam r u (x 0) (y 0) - target) ^ 2 * Real.exp (-(2 * gamma * m) * t)) ∧\n      Filter.Tendsto (fun t => E lam r u (x t) (y t)) Filter.atTop (nhds target)","proof":"by\n  obtain ⟨m, hm, hbound⟩ := exists_positive_gradient_bound\n    (r := r) (u := u) (hi := upper) hlam htarget\n  have hge : ∀ t ∈ Set.Ici (0 : ℝ), m ≤ gSq lam r u (x t) (y t) :=\n    fun t ht => hbound (x t, y t) (hband t ht)\n  have hde : ∀ t ∈ Set.Ici (0 : ℝ),\n      HasDerivAt (fun s => E lam r u (x s) (y s) - target)\n        (-gamma * (E lam r u (x t) (y t) - target) * gSq lam r u (x t) (y t)) t :=\n    fun _ ht => hasDerivAt_gap_of_trajectory htraj ht\n  refine ⟨m, hm, fun t ht => ?_, ?_⟩\n  · exact LinearInputDissipation.squared_error_exponential (le_of_lt hgamma) hde hge ht\n  · have he := LinearInputDissipation.error_tendsto_zero hgamma hm hde hge\n    simpa only [sub_add_cancel, zero_add] using he.add_const target","truncated":false,"comment":"Energy convergence along a supplied globally defined trajectory in the band.\nThe band assumption and the coordinate ODE are explicit premises."},{"id":281,"line":11,"statement":"theorem squared_error_antitone {e g : ℝ → ℝ} {gamma : ℝ}\n    (hgamma : 0 ≤ gamma)\n    (hd : ∀ t ∈ Set.Ici (0 : ℝ), HasDerivAt e (-gamma * e t * g t) t)\n    (hg : ∀ t ∈ Set.Ici (0 : ℝ), 0 ≤ g t) :\n    AntitoneOn (fun t => (e t) ^ 2) (Set.Ici (0 : ℝ))","proof":"by\n  have hsq : ∀ t ∈ Set.Ici (0 : ℝ),\n      HasDerivAt (fun s => (e s) ^ 2) (-2 * gamma * (e t) ^ 2 * g t) t := by\n    intro t ht\n    convert (hd t ht).pow 2 using 1\n    ring\n  exact antitoneOn_of_hasDerivWithinAt_nonpos (convex_Ici (0 : ℝ))\n    (fun t ht => (hsq t ht).continuousAt.continuousWithinAt)\n    (fun t ht => (hsq t (interior_subset ht)).hasDerivWithinAt)\n    (fun t ht => by\n      have hn : 0 ≤ 2 * gamma * (e t) ^ 2 * g t := by\n        exact mul_nonneg (mul_nonneg (mul_nonneg (by norm_num) hgamma)\n          (sq_nonneg _)) (hg t (interior_subset ht))\n      nlinarith)","truncated":false,"comment":"Nonnegative damping makes the squared error antitone on nonnegative time."},{"id":282,"line":31,"statement":"theorem error_nonneg {e g : ℝ → ℝ} {gamma : ℝ}\n    (hgamma : 0 ≤ gamma)\n    (hd : ∀ t ∈ Set.Ici (0 : ℝ), HasDerivAt e (-gamma * e t * g t) t)\n    (hg : ∀ t ∈ Set.Ici (0 : ℝ), 0 ≤ g t)\n    (he0 : 0 ≤ e 0) {t : ℝ} (ht : 0 ≤ t) : 0 ≤ e t","proof":"by\n  by_contra hn\n  have hneg : e t < 0 := lt_of_not_ge hn\n  have hc : ContinuousOn e (Set.Icc (0 : ℝ) t) :=\n    fun s hs => (hd s hs.1).continuousAt.continuousWithinAt\n  obtain ⟨s, hs, hz⟩ := intermediate_value_Icc' ht hc\n    (show (0 : ℝ) ∈ Set.Icc (e t) (e 0) from ⟨le_of_lt hneg, he0⟩)\n  have hbound := squared_error_antitone hgamma hd hg hs.1 ht hs.2\n  dsimp only at hbound\n  rw [hz] at hbound\n  nlinarith [sq_pos_of_neg hneg]","truncated":false,"comment":"A zero crossing cannot be followed by a negative error: its square would grow."},{"id":283,"line":47,"statement":"theorem error_le_initial {e g : ℝ → ℝ} {gamma : ℝ}\n    (hgamma : 0 ≤ gamma)\n    (hd : ∀ t ∈ Set.Ici (0 : ℝ), HasDerivAt e (-gamma * e t * g t) t)\n    (hg : ∀ t ∈ Set.Ici (0 : ℝ), 0 ≤ g t)\n    (he0 : 0 ≤ e 0) {t : ℝ} (ht : 0 ≤ t) : e t ≤ e 0","proof":"by\n  have he := error_nonneg hgamma hd hg he0 ht\n  have hs := squared_error_antitone hgamma hd hg\n    (show (0 : ℝ) ∈ Set.Ici 0 by simp) ht ht\n  nlinarith","truncated":false,"comment":""},{"id":284,"line":58,"statement":"theorem energy_band_of_trajectory {lam r u gamma target : ℝ} {x y b : ℝ → ℝ}\n    (hgamma : 0 ≤ gamma) (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target ≤ E lam r u (x 0) (y 0)) :\n    ∀ t ∈ Set.Ici (0 : ℝ),\n      target ≤ E lam r u (x t) (y t) ∧\n        E lam r u (x t) (y t) ≤ E lam r u (x 0) (y 0)","proof":"by\n  have hd : ∀ t ∈ Set.Ici (0 : ℝ),\n      HasDerivAt (fun s => E lam r u (x s) (y s) - target)\n        (-gamma * (E lam r u (x t) (y t) - target) *\n          gSq lam r u (x t) (y t)) t :=\n    fun _ ht => hasDerivAt_gap_of_trajectory htraj ht\n  have hg : ∀ t ∈ Set.Ici (0 : ℝ), 0 ≤ gSq lam r u (x t) (y t) :=\n    fun t _ => gSq_nonneg lam r u (x t) (y t)\n  intro t ht\n  have hlo := error_nonneg hgamma hd hg (sub_nonneg.mpr hinit) ht\n  have hhi := error_le_initial hgamma hd hg (sub_nonneg.mpr hinit) ht\n  constructor <;> linarith","truncated":false,"comment":"The original energy band follows from the actual ODE and the initial energy."},{"id":285,"line":78,"statement":"theorem energy_convergence_of_initial {lam r u gamma target : ℝ}\n    (hlam : 0 < lam) (hgamma : 0 < gamma)\n    (htarget : (max (-r) 0) ^ 2 / (12 * lam) < target)\n    {x y b : ℝ → ℝ} (htraj : IsTrajectory lam r u gamma target x y b)\n    (hinit : target ≤ E lam r u (x 0) (y 0)) :\n    ∃ m : ℝ, 0 < m ∧\n      (∀ t : ℝ, 0 ≤ t →\n        (E lam r u (x t) (y t) - target) ^ 2 ≤\n          (E lam r u (x 0) (y 0) - target) ^ 2 * Real.exp (-(2 * gamma * m) * t)) ∧\n      Filter.Tendsto (fun t => E lam r u (x t) (y t)) Filter.atTop (nhds target)","proof":"by\n  exact energy_convergence_in_band hlam hgamma htarget htraj\n    (energy_band_of_trajectory (le_of_lt hgamma) htraj hinit)","truncated":false,"comment":"Exponential energy convergence now needs an initial condition, not assumed confinement.\nThe coordinate trajectory is still supplied, so global existence remains separate."},{"id":286,"line":14,"statement":"theorem energy_shear (k sigma u x p : ℝ) :\n    E (1 / 2) (-sigma / k) u x (p + Real.sqrt 2 * x) =\n      p ^ 2 / 2 + x ^ 4 / 8 - sigma * x ^ 2 / (2 * k) - u * x","proof":"by\n  unfold E f\n  ring","truncated":false,"comment":"The shear identifies the explicit energy with the classical quartic first integral."},{"id":287,"line":20,"statement":"theorem gy_shear (x p : ℝ) : gy x (p + Real.sqrt 2 * x) = p","proof":"by\n  unfold gy\n  ring","truncated":false,"comment":""},{"id":288,"line":24,"statement":"theorem gx_shear (k sigma u x p : ℝ) :\n    gx (1 / 2) (-sigma / k) u x (p + Real.sqrt 2 * x) =\n      x ^ 3 / 2 - sigma / k * x - Real.sqrt 2 * p - u","proof":"by\n  unfold gx\n  ring_nf\n  rw [Real.sq_sqrt (by norm_num : (0 : ℝ) ≤ 2)]\n  ring","truncated":false,"comment":""},{"id":289,"line":34,"statement":"theorem forced_phase_hasDerivAt {k sigma u s : ℝ} {kappa : ℝ → ℝ}\n    (hk : k ≠ 0) (hκ : ContDiff ℝ 2 kappa)\n    (heq : k * deriv (deriv kappa) s + k * (kappa s) ^ 3 / 2 - sigma * kappa s = k * u) :\n    HasDerivAt kappa (gy (kappa s) (deriv kappa s + Real.sqrt 2 * kappa s)) s ∧\n    HasDerivAt (fun t => deriv kappa t + Real.sqrt 2 * kappa t)\n      (-gx (1 / 2) (-sigma / k) u (kappa s)\n        (deriv kappa s + Real.sqrt 2 * kappa s)) s","proof":"by\n  have hx := (hκ.differentiable (by norm_num) s).hasDerivAt\n  have hp := (hκ.differentiable_deriv_two s).hasDerivAt\n  have hacc : deriv (deriv kappa) s = sigma / k * kappa s - (kappa s) ^ 3 / 2 + u := by\n    apply (mul_left_cancel₀ hk)\n    field_simp\n    nlinarith [heq]\n  constructor\n  · simpa only [gy_shear] using hx\n  · convert hp.add (hx.const_mul (Real.sqrt 2)) using 1\n    rw [gx_shear, hacc]\n    ring","truncated":false,"comment":"A forced curvature equation gives the actual phase velocities `(gy, -gx)`.\nThe variable is arclength; no time evolution or solution existence is asserted."},{"id":290,"line":54,"statement":"theorem phase_hasDerivAt {k sigma s : ℝ} {kappa : ℝ → ℝ}\n    (hk : k ≠ 0) (hκ
