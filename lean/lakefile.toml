name = "primitive"
version = "0.1.0"
defaultTargets = ["Elastica"]

# Preserve existing legacy module/export semantics during this toolchain port.
# This Lake compatibility option only opts out of module-system import warnings.
allowNonModules = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "2ddf59c8f14245864e6c0ed227a2dab76b9efea2"

[[lean_lib]]
name = "Elastica"
