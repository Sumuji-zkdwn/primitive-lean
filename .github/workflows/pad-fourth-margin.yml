name: PAD fourth-probe uniform exact noise margin

on:
  push:
    branches:
      - chatgpt/pad-fourth-probe-uniform-margin-20261108
    paths:
      - 'lean/PADFourLayerUniformMargin.lean'
      - 'tools/check_pad_fourth_margin.py'
      - '.github/workflows/pad-fourth-margin.yml'
  pull_request:
    paths:
      - 'lean/PADFourLayerUniformMargin.lean'
      - 'tools/check_pad_fourth_margin.py'
      - '.github/workflows/pad-fourth-margin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean/Mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Verify rational minimax gap
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_pad_fourth_margin.py | tee pad-margin-fraction.log
      - name: Compile standalone Lean sidecar trust zero and audit axioms
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          for f in PADFourLayer PADFourLayerCalibration PADFourLayerThreeProbe PADFourLayerFourProbe PADFourLayerFourthMean PADFourLayerUniformMargin; do
            lake env lean --trust=0 -o ".lake/build/lib/lean/$f.olean" "$f.lean" 2>&1 | tee "../pad-margin-$f.log"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('PADFourLayerUniformMargin.lean').read_text()
          names=re.findall(r'^theorem\s+(\w+)',s,re.M)
          assert len(names)==7 and len(set(names))==7,names
          Path('PADFourLayerUniformMarginAudit.lean').write_text(
            'import PADFourLayerUniformMargin\n'+
            ''.join('#print axioms PADFourLayerUniformMargin.'+n+'\n' for n in names))
          print('Audited',names)
          PY
          lake env lean --trust=0 PADFourLayerUniformMarginAudit.lean 2>&1 | tee ../pad-margin-axioms.log
          python3 - <<'PY'
          from pathlib import Path
          names=('PADFourLayer','PADFourLayerCalibration','PADFourLayerThreeProbe',
                 'PADFourLayerFourProbe','PADFourLayerFourthMean','PADFourLayerUniformMargin')
          text=''.join(Path('../pad-margin-'+f+'.log').read_text() for f in names)
          text+=Path('../pad-margin-axioms.log').read_text()
          assert not any(v in text for v in ('error:','warning:','sorryAx')),text
          print('PASS exact margin Lean trust zero and axiom audit')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pad-fourth-margin-evidence
          path: |
            pad-margin-fraction.log
            pad-margin-*.log
          if-no-files-found: warn
