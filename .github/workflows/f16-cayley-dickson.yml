name: F16 Cayley-Dickson table (Lean 4.36, algebra census)

on:
  push:
    branches:
      - ccr-9ddeac0a-tpeopz
  pull_request:
    paths:
      - 'lean/Research/F16CayleyDickson.lean'
      - 'tests/test_f16_cayley_dickson.py'
      - 'linear_input/lean_check/F16Holonomy.inc'
      - '.github/workflows/f16-cayley-dickson.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f16-cayley-dickson:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean/mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile Lean kernel-checked theorems
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research
          lake env lean --trust=0 -o .lake/build/lib/lean/Research/F16CayleyDickson.olean Research/F16CayleyDickson.lean 2>&1 | tee ../f16-cd-lean.log
          if grep -E '(^|[[:space:]])(error:|warning:|sorryAx)' ../f16-cd-lean.log; then exit 1; fi
      - name: Audit theorems against allowed axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          path = pathlib.Path('Research/F16CayleyDickson.lean')
          source = path.read_text()
          assert not re.search(r'^\s*(axiom|sorry)\b', source, re.M)
          assert 'native_decide' not in source
          names = re.findall(r'^(?:@\[simp\] )?theorem\s+(\w+)', source, re.M)
          assert len(names) >= 10, names
          audit = 'import Research.F16CayleyDickson\n' + ''.join('#print axioms F16CayleyDickson.' + x + '\n' for x in names)
          pathlib.Path('F16CayleyDicksonAudit.lean').write_text(audit)
          pathlib.Path('../f16-cd-axiom-count.txt').write_text(str(len(names)))
          PY
          lake env lean --trust=0 F16CayleyDicksonAudit.lean 2>&1 | tee ../f16-cd-audit.log
          python - <<'PY'
          import pathlib, re
          s = pathlib.Path('../f16-cd-audit.log').read_text()
          n = int(pathlib.Path('../f16-cd-axiom-count.txt').read_text())
          assert not re.search(r'\b(error:|warning:|sorryAx)\b', s), s
          entries = re.findall(r'depends on axioms:\s*\[([^]]*)\]', s)
          absent = s.count('does not depend on any axioms')
          assert len(entries) + absent == n, (n, len(entries), absent, s)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for entry in entries:
              used = set(filter(None, (x.strip() for x in entry.split(','))))
              assert used <= allowed, used - allowed
          print('Kernel dependencies checked:', n)
          PY
      - name: Run independent exhaustive census
        shell: bash
        run: python -B tests/test_f16_cayley_dickson.py -v 2>&1 | tee f16-cd-python.log
      - name: Upload exact-head logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: f16-cayley-dickson
          path: |
            f16-cd-lean.log
            f16-cd-audit.log
            f16-cd-axiom-count.txt
            f16-cd-python.log
          if-no-files-found: warn
