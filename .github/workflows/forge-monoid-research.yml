name: Forge monoid research audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/forge-monoid-research.yml'
      - 'tools/autonomy/forge_lean_monoid.py'
      - 'tests/fixtures/forge_monoid_*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Replay finite snapshot without Lean
        run: |
          python -B -m tools.autonomy.forge_lean_monoid --state tests/fixtures/forge_monoid_evolution6.json --semantic tests/fixtures/forge_monoid_semantic4.json --output verification/forge-monoid-finite
      - name: Install pinned Lean and mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Recheck historical and new certificates
        run: |
          python -B -m tools.autonomy.forge_lean_monoid --state tests/fixtures/forge_monoid_evolution6.json --semantic tests/fixtures/forge_monoid_semantic4.json --output verification/forge-monoid-kernel --kernel
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: forge-monoid-research
          path: verification/forge-monoid-*
          if-no-files-found: warn
