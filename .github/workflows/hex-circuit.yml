name: Lean Hex Circuit game

on:
  pull_request:
    branches: [main]
    paths:
      - 'games/hex/**'
      - '.github/workflows/hex-circuit.yml'
  push:
    branches: [main, 'chatgpt/lean-hex-*']
    paths:
      - 'games/hex/**'
      - '.github/workflows/hex-circuit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the repository's pinned Lean toolchain
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Type-check game and audit theorem assumptions with trust zero
        run: |
          elan run leanprover/lean4:v4.36.0-rc2 lean --trust=0 games/hex/HexGame.lean | tee "$RUNNER_TEMP/hex-lean-check.log"
          python3 - <<'PY'
          import re, os
          from pathlib import Path
          txt = (Path(os.environ["RUNNER_TEMP"]) / "hex-lean-check.log").read_text()
          for name in ("checkedMove_inside", "edit_outside"):
              match = re.search(r"'HexCircuit\\." + name + r"' depends on axioms: \\[([^\\]]*)\\]", txt)
              assert match is not None, f"missing axiom report: {name}"
              used = {a.strip() for a in match.group(1).split(",") if a.strip()}
              assert used <= {"propext", "Classical.choice", "Quot.sound"}, (name, used)
          print("HEX_GAME_AXIOM_AUDIT_OK")
          PY

      - name: Execute Lean game self-test
        run: elan run leanprover/lean4:v4.36.0-rc2 lean --run games/hex/HexGame.lean --self-test

      - name: Execute a playable winning terminal session
        run: |
          printf 'set 1 0 2\nset 1 -1 3\nset 0 -1 4\nset -1 0 5\nset -1 1 0\nset 0 1 2\nrun 7\nquit\n' \
            | elan run leanprover/lean4:v4.36.0-rc2 lean --run games/hex/HexGame.lean \
            | tee "$RUNNER_TEMP/hex-game-session.log"
          grep -q 'goals=6/6' "$RUNNER_TEMP/hex-game-session.log"
          grep -q 'YOU WIN' "$RUNNER_TEMP/hex-game-session.log"
