name: KK inner system Fuchsian uniqueness
on:
  pull_request:
    paths:
      - 'tools/check_kk_inner_system_uniqueness.py'
      - 'docs/research/2026-11-27-kk-inner-system-uniqueness.md'
      - '.github/workflows/kk-inner-system-uniqueness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prior Ricci rows and new system audit
        run: |
          set -euo pipefail
          mkdir -p verification
          git rev-parse HEAD | tee verification/head.txt
          sha256sum tools/check_kk_horizon_inner_radial_gauge.py tools/check_kk_inner_system_uniqueness.py | tee verification/oracles.sha256
          python -m pip install sympy==1.14.0
          python -B tools/check_kk_horizon_inner_radial_gauge.py | tee verification/radial-rows.log
          python -B tools/check_kk_inner_system_uniqueness.py | tee verification/system.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kk-inner-system-audit
          path: verification/
