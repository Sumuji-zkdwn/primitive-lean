name: Square-zero network (Lean 4.36, exact graph census)

on:
  push:
    branches:
      - chatgpt/square-zero-network-20261117
  pull_request:
    paths:
      - 'lean/Research/SquareZeroNetwork.lean'
      - 'tests/test_square_zero_network.py'
      - '.github/workflows/square-zero-network.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  square-zero-network:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean/mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile Lean kernel-checked theorems
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research
          lake env lean --trust=0 -o .lake/build/lib/lean/Research/SquareZeroNetwork.olean Research/SquareZeroNetwork.lean 2>&1 | tee ../square-zero-lean.log
          if grep -E '(^|[[:space:]])(error:|warning:|sorryAx)' ../square-zero-lean.log; then exit 1; fi
      - name: Audit theorems against allowed axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          path = pathlib.Path('Research/SquareZeroNetwork.lean')
          source = path.read_text()
          assert not re.search(r'^\s*(axiom|sorry)\b', source, re.M)
          names = re.findall(r'^theorem\s+(\w+)', source, re.M)
          assert len(names) >= 10, names
          audit = 'import Research.SquareZeroNetwork\n' + ''.join('#print axioms SquareZeroNetwork.' + x + '\n' for x in names)
          pathlib.Path('SquareZeroNetworkAudit.lean').write_text(audit)
          pathlib.Path('../square-zero-axiom-count.txt').write_text(str(len(names)))
          PY
          lake env lean --trust=0 SquareZeroNetworkAudit.lean 2>&1 | tee ../square-zero-audit.log
          python - <<'PY'
          import pathlib, re
          s = pathlib.Path('../square-zero-audit.log').read_text()
          n = int(pathlib.Path('../square-zero-axiom-count.txt').read_text())
          assert not re.search(r'\b(error:|warning:|sorryAx)\b', s), s
          entries = re.findall(r'depends on axioms:\s*\[([^]]*)\]', s)
          absent = s.count('does not depend on any axioms')
          assert len(entries) + absent == n, (n, len(entries), absent, s)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for entry in entries:
              used = set(filter(None, (x.strip() for x in entry.split(','))))
              assert used <= allowed, used - allowed
          print('Kernel dependencies checked:', n)
          PY
      - name: Run independent finite census and regressions
        shell: bash
        run: python -B tests/test_square_zero_network.py 2>&1 | tee square-zero-python.log
      - name: Upload exact-head logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: square-zero-network
          path: |
            square-zero-lean.log
            square-zero-audit.log
            square-zero-axiom-count.txt
            square-zero-python.log
          if-no-files-found: warn
