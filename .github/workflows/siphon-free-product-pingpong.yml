name: Siphon free product C6 * C2 (Lean 4.36, exact polynomial check)

on:
  push:
    branches:
      - ccr-9ddeac0a-tpeopz
  pull_request:
    paths:
      - 'lean/Research/SiphonFreeProduct.lean'
      - 'tests/test_siphon_free_product_pingpong.py'
      - '.github/workflows/siphon-free-product-pingpong.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  siphon-free-product-pingpong:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean/mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile Lean kernel-checked theorems
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research
          lake env lean --trust=0 -o .lake/build/lib/lean/Research/SiphonFreeProduct.olean Research/SiphonFreeProduct.lean 2>&1 | tee ../siphon-free-product-pingpong-lean.log
          if grep -E '(^|[[:space:]])(error:|warning:|sorryAx)' ../siphon-free-product-pingpong-lean.log; then exit 1; fi
      - name: Audit theorems against allowed axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          path = pathlib.Path('Research/SiphonFreeProduct.lean')
          source = path.read_text()
          assert not re.search(r'^\s*(axiom|sorry)\b', source, re.M)
          assert 'native_decide' not in source
          names = re.findall(r'^(?:@\[simp\] )?theorem\s+(\w+)', source, re.M)
          assert len(names) >= 35, names
          audit = 'import Research.SiphonFreeProduct\n' + ''.join('#print axioms SiphonFreeProduct.' + x + '\n' for x in names)
          pathlib.Path('SiphonFreeProductAudit.lean').write_text(audit)
          pathlib.Path('../siphon-free-product-pingpong-axiom-count.txt').write_text(str(len(names)))
          PY
          lake env lean --trust=0 SiphonFreeProductAudit.lean 2>&1 | tee ../siphon-free-product-pingpong-audit.log
          python - <<'PY'
          import pathlib, re
          s = pathlib.Path('../siphon-free-product-pingpong-audit.log').read_text()
          n = int(pathlib.Path('../siphon-free-product-pingpong-axiom-count.txt').read_text())
          assert not re.search(r'\b(error:|warning:|sorryAx)\b', s), s
          entries = re.findall(r'depends on axioms:\s*\[([^]]*)\]', s)
          absent = s.count('does not depend on any axioms')
          assert len(entries) + absent == n, (n, len(entries), absent, s)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for entry in entries:
              used = set(filter(None, (x.strip() for x in entry.split(','))))
              assert used <= allowed, used - allowed
          print('Kernel dependencies checked:', n)
          PY
      - name: Run independent exact checks
        shell: bash
        run: python -B tests/test_siphon_free_product_pingpong.py -v 2>&1 | tee siphon-free-product-pingpong-python.log
      - name: Upload exact-head logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: siphon-free-product-pingpong
          path: |
            siphon-free-product-pingpong-lean.log
            siphon-free-product-pingpong-audit.log
            siphon-free-product-pingpong-axiom-count.txt
            siphon-free-product-pingpong-python.log
          if-no-files-found: warn
