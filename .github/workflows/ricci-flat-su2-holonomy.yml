name: Ricci-flat gravity non-Abelian holonomy

on:
  pull_request:
    paths:
      - 'lean/Research/RicciFlatSU2Holonomy.lean'
      - 'tools/check_gh_holonomy.py'
      - 'docs/research/2026-11-22-ricci-flat-nonabelian-holonomy.md'
      - '.github/workflows/ricci-flat-su2-holonomy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install fixed Lean and mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile exact curvature algebra with Lean kernel
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research
          lake env lean --trust=0 -o .lake/build/lib/lean/Research/RicciFlatSU2Holonomy.olean Research/RicciFlatSU2Holonomy.lean 2>&1 | tee ../gh-holonomy-lean.log
          if grep -E '(^|[[:space:]])(error:|warning:|sorryAx)' ../gh-holonomy-lean.log; then exit 1; fi
      - name: Check theorem axiom dependencies
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          p=pathlib.Path('Research/RicciFlatSU2Holonomy.lean')
          source=p.read_text()
          assert not re.search(r'^\s*(axiom|sorry)\b',source,re.M)
          names=re.findall(r'^theorem\s+(\w+)',source,re.M)
          assert len(names)>=9,names
          pathlib.Path('RicciFlatSU2HolonomyAudit.lean').write_text(
              'import Research.RicciFlatSU2Holonomy\n'+''.join(
                '#print axioms RicciFlatSU2Holonomy.'+n+'\n' for n in names))
          pathlib.Path('../gh-holonomy-count.txt').write_text(str(len(names)))
          PY
          lake env lean --trust=0 RicciFlatSU2HolonomyAudit.lean 2>&1 | tee ../gh-holonomy-audit.log
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('../gh-holonomy-audit.log').read_text()
          n=int(pathlib.Path('../gh-holonomy-count.txt').read_text())
          assert not re.search(r'\b(error:|warning:|sorryAx)\b',s),s
          entries=re.findall(r'depends on axioms:\s*\[([^]]*)\]',s)
          absent=s.count('does not depend on any axioms')
          assert len(entries)+absent==n,(n,len(entries),absent)
          allowed={'propext','Classical.choice','Quot.sound'}
          for ent in entries:
              used=set(filter(None,(a.strip() for a in ent.split(','))))
              assert used<=allowed,used-allowed
          print('Kernel-audited theorem declarations:',n)
          PY
      - name: Compute original metric curvature independently
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check sympy==1.14.0
          python -B tools/check_gh_holonomy.py 2>&1 | tee gh-holonomy-python.log
      - name: Upload source- and exact-head-bound evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ricci-flat-su2-holonomy
          path: |
            gh-holonomy-lean.log
            gh-holonomy-audit.log
            gh-holonomy-count.txt
            gh-holonomy-python.log
          if-no-files-found: warn
