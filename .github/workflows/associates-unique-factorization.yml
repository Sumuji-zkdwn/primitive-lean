name: Associates and actual nonunique monoid Lean verification

on:
  push:
    branches: [chatgpt/associates-unique-factorization-20261103]
    paths:
      - 'linear_input/lean_check/AssociatesFactorIdentification.inc'
      - 'linear_input/lean_check/GeneratedNonUniqueMonoid.inc'
      - 'tools/verify_main_result.py'
      - 'tools/verify.py'
      - 'docs/integration/manifest.json'
      - '.github/workflows/associates-unique-factorization.yml'
  pull_request:
    branches: [chatgpt/prime-factor-identification-20261103]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent:
    name: General UFM and cancellative 4-6-9 example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and Mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Prepare standalone proof
        run: |
          python - <<'PY'
          from pathlib import Path
          names = [
              'TernaryZeroCesaro.inc',
              'FiniteObservationSeparation.inc',
              'DecompositionIdentification.inc',
              'AssociatesFactorIdentification.inc',
              'GeneratedNonUniqueMonoid.inc'
          ]
          sections = []
          for name in names:
              src = (Path('linear_input/lean_check') / name).read_text('utf-8')
              for token in ('sorry', 'admit', 'axiom', 'unsafe', 'native_decide'):
                  assert token not in src, (name, token)
              sections.append(src)
          Path('lean/AssociatesUFMProbe.lean').write_text(
              'import Mathlib\n\n' + '\n\n'.join(sections), encoding='utf-8')
          PY
      - name: Lean trust-zero verification
        working-directory: lean
        run: lake env lean --trust=0 AssociatesUFMProbe.lean

  integrated:
    name: Retained source, all Lean declarations, axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install offline verification dependencies
        run: python -m pip install pytest==9.2.0 numpy==2.5.4
      - name: Install pinned Lean and Mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Run integrated full theorem and axiom audit
        run: python -B -X utf8 tools/verify.py --integration-only
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: associates-ufm-verification-${{ github.run_id }}
          path: |
            verification/
            linear_input/lean_results.json
          if-no-files-found: warn
