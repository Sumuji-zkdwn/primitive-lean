name: Forge Watchdog - audit scheduler and bounded capability growth

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/forge-watchdog.yml'
      - 'tools/autonomy/forge_audit.py'
      - 'tests/test_forge_audit.py'
      - 'tests/fixtures/forge_audit_*.json'
      - 'docs/autonomy/FORGE_WATCHDOG.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-watchdog.yml'
      - 'tools/autonomy/forge_audit.py'
  schedule:
    # Read-only health snapshot every 30 minutes, after both Forge cycles.
    - cron: '27,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-watchdog-read-only-halfhour
  cancel-in-progress: false

jobs:
  audit-proposal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR source without stored credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Independently test real verified histories and fail-closed dispatch gate
        run: |
          set -euo pipefail
          python -m compileall -q tools/autonomy/forge_audit.py tests/test_forge_audit.py
          python -m unittest discover -s tests -p test_forge_audit.py -v
      - name: Generate inspectable audit against synthetic missing schedules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/forge-watchdog
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("verification/forge-watchdog")
          (p/"generic-runs.json").write_text(json.dumps({"workflow_runs":[]}))
          (p/"meta-runs.json").write_text(json.dumps({"workflow_runs":[]}))
          PY
          python -B -m tools.autonomy.forge_audit \
            --generic-state tests/fixtures/forge_audit_generic.json \
            --meta-state tests/fixtures/forge_audit_meta.json \
            --generic-runs verification/forge-watchdog/generic-runs.json \
            --meta-runs verification/forge-watchdog/meta-runs.json \
            --now '2026-11-23T11:40:00Z' \
            --output verification/forge-watchdog/audit.json
          python - <<'PY'
          import json
          with open("verification/forge-watchdog/audit.json") as f:
              a = json.load(f)
          assert a["scheduler"]["generic"]["no_scheduled_runs_observed"]
          assert a["scheduler"]["meta"]["no_scheduled_runs_observed"]
          assert a["capability"]["meta"]["maximum_certified_rule_lineage"] == 2
          assert not a["capability"]["expressive_power_beyond_trusted_primitive_closure"]
          print("Observed schedule absence and zero new primitive expressive power")
          PY
      - name: Retain audit evidence even after failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forge-watchdog-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/forge-watchdog
          if-no-files-found: warn
          retention-days: 30

  audit-half-hour:
    # Never dispatch, push, merge or execute data from state branches as code.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted main-branch audit code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout certified Generic Forge ledger as data
        uses: actions/checkout@v5
        with:
          ref: autonomy/generic-forge-state
          path: generic-state
          persist-credentials: false
      - name: Checkout certified Meta Forge ledger as data
        uses: actions/checkout@v5
        with:
          ref: autonomy/meta-forge-state
          path: meta-state
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run monitor regression and validate the trusted controller
        shell: bash
        working-directory: control
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest discover -s tests -p test_forge_audit.py -v
      - name: Audit recent real workflow runs and verified ledgers
        shell: bash
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ../review
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/generic-forge.yml/runs?per_page=100" > ../review/generic-runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/meta-forge.yml/runs?per_page=100" > ../review/meta-runs.json
          python -B -m tools.autonomy.forge_audit \
            --generic-state ../generic-state/docs/autonomy/generic-forge-state.json \
            --meta-state ../meta-state/docs/autonomy/meta-forge-state.json \
            --generic-runs ../review/generic-runs.json \
            --meta-runs ../review/meta-runs.json \
            --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output ../review/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("../review/report.json").read_text())
          for name in ("generic", "meta"):
              stats = data["scheduler"][name]
              saved = data["state"][name + "_new_verified_last_4h"]
              print(f"{name}: scheduled={stats['observed_schedule_events']} "
                    f"success={stats['observed_operational_successes']} "
                    f"failure={stats['observed_operational_failures']} "
                    f"new_verified_4h={saved}")
          PY
      - name: Preserve auditable JSON and raw GitHub run evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forge-watchdog-halfhour-${{ github.run_id }}-${{ github.run_attempt }}
          path: review/
          if-no-files-found: warn
          retention-days: 30
