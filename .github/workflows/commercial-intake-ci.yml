name: Public PR audit intake preflight

on:
  pull_request:
    paths:
      - 'tools/commercial/triage_public_pr.py'
      - 'tests/test_commercial_pr_intake.py'
      - 'docs/commercial/pr-intake.md'
      - '.github/workflows/commercial-intake-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline intake fixture tests
        run: python3 -m unittest discover -s tests -p 'test_commercial_pr_intake.py' -v
      - name: Compile only the intake scripts
        run: python3 -m py_compile tools/commercial/triage_public_pr.py tests/test_commercial_pr_intake.py
