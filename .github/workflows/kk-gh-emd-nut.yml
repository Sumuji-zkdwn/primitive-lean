name: KK general GH EMD and smooth nut finite bridges

on:
  pull_request:
    paths:
      - 'lean/Research/KKGeneralGHBoundary.lean'
      - 'lean/Research/KKGeneralEMDResidual.lean'
      - 'lean/Research/KKNutCartesian.lean'
      - 'lean/Research/KKNutSmooth.lean'
      - 'tools/check_kk_gh_universal_2jet.py'
      - 'tools/check_kk_emd_universal_jets.py'
      - 'tools/check_kk_nut_cartesian.py'
      - 'docs/verification/2026-11-23-kk-general-gh-emd-nut.md'
      - '.github/workflows/kk-gh-emd-nut.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  general-kk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile three finite bridge modules with trust zero
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research
          for mod in KKGeneralGHBoundary KKGeneralEMDResidual KKNutCartesian KKNutSmooth; do
            lake env lean --trust=0 -o ".lake/build/lib/lean/Research/$mod.olean" "Research/$mod.lean" 2>&1 | tee "../kk-general-$mod-lean.log"
            if grep -E '(^|[[:space:]])(error:|sorryAx)' "../kk-general-$mod-lean.log"; then exit 1; fi
          done
      - name: Audit all theorem dependencies and absent custom axioms
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          mods=('KKGeneralGHBoundary','KKGeneralEMDResidual','KKNutCartesian','KKNutSmooth')
          imports=['import Research.'+m for m in mods]
          lines=[]; total=0
          for m in mods:
              t=Path('Research/'+m+'.lean').read_text()
              assert not re.search(r'^\s*(axiom|sorry)\b',t,re.M),m
              names=re.findall(r'^theorem\s+(\w+)',t,re.M)
              assert names,m
              total+=len(names)
              lines.extend('#print axioms '+m+'.'+x for x in names)
          Path('KKGeneralAllAudit.lean').write_text('\n'.join(imports+lines)+'\n')
          Path('../kk-general-count.txt').write_text(str(total))
          PY
          lake env lean --trust=0 KKGeneralAllAudit.lean 2>&1 | tee ../kk-general-axioms.log
          python - <<'PY'
          from pathlib import Path
          import re
          txt=Path('../kk-general-axioms.log').read_text()
          count=int(Path('../kk-general-count.txt').read_text())
          assert not re.search(r'\b(error:|sorryAx)\b',txt),txt
          with_axioms=re.findall(r'depends on axioms:\s*\[([^]]*)\]',txt)
          without=txt.count('does not depend on any axioms')
          assert len(with_axioms)+without==count,(count,len(with_axioms),without)
          allowed={'propext','Classical.choice','Quot.sound'}
          for row in with_axioms:
              assert {x.strip() for x in row.split(',') if x.strip()}<=allowed,row
          print('PASS: Lean theorem count and axiom audit',count)
          PY
      - name: Three independent general symbolic checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check sympy==1.14.0
          python -B tools/check_kk_gh_universal_2jet.py 2>&1 | tee kk-general-gh.log
          python -B tools/check_kk_emd_universal_jets.py 2>&1 | tee kk-general-emd.log
          python -B tools/check_kk_nut_cartesian.py 2>&1 | tee kk-general-nut.log
      - name: Record exact source and checkout refs
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > kk-general-checked-out.txt
          python - <<'PY'
          import json,os
          p=os.environ.get('GITHUB_EVENT_PATH')
          event=json.load(open(p)) if p and os.path.isfile(p) else {}
          print('source head SHA:',event.get('pull_request',{}).get('head',{}).get('sha','not pull_request'))
          PY
          sha256sum lean/Research/KKGeneralGHBoundary.lean lean/Research/KKGeneralEMDResidual.lean lean/Research/KKNutCartesian.lean lean/Research/KKNutSmooth.lean tools/check_kk_gh_universal_2jet.py tools/check_kk_emd_universal_jets.py tools/check_kk_nut_cartesian.py > kk-general-sha256.txt
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kk-general-gh-emd-nut
          path: |
            kk-general-*-lean.log
            kk-general-axioms.log
            kk-general-count.txt
            kk-general-gh.log
            kk-general-emd.log
            kk-general-nut.log
            kk-general-checked-out.txt
            kk-general-sha256.txt
          if-no-files-found: warn
