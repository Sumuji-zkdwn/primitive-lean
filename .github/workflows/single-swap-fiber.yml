name: One-swap generator fiber connectivity proof

on:
  push:
    branches: [chatgpt/single-swap-fiber-20261103]
    paths:
      - 'linear_input/lean_check/SingleSwapFiber.inc'
      - 'tools/verify_main_result.py'
      - 'tools/verify.py'
      - 'docs/integration/manifest.json'
      - '.github/workflows/single-swap-fiber.yml'
  pull_request:
    branches: [chatgpt/half-factorial-probe-20261103]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Prepare proof file
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            'TernaryZeroCesaro.inc',
            'FiniteObservationSeparation.inc',
            'DecompositionIdentification.inc',
            'GeneratedNonUniqueMonoid.inc',
            'HalfFactorialIdentification.inc',
            'SingleSwapFiber.inc'
          ]
          fragments = []
          for name in files:
              source = (Path('linear_input/lean_check')/name).read_text('utf-8')
              for forbidden in ('sorry', 'admit', 'axiom', 'unsafe', 'native_decide'):
                  assert forbidden not in source, (name, forbidden)
              fragments.append(source)
          Path('lean/SingleSwapFiberProbe.lean').write_text(
              'import Mathlib\n\n' + '\n\n'.join(fragments), encoding='utf-8')
          PY
      - name: Run lean --trust=0
        working-directory: lean
        run: lake env lean --trust=0 SingleSwapFiberProbe.lean

  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.2.0 numpy==2.5.4
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Complete integration proof and axiom audit
        run: python -B -X utf8 tools/verify.py --integration-only
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: single-swap-fiber-proof-${{ github.run_id }}
          path: |
            verification/
            linear_input/lean_results.json
          if-no-files-found: warn
