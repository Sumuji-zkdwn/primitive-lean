name: Self-rewriting observer Lean (isolated)

on:
  push:
    branches: [chatgpt/self-rewriting-observer-lean-20261106]
    paths:
      - 'lean/SelfRewritingObserver.lean'
      - 'lean/SelfRewritingObserverExtensions.lean'
      - 'lean/SelfRewritingObserverBridgeTail.inc'
      - 'linear_input/lean_check/OperatorWordObservations.inc'
      - '.github/workflows/self-rewriting-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install repository-pinned Lean and Mathlib cache
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Compile exact model with zero trust
        working-directory: lean
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean --trust=0 -o .lake/build/lib/lean/SelfRewritingObserver.olean SelfRewritingObserver.lean
          lake env lean --trust=0 -o .lake/build/lib/lean/SelfRewritingObserverExtensions.olean SelfRewritingObserverExtensions.lean

      - name: Compile bridge against original operator-word Lean source
        working-directory: lean
        run: |
          set -euo pipefail
          printf 'import SelfRewritingObserverExtensions\n' > SelfRewritingObserverNativeBridge.lean
          cat ../linear_input/lean_check/OperatorWordObservations.inc >> SelfRewritingObserverNativeBridge.lean
          printf '\n' >> SelfRewritingObserverNativeBridge.lean
          cat SelfRewritingObserverBridgeTail.inc >> SelfRewritingObserverNativeBridge.lean
          lake env lean --trust=0 -o .lake/build/lib/lean/SelfRewritingObserverNativeBridge.olean SelfRewritingObserverNativeBridge.lean

      - name: Audit proof dependencies
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'import SelfRewritingObserverNativeBridge'
            for name in wordEq_iff_signature blind_classes frozen_classes feedback_classes feedback_implies_frozen frozen_implies_blind strict_feedback feedback_two_scans delayed_witness symmetry_involutive symmetry_invisible ruleWordEq_iff_signature headWordEq_iff_signature rule_classes head_classes head_signature_injective head_wordEq_iff_eq symmetry_invisible_with_rule symmetry_broken_by_head rule_probe_refines_feedback run_agrees_native native_wordEq_iff_signature compiled_old_program_cannot_reveal peek_rule_not_generated; do
              echo "#print axioms SelfRewritingObserver.$name"
            done
          } > SelfRewritingObserverAudit.lean
          lake env lean --trust=0 SelfRewritingObserverAudit.lean 2>&1 | tee ../self-rewriting-observer-axioms.log
          if grep -E 'sorryAx|selfRewritingSorry' ../self-rewriting-observer-axioms.log; then exit 1; fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-rewriting-observer-lean-${{ github.run_id }}
          path: |
            self-rewriting-observer-axioms.log
          if-no-files-found: warn
