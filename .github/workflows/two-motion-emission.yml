name: Two-motion outgoing energy (isolated Lean)

on:
  push:
    branches: [chatgpt/two-motion-emission-20261106]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Independent rational regression
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/check_two_motion_emission.py | tee two-motion-finite-checks.log
      - name: Install repository-pinned Lean and Mathlib cache
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile exact model and unchanged-source bridge
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          git rev-parse HEAD | tee ../two-motion-source.txt
          cat lean-toolchain | tee -a ../two-motion-source.txt
          sha256sum TwoMotionEmission.lean TwoMotionEmissionConsequences.lean TwoMotionEmissionBridgeTail.inc ../linear_input/lean_check/Observation.lean lake-manifest.json ../tools/check_two_motion_emission.py | tee -a ../two-motion-source.txt
          lake env lean --trust=0 -o .lake/build/lib/lean/TwoMotionEmission.olean TwoMotionEmission.lean 2>&1 | tee ../two-motion-model.log
          lake env lean --trust=0 -o .lake/build/lib/lean/TwoMotionEmissionConsequences.olean TwoMotionEmissionConsequences.lean 2>&1 | tee ../two-motion-consequences.log
          printf 'import TwoMotionEmissionConsequences\n' > TwoMotionEmissionNativeBridge.lean
          cat ../linear_input/lean_check/Observation.lean >> TwoMotionEmissionNativeBridge.lean
          printf '\n' >> TwoMotionEmissionNativeBridge.lean
          cat TwoMotionEmissionBridgeTail.inc >> TwoMotionEmissionNativeBridge.lean
          lake env lean --trust=0 -o .lake/build/lib/lean/TwoMotionEmissionNativeBridge.olean TwoMotionEmissionNativeBridge.lean 2>&1 | tee ../two-motion-bridge.log
          if grep -E 'warning:|error:' ../two-motion-model.log ../two-motion-consequences.log ../two-motion-bridge.log; then exit 1; fi
      - name: Audit every added theorem
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          sources = [pathlib.Path('TwoMotionEmission.lean'), pathlib.Path('TwoMotionEmissionConsequences.lean'), pathlib.Path('TwoMotionEmissionBridgeTail.inc')]
          names = [n for p in sources for n in re.findall(r'^theorem\s+(\w+)', p.read_text(), re.M)]
          assert names and len(names) == len(set(names))
          text = 'import TwoMotionEmissionNativeBridge\n' + ''.join('#print axioms TwoMotionEmission.'+n+'\n' for n in names)
          pathlib.Path('TwoMotionEmissionAudit.lean').write_text(text)
          pathlib.Path('../two-motion-theorems.txt').write_text('\n'.join(names)+'\n')
          print('Auditing',len(names),'theorems')
          PY
          lake env lean --trust=0 TwoMotionEmissionAudit.lean 2>&1 | tee ../two-motion-axioms.log
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path('../two-motion-axioms.log').read_text()
          names = pathlib.Path('../two-motion-theorems.txt').read_text().splitlines()
          rows = re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text)
          assert len(rows) == len(names), (len(rows), len(names))
          allowed = {'propext','Classical.choice','Quot.sound'}
          for row in rows:
              used = set(filter(None, (x.strip() for x in row.split(','))))
              assert used <= allowed, used - allowed
          assert 'warning:' not in text and 'error:' not in text
          print('All added theorem dependencies are within the standard allowlist.')
          PY
      - name: Upload exact-source evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: two-motion-emission-${{ github.run_id }}
          path: |
            two-motion-*.log
            two-motion-theorems.txt
            two-motion-source.txt
          if-no-files-found: warn
