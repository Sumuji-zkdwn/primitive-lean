name: Build Curve Lab Android APK

on:
  push:
    branches: [app/curve-lab-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check geometry with pure Java
        run: |
          mkdir -p /tmp/curve-test
          javac -d /tmp/curve-test \
            curve-lab-android/app/src/main/java/com/primitive/curvelab/Geometry.java \
            curve-lab-android/tests/GeometryTest.java
          java -cp /tmp/curve-test GeometryTest
      - name: Build installable debug APK
        working-directory: curve-lab-android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: curve-lab-android-apk
          path: curve-lab-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
