name: KK Hopf clutching winding number

on:
  pull_request:
    paths:
      - 'lean/Research/KKHopfWinding.lean'
      - 'tools/check_kk_hopf_clutching_winding.py'
      - 'docs/verification/2026-11-23-kk-hopf-winding.md'
      - '.github/workflows/kk-hopf-winding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hopf-winding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Kernel compile entire Hopf clutching dependency chain
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research
          for mod in KKHopfGlobalAlgebra KKHopfOrbit KKHopfActionFree KKHopfSurjective KKHopfQuotient KKHopfTwoSections KKHopfPhaseUnique KKHopfEquator KKHopfHomeo KKHopfNorthTriv KKHopfNorthHomeo KKHopfSouthHomeo KKHopfTransitionAlgebra KKHopfTransitionContinuous KKHopfWinding; do
            lake env lean --trust=0 -o ".lake/build/lib/lean/Research/$mod.olean" "Research/$mod.lean" 2>&1 | tee "../kk-winding-$mod.log"
          done
      - name: Axiom audit all new named theorems and definitions
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('Research/KKHopfWinding.lean').read_text()
          stripped=re.sub(r'/\-.*?\-/','',src,flags=re.S)
          assert not re.search(r'^\s*(axiom|sorry)\b',stripped,re.M)
          names=re.findall(r'^theorem\s+(\w+)',stripped,re.M)
          assert len(names)>=7,names
          audit=['#print axioms KKHopfWinding.'+x for x in names]
          audit+=['#print axioms KKHopfWinding.circlePhase',
                  '#print axioms KKHopfWinding.equatorBase',
                  '#print axioms KKHopfTransitionContinuous.transition']
          Path('KKHopfWindingAudit.lean').write_text(
             'import Research.KKHopfWinding\n'+'\n'.join(audit)+'\n')
          Path('../kk-winding-count.txt').write_text(str(len(audit)))
          PY
          lake env lean --trust=0 KKHopfWindingAudit.lean 2>&1 | tee ../kk-winding-axioms.log
          python - <<'PY'
          from pathlib import Path
          import re
          txt=Path('../kk-winding-axioms.log').read_text()
          n=int(Path('../kk-winding-count.txt').read_text())
          deps=re.findall(r'depends on axioms:\s*\[([^]]*)\]',txt)
          none=txt.count('does not depend on any axioms')
          assert len(deps)+none==n,(n,len(deps),none)
          allowed={'propext','Classical.choice','Quot.sound'}
          for dep in deps:
            assert {w.strip() for w in dep.split(',') if w.strip()}<=allowed,dep
          assert 'sorryAx' not in txt
          print('PASS: all',n,'theorem/definition axiom audits')
          PY
      - name: Independent exact equatorial transition test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check sympy==1.14.0
          python -B tools/check_kk_hopf_clutching_winding.py 2>&1 | tee kk-winding-sympy.log
      - name: Preserve checkout SHA and source checksums
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > kk-winding-checkout.txt
          sha256sum lean/Research/KKHopfWinding.lean tools/check_kk_hopf_clutching_winding.py > kk-winding-sha256.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kk-hopf-winding
          path: |
            kk-winding-*.log
            kk-winding-axioms.log
            kk-winding-count.txt
            kk-winding-sympy.log
            kk-winding-checkout.txt
            kk-winding-sha256.txt
          if-no-files-found: warn
