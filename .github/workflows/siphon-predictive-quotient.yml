name: Siphon predictive quotient and observer splitting

on:
  pull_request:
    paths:
      - 'lean/Research/SiphonPredictiveQuotient.lean'
      - 'tests/test_siphon_predictive_quotient.py'
      - 'docs/research/2026-11-17-siphon-predictive-quotient.md'
      - '.github/workflows/siphon-predictive-quotient.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predictive-quotient:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Independent exhaustive integer verification
        run: python3 -B -m unittest discover -s tests -p 'test_siphon_predictive_quotient.py' -v
      - name: Install pinned Lean and mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile imports then kernel-check new bridge
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          lake build Elastica.Geometry
          mkdir -p .lake/build/lib/lean/Research
          lake env lean --trust=0 -o .lake/build/lib/lean/Research/SiphonPolynomialE.olean Research/SiphonPolynomialE.lean 2>&1 | tee ../siphon-predictive-lean.log
          lake env lean --trust=0 -o .lake/build/lib/lean/Research/ElasticaObservationQuotient.olean Research/ElasticaObservationQuotient.lean 2>&1 | tee -a ../siphon-predictive-lean.log
          lake env lean --trust=0 Research/SiphonPredictiveQuotient.lean 2>&1 | tee -a ../siphon-predictive-lean.log
          if grep -q 'sorryAx' ../siphon-predictive-lean.log; then
            echo 'Unproved axioms detected' >&2
            exit 1
          fi
      - name: Save Lean verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siphon-predictive-${{ github.run_id }}
          path: siphon-predictive-lean.log
          if-no-files-found: warn
          retention-days: 30
