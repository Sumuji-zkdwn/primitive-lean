name: KK horizon local inner Fuchsian tensor uniqueness
on:
  pull_request:
    paths:
      - 'tools/check_kk_horizon_local_fuchs.py'
      - 'docs/research/2026-11-26-kk-horizon-local-fuchs-tensor.md'
      - '.github/workflows/kk-horizon-local-fuchs-tensor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify lift, Fuchsian coefficients and principal sign
        run: |
          set -euo pipefail
          mkdir -p verification
          git rev-parse HEAD | tee verification/head.txt
          sha256sum tools/check_kk_horizon_local_fuchs.py | tee verification/oracle.sha256
          python -m pip install sympy==1.14.0
          python -B tools/check_kk_horizon_local_fuchs.py | tee verification/local-fuchs.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kk-local-fuchs-tensor-audit
          path: verification/
