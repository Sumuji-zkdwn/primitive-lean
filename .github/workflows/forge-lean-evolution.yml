name: Forge Lean Evolution - persistent proof-guided expansion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/forge-lean-evolution.yml'
      - 'tools/autonomy/forge_lean_evolution.py'
      - 'tools/autonomy/forge_lean_group.py'
      - 'tools/autonomy/forge_lean_group_test.py'
      - 'tools/autonomy/forge_lean_certificate.py'
      - 'tools/autonomy/forge_lean_feedback.py'
      - 'tools/autonomy/forge_lean_reentry.py'
      - 'tools/autonomy/generic_forge.py'
      - 'tools/autonomy/semantic_forge.py'
      - 'linear_input/lean_check/OperatorWordObservations.inc'
      - 'tests/fixtures/semantic_bridge_semantic.json'
      - 'tests/fixtures/forge_lean_evolution_empty.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-lean-evolution.yml'
      - 'tools/autonomy/forge_lean_evolution.py'
      - 'tools/autonomy/forge_lean_group.py'
  schedule:
    - cron: '51 14 * * *'
  workflow_dispatch:
    inputs:
      generations:
        description: 'Maximum new kernel-verified generations in this manual run'
        required: true
        type: choice
        default: '5'
        options: ['1', '2', '3', '4', '5']

permissions:
  contents: read

concurrency:
  group: forge-lean-evolution-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      day: ${{ steps.plan.outputs.day }}
      state_sha: ${{ steps.plan.outputs.state_sha }}
      semantic_sha: ${{ steps.plan.outputs.semantic_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read data-only persistent history
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: autonomy/forge-lean-evolution-state
          path: evolution-state
          persist-credentials: false
      - name: Read actual semantic source ledger
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: autonomy/semantic-capability-state
          path: semantic-state
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Lean and mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Reconstruct seed proofs, historical receipts, and the next candidate
        id: plan
        shell: bash
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          MANUAL_GENERATIONS: ${{ inputs.generations }}
        run: |
          set -euo pipefail
          out=verification/forge-evolution
          mkdir -p "$out"
          head=$(git rev-parse HEAD)
          if [ "$IS_PR" = true ]; then
            cp tests/fixtures/forge_lean_evolution_empty.json "$out/state.json"
            cp tests/fixtures/semantic_bridge_semantic.json "$out/semantic.json"
            state_sha=fixture
            semantic_sha=fixture
            day=2026-11-24
          else
            state_sha=$(git -C evolution-state rev-parse HEAD)
            semantic_sha=$(git -C semantic-state rev-parse HEAD)
            day=$(date -u +%F)
            test ! -L evolution-state/docs/autonomy/forge-lean-evolution-state.json
            test ! -L semantic-state/docs/autonomy/semantic-capability-state.json
            cp evolution-state/docs/autonomy/forge-lean-evolution-state.json "$out/state.json"
            cp semantic-state/docs/autonomy/semantic-capability-state.json "$out/semantic.json"
          fi
          printf '%s\n' "$head" > "$out/control-sha.txt"
          printf '%s\n' "$state_sha" > "$out/state-sha.txt"
          printf '%s\n' "$semantic_sha" > "$out/semantic-sha.txt"
          args=()
          if [ "$IS_MANUAL" = true ]; then
            args=(--manual-run-id "$GITHUB_RUN_ID" --manual-generations "$MANUAL_GENERATIONS")
          fi
          python -B -m tools.autonomy.forge_lean_evolution --state "$out/state.json" --semantic "$out/semantic.json" --day "$day" --head "$head" --output "$out/first" "${args[@]}"
          candidate=$(python -c 'import json; from pathlib import Path; print(str(json.loads(Path("verification/forge-evolution/first/report.json").read_text())["status"] in ("NEW_KERNEL_VERIFIED_RECEIPT", "NEW_KERNEL_VERIFIED_BATCH")).lower())')
          {
            echo "candidate=$candidate"
            echo "day=$day"
            echo "state_sha=$state_sha"
            echo "semantic_sha=$semantic_sha"
          } >> "$GITHUB_OUTPUT"
      - name: PR regression - restart from saved receipt on a new day
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          out=verification/forge-evolution
          head=$(git rev-parse HEAD)
          python -B -m tools.autonomy.forge_lean_evolution --state "$out/first/next-state.json" --semantic "$out/semantic.json" --day 2026-11-25 --head "$head" --output "$out/second"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("verification/forge-evolution")
          first = json.loads((p / "first/next-state.json").read_text())
          second = json.loads((p / "second/next-state.json").read_text())
          r = json.loads((p / "second/report.json").read_text())
          assert len(first["receipts"]) == 1
          assert len(second["receipts"]) == 2
          assert second["receipts"][0] == first["receipts"][0]
          symbol = "e:" + first["receipts"][0]["chain_sha256"][:24]
          assert symbol in r["active_production_symbols"]
          assert r["search"]["by_parent"][symbol]["generated"] == 1024
          assert r["previous_generations"] == 1
          assert second["receipts"][1]["behavior_sha256"] != first["receipts"][0]["behavior_sha256"]
          assert (p / "second/history-1/Certificate.lean").read_bytes() == (p / "first/new/Certificate.lean").read_bytes()
          assert json.loads((p / "second/history-1/mapping.json").read_text())["status"] == "KERNEL_AND_AXIOM_AUDIT_PASSED"
          assert json.loads((p / "second/new/mapping.json").read_text())["status"] == "KERNEL_AND_AXIOM_AUDIT_PASSED"
          print("PASS two distinct persistent generations, historical proof replay and new production symbol")
          PY
      - name: PR regression - same-day replay is idempotent and tampering fails closed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          out=verification/forge-evolution
          head=$(git rev-parse HEAD)
          python -B -m tools.autonomy.forge_lean_evolution --state "$out/first/next-state.json" --semantic "$out/semantic.json" --day 2026-11-24 --head "$head" --output "$out/same-day"
          cmp "$out/first/next-state.json" "$out/same-day/next-state.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("verification/forge-evolution")
          r = json.loads((p / "same-day/report.json").read_text())
          assert r["status"] == "ALREADY_VERIFIED_TODAY"
          s = json.loads((p / "first/next-state.json").read_text())
          s["receipts"][0]["witness"] = [0, 0] if s["receipts"][0]["witness"] != [0, 0] else [1, 1]
          (p / "tampered.json").write_text(json.dumps(s))
          PY
          if python -B -m tools.autonomy.forge_lean_evolution --state "$out/tampered.json" --semantic "$out/semantic.json" --day 2026-11-25 --head "$head" --output "$out/tampered"; then
            echo "ERROR: altered history accepted"; exit 1
          fi
          echo "PASS altered history rejected"
      - name: PR regression - manual same-day batch, retry, and automatic gate
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          out=verification/forge-evolution
          head=$(git rev-parse HEAD)
          python -B -m tools.autonomy.forge_lean_evolution --state "$out/first/next-state.json" --semantic "$out/semantic.json" --day 2026-11-24 --head "$head" --output "$out/manual" --manual-run-id 12345 --manual-generations 2
          python -B -m tools.autonomy.forge_lean_evolution --state "$out/manual/next-state.json" --semantic "$out/semantic.json" --day 2026-11-24 --head "$head" --output "$out/manual-retry" --manual-run-id 12345 --manual-generations 2
          python -B -m tools.autonomy.forge_lean_evolution --state "$out/manual/next-state.json" --semantic "$out/semantic.json" --day 2026-11-24 --head "$head" --output "$out/manual-auto"
          cmp "$out/manual/next-state.json" "$out/manual-retry/next-state.json"
          cmp "$out/manual/next-state.json" "$out/manual-auto/next-state.json"
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.autonomy import forge_lean_evolution as evo
          p = Path("verification/forge-evolution")
          load = lambda f: json.loads((p / f).read_text())
          old = load("first/next-state.json")["receipts"]
          rows = load("manual/next-state.json")["receipts"]
          report = load("manual/report.json")
          assert len(rows) == 3 and rows[:1] == old
          assert report["status"] == "NEW_KERNEL_VERIFIED_BATCH" and report["new_count"] == 2
          for i, row in enumerate(rows[1:], 1):
              assert row["day"] == "2026-11-24" and row["manual_run_id"] == "12345"
              assert row["manual_index"] == i and row["manual_limit"] == 2
              assert load(f"manual/new-{i}/mapping.json")["status"] == "KERNEL_AND_AXIOM_AUDIT_PASSED"
              assert (p / f"manual/new-{i}/Certificate.lean").read_bytes() == (p / f"manual-retry/history-{i+1}/Certificate.lean").read_bytes()
          assert len({r["behavior_sha256"] for r in rows}) == 3
          assert "e:" + rows[1]["chain_sha256"][:24] in report["steps"][1]["production_symbols"]
          assert load("manual-retry/report.json")["status"] == "MANUAL_RUN_ALREADY_RECORDED"
          assert load("manual-auto/report.json")["status"] == "ALREADY_VERIFIED_TODAY"
          runs = {}
          evo.validate_receipt_order(rows[1], rows[0], runs)
          evo.validate_receipt_order(rows[2], rows[1], runs)
          for bad, prior in [(dict(rows[2], manual_index=1), rows[1]),
                             (dict(rows[2], manual_limit=6), rows[1]),
                             (dict(rows[2], day="2026-11-23"), rows[1]),
                             (rows[0], rows[2]), (rows[2], rows[0])]:
              try:
                  evo.validate_receipt_order(bad, prior, runs)
              except ValueError:
                  pass
              else:
                  raise AssertionError("invalid receipt order accepted")
          for bad in (0, 6, True):
              try:
                  evo.validate_manual("12345", bad)
              except ValueError:
                  pass
              else:
                  raise AssertionError("invalid batch limit accepted")
          print("PASS manual two-generation same-day batch, reentry, retry, automatic gate and limits")
          PY
      - name: PR regression - affine and parity fallback certificates
        if: github.event_name == 'pull_request'
        run: python -B -m tools.autonomy.forge_lean_group_test --output verification/forge-evolution/group-test
      - name: Preserve exact input snapshots and all proof/search evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forge-evolution-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/forge-evolution/
          if-no-files-found: warn
          retention-days: 90

  persist:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.candidate == 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout trusted exact main code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout isolated data ledger for bounded append
        uses: actions/checkout@v5
        with:
          ref: autonomy/forge-lean-evolution-state
          path: evolution-state
          persist-credentials: true
      - name: Read current upstream data again
        uses: actions/checkout@v5
        with:
          ref: autonomy/semantic-capability-state
          path: semantic-state
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore plan as inert comparison data
        uses: actions/download-artifact@v4
        with:
          name: forge-evolution-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: prior-plan
      - name: Install same pinned Lean and mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Independently reconstruct exact plan and rerun kernel
        shell: bash
        env:
          EXPECTED_STATE: ${{ needs.plan.outputs.state_sha }}
          EXPECTED_SEMANTIC: ${{ needs.plan.outputs.semantic_sha }}
          DAY: ${{ needs.plan.outputs.day }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          MANUAL_GENERATIONS: ${{ inputs.generations }}
        run: |
          set -euo pipefail
          out=verification/forge-evolution-replay
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C evolution-state rev-parse HEAD)" = "$EXPECTED_STATE"
          test "$(git -C semantic-state rev-parse HEAD)" = "$EXPECTED_SEMANTIC"
          test ! -L evolution-state/docs/autonomy/forge-lean-evolution-state.json
          test ! -L semantic-state/docs/autonomy/semantic-capability-state.json
          cp evolution-state/docs/autonomy/forge-lean-evolution-state.json "$out/state.json"
          cp semantic-state/docs/autonomy/semantic-capability-state.json "$out/semantic.json"
          cmp "$out/state.json" prior-plan/state.json
          cmp "$out/semantic.json" prior-plan/semantic.json
          args=()
          if [ "$IS_MANUAL" = true ]; then
            args=(--manual-run-id "$GITHUB_RUN_ID" --manual-generations "$MANUAL_GENERATIONS")
          fi
          python -B -m tools.autonomy.forge_lean_evolution --state "$out/state.json" --semantic "$out/semantic.json" --day "$DAY" --head "$GITHUB_SHA" --output "$out" "${args[@]}"
          cmp "$out/next-state.json" prior-plan/first/next-state.json
          cmp "$out/report.json" prior-plan/first/report.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.autonomy import forge_lean_evolution as evo
          p = Path("verification/forge-evolution-replay")
          old = json.loads((p / "state.json").read_text())["receipts"]
          new = json.loads((p / "next-state.json").read_text())["receipts"]
          report = json.loads((p / "report.json").read_text())
          n = len(new) - len(old)
          assert new[:len(old)] == old and len(new) <= evo.LIMIT
          if os.environ["IS_MANUAL"] == "true":
              requested = int(os.environ["MANUAL_GENERATIONS"])
              run_id = os.environ["GITHUB_RUN_ID"]
              evo.validate_manual(run_id, requested)
              assert report["status"] == "NEW_KERNEL_VERIFIED_BATCH"
              assert 1 <= n <= requested and report["new_count"] == n
              for i, row in enumerate(new[len(old):], 1):
                  assert row["manual_run_id"] == run_id and row["manual_index"] == i
                  assert row["manual_limit"] == requested and row["day"] == os.environ["DAY"]
              stages = [f"new-{i}" for i in range(1, n+1)]
          else:
              assert n == 1 and report["status"] == "NEW_KERNEL_VERIFIED_RECEIPT"
              assert set(new[-1]) == evo.FIELDS
              stages = ["new"]
          for stage in stages:
              assert (p / stage / "Certificate.lean").read_bytes() == (Path("prior-plan/first") / stage / "Certificate.lean").read_bytes()
              assert json.loads((p / stage / "mapping.json").read_text())["status"] == "KERNEL_AND_AXIOM_AUDIT_PASSED"
          PY
      - name: Commit only the independently checked append-only JSON receipts
        working-directory: evolution-state
        shell: bash
        run: |
          set -euo pipefail
          cp ../verification/forge-evolution-replay/next-state.json docs/autonomy/forge-lean-evolution-state.json
          git config user.name "forge-lean-evolution[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/autonomy/forge-lean-evolution-state.json
          test "$(git diff --cached --name-only)" = "docs/autonomy/forge-lean-evolution-state.json"
          git commit -m "forge lean evolution: append kernel-verified semantic extensions"
          git push origin HEAD:refs/heads/autonomy/forge-lean-evolution-state
      - name: Preserve independent persistence verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forge-evolution-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/forge-evolution-replay/
          if-no-files-found: warn
          retention-days: 90
