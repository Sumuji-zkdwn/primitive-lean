name: Siphon four-probe probability observability

on:
  pull_request:
    paths:
      - 'docs/research/2026-11-23-siphon-four-probe-observability.md'
      - 'tests/test_siphon_four_probe_observability.py'
      - '.github/workflows/siphon-four-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run independent rational regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_siphon_four_probe_observability.py' -v
