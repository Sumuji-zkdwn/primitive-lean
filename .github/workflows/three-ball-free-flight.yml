name: Three-ball free flight (Lean 4.36, event simulation census)

on:
  push:
    branches:
      - ccr-9ddeac0a-tpeopz
  pull_request:
    paths:
      - 'lean/ThreeBallCollision.lean'
      - 'lean/ThreeBallFreeFlight.lean'
      - 'tests/test_three_ball_free_flight.py'
      - '.github/workflows/three-ball-free-flight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-ball-free-flight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean/mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Build the existing velocity theorems
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          lake env lean --trust=0 -o .lake/build/lib/lean/ThreeBallCollision.olean ThreeBallCollision.lean > ../three-ball-deps.log 2>&1
      - name: Compile the free-flight model at trust zero
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --trust=0 -o .lake/build/lib/lean/ThreeBallFreeFlight.olean ThreeBallFreeFlight.lean 2>&1 | tee ../three-ball-flight-lean.log
          if grep -E '(^|[[:space:]])(error:|warning:|sorryAx)' ../three-ball-flight-lean.log; then exit 1; fi
      - name: Audit theorems against allowed axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          source = pathlib.Path('ThreeBallFreeFlight.lean').read_text()
          assert not re.search(r'^\s*(axiom|sorry)\b', source, re.M)
          assert 'native_decide' not in source
          names = re.findall(r'^theorem\s+([\w.]+)', source, re.M)
          assert len(names) >= 8, names
          audit = 'import ThreeBallFreeFlight\n' + ''.join('#print axioms ThreeBallFreeFlight.' + x + '\n' for x in names)
          pathlib.Path('ThreeBallFreeFlightAudit.lean').write_text(audit)
          pathlib.Path('../three-ball-flight-axiom-count.txt').write_text(str(len(names)))
          PY
          lake env lean --trust=0 ThreeBallFreeFlightAudit.lean 2>&1 | tee ../three-ball-flight-audit.log
          python - <<'PY'
          import pathlib, re
          s = pathlib.Path('../three-ball-flight-audit.log').read_text()
          n = int(pathlib.Path('../three-ball-flight-axiom-count.txt').read_text())
          assert not re.search(r'\b(error:|warning:|sorryAx)\b', s), s
          entries = re.findall(r'depends on axioms:\s*\[([^]]*)\]', s)
          absent = s.count('does not depend on any axioms')
          assert len(entries) + absent == n, (n, len(entries), absent, s)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for entry in entries:
              used = set(filter(None, (x.strip() for x in entry.split(','))))
              assert used <= allowed, used - allowed
          print('Kernel dependencies checked:', n)
          PY
      - name: Run independent event simulation census
        shell: bash
        run: python -B tests/test_three_ball_free_flight.py -v 2>&1 | tee three-ball-flight-python.log
      - name: Upload exact-head logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: three-ball-free-flight
          path: |
            three-ball-deps.log
            three-ball-flight-lean.log
            three-ball-flight-audit.log
            three-ball-flight-axiom-count.txt
            three-ball-flight-python.log
          if-no-files-found: warn
