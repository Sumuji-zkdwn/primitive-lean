name: KK Hopf north local homeomorphism
on:
  pull_request:
    paths:
      - 'lean/Research/KKHopfNorthHomeo.lean'
      - 'docs/verification/2026-11-23-kk-hopf-north-homeo.md'
      - '.github/workflows/kk-hopf-north-homeo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  north-homeomorphism:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile actual Hopf north local homeomorphism with trust zero
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research
          for mod in KKHopfGlobalAlgebra KKHopfOrbit KKHopfActionFree KKHopfSurjective KKHopfQuotient KKHopfTwoSections KKHopfPhaseUnique KKHopfHomeo KKHopfNorthTriv KKHopfNorthHomeo; do
            lake env lean --trust=0 -o ".lake/build/lib/lean/Research/$mod.olean" "Research/$mod.lean" 2>&1 | tee "../kk-north-homeo-$mod.log"
          done
      - name: Audit equivalence and homeomorphism axioms
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('Research/KKHopfNorthHomeo.lean').read_text()
          clean=re.sub(r'/\-.*?\-/', '',src,flags=re.S)
          assert not re.search(r'^\s*(axiom|sorry)\b',clean,re.M)
          Path('KKHopfNorthHomeoAudit.lean').write_text(
            'import Research.KKHopfNorthHomeo\n'
            '#print axioms KKHopfNorthTriv.northTrivialization\n'
            '#print axioms KKHopfNorthHomeo.northHomeomorph\n')
          PY
          lake env lean --trust=0 KKHopfNorthHomeoAudit.lean 2>&1 | tee ../kk-north-homeo-audit.log
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('../kk-north-homeo-audit.log').read_text()
          rows=re.findall(r'depends on axioms:\s*\[([^]]*)\]',t)
          none=t.count('does not depend on any axioms')
          assert len(rows)+none==2,(len(rows),none)
          for row in rows:
            assert {x.strip() for x in row.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'},row
          assert 'sorryAx' not in t
          print('PASS: north algebraic equivalence and local Homeomorph axioms')
          PY
      - name: Preserve source fingerprints
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > kk-north-homeo-checkout.txt
          sha256sum lean/Research/KKHopfNorthHomeo.lean lean/Research/KKHopfNorthTriv.lean > kk-north-homeo-sha256.txt
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kk-hopf-north-homeo
          path: |
            kk-north-homeo-*.log
            kk-north-homeo-checkout.txt
            kk-north-homeo-sha256.txt
          if-no-files-found: warn
