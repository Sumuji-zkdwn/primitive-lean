name: Smooth manifold second Bianchi for Mathlib Levi-Civita

on:
  pull_request:
    paths:
      - 'lean/RicciFlowBlueprint/LieBracketDerivation.lean'
      - 'lean/RicciFlowBlueprint/Curvature.lean'
      - 'lean/RicciFlowBlueprint/Bianchi.lean'
      - 'lean/Research/SmoothLeviCivitaBianchi.lean'
      - 'docs/verification/2026-11-22-smooth-levicivita-bianchi.md'
      - 'licenses/ricci-flow-blueprint-Apache-2.0.txt'
      - '.github/workflows/smooth-levicivita-bianchi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smooth-bianchi:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install repository-pinned Lean and mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Kernel compile tensor bridge, upstream manifold curvature and Bianchi
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research .lake/build/lib/lean/RicciFlowBlueprint
          for file in \
            Research/RicciFlatBianchiYangMills.lean \
            Research/BianchiOperatorBridge.lean \
            RicciFlowBlueprint/LieBracketDerivation.lean \
            RicciFlowBlueprint/Curvature.lean \
            RicciFlowBlueprint/Bianchi.lean \
            Research/SmoothLeviCivitaBianchi.lean; do
            echo "CHECKING $file"
            prefix=$(printf '%s' "$file" | sed 's/\.lean$//')
            lake env lean --trust=0 -o ".lake/build/lib/lean/$prefix.olean" "$file" 2>&1 | tee -a ../smooth-bianchi-lean.log
          done
          if grep -E '(^|[[:space:]])(error:|sorryAx)' ../smooth-bianchi-lean.log; then exit 1; fi
      - name: Audit theorem declarations and imported geometric Bianchi
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          p=pathlib.Path('Research/SmoothLeviCivitaBianchi.lean')
          src=p.read_text()
          assert not re.search(r'^\s*(axiom|sorry)\b',src,re.M)
          upstream=pathlib.Path('RicciFlowBlueprint/Bianchi.lean').read_text()
          assert not re.search(r'^\s*(axiom|sorry)\b',upstream,re.M)
          names=re.findall(r'^theorem\s+(\w+)',src,re.M)
          assert len(names)>=3,names
          out='import Research.SmoothLeviCivitaBianchi\n'
          out+='#check CovariantDerivative.bianchi_second\n'
          out+='#print axioms CovariantDerivative.bianchi_second\n'
          out+=''.join('#print axioms SmoothLeviCivitaBianchi.'+n+'\n' for n in names)
          pathlib.Path('SmoothLeviCivitaBianchiAudit.lean').write_text(out)
          pathlib.Path('../smooth-bianchi-count.txt').write_text(str(len(names)+1))
          PY
          lake env lean --trust=0 SmoothLeviCivitaBianchiAudit.lean 2>&1 | tee ../smooth-bianchi-audit.log
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('../smooth-bianchi-audit.log').read_text()
          n=int(pathlib.Path('../smooth-bianchi-count.txt').read_text())
          assert not re.search(r'\b(error:|sorryAx)\b',s),s
          entries=re.findall(r'depends on axioms:\s*\[([^]]*)\]',s)
          absent=s.count('does not depend on any axioms')
          assert len(entries)+absent==n,(n,len(entries),absent,s)
          allowed={'propext','Classical.choice','Quot.sound'}
          for e in entries:
              used=set(filter(None,(x.strip() for x in e.split(','))))
              assert used<=allowed,used-allowed
          print('Verified theorem declarations (including upstream):',n)
          PY
      - name: Verify upstream revision and licensing references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'c8017e2c26898d11f39cec0dfce89368d5a0506a' \
            docs/verification/2026-11-22-smooth-levicivita-bianchi.md
          test -s licenses/ricci-flow-blueprint-Apache-2.0.txt
          sha256sum lean/RicciFlowBlueprint/{LieBracketDerivation,Curvature,Bianchi}.lean \
            > smooth-bianchi-vendored-source-sha256.txt
          git rev-parse HEAD > smooth-bianchi-git-head.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smooth-levicivita-bianchi
          path: |
            smooth-bianchi-lean.log
            smooth-bianchi-audit.log
            smooth-bianchi-count.txt
            smooth-bianchi-vendored-source-sha256.txt
            smooth-bianchi-git-head.txt
          if-no-files-found: warn
