name: Elastica observation quotient bridge

on:
  pull_request:
    paths:
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/Research/ElasticaObservationQuotient.lean'
      - 'tests/test_elastica_observation_bridge.py'
      - 'docs/research/2026-11-07-observation-quotient-bridge.md'
      - '.github/workflows/elastica-observation-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quotient-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact proposed head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record source revision
        run: git rev-parse HEAD

      - name: Run independent exhaustive finite-state tests
        run: python -m unittest discover -s tests -p test_elastica_observation_bridge.py -v

      - name: Install pinned Lean and mathlib cache
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Compile quotient bridge without sorry, with kernel trust zero
        working-directory: lean
        run: |
          lake build Elastica.Geometry
          lake env lean --trust=0 Research/ElasticaObservationQuotient.lean
