name: Forge Core Android APK
on:
  pull_request:
    paths:
      - 'mobile/forge-core/**'
      - '.github/workflows/forge-core-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify exact core
        run: node mobile/forge-core/test-core.cjs
      - name: Build APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle -p mobile/forge-core --no-daemon :app:assembleDebug
          mkdir -p dist
          cp mobile/forge-core/app/build/outputs/apk/debug/app-debug.apk dist/Forge-Core.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Forge-Core.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Forge-Core.apk
          sha256sum dist/Forge-Core.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-Core-Android
          path: dist/
          retention-days: 90
          if-no-files-found: error
