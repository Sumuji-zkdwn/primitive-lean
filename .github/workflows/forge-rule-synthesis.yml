name: Forge expansion rule synthesis shadow audit
on:
  pull_request:
    branches: [main, research/forge-saturation-tower-20261128]
    paths:
      - '.github/workflows/forge-rule-synthesis.yml'
      - 'tools/autonomy/forge_rule_search.py'
      - 'tools/autonomy/forge_tower.py'
      - 'tools/autonomy/forge_lean_monoid.py'
      - 'tests/fixtures/forge_monoid_*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exact small closures and synthesized rule replay
        run: python -B -m tools.autonomy.forge_rule_search --selftest
      - name: Synthesize from pinned Forge shadow root
        run: |
          python -B -m tools.autonomy.forge_rule_search --root forge --state tests/fixtures/forge_monoid_evolution6.json --semantic tests/fixtures/forge_monoid_semantic4.json --output verification/forge-rules-a --steps 1
          python -B -m tools.autonomy.forge_rule_search --root forge --state tests/fixtures/forge_monoid_evolution6.json --semantic tests/fixtures/forge_monoid_semantic4.json --resume verification/forge-rules-a/rules.json --output verification/forge-rules-b --steps 2
          python -B -m tools.autonomy.forge_rule_search --root forge --state tests/fixtures/forge_monoid_evolution6.json --semantic tests/fixtures/forge_monoid_semantic4.json --output verification/forge-rules-compact --steps 2 --policy compact
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: forge-rule-synthesis-shadow
          path: verification/forge-rules-*
          if-no-files-found: warn
