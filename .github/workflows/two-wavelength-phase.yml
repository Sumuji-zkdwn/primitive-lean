name: Two-wavelength phase observation (isolated Lean)

on:
  pull_request:
    branches: [main]
    paths:
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/DarkBrightObservation.lean'
      - 'lean/PrismHysteresisReadout.lean'
      - 'lean/FluidPrismPhaseMemory.lean'
      - 'lean/TwoWavelength*.lean'
      - 'tools/verify_two_wavelength.py'
      - 'tools/check_lean_migration.py'
      - 'docs/lean436/**'
      - '.github/workflows/two-wavelength-phase.yml'
  push:
    branches: [chatgpt/two-wavelength-phase-20261107]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact proposed head and migration source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install repository-pinned Lean and Mathlib cache
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile additions, audit axioms, and run independent experiments
        run: python -B tools/verify.py --two-wavelength-only
      - name: Upload source-specific verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: two-wavelength-phase-${{ github.run_id }}
          path: verification/two-wavelength/
          if-no-files-found: warn
