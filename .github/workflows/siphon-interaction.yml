name: Siphon interaction potential and finite regression

on:
  pull_request:
    paths:
      - 'lean/Research/SiphonInteraction.lean'
      - 'lean/Research/SiphonPolynomialE.lean'
      - 'tests/test_siphon_interaction.py'
      - 'tests/test_siphon_polynomial_e.py'
      - 'docs/research/2026-11-08-siphon-interaction.md'
      - 'docs/research/2026-11-08-siphon-polynomial-e.md'
      - '.github/workflows/siphon-interaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout the proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check finite arithmetic independently
        run: python3 -B -m unittest discover -s tests -p 'test_siphon_*.py' -v
      - name: Install pinned Lean
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false
          use-github-cache: true
      - name: Download Mathlib cache with retry for transient transfer failures
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if lake exe cache get; then
              exit 0
            fi
            echo "Mathlib cache transfer failed on attempt ${attempt}" >&2
            sleep 5
          done
          exit 1
      - name: Compile exact Lean theorems and show axioms
        shell: bash
        run: |
          set -euo pipefail
          cd lean
          for module in Research/SiphonInteraction.lean Research/SiphonPolynomialE.lean; do
            lake env lean --trust=0 "$module" 2>&1 | tee -a ../siphon-lean.log
          done
          if grep -q sorryAx ../siphon-lean.log; then
            echo 'Unproved axioms detected'
            exit 1
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siphon-interaction-${{ github.run_id }}
          path: siphon-lean.log
          if-no-files-found: warn
          retention-days: 30
