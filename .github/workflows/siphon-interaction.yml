name: Siphon interaction potential and finite regression

on:
  pull_request:
    paths:
      - 'lean/Research/SiphonInteraction.lean'
      - 'tests/test_siphon_interaction.py'
      - 'docs/research/2026-11-08-siphon-interaction.md'
      - '.github/workflows/siphon-interaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout the proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact finite arithmetic independently
        run: python3 -B -m unittest discover -s tests -p 'test_siphon_interaction.py' -v
      - name: Install pinned Lean and mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile exact Lean theorems and show axioms
        shell: bash
        run: |
          set -euo pipefail
          cd lean
          lake env lean --trust=0 Research/SiphonInteraction.lean 2>&1 | tee ../siphon-lean.log
          if grep -q sorryAx ../siphon-lean.log; then
            echo 'Unproved axioms detected'
            exit 1
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siphon-interaction-${{ github.run_id }}
          path: siphon-lean.log
          if-no-files-found: warn
          retention-days: 30
