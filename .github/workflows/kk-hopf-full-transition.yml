name: KK Hopf full overlap transition

on:
  pull_request:
    paths:
      - 'lean/Research/KKHopfTransitionAlgebra.lean'
      - 'tools/check_kk_hopf_full_transition.py'
      - 'docs/verification/2026-11-23-kk-hopf-full-transition.md'
      - '.github/workflows/kk-hopf-full-transition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hopf-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile geometry dependency chain and overlap formula with trust zero
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research
          for mod in KKHopfGlobalAlgebra KKHopfOrbit KKHopfActionFree KKHopfSurjective KKHopfQuotient KKHopfTwoSections KKHopfPhaseUnique KKHopfHomeo KKHopfNorthTriv KKHopfNorthHomeo KKHopfSouthHomeo KKHopfTransitionAlgebra; do
            lake env lean --trust=0 -o ".lake/build/lib/lean/Research/$mod.olean" "Research/$mod.lean" 2>&1 | tee "../kk-overlap-$mod.log"
          done
      - name: Audit the new transition theorems and both local homeomorphisms
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('Research/KKHopfTransitionAlgebra.lean').read_text()
          clean=re.sub(r'/\-.*?\-/', '',src,flags=re.S)
          assert not re.search(r'^\s*(axiom|sorry)\b',clean,re.M)
          names=re.findall(r'^theorem\s+(\w+)',clean,re.M)
          assert len(names)==3,names
          checks=['#print axioms KKHopfTransitionAlgebra.'+n for n in names]
          checks+=['#print axioms KKHopfNorthHomeo.northHomeomorph',
                   '#print axioms KKHopfSouthHomeo.southHomeomorph']
          Path('KKHopfFullOverlapAudit.lean').write_text(
            'import Research.KKHopfTransitionAlgebra\n'+'\n'.join(checks)+'\n')
          Path('../kk-overlap-count.txt').write_text(str(len(checks)))
          PY
          lake env lean --trust=0 KKHopfFullOverlapAudit.lean 2>&1 | tee ../kk-overlap-axioms.log
          python - <<'PY'
          from pathlib import Path
          import re
          txt=Path('../kk-overlap-axioms.log').read_text()
          n=int(Path('../kk-overlap-count.txt').read_text())
          rows=re.findall(r'depends on axioms:\s*\[([^]]*)\]',txt)
          none=txt.count('does not depend on any axioms')
          assert len(rows)+none==n,(len(rows),none,n)
          for row in rows:
            assert {x.strip() for x in row.split(',') if x.strip()} <= {
              'propext','Classical.choice','Quot.sound'},row
          assert 'sorryAx' not in txt
          print('PASS:',n,'theorem and Homeomorph axiom audits')
          PY
      - name: Check exact symbolic transition residuals
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check sympy==1.14.0
          python -B tools/check_kk_hopf_full_transition.py 2>&1 | tee kk-overlap-sympy.log
      - name: Preserve source evidence
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > kk-overlap-checkout.txt
          sha256sum lean/Research/KKHopfTransitionAlgebra.lean tools/check_kk_hopf_full_transition.py > kk-overlap-sha256.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kk-hopf-full-overlap
          path: |
            kk-overlap-*.log
            kk-overlap-count.txt
            kk-overlap-checkout.txt
            kk-overlap-sha256.txt
          if-no-files-found: warn
