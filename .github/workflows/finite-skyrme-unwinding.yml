name: Finite Skyrme SU2 cube unwinding obstruction

on:
  pull_request:
    paths:
      - 'lean/Research/FiniteSkyrmeUnwinding.lean'
      - 'tools/check_finite_skyrme_unwinding.py'
      - 'docs/research/2026-11-23-finite-skyrme-unwinding.md'
      - '.github/workflows/finite-skyrme-unwinding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-skyrme-unwinding:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Pinned mathlib Lean toolchain
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Lean kernel check
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Research
          lake env lean --trust=0 -o .lake/build/lib/lean/Research/FiniteSkyrmeUnwinding.olean Research/FiniteSkyrmeUnwinding.lean 2>&1 | tee ../finite-skyrme-lean.log
          if grep -E '(^|[[:space:]])(error:|warning:|sorryAx)' ../finite-skyrme-lean.log; then exit 1; fi
      - name: Audit every theorem's axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          p=pathlib.Path('Research/FiniteSkyrmeUnwinding.lean')
          src=p.read_text()
          assert not re.search(r'^\s*(axiom|sorry)\b',src,re.M)
          names=re.findall(r'^theorem\s+(\w+)',src,re.M)
          assert len(names)==8,names
          pathlib.Path('FiniteSkyrmeUnwindingAudit.lean').write_text(
              'import Research.FiniteSkyrmeUnwinding\n'+''.join(
                  '#print axioms FiniteSkyrmeUnwinding.'+n+'\n' for n in names))
          pathlib.Path('../finite-skyrme-count.txt').write_text(str(len(names)))
          PY
          lake env lean --trust=0 FiniteSkyrmeUnwindingAudit.lean 2>&1 | tee ../finite-skyrme-audit.log
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('../finite-skyrme-audit.log').read_text()
          n=int(pathlib.Path('../finite-skyrme-count.txt').read_text())
          assert not re.search(r'\b(error:|warning:|sorryAx)\b',s),s
          entries=re.findall(r'depends on axioms:\s*\[([^]]*)\]',s)
          absent=s.count('does not depend on any axioms')
          assert len(entries)+absent==n,(n,len(entries),absent)
          allowed={'propext','Classical.choice','Quot.sound'}
          for ent in entries:
              used=set(filter(None,(v.strip() for v in ent.split(','))))
              assert used<=allowed, used-allowed
          print('Audited theorem count:',n)
          PY
      - name: Independent exact 3D cube oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check sympy==1.14.0
          python -B tools/check_finite_skyrme_unwinding.py 2>&1 | tee finite-skyrme-python.log
      - name: Attach source-linked audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finite-skyrme-unwinding
          path: |
            finite-skyrme-lean.log
            finite-skyrme-audit.log
            finite-skyrme-count.txt
            finite-skyrme-python.log
          if-no-files-found: warn
