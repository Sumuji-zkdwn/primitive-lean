name: Proof Forge - finite observer certificates (Lean kernel)

on:
  pull_request:
    branches: [main]
    paths:
      - 'proof_forge/requests/**'
      - 'tools/autonomy/proof_forge.py'
      - 'tests/test_proof_forge.py'
      - 'tests/test_proof_forge_orientation_research.py'
      - 'tools/autonomy/proof_forge_orientation_report.py'
      - 'docs/autonomy/PROOF_FORGE_ORIENTATION_RESEARCH.md'
      - 'docs/autonomy/PROOF_FORGE.md'
      - '.github/workflows/proof-forge.yml'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-forge-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  kernel-certificates:
    name: Independently compile all generated finite certificates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact proposed source (never merge PR)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test finite model checker, source constraints and audit logic
        run: python -m unittest discover -s tests -p 'test_proof_forge.py' -v

      - name: Recheck archived research objects and all-pairs orientation kernel
        run: python -m unittest discover -s tests -p 'test_proof_forge_orientation_research.py' -v

      - name: Record exact source and generate bounded Lean proof obligations
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -B -X utf8 tools/autonomy/proof_forge.py generate \
            --requests proof_forge/requests \
            --output verification/proof-forge \
            --head "$EXPECTED_HEAD"


      - name: Export all-pairs research comparison and Actions summary
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -B -X utf8 -m tools.autonomy.proof_forge_orientation_report \
            --root . --head "$EXPECTED_HEAD" \
            --output verification/proof-forge/orientation-research.json \
            --markdown "$GITHUB_STEP_SUMMARY"


      - name: Install pinned Lean and Mathlib cache
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Compile each generated proof with trust zero (retain failures)
        working-directory: lean
        shell: bash
        run: |
          set -uo pipefail
          for f in ../verification/proof-forge/*.lean; do
            name="$(basename "$f" .lean)"
            set +e
            lake env lean --trust=0 "$f" > "../verification/proof-forge/$name.log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "../verification/proof-forge/$name.exit"
            echo "Proof Forge $name: Lean exit $result"
          done

      - name: Verify all proof files, compilation results and axiom records
        run: python -B -X utf8 tools/autonomy/proof_forge.py audit --output verification/proof-forge

      - name: Keep JSON certificates, generated Lean and exact-head logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: proof-forge-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/proof-forge/
          if-no-files-found: warn
          retention-days: 30

attest-evidence:
    # The signing identity is isolated from the job executing PR-controlled code.
    # Fork PRs have no write-capable credentials for this job.
    name: Sign exact-head Lean verification evidence
    needs: [kernel-certificates]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download evidence produced by the successful kernel job
        uses: actions/download-artifact@v4
        with:
          name: proof-forge-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof-evidence

      - name: Check evidence and package a deterministic archive
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED

          root = Path("proof-evidence")
          manifest = json.loads((root / "manifest.json").read_text("utf-8"))
          assert manifest.get("passed") is True
          assert manifest.get("checkout_sha") == os.environ["EXPECTED_HEAD"]
          names = manifest.get("models")
          assert isinstance(names, list) and 1 <= len(names) <= 12
          assert len(set(names)) == len(names)
          expected_names = {"manifest.json"}
          for name in names:
              assert isinstance(name, str) and re.fullmatch(r"[a-z][a-z0-9_-]{1,48}", name)
              record = json.loads((root / (name + ".json")).read_text("utf-8"))
              assert record["model"] == name
              assert record["checkout_sha"] == os.environ["EXPECTED_HEAD"]
              assert record["kernel_verified"] is True
              assert record["status"] == "LEAN_VERIFIED"
              assert record["axiom_audit"]["passed"] is True
              source = (root / (name + ".lean")).read_bytes()
              assert hashlib.sha256(source).hexdigest() == record["generated_lean_sha256"]
              assert (root / (name + ".exit")).read_text("utf-8").strip() == "0"
              expected_names.update(name + suffix for suffix in (".json", ".lean", ".exit", ".log"))
          paths = sorted(root.iterdir())
          assert len(paths) <= 60
          for file in paths:
              assert file.is_file() and not file.is_symlink()
              assert file.stat().st_size <= 1_000_000
          assert expected_names <= {path.name for path in paths}
          # Canonical ZIP entry order and metadata for reproducible bytes.
          with ZipFile("proof-forge-certified.zip", "w") as archive:
              for file in paths:
                  entry = ZipInfo(file.name, (1980, 1, 1, 0, 0, 0))
                  entry.compress_type = ZIP_DEFLATED
                  entry.external_attr = 0o644 << 16
                  archive.writestr(entry, file.read_bytes(), compress_type=ZIP_DEFLATED)
          print("PACKAGED_VERIFIED_EVIDENCE", len(names), manifest["checkout_sha"])
          PY

      - name: Create public GitHub provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: proof-forge-certified.zip

      - name: Retain the exact attested ZIP for independent verification
        uses: actions/upload-artifact@v6
        with:
          name: proof-forge-attested-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof-forge-certified.zip
          if-no-files-found: error
          retention-days: 30
