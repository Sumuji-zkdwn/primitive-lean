name: Primitive Foundry factory simulation

on:
  pull_request:
    branches: [main]
    paths:
      - 'games/primitive-foundry/**'
      - '.github/workflows/primitive-foundry.yml'
      - 'docs/dependency/data/source_edges.json'
  push:
    branches: [main, 'chatgpt/primitive-foundry-*', 'chatgpt/foundry-465-*']
    paths:
      - 'games/primitive-foundry/**'
      - '.github/workflows/primitive-foundry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory:
    name: Production-chain and source-backed research
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check games/primitive-foundry/engine.js
          node --check games/primitive-foundry/ui.js
          node --check games/primitive-foundry/ui.test.cjs
          node --check games/primitive-foundry/engine.test.cjs
      - name: Audit every baseline theorem against proof-term kernel references
        run: python3 -B games/primitive-foundry/check_dag.py
      - name: Run deterministic full factory production and dependency tests
        run: node --test games/primitive-foundry/engine.test.cjs games/primitive-foundry/ui.test.cjs
      - name: Verify offline bundle matches audited sources
        run: python3 -B games/primitive-foundry/build_play.py --check

  lean:
    name: Lean 4 trust-zero finite logistics laws
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Typecheck factory conservation and assembly with trust zero
        run: elan run leanprover/lean4:v4.36.0-rc2 lean --trust=0 games/primitive-foundry/Core.lean

  visual:
    name: Mobile and desktop browser renders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Japanese fonts for representative screenshot rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk > /tmp/noto-install.log
          fc-cache -f
      - name: Render self-contained page using headless Chrome when available
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome unavailable; browser screenshots not collected."
            exit 0
          fi
          mkdir -p visual-evidence
          python3 -m http.server 8765 --bind 127.0.0.1 --directory games/primitive-foundry >/tmp/foundry-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 2
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars \
            --virtual-time-budget=1500 --window-size=412,915 \
            --screenshot=visual-evidence/mobile.png http://127.0.0.1:8765/play.html
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars \
            --virtual-time-budget=1500 --window-size=1440,960 \
            --screenshot=visual-evidence/desktop.png http://127.0.0.1:8765/play.html
          test -s visual-evidence/mobile.png
          test -s visual-evidence/desktop.png
      - name: Preserve UI screenshots for review
        uses: actions/upload-artifact@v6
        with:
          name: primitive-foundry-screenshots
          path: visual-evidence/
          if-no-files-found: warn
