name: KK horizon full linear vacuum uniqueness
on:
  pull_request:
    paths:
      - 'tools/check_kk_horizon_full_linear.py'
      - 'docs/research/2026-11-26-kk-horizon-full-linear-uniqueness.md'
      - '.github/workflows/kk-horizon-full-linear-uniqueness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all linear vacuum and gauge-wave coefficient bounds
        run: |
          set -euo pipefail
          mkdir -p verification
          git rev-parse HEAD | tee verification/head.txt
          sha256sum tools/check_kk_horizon_full_linear.py | tee verification/oracle.sha256
          python -m pip install sympy==1.14.0
          python -B tools/check_kk_horizon_full_linear.py | tee verification/full-linear.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kk-full-linear-uniqueness-audit
          path: verification/
