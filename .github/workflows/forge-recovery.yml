name: Forge Recovery - bounded missed-slot catchup
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/forge-recovery.yml'
      - '.github/workflows/generic-forge.yml'
      - '.github/workflows/meta-forge.yml'
      - 'tools/autonomy/forge_recovery.py'
      - 'tests/test_forge_recovery.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-recovery.yml'
      - 'tools/autonomy/forge_recovery.py'
      - '.github/workflows/generic-forge.yml'
      - '.github/workflows/meta-forge.yml'
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Forge Watchdog - audit scheduler and bounded capability growth'
      - 'Autonomous Research Supervisor - GitHub-only recovery'
      - 'Research Conveyor - source-bound finite Lean cycle'
      - 'Primitive Lean integration verification'
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: forge-recovery-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_forge_recovery.py' -v

  recover:
    needs: regression
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch' ||
         github.event.workflow_run.event == 'push')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout only trusted main controller, never the triggering artifact
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bounded recovery of missing certified slots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B -m tools.autonomy.forge_recovery recover --output verification/forge-recovery/report.json
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forge-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/forge-recovery/
          if-no-files-found: warn
          retention-days: 30
