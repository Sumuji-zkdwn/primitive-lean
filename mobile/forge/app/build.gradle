plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'org.primitivelean.forge'
    compileSdk 35
    defaultConfig {
        applicationId 'org.primitivelean.forge'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
}
chaquopy {
    defaultConfig { version = '3.12' }
}
